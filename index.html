lation in some parts of the world. For Russell, however , the economic chaos of the time was itself the result of a set of deep-rooted and mistaken attitudes about work. Indeed , he claims that many of our ideas about work are little more than superstitions, which should be swept away with rigorous thinking . Russell distinguishes between two kinds of workers: labourers and supervisors. To these, he adds a third group of non-workers – the leisured landowners who depend on other people’s labour to support their own idleness. According to Russell, history is littered with examples of people working hard all their lives and being allowed to keep just enough for themselves and their families to survive, while any surplus they produce is appropriated by warriors, priests and the leisured ruling classes. And it is always these beneficiaries of the system , says Russell, who are heard praising the virtues of ‘honest toil’, giving a moral mask to a system that is manifestly unjust . And this fact alone should prompt us to re-evaluate the ethics of work . Parça / Soru Metindeki Dayanak Cümle Doğru Parafraz vs Elenecek Tuzak Russell #1 (Çıkarım) beneficiaries ... praising 'honest toil', giving a moral mask to a system that is manifestly unjust. D: sees ethics of hard work as a mechanism used by the privileged class to ensure the continuation of the unjust system. ( C 'işsizliği kesin kucaklayın' uç genellemesi!) Russell #2 (Açık Bilgi) little more than superstitions, which should be swept away with rigorous thinking C: could easily be changed by thinking more deeply ( B bu fikirler işçilerce değil yararlananlarca övülür). Russell #3 (Amaç/Zaman) For Russell, however, the economic chaos ... was itself the result of mistaken attitudes about work. A: to show that the economic chaos was a direct consequence of established work ethics . Russell #4 (Sonuç) prompt us to re-evaluate the ethics of work C: should be re-assessed to get rid of the unfair practices of the privileged class function ensureEduState(st) {
  if (!st || typeof st !== 'object') return {};
  const e = st.edu = (st.edu && typeof st.edu === 'object' && !Array.isArray(st.edu)) ? st.edu : {};
  if (!e.completed || typeof e.completed !== 'object' || Array.isArray(e.completed)) e.completed = {};
  if (!e.notes || typeof e.notes !== 'object' || Array.isArray(e.notes)) e.notes = {};
  if (!e.dayChecks || typeof e.dayChecks !== 'object' || Array.isArray(e.dayChecks)) e.dayChecks = {};
  if (!e.vocabMastered || typeof e.vocabMastered !== 'object' || Array.isArray(e.vocabMastered)) e.vocabMastered = {};
  if (!e.exercises || typeof e.exercises !== 'object' || Array.isArray(e.exercises)) e.exercises = {};
  if (!e.hl || typeof e.hl !== 'object' || Array.isArray(e.hl)) e.hl = {};
  if (!Array.isArray(e.freeNotes)) e.freeNotes = [];
  if (!Array.isArray(e.tasks)) e.tasks = [];
  if (!Array.isArray(e.vocab)) e.vocab = [];
  if (!Array.isArray(e.customCourses)) e.customCourses = [];
  if (!e.activeCourseId) e.activeCourseId = 'nayas-yds-akademik-telafi-2026';
  if (!e.activeSecId) e.activeSecId = 'sec-0-genel-bakis';
  if (!e.notebookTab) e.notebookTab = 'notes';
  if (eduReady && typeof fcEnsureCats === 'function') fcEnsureCats(e);
  // One-time starter seed of Nayas Tam Tanı [?] words for p-nayas profile (guards against TDZ during early store bootstrap)
  if (eduReady) {
    const profId = typeof activeProfile === 'function' ? activeProfile()?.id : '';
    if (profId === 'p-nayas' && !e.vocabSeeded) {
      const have = new Set(e.vocab.map(x => x.id));
      const now = Date.now();
      for (const item of NAYAS_SEED_VOCAB) {
        if (!have.has(item.id)) e.vocab.push({ ...item, mastered: false, createdAt: now, updatedAt: 1 });
      }
      e.vocabSeeded = true;
    }
  }
  return e;
}

function eduMergeStampMap(a, b) {
  const out = {};
  const keys = new Set([...Object.keys(a || {}), ...Object.keys(b || {})]);
  for (const k of keys) {
    const va = a?.[k], vb = b?.[k];
    if (va && !vb) out[k] = va;
    else if (vb && !va) out[k] = vb;
    else {
      const ta = Number(va?.at || (va === true ? 1 : 0)) || 0;
      const tb = Number(vb?.at || (vb === true ? 1 : 0)) || 0;
      out[k] = tb >= ta ? vb : va;
    }
  }
  return out;
}

function eduMergeArrayById(a, b) {
  const m = new Map();
  for (const list of [a || [], b || []]) {
    for (const it of list) {
      if (!it || typeof it.id !== 'string') continue;
      const prev = m.get(it.id);
      if (!prev || (Number(it.updatedAt) || 0) >= (Number(prev.updatedAt) || 0)) m.set(it.id, it);
    }
  }
  return [...m.values()];
}

function mergeEduState(rawA, rawB) {
  if (!rawA && !rawB) return {};
  const a = ensureEduState({ edu: JSON.parse(JSON.stringify(rawA || {})) });
  const b = ensureEduState({ edu: JSON.parse(JSON.stringify(rawB || {})) });
  const sa = Number(a.stamp) || 0, sb = Number(b.stamp) || 0;
  const newer = sb >= sa ? b : a;
  const hl = {};
  for (const k of new Set([...Object.keys(a.hl || {}), ...Object.keys(b.hl || {})])) {
    const seen = new Set();
    hl[k] = [...(a.hl?.[k] || []), ...(b.hl?.[k] || [])].filter(h => h && h.id && !seen.has(h.id) && seen.add(h.id)).slice(-80);
  }
  return {
    completed: eduMergeStampMap(a.completed, b.completed),
    notes: eduMergeStampMap(a.notes, b.notes),
    dayChecks: eduMergeStampMap(a.dayChecks, b.dayChecks),
    vocabMastered: eduMergeStampMap(a.vocabMastered, b.vocabMastered),
    exercises: eduMergeStampMap(a.exercises, b.exercises),
    hl,
    freeNotes: eduMergeArrayById(a.freeNotes, b.freeNotes),
    tasks: eduMergeArrayById(a.tasks, b.tasks),
    vocab: eduMergeArrayById(a.vocab, b.vocab),
    customCourses: eduMergeArrayById(a.customCourses, b.customCourses).filter(c => !c.deleted),
    activeCourseId: newer.activeCourseId || 'nayas-yds-akademik-telafi-2026',
    activeSecId: newer.activeSecId || 'sec-0-genel-bakis',
    notebookTab: newer.notebookTab || 'notes',
    vocabSeeded: !!(a.vocabSeeded || b.vocabSeeded),
    fcCats: eduMergeArrayById(a.fcCats, b.fcCats),
    fcCards: eduMergeStampMap(a.fcCards, b.fcCards),
    fcDaily: newer.fcDaily || a.fcDaily || b.fcDaily,
    hlCats: eduMergeArrayById(a.hlCats, b.hlCats),
    hlCatMap: eduMergeStampMap(a.hlCatMap, b.hlCatMap),
    hlCatsSyncedOnce: !!(a.hlCatsSyncedOnce || b.hlCatsSyncedOnce),
    libCfg: (Number(b.libCfg?.t) || 0) >= (Number(a.libCfg?.t) || 0) ? (b.libCfg || a.libCfg) : a.libCfg,
    favs: Array.isArray(newer.favs) ? newer.favs : (a.favs || b.favs || []),
    stamp: Math.max(sa, sb)
  };
}

function eduTouch(immediateSync = false) {
  const e = ensureEduState(state);
  e.stamp = Date.now();
  activeProfile().updatedAt = Date.now();
  save();
  if (immediateSync && window.syncProfileOp) syncProfileOp(activeProfile());
  else if (typeof syncSettingsSoon === 'function') syncSettingsSoon();
}

function allCourses() {
  const e = ensureEduState(state);
  const byId = new Map();
  for (const c of BUILTIN_COURSES) byId.set(c.id, c);
  for (const c of e.customCourses || []) if (c && !c.deleted && c.id && Array.isArray(c.sections)) byId.set(c.id, c);
  return [...byId.values()];
}

function currentCourse() {
  const e = ensureEduState(state);
  const list = allCourses();
  return list.find(c => c.id === e.activeCourseId) || list[0];
}

function currentCourseSection(course) {
  const c = course || currentCourse();
  const e = ensureEduState(state);
  return c?.sections?.find(s => s.id === e.activeSecId) || c?.sections?.[0];
}

function courseForBook(bid) {
  return allCourses().find(c => c.pairedBookId === bid || c.diagnosticBookId === bid);
}

function secForTest(course, bid, tid) {
  if (!course || !course.sections?.length) return null;
  if (tid) {
    const exact = course.sections.find(s => s.pairedTestId === tid);
    if (exact) return exact;
    const taniMap = {
      'm1-kelime': 'sec-3-kelime-pv',
      'm2-gramer-fiil-cumlecik': 'sec-1-sozdizim',
      'm3-baglac-edat-miktar': 'sec-2-baglac-edat',
      'm4-cloze-tamamlama-ceviri': 'sec-4-cloze-tamamlama',
      'm5-soylem-mantik': 'sec-4-cloze-tamamlama',
      'm6-okuma-parcalari': 'sec-5-okuma-celdirici'
    };
    const mapped = taniMap[tid];
    if (mapped) {
      const f = course.sections.find(s => s.id === mapped);
      if (f) return f;
    }
  }
  return course.sections[0];
}

function isSecDone(cid, sid) {
  const v = ensureEduState(state).completed[cid + '/' + sid];
  return !!(v === true || v?.done);
}

function setSecDone(cid, sid, done) {
  const e = ensureEduState(state);
  e.completed[cid + '/' + sid] = { done: !!done, at: Date.now() };
  eduTouch(true);
}

function isDayCheckDone(checkId) {
  const v = ensureEduState(state).dayChecks[checkId];
  return !!(v === true || v?.done);
}

function toggleDayCheck(checkId) {
  if (locked) return;
  const e = ensureEduState(state);
  const next = !isDayCheckDone(checkId);
  e.dayChecks[checkId] = { done: next, at: Date.now() };
  // Mirror topic check onto section completion if matching
  const match = EDU_7DAY_PLAN.find(d => d.checks[0]?.id === checkId);
  if (match && match.secId) setSecDone(NAYAS_YDS_COURSE.id, match.secId, next);
  else eduTouch(true);
  render();
}

function eduTestMetrics(bid, tid) {
  if (!bid || !tid) return null;
  const b = books.find(x => x.id === bid);
  const t = b?.tests?.find(x => x.id === tid);
  const s = state.tests?.[bid + '/' + tid];
  const qTotal = t ? (t.questionCount ?? t.questions.length) : null;
  const answered = s ? Object.keys(s.answers || {}).length : 0;
  const elapsed = Math.round(s?.elapsed || 0);
  let outcome = null;
  if (t && s?.checked && typeof testOutcome === 'function') outcome = testOutcome(t, s);
  const done = !!(s?.checked || (qTotal && answered >= qTotal));
  return { book: b, test: t, state: s, qTotal, answered, elapsed, outcome, done };
}

function openCourse(cid, sid) {
  pulse(); running = false; ttsStop();

  if (!c) return;
  e.activeCourseId = c.id;
  e.activeSecId = (sid && c.sections.some(s => s.id === sid)) ? sid : c.sections[0].id;

async function eduOpenTest(bid, tid) {
  if (!bid) return;
  let b = books.find(x => x.id === bid && !x._catalog);
  if (!b && typeof ensureBook === 'function') {
    if (!books.some(x => x.id === bid) && typeof syncBooks === 'function' && syncOn()) {
      await syncBooks();
    }
    if (books.some(x => x.id === bid)) {
      const ok = await ensureBook(bid);
      b = ok ? books.find(x => x.id === bid) : null;
    }
  }
  if (!b) {
    dialog('Eşlikçi Test Kitabı Gerekli',
      `<p><b>${esc(bid)}</b> test kitabı şu an bu cihazda yüklü değil.</p>` +
      `<p>Çıktı klasöründeki <code>kitaplar/${esc(bid)}.json</code> dosyasını Test Kitaplığına ekleyerek hem bu testi çözebilir hem de canlı performans takibini başlatabilirsiniz.</p>` +
      `<div class="row" style="margin-top:14px"><button class="primary" data-act="import">＋ Test Kitabı JSON Ekle</button><button data-act="nav" data-view="library">Test Kitaplığına Git</button></div>`);
    return;
  }
  if (tid && b.tests.some(t => t.id === tid)) await openTest(bid, tid);
  else await openBook(bid);
}

function eduSpeakText(text, langHint, key) {
  if (typeof ttsSupported === 'function' && ttsSupported() && typeof ttsToggle === 'function') {
    if (langHint === 'en' && (typeof ttsHost === 'undefined' || !ttsHost) && 'speechSynthesis' in window) {
      window.speechSynthesis.cancel();
      const u = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices() || [];
      const enVoice = voices.find(v => /^en[-_]/i.test(v.lang) && v.localService) || voices.find(v => /^en[-_]/i.test(v.lang));
      if (enVoice) u.voice = enVoice;
      u.lang = enVoice?.lang || 'en-US';
      u.rate = ttsSettings().rate || 1;
      window.speechSynthesis.speak(u);
      toast('🔊 Okunuyor: ' + text.slice(0, 40));
      return;
    }
    ttsToggle(key, () => speechChunks(text));
  } else {
    toast('Bu tarayıcıda sesli okuma desteklenmiyor.');
  }
}

function eduOverallSummary() {
  const e = ensureEduState(state);
  const c = NAYAS_YDS_COURSE;
  const doneSecs = c.sections.filter(s => isSecDone(c.id, s.id)).length;
  let solvedModules = 0, totalAns = 0, totalQ = 0, totalCorrect = 0, checkedKnown = 0;
  for (const d of EDU_7DAY_PLAN) {
    if (!d.testId) continue;
    const m = eduTestMetrics(d.bookId, d.testId);
    if (m) {
      totalQ += (m.qTotal || 0);
      totalAns += m.answered;
      if (m.done) solvedModules++;
      if (m.outcome) {
        totalCorrect += m.outcome.correct;
        checkedKnown += m.outcome.known;
      }
    }
  }
  const activeTasks = e.tasks.filter(t => !t.deleted);
  const doneTasks = activeTasks.filter(t => t.done).length;
  const vocabAll = eduAllVocabItems();
  const vocabLearned = vocabAll.filter(v => v.mastered).length;
  return { doneSecs, totalSecs: c.sections.length, solvedModules, totalAns, totalQ, totalCorrect, checkedKnown, doneTasks, totalTasks: activeTasks.length, vocabLearned, vocabTotal: vocabAll.length };
}

function courseView() {
  const c = currentCourse();
  if (!c) return educationView();
  const s = currentCourseSection(c);
  const e = ensureEduState(state);
  const done = isSecDone(c.id, s.id);
  const idx = c.sections.findIndex(x => x.id === s.id);
  const prevSec = idx > 0 ? c.sections[idx - 1] : null;
  const nextSec = idx >= 0 && idx < c.sections.length - 1 ? c.sections[idx + 1] : null;

function eduAllVocabItems() {
  const e = ensureEduState(state);
  const out = [];
  const seenWords = new Set();
  for (const v of e.vocab || []) {
    if (!v || v.deleted) continue;
    const norm = String(v.word || '').trim().toLocaleLowerCase('en');
    if (norm) seenWords.add(norm);
    out.push({ kind: 'custom', id: v.id, word: v.word, meaning: v.meaning || '', note: v.note || '', source: v.source || 'Kişisel Kart', mastered: !!v.mastered, at: v.updatedAt || v.createdAt || 0 });
  }
  for (const b of books) {
    for (const t of b.tests) {
      const s = state.tests?.[b.id + '/' + t.id];
      if (!s) continue;
      for (const [qid, list] of Object.entries(s.unkText || {})) {
        for (const item of list || []) {
          const w = String(item?.t || '').trim();
          if (!w) continue;
          const mKey = 'ut:' + b.id + '/' + t.id + '/' + qid + ':' + w.toLocaleLowerCase('en');
          const m = e.vocabMastered[mKey];
          out.push({ kind: 'testText', id: mKey, bookId: b.id, testId: t.id, qid, word: w, meaning: 'Testte ❓ olarak işaretlendi (' + (item.w || 'soru') + ')', note: '', source: b.title + ' · ' + t.title, mastered: !!(m === true || m?.done), at: Number(s.stamp?.[qid]) || 0 });
        }
      }
      for (const [qid, optKeys] of Object.entries(s.unk || {})) {
        const q = t.questions?.find(x => x.id === qid);
        for (const ok of optKeys || []) {
          const optObj = q?.options?.find((o, i) => (typeof o === 'string' ? String.fromCharCode(65 + i) : o.id) === ok);
          const optTxt = typeof optObj === 'string' ? optObj : (optObj?.text || ('Şık ' + ok));
          const mKey = 'uo:' + b.id + '/' + t.id + '/' + qid + ':' + ok;
          const m = e.vocabMastered[mKey];
          out.push({ kind: 'testOpt', id: mKey, bookId: b.id, testId: t.id, qid, word: optTxt, meaning: b.title + ' sorusunda ? işaretli şık (' + ok + ')', note: '', source: t.title, mastered: !!(m === true || m?.done), at: Number(s.stamp?.[qid]) || 0 });
        }
      }
    }
  }
  return out;
}

function eduAllNotesItems() {
  const e = ensureEduState(state);
  const items = [];
  for (const c of allCourses()) {
    for (const s of c.sections) {
      const raw = e.notes[c.id + '/' + s.id];
      const txt = typeof raw === 'string' ? raw : (raw?.text || '');
      if (txt.trim()) items.push({ kind: 'course', title: c.shortTitle + ' › ' + s.dayTag + ' · ' + s.title, text: txt, cid: c.id, sid: s.id, source: c.library || 'Eğitim', at: Number(raw?.at) || 0 });
    }
  }
  for (const b of books) {
    for (const t of b.tests) {
      const s = state.tests?.[b.id + '/' + t.id];
      if (!s?.notes) continue;
      for (const [qid, txt] of Object.entries(s.notes)) {
        if (!String(txt || '').trim()) continue;
        const qi = t.questions ? t.questions.findIndex(x => x.id === qid) : -1;
        items.push({ kind: 'question', title: b.title + ' › ' + t.title + (qi >= 0 ? ' · S' + (qi + 1) : ''), text: String(txt), bookId: b.id, testId: t.id, qIndex: qi >= 0 ? qi : 0, source: typeof libOf === 'function' ? libOf(b) : 'Test', at: Number(s.stamp?.[qid]) || 0 });
      }
    }
  }
  return items.sort((a, b) => (b.at || 0) - (a.at || 0));
}

function eduAllHighlights() {
  const e = ensureEduState(state);
  const out = [];
  for (const c of allCourses()) {
    for (const s of c.sections) {
      for (const h of (e.hl[c.id + '/' + s.id] || [])) {
        out.push({ kind: 'course', id: h.id, t: h.t, color: h.color, style: h.style, at: h.at || 0, title: c.shortTitle + ' › ' + s.dayTag, cid: c.id, sid: s.id });
      }
    }
  }
  for (const b of books) {
    for (const t of b.tests) {
      const s = state.tests?.[b.id + '/' + t.id];
      if (!s?.hl) continue;
      for (const [qid, list] of Object.entries(s.hl)) {
        const qi = t.questions ? t.questions.findIndex(x => x.id === qid) : -1;
        for (const h of list || []) {
          out.push({ kind: 'question', id: h.id, t: h.t, color: h.color, style: h.style, where: h.w, at: h.at || 0, title: b.title + ' › ' + t.title + (qi >= 0 ? ' · S' + (qi + 1) : ''), bookId: b.id, testId: t.id, qid, qIndex: qi >= 0 ? qi : 0 });
        }
      }
    }
  }
  return out.sort((a, b) => (b.at || 0) - (a.at || 0));
}

  if (!el || el.disabled) return;
  const a = el.dataset.act;
  const allowedRead = ['openCourse', 'eduOpenPdf', 'eduReadSec', 'eduDrawerOpenFull', 'eduNbTab', 'eduNbFilter', 'eduSpeakWord', 'eduOpenPairedBook', 'eduOpenTest', 'eduCourseDrawer', 'eduJumpQuestion', 'eduExportCourse'];
  if (locked && a.startsWith('edu') && !allowedRead.includes(a)) { toast('Önce bu sekmede devam etmeyi seç.'); return; }

  switch (a) {
    case 'openCourse': openCourse(el.dataset.cid, el.dataset.sid); break;
    case 'eduToggleDone': {
      const cid = el.dataset.cid, sid = el.dataset.sid;
      setSecDone(cid, sid, !isSecDone(cid, sid));
      render();
      toast(isSecDone(cid, sid) ? '✓ Bölüm tamamlandı olarak işaretlendi.' : 'Bölüm tamamlanma işareti kaldırıldı.');
      break;
    }
    case 'eduReadSec': {
      const c = allCourses().find(x => x.id === el.dataset.cid) || currentCourse();
      const s = c?.sections?.find(x => x.id === el.dataset.sid) || currentCourseSection(c);
      if (s) eduSpeakText(s.title + '. ' + (s.searchText || ''), 'tr', 'edu:' + c.id + '/' + s.id);
      break;
    }
    case 'eduOpenPdf': {
      const c = allCourses().find(x => x.id === el.dataset.cid) || currentCourse();
      eduOpenPdf(c);
      break;
    }
    case 'eduOpenPairedBook': await eduOpenTest(el.dataset.book, null); break;
    case 'eduOpenTest': await eduOpenTest(el.dataset.book, el.dataset.test); break;
    case 'eduCourseDrawer': openCourseDrawer(el.dataset.book, (view === 'study' && currentBook?.id === el.dataset.book ? currentTest : null), el.dataset.sid); break;
    case 'eduDrawerOpenFull': {
      const cid = el.dataset.cid, sid = el.dataset.sid;
      closeDialog();
      openCourse(cid, sid);
      break;
    }
    case 'eduJumpQuestion': {
      const qi = Number(el.dataset.index) || 0;
      await openTest(el.dataset.book, el.dataset.test);
      if (typeof jump === 'function' && currentTest) jump(qi);
      break;
    }
    case 'eduDayCheck': toggleDayCheck(el.dataset.id); break;
    case 'eduAddTask': {
      const txt = ($('#eduTaskText')?.value || '').trim();
      if (!txt) { toast('Görev metni yaz.'); return; }
      const tag = $('#eduTaskTag')?.value || 'Genel';
      const now = Date.now();
      ensureEduState(state).tasks.push({ id: 'tk-' + now.toString(36) + Math.random().toString(36).slice(2, 5), text: txt, tag, done: false, createdAt: now, updatedAt: now });
      eduTouch(true);
      render();
      break;
    }
    case 'eduToggleTask': {
      const t = ensureEduState(state).tasks.find(x => x.id === el.dataset.id);
      if (t) { t.done = !t.done; t.updatedAt = Date.now(); eduTouch(true); render(); }
      break;
    }
    case 'eduDelTask': {
      const t = ensureEduState(state).tasks.find(x => x.id === el.dataset.id);
      if (t) { t.deleted = true; t.updatedAt = Date.now(); eduTouch(true); render(); }
      break;
    }
    case 'eduNbTab': ensureEduState(state).notebookTab = el.dataset.tab; nbFilter = ''; save(); render(); break;
    case 'eduNbFilter': nbFilter = el.dataset.f || ''; render(); break;
    case 'eduAddFreeNote': {
      const title = ($('#nbFreeTitle')?.value || '').trim() || 'Çalışma Notu';
      const tag = $('#nbFreeTag')?.value || 'Genel';
      const body = ($('#nbFreeBody')?.value || '').trim();
      if (!body) { toast('Not içeriği boş olamaz.'); return; }
      const now = Date.now();
      ensureEduState(state).freeNotes.push({ id: 'fn-' + now.toString(36) + Math.random().toString(36).slice(2, 5), title, tag, body, createdAt: now, updatedAt: now });
      eduTouch(true);
      render();
      toast('Çalışma notu kaydedildi.');
      break;
    }
    case 'eduDelFreeNote': {
      const n = ensureEduState(state).freeNotes.find(x => x.id === el.dataset.id);
      if (n) { n.deleted = true; n.updatedAt = Date.now(); eduTouch(true); render(); }
      break;
    }
    case 'eduAddVocab': {
      const word = ($('#nbVocabWord')?.value || '').trim();
      const meaning = ($('#nbVocabMeaning')?.value || '').trim();
      const note = ($('#nbVocabNote')?.value || '').trim();
      if (!word) { toast('Kelime veya ifade yaz.'); return; }
      const now = Date.now();
      ensureEduState(state).vocab.push({ id: 'vc-' + now.toString(36) + Math.random().toString(36).slice(2, 5), word, meaning, note, source: 'Kişisel Kart', mastered: false, createdAt: now, updatedAt: now });
      eduTouch(true);
      render();
      break;
    }
    case 'eduToggleVocab': {
      const e2 = ensureEduState(state);
      if (el.dataset.kind === 'custom') {
        const v = e2.vocab.find(x => x.id === el.dataset.id);
        if (v) { v.mastered = !v.mastered; v.updatedAt = Date.now(); eduTouch(true); render(); }
      } else {
        const prev = e2.vocabMastered[el.dataset.id];
        const next = !(prev === true || prev?.done);
        e2.vocabMastered[el.dataset.id] = { done: next, at: Date.now() };
        eduTouch(true);
        render();
      }
      break;
    }
    case 'eduDelVocab': {
      const v = ensureEduState(state).vocab.find(x => x.id === el.dataset.id);
      if (v) { v.deleted = true; v.updatedAt = Date.now(); eduTouch(true); render(); }
      break;
    }
    case 'eduSeedVocab': {
      const e2 = ensureEduState(state);
      const have = new Set(e2.vocab.filter(x => !x.deleted).map(x => String(x.word || '').toLocaleLowerCase('en')));
      let added = 0; const now = Date.now();
      for (const item of NAYAS_SEED_VOCAB) {
        if (!have.has(item.word.toLocaleLowerCase('en'))) {
          e2.vocab.push({ ...item, id: item.id + '-' + now.toString(36), mastered: false, createdAt: now, updatedAt: now });
          added++;
        }
      }
      if (added) { eduTouch(true); render(); toast(added + ' YDS çekirdek kelime kartı eklendi.'); }
      else toast('Tüm YDS çekirdek kelimeleri zaten havuzunda.');
      break;
    }
    case 'eduSpeakWord': eduSpeakText(el.dataset.word || '', 'en', 'vocab:' + (el.dataset.word || '')); break;
    case 'eduHlDel': {
      const e2 = ensureEduState(state), k = el.dataset.cid + '/' + el.dataset.sid;
      if (Array.isArray(e2.hl[k])) e2.hl[k] = e2.hl[k].filter(x => x.id !== el.dataset.hlId);
      eduTouch(true);
      render();
      break;
    }
    case 'eduExportCourse': {
      const c = allCourses().find(x => x.id === el.dataset.cid) || currentCourse();
      if (c) download(c.id + '-egitim.json', JSON.stringify({ format: 'egitim-atolyesi-ders', version: 1, course: c }, null, 2));
      break;
    }
    case 'eduImportCourse': {
      let inp = $('#eduCourseFile');
      if (!inp) {
        inp = document.createElement('input');
        inp.id = 'eduCourseFile';
        inp.type = 'file';
        inp.accept = '.json,application/json';
        inp.className = 'hidden';
        inp.onchange = async () => {
          const f = inp.files?.[0]; inp.value = '';
          if (!f) return;
          try {
            const j = JSON.parse(await f.text());
            const c = j.format === 'egitim-atolyesi-ders' ? j.course : j;
            if (!c || typeof c.id !== 'string' || typeof c.title !== 'string' || !Array.isArray(c.sections) || !c.sections.length) throw Error('Geçerli Eğitim Atölyesi ders JSON formatı değil.');
            c.updatedAt = Date.now();
            const e2 = ensureEduState(state);
            e2.customCourses = [...(e2.customCourses || []).filter(x => x.id !== c.id), c];
            eduTouch(true);
            render();
            toast('Eğitim modülü eklendi: ' + c.title);
          } catch (err) { toast('Modül eklenemedi: ' + err.message); }
        };
        document.body.append(inp);
      }
      inp.click();
      break;
    }
  }
});

document.addEventListener('input', e => {
  if (e.target.id === 'eduSecNote' && !locked) {
    const cid = e.target.dataset.cid, sid = e.target.dataset.sid;
    ensureEduState(state).notes[cid + '/' + sid] = { text: e.target.value, at: Date.now() };
    eduTouch(false);
  } else if (e.target.id === 'eduSearchInput') {
    eduSearch = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const n = $('#eduSearchInput');
    if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} }
  } else if (e.target.id === 'nbSearchInput') {
    nbSearch = e.target.value;
    const pos = e.target.selectionStart;
    render();
    const n = $('#nbSearchInput');
    if (n) { n.focus(); try { n.setSelectionRange(pos, pos); } catch (_) {} }
  }
});

eduReady = true;
if (typeof state !== 'undefined' && state) ensureEduState(state);

const eduExWork = {};

function eduExInitWork(exId) {
  const ex = EDU_EXERCISES[exId];
  if (!ex) return null;
  const savedWork = typeof state !== 'undefined' ? ensureEduState(state).exercises?.[exId]?.work : null;
  if (!eduExWork[exId]) {
    if (savedWork && typeof savedWork === 'object') {
      eduExWork[exId] = JSON.parse(JSON.stringify(savedWork));
    } else if (ex.kind === 'chip-fill') eduExWork[exId] = { slots: Array(ex.items.length).fill(null), selChip: null, checked: false };
    else if (ex.kind === 'match-pair') {
      const rightOrder = ex.pairs.map((p, i) => i);
      for (let i = rightOrder.length - 1; i > 0; i--) { const j = (i * 7 + exId.length) % (i + 1); [rightOrder[i], rightOrder[j]] = [rightOrder[j], rightOrder[i]]; }
      eduExWork[exId] = { pairs: {}, selLeft: null, rightOrder, checked: false };
    }
    else if (ex.kind === 'sort-bucket') eduExWork[exId] = { assigned: {}, selItem: null, checked: false };
    else if (ex.kind === 'type-fix') eduExWork[exId] = { vals: Array(ex.items.length).fill(''), checked: false };
    else if (ex.kind === 'spot-fix') eduExWork[exId] = { picks: Array(ex.items.length).fill(null), checked: false };
    else if (ex.kind === 'memory-flip') {
      const cards = [];
      ex.pairs.forEach((p, idx) => { cards.push({ pairIdx: idx, text: p.a }); cards.push({ pairIdx: idx, text: p.b }); });
      for (let i = cards.length - 1; i > 0; i--) { const j = (i * 11 + exId.length * 3) % (i + 1); [cards[i], cards[j]] = [cards[j], cards[i]]; }
      eduExWork[exId] = { cards, open: [], matched: [], miss: [], moves: 0, checked: false };
    }
    else if (ex.kind === 'order-seq') {
      const poolOrder = ex.steps.map((_, i) => i);
      for (let i = poolOrder.length - 1; i > 0; i--) { const j = (i * 5 + exId.length) % (i + 1); [poolOrder[i], poolOrder[j]] = [poolOrder[j], poolOrder[i]]; }
      if (poolOrder.every((v, i) => v === i) && poolOrder.length > 1) [poolOrder[0], poolOrder[1]] = [poolOrder[1], poolOrder[0]];
      eduExWork[exId] = { picked: [], poolOrder, checked: false };
    }
  }
  return eduExWork[exId];
}

function eduExPersist(exId, immediateSync = false) {
  const w = eduExWork[exId];
  if (!w || typeof state === 'undefined') return;
  const exMap = ensureEduState(state).exercises;
  const prev = exMap[exId] || {};
  exMap[exId] = { ...prev, work: JSON.parse(JSON.stringify(w)), at: Date.now() };
  eduTouch(immediateSync);
}

function eduExScore(exId) {
  const ex = EDU_EXERCISES[exId], w = eduExInitWork(exId);
  if (!ex || !w) return { ok: 0, total: 0 };
  if (ex.kind === 'chip-fill') return { ok: ex.items.filter((it, i) => w.slots[i] === it.ans).length, total: ex.items.length };
  if (ex.kind === 'match-pair') return { ok: ex.pairs.filter((p, i) => w.pairs[i] === i).length, total: ex.pairs.length };
  if (ex.kind === 'sort-bucket') return { ok: ex.items.filter((it, i) => w.assigned[i] === it.bucket).length, total: ex.items.length };
  if (ex.kind === 'type-fix') return { ok: ex.items.filter((it, i) => it.ans.includes(String(w.vals[i] || '').trim().toLowerCase())).length, total: ex.items.length };
  if (ex.kind === 'spot-fix') return { ok: ex.items.filter((it, i) => w.picks[i] === it.bad).length, total: ex.items.length };
  if (ex.kind === 'memory-flip') return { ok: w.matched.length, total: ex.pairs.length };
  if (ex.kind === 'order-seq') return { ok: ex.steps.filter((_, i) => w.picked[i] === i).length, total: ex.steps.length };
  return { ok: 0, total: 0 };
}

function eduExHTML(exId) {
  const ex = EDU_EXERCISES[exId];
  if (!ex) return '';
  const w = eduExInitWork(exId);
  const saved = ensureEduState(state).exercises[exId];
  const badges = { 'chip-fill': '⚡ Boşluk Bankası', 'match-pair': '🔗 Çift Eşleştirme', 'sort-bucket': '🗂️ Kutu Sınıflandırma', 'type-fix': '✍️ Aktif Hatırlama', 'spot-fix': '🎯 Tuzak Yakala', 'memory-flip': '🃏 Hafıza Oyunu', 'order-seq': '🔢 Sıralama Oyunu' };
  const sc = w.checked ? eduExScore(exId) : null;
  let body = '';

  if (ex.kind === 'chip-fill') {
    const used = new Set(w.slots.filter(Boolean));
    body = `<div class="ex-bank">${ex.bank.map(word => {
      const isUsed = used.has(word), isSel = w.selChip === word;
      return `<button type="button" class="small ex-chip ${isSel ? 'sel' : ''}" data-act="exChip" data-ex="${exId}" data-val="${esc(word)}" ${isUsed ? 'disabled' : ''}>${esc(word)}</button>`;
    }).join('')}</div>` +
    `<div class="ex-items">${ex.items.map((it, i) => {
      const val = w.slots[i], ok = w.checked && val === it.ans, bad = w.checked && val !== it.ans;
      return `<div class="ex-row ${ok ? 'ok' : bad ? 'bad' : ''}"><span>${i + 1}. ${esc(it.before)}<button type="button" class="ex-slot ${val ? 'filled' : ''}" data-act="exSlot" data-ex="${exId}" data-idx="${i}">${val ? esc(val) : '___'}</button>${esc(it.after)}</span>` +
        (w.checked ? `<small class="ex-fb">${ok ? '✓ ' : '✗ Doğrusu: <b>' + esc(it.ans) + '</b> · '}${esc(it.note)}</small>` : '') + `</div>`;
    }).join('')}</div>`;
  } else if (ex.kind === 'match-pair') {
    const rev = {};
    for (const [li, ri] of Object.entries(w.pairs)) rev[ri] = Number(li);
    body = `<div class="ex-match-grid"><div class="ex-col">${ex.pairs.map((p, li) => {
      const paired = w.pairs[li] !== undefined, isSel = w.selLeft === li;
      const ok = w.checked && w.pairs[li] === li, bad = w.checked && w.pairs[li] !== li;
      return `<button type="button" class="ex-match-btn ${isSel ? 'sel' : ''} ${paired ? 'paired' : ''} ${ok ? 'ok' : bad ? 'bad' : ''}" data-act="exMatchL" data-ex="${exId}" data-idx="${li}">${paired ? `<span class="ex-num">${li + 1}</span>` : ''}${esc(p.left)}</button>`;
    }).join('')}</div><div class="ex-col">${w.rightOrder.map(ri => {
      const p = ex.pairs[ri], matchedL = rev[ri];
      const ok = w.checked && matchedL === ri, bad = w.checked && matchedL !== undefined && matchedL !== ri;
      return `<button type="button" class="ex-match-btn ${matchedL !== undefined ? 'paired' : ''} ${ok ? 'ok' : bad ? 'bad' : ''}" data-act="exMatchR" data-ex="${exId}" data-idx="${ri}">${matchedL !== undefined ? `<span class="ex-num">${matchedL + 1}</span>` : ''}${esc(p.right)}</button>`;
    }).join('')}</div></div>`;
  } else if (ex.kind === 'sort-bucket') {
    const unassigned = ex.items.map((it, i) => ({ ...it, i })).filter(x => w.assigned[x.i] === undefined);
    body = `<div class="ex-bank">${unassigned.length ? unassigned.map(x => `<button type="button" class="small ex-chip ${w.selItem === x.i ? 'sel' : ''}" data-act="exBucketItem" data-ex="${exId}" data-idx="${x.i}">${esc(x.text)}</button>`).join('') : '<span class="edu-tip">Tüm kartlar kutulara dağıtıldı — Kontrol Et butonuna basabilirsin.</span>'}</div>` +
      `<div class="ex-buckets">${ex.buckets.map((bName, bi) => {
        const inside = ex.items.map((it, i) => ({ ...it, i })).filter(x => w.assigned[x.i] === bi);
        return `<div class="ex-bucket" data-act="exBucket" data-ex="${exId}" data-idx="${bi}"><strong>${esc(bName)}</strong><div class="ex-bucket-list">${inside.map(x => {
          const ok = w.checked && x.bucket === bi, bad = w.checked && x.bucket !== bi;
          return `<button type="button" class="small ex-chip ${ok ? 'ok' : bad ? 'bad' : ''}" data-act="exBucketUn" data-ex="${exId}" data-idx="${x.i}" title="Kaldırmak için dokun">${esc(x.text)} ×</button>`;
        }).join('') || '<small class="muted">Buraya eklemek için kart seçip dokun</small>'}</div></div>`;
      }).join('')}</div>`;
  } else if (ex.kind === 'type-fix') {
    body = `<div class="ex-items">${ex.items.map((it, i) => {
      const val = w.vals[i] || '', ok = w.checked && it.ans.includes(val.trim().toLowerCase()), bad = w.checked && !ok;
      return `<div class="ex-row ${ok ? 'ok' : bad ? 'bad' : ''}"><label>${i + 1}. ${esc(it.prompt)}</label><div class="row" style="margin-top:4px"><input class="ex-type-input" data-ex="${exId}" data-idx="${i}" value="${esc(val)}" placeholder="${esc(it.hint || 'Yaz…')}" autocomplete="off" spellcheck="false">${w.checked ? `<small class="ex-fb">${ok ? '✓ Doğru' : '✗ Doğrusu: <b>' + esc(it.ans[0]) + '</b>'}</small>` : ''}</div></div>`;
    }).join('')}</div>`;
  } else if (ex.kind === 'spot-fix') {
    body = `<div class="ex-items">${ex.items.map((it, i) => {
      const pick = w.picks[i], ok = w.checked && pick === it.bad, bad = w.checked && pick !== it.bad;
      return `<div class="ex-row ${ok ? 'ok' : bad ? 'bad' : ''}"><div class="ex-spot-sent">${i + 1}. ${it.tokens.map((tok, ti) => {
        const isPick = pick === ti, isTrue = w.checked && ti === it.bad;
        return `<button type="button" class="ex-tok ${isPick ? 'sel' : ''} ${isTrue ? 'true-bad' : ''}" data-act="exSpot" data-ex="${exId}" data-idx="${i}" data-tok="${ti}">${esc(tok)}</button>`;
      }).join(' ')}</div>${w.checked ? `<small class="ex-fb">${ok ? '✓ Tuzak yakalandı! ' : '✗ Hatalı kısım: <b>' + esc(it.tokens[it.bad]) + '</b> → '}Doğrusu: <b>${esc(it.fix)}</b> · ${esc(it.note)}</small>` : ''}</div>`;
    }).join('')}</div>`;
  } else if (ex.kind === 'memory-flip') {
    body = `<div class="ex-mem-bar"><span>Eşleşen: <b>${w.matched.length} / ${ex.pairs.length}</b></span><span>Hamle: <b>${w.moves}</b></span></div>` +
      `<div class="ex-mem-grid">${w.cards.map((c, ci) => {
        const isMatched = w.matched.includes(c.pairIdx), isOpen = w.open.includes(ci), isMiss = w.miss.includes(ci);
        const show = isMatched || isOpen || isMiss;
        return `<button type="button" class="ex-mem-card ${isMatched ? 'matched' : isMiss ? 'miss' : isOpen ? 'open' : ''}" data-act="exMem" data-ex="${exId}" data-idx="${ci}" ${isMatched ? 'disabled' : ''}>${show ? esc(c.text) : '❓'}</button>`;
      }).join('')}</div>`;
  } else if (ex.kind === 'order-seq') {
    const pickedSet = new Set(w.picked);
    const remaining = w.poolOrder.filter(si => !pickedSet.has(si));
    body = `<div class="ex-seq-slots"><strong>Sıran (${w.picked.length}/${ex.steps.length}):</strong>${w.picked.length ? w.picked.map((si, pos) => {
      const ok = w.checked && si === pos, bad = w.checked && si !== pos;
      return `<button type="button" class="ex-seq-btn placed ${ok ? 'ok' : bad ? 'bad' : ''}" data-act="exSeqUn" data-ex="${exId}" data-pos="${pos}"><span class="ex-num">${pos + 1}</span><span>${esc(ex.steps[si])}</span></button>`;
    }).join('') : '<small class="muted">Alttaki kartlara sırayla dokunarak yukarı diz.</small>'}</div>` +
      `<div class="ex-seq-pool">${remaining.map(si => `<button type="button" class="ex-seq-btn" data-act="exSeqPick" data-ex="${exId}" data-idx="${si}">➕ ${esc(ex.steps[si])}</button>`).join('')}</div>`;
  }

  const stars = sc ? (sc.ok === sc.total ? '⭐⭐⭐' : sc.ok >= Math.ceil(sc.total / 2) ? '⭐⭐' : '⭐') : '';
  return `<section class="edu-ex-card" data-ex-card="${exId}"><div class="ex-head"><div><span class="tag">${badges[ex.kind] || 'Alıştırma'}</span><h4>${esc(ex.title)}</h4></div>${saved?.done ? `<span class="result-badge" style="--result-color:var(--green)">✓ ${saved.score}/${saved.total}</span>` : ''}</div><p class="ex-prompt">${esc(ex.prompt)}</p>${body}<div class="row ex-actions">${ex.kind !== 'memory-flip' ? `<button type="button" class="small primary" data-act="exCheck" data-ex="${exId}">Kontrol Et</button>` : ''}<button type="button" class="small" data-act="exReset" data-ex="${exId}">Sıfırla</button>${sc ? `<span class="ex-score">Sonuç: <b>${sc.ok} / ${sc.total}</b> <span class="ex-stars">${stars}</span></span>` : ''}</div></section>`;
}

function eduMountExercises() {
  document.querySelectorAll('.edu-ex-slot[data-ex-id]').forEach(slot => {
    const id = slot.dataset.exId;
    if (EDU_EXERCISES[id]) slot.innerHTML = eduExHTML(id);
  });
}

function eduRefreshEx(exId, persist = true) {
  if (persist) eduExPersist(exId, false);
  const slot = document.querySelector('.edu-ex-slot[data-ex-id="' + exId + '"]');
  if (slot) slot.innerHTML = eduExHTML(exId);
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act^="ex"]');
  if (!el) return;
  const a = el.dataset.act, exId = el.dataset.ex;
  const ex = EDU_EXERCISES[exId];
  if (!ex) return;
  const w = eduExInitWork(exId);
  if (a === 'exChip') {
    w.selChip = w.selChip === el.dataset.val ? null : el.dataset.val;
    w.checked = false;
    eduRefreshEx(exId);
  } else if (a === 'exSlot') {
    const idx = Number(el.dataset.idx);
    if (w.selChip) { w.slots[idx] = w.selChip; w.selChip = null; }
    else if (w.slots[idx]) { w.slots[idx] = null; }
    w.checked = false;
    eduRefreshEx(exId);
  } else if (a === 'exMatchL') {
    const li = Number(el.dataset.idx);
    if (w.pairs[li] !== undefined) delete w.pairs[li];
    else w.selLeft = w.selLeft === li ? null : li;
    w.checked = false;
    eduRefreshEx(exId);
  } else if (a === 'exMatchR') {
    const ri = Number(el.dataset.idx);
    if (w.selLeft !== null) {
      for (const [k, v] of Object.entries(w.pairs)) if (v === ri) delete w.pairs[k];
      w.pairs[w.selLeft] = ri;
      w.selLeft = null;
    } else {
      for (const [k, v] of Object.entries(w.pairs)) if (v === ri) delete w.pairs[k];
    }
    w.checked = false;
    eduRefreshEx(exId);
  } else if (a === 'exBucketItem') {
    const idx = Number(el.dataset.idx);
    w.selItem = w.selItem === idx ? null : idx;
    w.checked = false;
    eduRefreshEx(exId);
  } else if (a === 'exBucket') {
    const bi = Number(el.dataset.idx);
    const targetItem = w.selItem !== null ? w.selItem : ex.items.findIndex((_, i) => w.assigned[i] === undefined);
    if (targetItem >= 0) { w.assigned[targetItem] = bi; w.selItem = null; w.checked = false; eduRefreshEx(exId); }
  } else if (a === 'exBucketUn') {
    e.stopPropagation();
    delete w.assigned[Number(el.dataset.idx)];
    w.checked = false;
    eduRefreshEx(exId);
  } else if (a === 'exSpot') {
    w.picks[Number(el.dataset.idx)] = Number(el.dataset.tok);
    w.checked = false;
    eduRefreshEx(exId);
  } else if (a === 'exMem') {
    const ci = Number(el.dataset.idx);
    if (w.miss.length) w.miss = [];
    if (w.open.includes(ci)) return;
    w.open.push(ci);
    if (w.open.length === 2) {
      w.moves++;
      const [c1, c2] = w.open;
      if (w.cards[c1].pairIdx === w.cards[c2].pairIdx) {
        w.matched.push(w.cards[c1].pairIdx);
        w.open = [];
        if (w.matched.length === ex.pairs.length) {
          w.checked = true;
          ensureEduState(state).exercises[exId] = { done: true, score: ex.pairs.length, total: ex.pairs.length, work: JSON.parse(JSON.stringify(w)), at: Date.now() };
          eduTouch(true);
          toast('🌟 Tebrikler! Tüm hafıza kartlarını ' + w.moves + ' hamlede eşleştirdin!');
          eduRefreshEx(exId, false);
          return;
        }
      } else {
        w.miss = [c1, c2];
        w.open = [];
      }
    }
    eduRefreshEx(exId);
  } else if (a === 'exSeqPick') {
    const si = Number(el.dataset.idx);
    if (!w.picked.includes(si)) w.picked.push(si);
    w.checked = false;
    eduRefreshEx(exId);
  } else if (a === 'exSeqUn') {
    const pos = Number(el.dataset.pos);
    w.picked.splice(pos, 1);
    w.checked = false;
    eduRefreshEx(exId);
  } else if (a === 'exCheck') {
    w.checked = true;
    const sc = eduExScore(exId);
    ensureEduState(state).exercises[exId] = { done: sc.ok === sc.total, score: sc.ok, total: sc.total, work: JSON.parse(JSON.stringify(w)), at: Date.now() };
    eduTouch(true);
    eduRefreshEx(exId, false);
    toast(sc.ok === sc.total ? '🌟 Harika! Tam puan (' + sc.ok + '/' + sc.total + ')!' : 'Kontrol edildi: ' + sc.ok + '/' + sc.total);
  } else if (a === 'exReset') {
    delete eduExWork[exId];
    delete ensureEduState(state).exercises[exId];
    eduTouch(true);
    eduRefreshEx(exId, false);
  }
});

document.addEventListener('input', e => {
  if (e.target.classList?.contains('ex-type-input')) {
    const exId = e.target.dataset.ex, idx = Number(e.target.dataset.idx);
    const w = eduExInitWork(exId);
    if (w) { w.vals[idx] = e.target.value; w.checked = false; eduExPersist(exId, false); }
  }
});
// ── 3. Sınıf Fen Bilimleri · İnteraktif Web Oyunları Motoru (Bölüm 1: Ünite 1–3 + Ortak Ses/Kayıt) ──
(() => {
  let audioCtx = null;
  let fen3Muted = false;
  const activeIntervals = [];
  const activeRafs = [];

  window.fen3CleanupGames = function () {
    while (activeIntervals.length) clearInterval(activeIntervals.pop());
    while (activeRafs.length) cancelAnimationFrame(activeRafs.pop());
  };

  function playTone(freq, dur = 0.12, type = 'sine', vol = 0.08, delay = 0) {
    if (fen3Muted) return;
    try {
      const AC = window.AudioContext || window.webkitAudioContext;
      if (!AC) return;
      if (!audioCtx) audioCtx = new AC();
      if (audioCtx.state === 'suspended') audioCtx.resume().catch(() => {});
      const t = audioCtx.currentTime + delay;
      const o = audioCtx.createOscillator();
      const g = audioCtx.createGain();
      o.type = type;
      o.frequency.setValueAtTime(freq, t);
      g.gain.setValueAtTime(vol, t);
      g.gain.exponentialRampToValueAtTime(0.001, t + dur);
      o.connect(g);
      g.connect(audioCtx.destination);
      o.start(t);
      o.stop(t + dur + 0.02);
    } catch (_) {}
  }

  const sfxGood = () => { playTone(523, 0.1, 'triangle', 0.09, 0); playTone(659, 0.14, 'triangle', 0.09, 0.08); };
  const sfxWin = () => { playTone(523, 0.1, 'triangle', 0.09, 0); playTone(659, 0.1, 'triangle', 0.09, 0.09); playTone(784, 0.12, 'triangle', 0.1, 0.18); playTone(1046, 0.22, 'triangle', 0.1, 0.28); };
  const sfxBad = () => playTone(195, 0.18, 'sawtooth', 0.055, 0);
  const sfxPop = () => playTone(720, 0.07, 'sine', 0.08, 0);
  const sfxSplash = () => { playTone(320, 0.1, 'sine', 0.07, 0); playTone(230, 0.14, 'sine', 0.06, 0.05); };

  function saveGameProgress(gameId, score, total) {
    if (typeof state === 'undefined' || typeof ensureEduState !== 'function') return;
    const e = ensureEduState(state);
    e.exercises = e.exercises || {};
    e.exercises[gameId] = { done: score >= total, score, total, at: Date.now() };
    if (typeof eduTouch === 'function') eduTouch(true);
    const bar = document.getElementById('fen3ScoreBanner');
    if (bar && typeof window.fen3ScoreBannerHTML === 'function') bar.innerHTML = window.fen3ScoreBannerHTML();
  }

  function gameHeader(gameId, badge, title, subtitle) {
    const saved = typeof state !== 'undefined' ? ensureEduState(state).exercises?.[gameId] : null;
    return `<div class="fg-head">
      <div><span class="fg-badge">${badge}</span><h4>${title}</h4><p class="fg-sub">${subtitle}</p></div>
      <div class="fg-head-right">
        ${saved?.done ? `<span class="fg-won">⭐ Tamamlandı (${saved.score}/${saved.total})</span>` : ''}
        <button type="button" class="small fg-mute" data-fg-mute="1" title="Ses efektleri">${fen3Muted ? '🔇 Ses Kapalı' : '🔊 Ses Açık'}</button>
      </div>
    </div>`;
  }

  window.FEN3_HELPER = {
    activeIntervals, activeRafs, sfxGood, sfxWin, sfxBad, sfxPop, sfxSplash, saveGameProgress, gameHeader
  };

  window.fen3ScoreBannerHTML = function () {
    const allIds = [
      'game-u1-sink', 'game-u1-balloons', 'game-u1-heroes',
      'game-u2-microscope', 'game-u2-mystery', 'game-u2-butterfly',
      'game-u3-dig', 'game-u3-fossil',
      'game-u4-matter', 'game-u4-separate',
      'game-u5-force', 'game-u6-electric',
      'game-u7-farm', 'game-u8-habitat',
      'game-hb-u1', 'game-hb-u2', 'game-hb-u3',
      'game-hb-u4', 'game-hb-u5', 'game-hb-u6'
    ];
    const ex = typeof state !== 'undefined' ? (ensureEduState(state).exercises || {}) : {};
    const done = allIds.filter(id => ex[id]?.done).length;
    const pct = Math.round((done / allIds.length) * 100);
    return `<div class="fg-banner-inner">
      <div><b>🏆 3. Sınıf Kaşifi Karnesi:</b> ${done} / ${allIds.length} Web Oyunu Tamamlandı (%${pct})</div>
      <div class="fg-banner-bar"><i style="width:${pct}%"></i></div>
      <div class="fg-banner-stars">${'⭐'.repeat(Math.min(done, 20))}${done === 0 ? 'Fen Bilimleri ve Hayat Bilgisi oyunlarını bitirip yıldızları topla!' : ''}</div>
    </div>`;
  };

  // ═══════════════════════════════════════════════════════════════
  // OYUN 1: 🧪 Sihirli Su Tankı + Tuzlu Su & Kaptan Salı Görevi
  // ═══════════════════════════════════════════════════════════════
  const SINK_ITEMS = [
    { id: 'wood', name: 'Tahta Küp', icon: '🪵', fresh: true, salty: true, fact: 'Tahta her iki suda da yüzer; içi hafif ve gözeneklidir.' },
    { id: 'nail', name: 'Demir Çivi', icon: '🔩', fresh: false, salty: false, fact: 'Demir çok yoğundur, tuzlu suda bile dibe batar.' },
    { id: 'egg', name: 'Taze Yumurta', icon: '🥚', fresh: false, salty: true, fact: 'Sürpriz! Yumurta tatlı suda batar ama suya tuz eklenince su yoğunlaşır ve YÜZER!' },
    { id: 'ice', name: 'Buz Küpü', icon: '🧊', fresh: true, salty: true, fact: 'Buz sudan hafif olduğu için suyun üstünde yüzer!' },
    { id: 'coin', name: 'Madeni Para', icon: '🪙', fresh: false, salty: false, fact: 'Metal para yoğun olduğu için dibe çöker.' },
    { id: 'cork', name: 'Mantar Tıpa', icon: '🍾', fresh: true, salty: true, fact: 'Mantar tıpa hafif olduğu için yüzeyde kalır.' },
    { id: 'marble', name: 'Cam Bilye', icon: '🔮', fresh: false, salty: false, fact: 'Cam bilye ağır ve yoğundur; hemen batar.' },
    { id: 'grape', name: 'Üzüm Tanesi', icon: '🍇', fresh: false, salty: true, fact: 'Üzüm tatlı suda batar ama tuzlu suda yukarı çıkar!' }
  ];

  function mountSinkGame(slot) {
    let sel = 'wood', salty = false, guess = null, tested = {}, dropping = false;
    let raftPick = [], raftDone = false;
    let msg = 'ZORLU DENEY: Bu kez "Tatlı Su" ve "Tuzlu Su" farkı da var! Nesne seç, tahmin et, suya bırak!';

    function draw() {
      const cur = SINK_ITEMS.find(x => x.id === sel) || SINK_ITEMS[0];
      const key = cur.id + '_' + (salty ? 's' : 'f');
      const curFloats = salty ? cur.salty : cur.fresh;
      const doneKeys = Object.keys(tested).length;
      const floaters = SINK_ITEMS.filter(x => tested[x.id + '_' + (salty ? 's' : 'f')] && (salty ? x.salty : x.fresh));
      const sinkers = SINK_ITEMS.filter(x => tested[x.id + '_' + (salty ? 's' : 'f')] && !(salty ? x.salty : x.fresh));
      const hits = Object.values(tested).filter(x => x.hit).length;

      slot.innerHTML = `<section class="fg-card sky">
        ${gameHeader('game-u1-sink', '🧪 ZORLU DENEY LABI · 2 AŞAMALI', 'Oyun 1 · Tatlı Su vs Tuzlu Su Tankı & Kaptan Salı', 'Yumurta ve üzüm tuzlu suda nasıl davranır? İki suda da dene, sonra Kaptan\'ın batmayacak 3 malzemeli salını kur!')}
        <div class="fg-sink-layout">
          <div class="fg-tank-col">
            <div class="fg-water-switch">
              <button type="button" class="small ${!salty ? 'primary' : ''}" data-sink-mode="0">💧 Tatlı Su</button>
              <button type="button" class="small ${salty ? 'primary' : ''}" data-sink-mode="1">🧂 Tuzlu Su (Yoğun)</button>
            </div>
            <div class="fg-shelf">
              ${SINK_ITEMS.map(it => {
                const k = it.id + '_' + (salty ? 's' : 'f');
                const t = tested[k];
                return `<button type="button" class="fg-obj-btn ${sel === it.id ? 'sel' : ''} ${t ? 'done' : ''}" data-sink-pick="${it.id}">
                  <span class="fg-ico">${it.icon}</span><small>${it.name}</small>${t ? `<span class="fg-mini-tag">${t.hit ? '🌟' : '🔬'}</span>` : ''}
                </button>`;
              }).join('')}
            </div>
            <div class="fg-controls">
              <div class="fg-guess-row">
                <span><b>Tahminin (${salty ? 'Tuzlu' : 'Tatlı'}):</b></span>
                <button type="button" class="small ${guess === true ? 'primary' : ''}" data-sink-guess="1">🎈 Yüzer</button>
                <button type="button" class="small ${guess === false ? 'primary' : ''}" data-sink-guess="0">⚓ Batar</button>
              </div>
              <button type="button" class="primary fg-drop-btn" data-sink-drop="1" ${guess === null ? 'disabled' : ''}>💧 Suya Bırak!</button>
            </div>
            <div class="fg-tank ${salty ? 'salty' : ''}">
              <div class="fg-air">${!tested[key] && !dropping ? `<div class="fg-held-item">${cur.icon}<span>${cur.name}</span></div>` : ''}</div>
              <div class="fg-water">
                <div class="fg-float-row">${floaters.map(f => `<span class="fg-in-water floater" title="${f.name}">${f.icon}</span>`).join('')}</div>
                <div class="fg-sink-row">${sinkers.map(s => `<span class="fg-in-water sinker" title="${s.name}">${s.icon}</span>`).join('')}</div>
                ${dropping ? `<div class="fg-drop-anim ${curFloats ? 'to-top' : 'to-bot'}">${cur.icon}</div>` : ''}
              </div>
              <div class="fg-sand"></div>
            </div>
          </div>
          <div class="fg-notebook">
            <h5>📒 Deney Kayıtları (${doneKeys}/16 test · ${hits} doğru tahmin)</h5>
            <div class="fg-msg">${msg}</div>
            <div class="fg-raft-box">
              <h6>⛵ Kaptan'ın Salı Görevi (Tatlı Suda Yüzebilen 3 Malzeme Seç!)</h6>
              <div class="row">
                ${['wood', 'nail', 'cork', 'marble', 'ice', 'coin'].map(id => {
                  const it = SINK_ITEMS.find(x => x.id === id);
                  const on = raftPick.includes(id);
                  return `<button type="button" class="small ${on ? 'primary' : ''}" data-raft-id="${id}" ${raftDone ? 'disabled' : ''}>${it.icon} ${it.name}</button>`;
                }).join('')}
              </div>
              <div class="row" style="margin-top:8px">
                <button type="button" class="small primary" data-raft-test="1" ${raftPick.length !== 3 || raftDone ? 'disabled' : ''}>⛵ Salı Suya İndir (${raftPick.length}/3)</button>
                <button type="button" class="small" data-sink-reset="1">🔄 Sıfırla</button>
              </div>
            </div>
          </div>

      </section>`;
    }

    slot.onclick = e => {

      const p = e.target.closest('[data-sink-pick]');
      if (p) { sel = p.dataset.sinkPick; guess = null; sfxPop(); draw(); return; }

      if (e.target.closest('[data-sink-drop]')) {

        const cur = SINK_ITEMS.find(x => x.id === sel);

        setTimeout(() => {
          dropping = false;
          const hit = guess === resFloats;
          tested[cur.id + '_' + (salty ? 's' : 'f')] = { hit, floats: resFloats };

        }, 500);
        return;
      }
      const rBtn = e.target.closest('[data-raft-id]');
      if (rBtn) {
        const id = rBtn.dataset.raftId;
        if (raftPick.includes(id)) raftPick = raftPick.filter(x => x !== id);
        else if (raftPick.length < 3) raftPick.push(id);
        sfxPop(); draw(); return;
      }
      if (e.target.closest('[data-raft-test]')) {
        const ok = raftPick.every(id => SINK_ITEMS.find(x => x.id === id).fresh);
        if (ok) {
          raftDone = true; sfxWin();
          msg = '⛵🎉 Harika Mühendis! Tahta, mantar ve buz tatlı suda yüzdüğü için salın batmadı!';
          saveGameProgress('game-u1-sink', 1, 1);
        } else {
          sfxBad();
          msg = '⚓ Eyvah, salın battı! Seçtiğin malzemelerden biri ağır ve batıyor. Yukarıdaki tankta tek tek test edip tekrar dene!';
          raftPick = [];
        }
        draw(); return;
      }
      if (e.target.closest('[data-sink-reset]')) { sel = 'wood'; salty = false; guess = null; tested = {}; raftPick = []; raftDone = false; msg = 'Deney sıfırlandı!'; draw(); }
    };
    draw();
  }

  // ═══════════════════════════════════════════════════════════════
  // OYUN 2: 🎈 Arcade Balon Avı (3 Can, 35 sn Sayaç, Combo x2/x3!)
  // ═══════════════════════════════════════════════════════════════
  const BAL_GOOD = ['Meraklıdır', 'Sabırlıdır', 'Gözlem Yapar', 'Kanıt Arar', 'Tarafsızdır', 'Paylaşımcıdır', 'Tekrar Dener', 'Ölçüm Yapar', 'Soru Sorar'];
  const BAL_BAD = ['Hemen Pes Eder', 'Kanıtsız İnanır', 'Sonucu Uydurur', 'Veriyi Gizler', 'Tek Başına Yapar', 'Hiç Şüphe Etmez'];

  function mountBalloonsGame(slot) {
    let running = false, score = 0, caught = 0, lives = 3, timeLeft = 35, combo = 0;
    let balloons = [], particles = [], timerId = null, lastTime = 0, spawnTimer = 0;
    const COLORS = ['#ef4444', '#f59e0b', '#10b981', '#0ea5e9', '#8b5cf6', '#ec4899'];

    slot.innerHTML = `<section class="fg-card sun">
      ${gameHeader('game-u1-balloons', '🎈 ARCADE CANVAS OYUNU · ZAMAN YARIŞI', 'Oyun 2 · Bilim İnsanı Balon Avı (3 Can · 35 Sn)', 'Dikkat! Çeldirici balonlar hızlanıyor: 35 saniyede 3 canın bitmeden 10 doğru balonu patlat! Seri yakalarsan Combo x2/x3 puan alırsın!')}
      <div class="fg-bal-bar">
        <span>❤️ Can: <b id="fgBalLives">❤️❤️❤️</b></span>
        <span>⏱️ Süre: <b id="fgBalTime">35 sn</b></span>
        <span>🔥 Seri: <b id="fgBalCombo">x1</b></span>
        <span>⭐ Puan: <b id="fgBalScore">0</b></span>
        <span>🎯 <b id="fgBalCaught">0 / 10</b></span>
        <div class="row">
          <button type="button" class="small primary" id="fgBalStart">▶ Başlat</button>
          <button type="button" class="small" id="fgBalReset">🔄 Sıfırla</button>
        </div>
      </div>
      <div class="fg-msg" id="fgBalMsg">Şaşırtmacalara dikkat! Örneğin "Tek Başına Yapar" veya "Sonucu Uydurur" YANLIŞTIR!</div>
      <div class="fg-canvas-wrap"><canvas id="fgBalCanvas" width="680" height="330"></canvas></div>
    </section>`;

    const canvas = slot.querySelector('#fgBalCanvas');
    const ctx = canvas.getContext('2d');
    const scoreEl = slot.querySelector('#fgBalScore');
    const caughtEl = slot.querySelector('#fgBalCaught');
    const livesEl = slot.querySelector('#fgBalLives');
    const timeEl = slot.querySelector('#fgBalTime');
    const comboEl = slot.querySelector('#fgBalCombo');
    const msgEl = slot.querySelector('#fgBalMsg');
    const startBtn = slot.querySelector('#fgBalStart');

    function syncHUD() {
      scoreEl.textContent = score;
      caughtEl.textContent = caught + ' / 10';
      livesEl.textContent = lives > 0 ? '❤️'.repeat(lives) : '💔';
      timeEl.textContent = timeLeft + ' sn';
      comboEl.textContent = 'x' + (combo >= 4 ? 3 : combo >= 2 ? 2 : 1);
    }

    function stopGame(win, reason) {
      running = false;
      if (timerId) { clearInterval(timerId); timerId = null; }
      startBtn.textContent = win ? '🏆 Kazandın!' : '▶ Tekrar Dene';
      msgEl.textContent = reason;
      if (win) { sfxWin(); saveGameProgress('game-u1-balloons', caught, 10); }
      else sfxBad();
    }

    function spawnBalloon() {
      const isGood = Math.random() < 0.58;
      const pool = isGood ? BAL_GOOD : BAL_BAD;
      const speedBoost = 1 + caught * 0.08;
      balloons.push({
        x: 68 + Math.random() * (canvas.width - 136),
        y: canvas.height + 44,
        r: 42,
        vy: (58 + Math.random() * 44) * speedBoost,
        sway: Math.random() * 6,
        color: COLORS[Math.floor(Math.random() * COLORS.length)],
        label: pool[Math.floor(Math.random() * pool.length)],
        isGood
      });
    }

    function burst(x, y, color) {
      for (let i = 0; i < 18; i++) {
        const ang = (Math.PI * 2 * i) / 18;
        const sp = 60 + Math.random() * 100;
        particles.push({ x, y, vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, life: 0.55, color });
      }
    }

    function drawScene(dt) {
      ctx.clearRect(0, 0, canvas.width, canvas.height);
      const grad = ctx.createLinearGradient(0, 0, 0, canvas.height);
      grad.addColorStop(0, '#bae6fd'); grad.addColorStop(1, '#f0f9ff');
      ctx.fillStyle = grad; ctx.fillRect(0, 0, canvas.width, canvas.height);

      ctx.fillStyle = 'rgba(255,255,255,0.85)';
      [[100, 56, 26], [340, 40, 22], [570, 68, 28]].forEach(([cx, cy, r]) => {
        ctx.beginPath(); ctx.arc(cx, cy, r, 0, Math.PI * 2); ctx.arc(cx + r * 0.8, cy + 4, r * 0.7, 0, Math.PI * 2); ctx.arc(cx - r * 0.8, cy + 5, r * 0.65, 0, Math.PI * 2); ctx.fill();
      });

      if (!running && balloons.length === 0) {
        ctx.fillStyle = '#0f2438'; ctx.font = 'bold 18px Segoe UI, sans-serif'; ctx.textAlign = 'center';
        ctx.fillText(caught >= 10 ? '🏆 TEBRİKLER! Puanın: ' + score : 'Hazırsan "▶ Başlat" butonuna bas!', canvas.width / 2, canvas.height / 2);
        return;
      }

      for (const b of balloons) {
        if (running) { b.y -= b.vy * dt; b.sway += dt * 2.4; b.x += Math.sin(b.sway) * 20 * dt; }
        ctx.strokeStyle = '#64748b'; ctx.lineWidth = 1.6;
        ctx.beginPath(); ctx.moveTo(b.x, b.y + b.r); ctx.quadraticCurveTo(b.x + 6, b.y + b.r + 18, b.x - 3, b.y + b.r + 32); ctx.stroke();
        ctx.fillStyle = b.color;
        ctx.beginPath(); ctx.ellipse(b.x, b.y, b.r * 0.94, b.r * 1.06, 0, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = 'rgba(255,255,255,0.28)';
        ctx.beginPath(); ctx.ellipse(b.x - 13, b.y - 14, 9, 15, -0.4, 0, Math.PI * 2); ctx.fill();
        ctx.fillStyle = '#fff'; ctx.font = 'bold 11.5px Segoe UI, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
        const words = b.label.split(' ');
        if (words.length > 1) {
          const mid = Math.ceil(words.length / 2);
          ctx.fillText(words.slice(0, mid).join(' '), b.x, b.y - 7);
          ctx.fillText(words.slice(mid).join(' '), b.x, b.y + 8);
        } else ctx.fillText(b.label, b.x, b.y);
      }
      balloons = balloons.filter(b => b.y > -60);

      for (const p of particles) {
        p.x += p.vx * dt; p.y += p.vy * dt; p.life -= dt;
        ctx.globalAlpha = Math.max(0, p.life * 1.8); ctx.fillStyle = p.color;
        ctx.beginPath(); ctx.arc(p.x, p.y, 4.5, 0, Math.PI * 2); ctx.fill();
      }
      ctx.globalAlpha = 1; particles = particles.filter(p => p.life > 0);
    }

    function loop(ts) {
      if (!document.body.contains(canvas)) return;
      const dt = Math.min(0.05, (ts - (lastTime || ts)) / 1000);
      lastTime = ts;
      if (running) {
        spawnTimer += dt;
        if (spawnTimer >= 0.9 && balloons.length < 7) { spawnBalloon(); spawnTimer = 0; }
      }
      drawScene(dt);
      if (running || particles.length > 0) { const id = requestAnimationFrame(loop); activeRafs.push(id); }
    }

    canvas.addEventListener('pointerdown', e => {
      if (!running) return;
      const rect = canvas.getBoundingClientRect();
      const px = (e.clientX - rect.left) * (canvas.width / rect.width);
      const py = (e.clientY - rect.top) * (canvas.height / rect.height);
      for (let i = balloons.length - 1; i >= 0; i--) {
        const b = balloons[i];
        if (Math.hypot(px - b.x, py - b.y) <= b.r + 6) {
          balloons.splice(i, 1);
          if (b.isGood) {
            combo++;
            const mult = combo >= 4 ? 3 : combo >= 2 ? 2 : 1;
            score += 10 * mult;
            caught++;
            burst(b.x, b.y, b.color); sfxPop();
            msgEl.textContent = `🌟 "${b.label}" doğru! (+${10 * mult} Puan · Seri x${mult})`;
            if (caught >= 10) stopGame(true, `🏆 Mükemmel! Süre bitmeden 10 doğru balonu yakaladın! Toplam Puan: ${score}`);
          } else {
            combo = 0; lives--;
            burst(b.x, b.y, '#64748b'); sfxBad();
            msgEl.textContent = `💥 Eyvah! "${b.label}" bir tuzaktı! 1 can gitti.`;
            if (lives <= 0) stopGame(false, '💔 Canların bitti! Sıfırlayıp tekrar dene, şaşırtmacalara dikkat et!');
          }
          syncHUD();
          break;
        }
      }
    });

    function resetAll() {
      running = false; if (timerId) { clearInterval(timerId); timerId = null; }
      score = 0; caught = 0; lives = 3; timeLeft = 35; combo = 0; balloons = []; particles = [];
      startBtn.textContent = '▶ Başlat'; syncHUD(); drawScene(0);
    }

    startBtn.onclick = () => {
      if (caught >= 10 || lives <= 0 || timeLeft <= 0) resetAll();
      running = !running;
      startBtn.textContent = running ? '⏸ Duraklat' : '▶ Devam Et';
      if (running) {
        if (!timerId) {
          timerId = setInterval(() => {
            if (!running) return;
            timeLeft--;
            syncHUD();
            if (timeLeft <= 0) stopGame(false, '⏱️ Süre doldu! Sıfırlayıp biraz daha hızlı dene!');
          }, 1000);
          activeIntervals.push(timerId);
        }
        if (balloons.length === 0) spawnBalloon();
        lastTime = performance.now();
        activeRafs.push(requestAnimationFrame(loop));
      }
    };

    slot.querySelector('#fgBalReset').onclick = () => { resetAll(); msgEl.textContent = 'Oyun sıfırlandı! Başlamak için "▶ Başlat"a bas.'; };
    syncHUD(); drawScene(0);
  }

        ctx.clearRect(0, 0, 240, 240);
        ctx.fillStyle = slideId === 'yogurt' ? '#fefce8' : slideId === 'pond' ? '#ecfeff' : (slideId === 'bread' || slideId === 'yeast') ? '#fef3c7' : '#dcfce7';
        ctx.fillRect(0, 0, 240, 240);

        if (zoom < 220) {
          ctx.fillStyle = '#64748b'; ctx.font = 'bold 13px Segoe UI, sans-serif'; ctx.textAlign = 'center';
          ctx.fillText('Zoomu 500x üstüne çek!', 120, 120);
        } else {
          if (slideId === 'yogurt') {
            ctx.fillStyle = '#0284c7';
            for (let i = 0; i < 9; i++) {
              const bx = 40 + (i * 23 + Math.sin(t + i) * 16) % 165, by = 45 + (i * 31 + Math.cos(t * 1.2 + i) * 14) % 150;
              ctx.save(); ctx.translate(bx, by); ctx.rotate(t * 0.4 + i); ctx.beginPath(); ctx.roundRect(-12, -4, 24, 8, 4); ctx.fill(); ctx.restore();
            }
          } else if (slideId === 'pond') {
            for (let i = 0; i < 4; i++) {
              const ax = 60 + i * 38 + Math.sin(t + i) * 18, ay = 75 + (i % 2) * 70 + Math.cos(t * 0.9 + i) * 16;
              ctx.fillStyle = 'rgba(20,184,166,0.45)'; ctx.strokeStyle = '#0f766e'; ctx.lineWidth = 2; ctx.beginPath();
              for (let a = 0; a < Math.PI * 2; a += 0.4) { const rad = 16 + Math.sin(a * 3 + t * 2 + i) * 4; const px = ax + Math.cos(a) * rad, py = ay + Math.sin(a) * rad; a === 0 ? ctx.moveTo(px, py) : ctx.lineTo(px, py); }
              ctx.closePath(); ctx.fill(); ctx.stroke();
            }
          } else if (slideId === 'bread' || slideId === 'yeast') {
            ctx.strokeStyle = '#65a30d'; ctx.lineWidth = 2.2;
            for (let i = 0; i < 6; i++) {
              const x0 = 40 + i * 32;
              if (slideId === 'bread') { ctx.beginPath(); ctx.moveTo(x0, 220); ctx.quadraticCurveTo(x0 + Math.sin(t + i) * 12, 140, x0 + 8, 75 + (i % 2) * 28); ctx.stroke(); ctx.fillStyle = '#166534'; ctx.beginPath(); ctx.arc(x0 + 8, 75 + (i % 2) * 28, 10, 0, Math.PI * 2); ctx.fill(); }
              else { ctx.fillStyle = '#d97706'; ctx.beginPath(); ctx.arc(45 + i * 28, 100 + Math.sin(t + i) * 22, 13, 0, Math.PI * 2); ctx.fill(); ctx.beginPath(); ctx.arc(57 + i * 28, 88 + Math.sin(t + i) * 22, 7, 0, Math.PI * 2); ctx.fill(); }
            }
          } else {
            ctx.strokeStyle = slideId === 'onion' ? '#9333ea' : '#15803d'; ctx.lineWidth = 1.6;
            for (let r = 0; r < 5; r++) for (let c = 0; c < 5; c++) {
              ctx.fillStyle = slideId === 'onion' ? 'rgba(216,180,254,0.45)' : 'rgba(74,222,128,0.45)';
              ctx.fillRect(20 + c * 40, 20 + r * 40, 36, 36); ctx.strokeRect(20 + c * 40, 20 + r * 40, 36, 36);
              ctx.fillStyle = slideId === 'onion' ? '#6b21a8' : '#166534'; ctx.beginPath(); ctx.arc(38 + c * 40, 38 + r * 40, 5, 0, Math.PI * 2); ctx.fill();
            }
          }
        }
        ctx.strokeStyle = 'rgba(15,36,56,0.18)'; ctx.lineWidth = 1;
        ctx.beginPath(); ctx.moveTo(120, 0); ctx.lineTo(120, 240); ctx.moveTo(0, 120); ctx.lineTo(240, 120); ctx.stroke();
        const badge = slot.querySelector('#fgMicZoomLbl');
        if (badge) badge.textContent = `${zoom}x · ${sharpNow ? '✨ NET!' : '🌫️ Odakla'}`;
        activeRafs.push(requestAnimationFrame(anim));
      }
      activeRafs.push(requestAnimationFrame(anim));

      const updateFocusUI = () => {
        const sNow = SLIDES.find(x => x.id === slideId);
        const sharpNow = zoom >= 500 && Math.abs(focus - sNow.targetFocus) <= 12;
        slot.querySelector('#fgMicVal').textContent = zoom + 'x';
        slot.querySelector('#fgMicFocVal').textContent = focus;
        if (!step1GroupOk) slot.querySelectorAll('[data-mic-grp]').forEach(b => b.disabled = !sharpNow);
        if (sharpNow) slot.querySelector('#fgMicMsg').textContent = '✨ ' + sNow.desc;
      };
      slot.querySelector('#fgMicRange').oninput = e => { zoom = Number(e.target.value); updateFocusUI(); };
      slot.querySelector('#fgMicFoc').oninput = e => { focus = Number(e.target.value); updateFocusUI(); };
    }

    slot.onclick = e => {
      const sb = e.target.closest('[data-mic-slide]');
      if (sb) { slideId = sb.dataset.micSlide; zoom = 100; focus = 15; step1GroupOk = false; sfxPop(); renderUI(); return; }
      const gb = e.target.closest('[data-mic-grp]');
      if (gb) {
        const s = SLIDES.find(x => x.id === slideId);
        if (gb.dataset.micGrp === s.group) { step1GroupOk = true; sfxGood(); msg = '✅ Grup doğru! Şimdi Aşama 2 sorusunu cevapla!'; renderUI(); }
        else { sfxBad(); slot.querySelector('#fgMicMsg').textContent = '🤔 Dikkat! Bu canlı farklı bir grupta.'; }
        return;
      }
      const qb = e.target.closest('[data-mic-q]');
      if (qb) {
        const s = SLIDES.find(x => x.id === slideId);
        if (Number(qb.dataset.micQ) === s.qAns) {
          found[s.id] = true; step1GroupOk = false; sfxGood();
          msg = '🌟 Süper! Lam deftere kaydedildi!';
          if (Object.keys(found).length === SLIDES.length) { sfxWin(); saveGameProgress('game-u2-microscope', SLIDES.length, SLIDES.length); }
          const next = SLIDES.find(x => !found[x.id]);
          if (next) { slideId = next.id; zoom = 100; focus = 15; }
          renderUI();
        } else { sfxBad(); slot.querySelector('#fgMicMsg').textContent = '❌ Tekrar düşün!'; }
      }
    };
    renderUI();
  }

  function mountDigGame(slot) {
    let rockIdx = 0, hits = {}, selMine = null, matched = {}, msg = 'Sert kayalı karolar (🪨) 2 kazma darbesi ister! Hepsini kazıp doğru kullanım alanına gönder!';

    function draw() {
      const r = ROCK_STEPS[rockIdx];
      const matchCount = Object.keys(matched).length;
      slot.innerHTML = `<section class="fg-card sun">
        ${gameHeader('game-u3-dig', '⛏️ ZORLU YER ALTI KAZI ATÖLYESİ', 'Oyun 7 · Kayaç Çekici & 8 Maden Kazısı', 'Solda kayacı ufala; sağda sert karoları 2 darbede kırıp çıkardığın 8 madeni kullanım alanıyla eşleştir!')}

                const h = hits[m.id] || 0, isDug = h >= m.hp, isDone = matched[m.id], isSel = selMine === m.id;
                return `<button type="button" class="fg-tile ${isDug ? 'dug' : ''} ${isSel ? 'sel' : ''} ${isDone ? 'done' : ''}" data-dig-tile="${m.id}">

            </div>
            <div class="fg-msg">${msg}</div>
            <div class="fg-use-grid">
              ${[MINES[5], MINES[1], MINES[7], MINES[0], MINES[6], MINES[3], MINES[2], MINES[4]].map(m => {

      const tile = e.target.closest('[data-dig-tile]');

        const id = tile.dataset.digTile, m = MINES.find(x => x.id === id);
        hits[id] = (hits[id] || 0);

      canvas.onpointermove = e => scrub(e);
      canvas.onpointerup = () => { brushing = false; checkClear(); };

      { name: 'Parkur 2: Kaygan Buz Pisti!', friction: 0.996, targetX: 490, w: 78, tip: 'Buzda sürtünme azdır, araba zor durur! Erkenden ters kuvvet (fren) uygula!' },
      { name: 'Parkur 3: Rüzgarlı Tepe', friction: 0.98, wind: -0.05, targetX: 500, w: 72, tip: 'Karşıdan rüzgar arabayı geri itiyor! Daha güçlü itip tam bayrakta durdur!' }
    ];
    let lvl = 0, carX = 45, vel = 0, won = {}, shapeMsg = 'Kuvvet testi için aşağıdaki cisimlere tıkla!';

    slot.innerHTML = `<section class="fg-card sun">
      ${H().gameHeader('game-u5-force', '🏎️ GERÇEK FİZİK & KUVVET PARKURU', 'Oyun 11 · İtme–Çekme ile Hedefe Park Et & Şekil Değiştirme', 'Arabayı sağa iterek bayrağa götür ama UÇURUMA DÜŞMEDEN ters yönde iterek durdur! Hız 0 olunca yeşil alanda olmalısın!')}
      <div class="row" id="fgLvlRow"></div>
      <div class="fg-msg" id="fgForceMsg">${LEVELS[0].tip}</div>
      <div class="fg-canvas-wrap"><canvas id="fgForceCanvas" width="660" height="170" style="border-radius:12px;border:2px solid #cbd5e1;width:100%;max-width:660px"></canvas></div>
      <div class="row" style="justify-content:center;gap:10px">
        <button type="button" class="small primary" id="fgPushL">⬅️ Sola İt / Fren</button>
        <button type="button" class="small primary" id="fgPushR">➡️ Sağa İt (+Hız)</button>
        <button type="button" class="small" id="fgForceReset">🔄 Baştan Al</button>
      </div>
      <div class="fg-notebook" style="margin-top:6px">
        <h6>🧱 Kuvvetin Şekil Değiştirme Etkisi (Tıkla &amp; Test Et)</h6>
        <div class="row">
          <button type="button" class="small" data-sh="hamur">🟡 Oyun Hamuru</button>
          <button type="button" class="small" data-sh="lastik">🎗️ Paket Lastiği</button>
          <button type="button" class="small" data-sh="sunger">🧽 Sünger</button>
          <button type="button" class="small" data-sh="bardak">🥃 Cam Bardak</button>
        </div>
        <small id="fgShapeMsg" style="display:block;margin-top:6px">${shapeMsg}</small>
      </div>
    </section>`;

    const canvas = slot.querySelector('#fgForceCanvas'), ctx = canvas.getContext('2d');
    const msgEl = slot.querySelector('#fgForceMsg'), lvlRow = slot.querySelector('#fgLvlRow');

    function renderLvlBtns() {
      lvlRow.innerHTML = LEVELS.map((lv, i) => `<button type="button" class="small ${lvl === i ? 'primary' : ''}" data-flvl="${i}">${won[i] ? '✅ ' : ''}${lv.name}</button>`).join('');
      lvlRow.querySelectorAll('[data-flvl]').forEach(b => b.onclick = () => { lvl = Number(b.dataset.flvl); carX = 45; vel = 0; msgEl.textContent = LEVELS[lvl].tip; renderLvlBtns(); });
    }
    renderLvlBtns();

    function step() {
      if (!document.body.contains(canvas)) return;
      const lv = LEVELS[lvl];
      if (Math.abs(vel) > 0.02 || (lv.wind && carX > 45)) {
        vel = (vel + (lv.wind || 0)) * lv.friction;
        carX += vel;
        if (carX < 30) { carX = 30; vel = 0; }
        if (Math.abs(vel) < 0.06) {
          vel = 0;
          if (carX >= lv.targetX && carX <= lv.targetX + lv.w - 30) {
            if (!won[lvl]) {
              won[lvl] = true; H().sfxGood();
              msgEl.textContent = `🏁 MÜKEMMEL! ${lv.name} içinde tam hedefte durdun!`;
              renderLvlBtns();
              if (Object.keys(won).length === LEVELS.length) { H().sfxWin(); H().saveGameProgress('game-u5-force', 3, 3); msgEl.textContent = '🏆 3 Fizik Parkurunu da Ustaca Tamamladın!'; }
            }
          }
        }
        if (carX > 590) {
          carX = 45; vel = 0; H().sfxBad();
          msgEl.textContent = '💥 Uçuruma düştün! Çok hızlı ittin, zıt yönde iterek yavaşlatmayı unutma!';
        }
      }

      ctx.clearRect(0, 0, 660, 170);
      ctx.fillStyle = lvl === 1 ? '#e0f2fe' : '#f8fafc'; ctx.fillRect(0, 0, 660, 170);
      // Yol ve hedef
      ctx.fillStyle = lvl === 1 ? '#bae6fd' : '#cbd5e1'; ctx.fillRect(0, 125, 595, 22);
      ctx.fillStyle = '#86efac'; ctx.fillRect(lv.targetX, 125, lv.w, 22);
      ctx.fillStyle = '#0f172a'; ctx.fillRect(lv.targetX + lv.w - 10, 75, 4, 50);
      ctx.fillStyle = '#16a34a'; ctx.fillRect(lv.targetX + lv.w - 6, 75, 26, 16);
      // Uçurum
      ctx.fillStyle = '#fee2e2'; ctx.fillRect(595, 125, 65, 45);
      ctx.fillStyle = '#b91c1c'; ctx.font = 'bold 11px Segoe UI, sans-serif'; ctx.fillText('UÇURUM!', 602, 148);
      // Araba
      ctx.fillStyle = '#ef4444'; ctx.beginPath(); ctx.roundRect(carX, 96, 48, 22, 6); ctx.fill();
      ctx.fillStyle = '#38bdf8'; ctx.fillRect(carX + 12, 86, 22, 12);
      ctx.fillStyle = '#1e293b'; ctx.beginPath(); ctx.arc(carX + 11, 121, 7, 0, Math.PI * 2); ctx.arc(carX + 37, 121, 7, 0, Math.PI * 2); ctx.fill();
      ctx.fillStyle = '#0f172a'; ctx.font = 'bold 12px Segoe UI, sans-serif';
      ctx.fillText(`Hız: ${vel.toFixed(1)} | Konum: ${Math.round(carX)}`, 14, 24);
      if (lv.wind) ctx.fillText('💨 Rüzgar Sola Esiyor!', 480, 24);
      H().activeRafs.push(requestAnimationFrame(step));
    }
    H().activeRafs.push(requestAnimationFrame(step));

    slot.querySelector('#fgPushR').onclick = () => { vel += 2.6; H().sfxPop(); };
    slot.querySelector('#fgPushL').onclick = () => { vel -= 2.2; H().sfxPop(); };
    slot.querySelector('#fgForceReset').onclick = () => { carX = 45; vel = 0; msgEl.textContent = LEVELS[lvl].tip; };
    slot.querySelectorAll('[data-sh]').forEach(b => b.onclick = () => {
      const m = {
        hamur: '🟡 Oyun hamuruna kuvvet uygulayınca şekli KALICI olarak değişir!',
        lastik: '🎗️ Paket lastiğini çekince uzar, bırakınca ESKİ HÂLİNE DÖNER (esnek)!',
        sunger: '🧽 Süngeri sıkınca şekli değişir, bırakınca eski hâline döner!',
        bardak: '🥃 Cam bardağa sert kuvvet uygularsan kırılır (esnek değildir)!'
      };
      slot.querySelector('#fgShapeMsg').textContent = m[b.dataset.sh]; H().sfxPop();
    });
  }

      { id: 'buz', name: '🧊 Buzdolabı', src: 'sehir' }, { id: 'fener', name: '🔦 El Feneri', src: 'pil' },
      { id: 'tel', name: '📱 Akıllı Telefon', src: 'batarya' }, { id: 'saat', name: '🕰️ Duvar Saati', src: 'pil' },
      { id: 'ut', name: '🫧 Çamaşır Mak.', src: 'sehir' }, { id: 'ev', name: '🚗 Elektrikli Araba', src: 'batarya' }

      { id: 'h1', txt: '💦 Islak elle prize dokunuluyor!', fix: 'Kurulanıp kuru elle dokunuldu ✅' },
      { id: 'h2', txt: '⚡ Kablosu soyulmuş priz!', fix: 'Tamir edildi / fiş çekildi ✅' },

      { id: 'h4', txt: '🍴 Prize metal çatal sokulmaya çalışılıyor!', fix: 'Metal cisim uzaklaştırıldı ✅' }
    ];
    const WASTES = [
      { id: 'w1', txt: '☀️ Gündüz yanan salon lambası (Kapat)', save: 25 },
      { id: 'w2', txt: '📺 Kimsenin izlemediği açık TV (Kapat)', save: 25 },
      { id: 'w3', txt: '🧊 Kapağı açık kalmış buzdolabı (Kapat)', save: 25 },
      { id: 'w4', txt: '💡 Eski akkor ampul (LED ile değiştir)', save: 25 }
    ];
    let devIdx = 0, devDone = false, fixedH = {}, fixedW = {}, msg = '1) Cihazın kaynağını seç. 2) Evdeki tüm elektrik tehlikelerini temizle. 3) Tasarruf sayacını %100 yap!';

    function draw() {
      const hCount = Object.keys(fixedH).length, wPct = Object.values(fixedW).reduce((a, b) => a + b, 0);
      const cur = DEVICES[devIdx];
      slot.innerHTML = `<section class="fg-card rose">
        ${H().gameHeader('game-u6-electric', '⚡ AKILLI EV MÜHENDİSİ', 'Oyun 12 · Elektrik Kaynağı, Güvenlik & Tasarruf Görevi', 'Üç görevi de tamamla: Kaynakları bağla, 4 tehlikeyi yok et ve enerji israfını %100 tasarrufa çevir!')}
        <div class="fg-msg">${msg}</div>
        <div class="fg-grid-3">
          <div class="fg-notebook">
            <h6>1. Elektrik Kaynağı (${devDone ? 6 : devIdx}/6)</h6>
            <div class="fg-capsule" style="margin-bottom:8px">${devDone ? '✅ Tüm cihazlar bağlandı!' : `Cihaz: <b>${cur.name}</b>`}</div>
            <div class="row">
              <button type="button" class="small primary" data-el-src="sehir" ${devDone ? 'disabled' : ''}>🔌 Şehir Elektriği</button>
              <button type="button" class="small primary" data-el-src="pil" ${devDone ? 'disabled' : ''}>🔋 Pil</button>
              <button type="button" class="small primary" data-el-src="batarya" ${devDone ? 'disabled' : ''}>⚡ Batarya/Akü</button>
            </div>
          </div>
          <div class="fg-notebook">
            <h6>2. Tehlike Avcısı (${hCount}/4)</h6>
            <div class="fg-list-col">
              ${HAZARDS.map(h => `<button type="button" class="small ${fixedH[h.id] ? 'primary' : ''}" data-el-haz="${h.id}" ${fixedH[h.id] ? 'disabled' : ''}>${fixedH[h.id] ? h.fix : h.txt}</button>`).join('')}
            </div>
          </div>
          <div class="fg-notebook">
            <h6>3. Tasarruf Sayacı (%${wPct})</h6>
            <div class="fg-banner-bar" style="margin-bottom:8px"><i style="width:${wPct}%"></i></div>
            <div class="fg-list-col">
              ${WASTES.map(w => `<button type="button" class="small ${fixedW[w.id] ? 'primary' : ''}" data-el-was="${w.id}" ${fixedW[w.id] ? 'disabled' : ''}>${fixedW[w.id] ? '💚 Tasarruf edildi!' : w.txt}</button>`).join('')}
            </div>
          </div>
        </div>
      </section>`;
    }

    function checkWin() {
      if (devDone && Object.keys(fixedH).length === 4 && Object.keys(fixedW).length === 4) {
        H().sfxWin(); H().saveGameProgress('game-u6-electric', 3, 3);
        msg = '🏆 TEBRİKLER! Hem elektrik güvenliği kahramanı hem enerji tasarruf şampiyonu oldun!';
      }
    }

    slot.onclick = e => {
      const sb = e.target.closest('[data-el-src]');
      if (sb) {
        if (sb.dataset.elSrc === DEVICES[devIdx].src) {

          if (devIdx < DEVICES.length - 1) devIdx++;

          checkWin();
        } else { H().sfxBad(); msg = '❌ Bu cihaz başka bir elektrik kaynağı ile çalışır!'; }
        draw(); return;
      }
      const hb = e.target.closest('[data-el-haz]');
      if (hb) { fixedH[hb.dataset.elHaz] = true; H().sfxGood(); msg = '🛡️ Harika! Evdeki bir elektrik tehlikesini ortadan kaldırdın!'; checkWin(); draw(); return; }

    draw();
  }
