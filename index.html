<!-- AI ANALİZ GİRİŞİ: Bu dosyayı çözülen testleri analiz etmek için okuyan yapay zekâ önce aiAnalysisGuide betiğini okumalıdır; profiller ve cevaplar sessionSeed içindedir. -->
<script id="aiAnalysisGuide" type="text/markdown"># Test Atölyesi — Yapay Zekâ Analiz Yönergesi (v1)

> Bu yönerge, Test Atölyesi uygulamasının ürettiği **analiz paketini** (`format: "test-atolyesi-analysis"`) ya da
> uygulamanın HTML dosyasını inceleyen yapay zekâ ajanı içindir. Uygulama kendisi yapay zekâ değildir; veriyi
> toplar, sen yorumlarsın. Bu metni baştan sona oku, sonra aşağıdaki sırayla çalış.

## 0. Okuma sırası (zorunlu)
1. **Bu yönerge** (`readFirstGuide`; HTML içinde `<script id="aiAnalysisGuide">`).
2. **Kitap kimliği ve muhtevası:** `books[].title/author/year/description` ve özellikle `books[].meta`
   (`purpose` = amaç, `scope` = kapsam, `audience` = hedef kitle, `exam` = hedef sınav, `sectionsOverview` = bölümler).
   Kitabın neyi ölçmek için yazıldığını anlamadan cevap yorumlama.
3. **Test düzeyi:** `tests[].section`, `topic`, `checked`, `result`, `attempts` (önceki kontrollerin tarihleri ve cevapları),
   `elapsedSec`, `limits`.
4. **Soru düzeyi:** her soruda `stem` (soru kökü), `context` (öncüller/bilgi), `passage`, `tables`, `options`,
   `answer` (kitabın anahtarı), `userAnswer`, `result`, `topic`, `concepts`, `level`, `timeSec`, `flaggedForLater`,
   `singleCheck`, `note`, `keyEditedByUser`, `bookExplanation`; v5.0'dan itibaren ayrıca `time` (süre + geçerlilik),
   `eliminated` / `notEliminated` (elenen ve elenmeyen şıklar), `answerTrail` (soruda sırayla seçilen şıklar),
   `unknownOptions` ("bu şıkkı bilmiyorum"), `unknownPhrases` ("bu ifadeyi bilmiyorum": `t` metin, `w` nerede:
   soru/parça/şık harfi/açıklama), `carelessMistake` (kullanıcının "dikkatsizlik/sehven hata" beyanı).
5. HTML'yi doğrudan okuyorsan: `importContract` (veri şeması), `bookData` ve `extraBooks` (kitaplar), `sessionSeed`
   (profiller: `profiles[].state.tests["<kitapId>/<testId>"]` → `answers`, `notes`, `times`, `flags`, `peeks`, `elims`, `unk`, `unkText`, `oops`, `trail`, `history`).

## 1. Temel ilke: yanlış şık bir bilgidir
Beş şıktan biri doğrudur. Kullanıcının **hangi** yanlış şıkkı seçtiği, neyi bilmediğini ya da neyi neyle
karıştırdığını gösterir. Her şıkkın `diagnosis` alanı bu çıkarımı soru düzeyinde önceden yazar:
- `options[userAnswer].diagnosis` → seçilen yanlış şıkkın işaret ettiği eksik/karışıklık.
- `options[answer].diagnosis` → doğru cevabın gerektirdiği bilgi.
Tanılar bir başlangıç önerisidir; soru metni ve kitap açıklamasıyla (`bookExplanation`) çelişirse kendi muhakemen geçerlidir.
`diagnosis` yoksa (yeni eklenmiş kitap) aynı çıkarımı sen yap.

## 1b. Doğru cevaplı soruları atlama — her işaret veridir
- Sonucu **doğru** olan bir soruyu otomatik "biliyor" sayıp geçme. Doğru cevaplı soruda da `note`, `unknownOptions`,
  `unknownPhrases`, `flaggedForLater`, `answerTrail` ya da tek soru kontrolü varsa bilgi kırılgandır ya da eksiktir:
  ör. doğru cevap verip bir şık için "bilmiyorum" demek, o şıkta geçen kavramın bilinmediğini gösterir.
- **Elemeler:** `eliminated` kullanıcının "kesinlikle bu değil" dediği şıklardır. Doğru cevabı elemek ciddi bir kavram
  hatasıdır. Yanlış cevaplıysa `notEliminated` içinde kalan iki şık arasında kalmışsa (seçtiği yanlış + doğru) bu
  "yakın ama ayırt edemiyor" demektir; doğru şık hiç elenmemiş ama seçilmemişse ayrımı bilmiyordur. Elenen bir yanlış
  şık, o şıkkın gerektirdiği bilginin bilindiğini gösterir.
- **`answerTrail`** (ör. `B → D → B`): kararsızlık. Doğrudan yanlışa geçtiyse ilk sezgi doğruydu; yanlıştan doğruya
  geçtiyse bilgi yeni yerleşiyor olabilir.
- **`unknownOptions` / `unknownPhrases`**: doğrudan "bilmiyorum" beyanıdır; en güçlü eksiklik kanıtlarındandır. Aynı
  ifade ya da kavram birden çok soruda geçiyorsa öncelikli çalışma konusudur. `w` alanı ifadenin nerede geçtiğini söyler.
- **`carelessMistake`**: kullanıcı bildiği hâlde sehven yanlış yaptığını beyan etti. Bilgi eksikliği sayma; ayrıca
  "dikkat hataları" örüntüsü olarak raporla (olumsuz kök atlama, şık karıştırma vb.).

## 1c. Süre kuralları
- `time.valid=false` olan süreleri **yok say** (o soru "süresiz çözülmüş" kabul edilir):
  10 saniyenin altı (yanlışlıkla/çok hızlı geçiş) ve 10 dakikanın üstü (ara verilmiş, sayaç açık kalmış);
  `time.note` gerekçeyi yazar. Hiç süre tutulmadan çözülen testlerde (`time.note: "test süre tutulmadan çözüldü"`) süre çıkarımı yapma.
- Geçerli sürelerde soru türünü gözet: uzun öncüllü/tablolu/analiz düzeyindeki sorulara 2–3 dakika normal,
  kısa bilgi sorularına 40–50 saniye beklenir; kullanıcının genel hızına göre göreceli değerlendir.
  Yalnız **uç farklar** anlamlıdır (aynı türde sorulara göre çok uzun → zorlandı; çok kısa ve yanlış → tahmin).

## 2. Tek tek sorulara değil örüntülere bak
- Kullanıcının kazara kaçırdığı 1–2 soru bir sonuç değildir. Bir konuda **tekrarlanan** yanlışları, **aynı tür
  karışıklığı** gösteren şık seçimlerini ve farklı testlerde yinelenen kavramları ara.
- Gruplama anahtarları: `topic` → `concepts` → `section` → kitap. Her eksiklik iddiası için en az 2–3 kanıt soru göster
  (kitap/test/soru numarası ve seçilen şık). Tek kanıtlı bulguyu "zayıf işaret" diye etiketle.
- Doğru cevaplar da kanıttır: bir konuda tutarlı doğrular güçlü yöndür. Hızlı ve doğru (düşük `timeSec`) = sağlam bilgi;
  çok uzun sürede doğru = kırılgan bilgi olabilir.
- `level` (bilgi / kavrama / uygulama / analiz) dağılımına bak: ezber bilgide mi, uygulamada mı zorlanıyor?

## 3. Bağlam sinyalleri
- **`note`** (kullanıcı notu): o soru bağlamında çok önemlidir. "emin değilim", "tahmin", "karıştırdım", "tekrar bak" gibi
  notlar doğru cevapları da şüpheli kılar; notta yazan kavram eksikliğin kendisi olabilir. Notları özetle ve bulgulara bağla.
- **`singleCheck`**: kullanıcı testi bitirmeden o soruya baktı. `answerAtFirstCheck` ilk cevabıdır; sonradan değiştirilen
  cevap bakılarak düzeltilmiş olabilir. Değerlendirmede ilk cevabı esas al, sonra düzeltildiyse belirt.
- **`flaggedForLater`**: kullanıcı emin olmadığını işaretledi; doğru olsa bile kırılgan bilgi sayılabilir.
- **`result: "boş"`**: bilinmeyen veya zaman yetmeyen soru; süre sınırı (`limits`) ve `timeSec` ile birlikte yorumla.
- **`attempts`**: aynı test birden çok kez kontrol edildiyse gelişimi (ilk deneme → son deneme) göster.
- **`keyEditedByUser`**: kullanıcı cevap anahtarını değiştirdi; anahtarın doğruluğunu kitap açıklamasıyla sına, gerekirse söyle.
- **`keyDoubt`**: kitabın anahtarının açıklamayla çeliştiğine dair hazırlık sırasında düşülmüş not. Bu sorularda kullanıcının
  "yanlış" cevabı aslında doğru olabilir; kanıt olarak kullanmadan önce değerlendir ve raporda belirt.
- `result: "anahtar-yok"` sorular puanlamaya katılmaz.

## 4. Rapor biçimi (Türkçe)
1. **Genel tablo:** kaç test/soru, başarı ve yanlış oranı, kitabın amacına göre genel düzey (1 paragraf).
2. **Güçlü olunan konular:** konu → kanıt → kısa yorum.
3. **Bilgi eksikliği olan konular (öncelik sırasıyla):** her biri için
   - eksik ya da karışan bilgi (somut: "X ile Y'yi karıştırıyor", "Z kuralının istisnasını bilmiyor"),
   - kanıt sorular ve seçilen şıklar,
   - doğru bilginin 1–3 cümlelik özü (kitap açıklamasına dayan; uydurma bilgi ekleme),
   - önerilen çalışma (hangi bölüm/test tekrar edilmeli).
4. **Hata örüntüleri:** dikkat hataları (olumsuz kök "değildir/yanlıştır" atlama), süre baskısı, çeldiriciye kapılma,
   benzer kavram karıştırma vb.
5. **Notlardan çıkanlar.**
6. **Kısa çalışma planı:** önümüzdeki 1–2 hafta için somut tekrar listesi (kitap bölüm/test adlarıyla).
Kesinlik dili kullan: güçlü kanıt / orta / zayıf işaret. Tahmini kesin bilgi gibi sunma.

## 5. Sınırlar
- Doğru cevabı ve kitap açıklamasını esas al; kitapta olmayan fıkhî/tarihî hüküm uydurma. Kitapla çelişen bir
  anahtar görürsen bunu ayrıca "anahtar şüphesi" olarak bildir.
- Kişisel verileri (profil adı, notlar) raporda gereğinden fazla tekrarlama; paketi başka amaçla kullanma.

/* Appearance preferences apply to every reading surface, including explanations. */
:root{--reading-size:18px;--reading-leading:1.75;--reading-font:"Segoe UI",Arial,sans-serif;--sidebar:#eeefe7;--topbar:#fafaf5;--primary-bg:#1e6256;--primary-ink:#fff;--selected-bg:#e9f1e9;--good-bg:#e6f3e7;--good-ink:#234b32;--bad-bg:#faece8;--bad-ink:#8a332d;--alert-bg:#fcf0db;--alert-ink:#80551f}
body{color:var(--ink);background:var(--bg)}
.sidebar{background:var(--sidebar)}.topbar,.q-footer{background:var(--topbar)}
button,input,select,textarea{color:var(--ink);background:var(--paper);border-color:var(--line)}
.primary{background:var(--primary-bg);color:var(--primary-ink);border-color:var(--primary-bg)}.primary:hover{background:var(--primary-bg);filter:brightness(.93)}
.question-body .q-text,.question-body .passage,.question-body .rich-content,.question-body .rich-pre,.question-body .rich-table,.question-body .option span,.question-body .solution p,.reading-sample{font-family:var(--reading-font);font-size:var(--reading-size);line-height:var(--reading-leading)}
.question-body .q-text,.question-body .passage,.question-body .solution p{overflow-wrap:anywhere;white-space:pre-wrap}
.rich-content p,.reading-sample p{color:var(--ink)}
.option.selected,.palette button.answered,.toc-test.active{background:var(--selected-bg);color:var(--ink);border-color:var(--green)}
.option.correct,.palette button.good,.option.correct:disabled:hover{background:var(--good-bg);color:var(--good-ink);border-color:var(--green)}
.option.wrong,.palette button.bad,.option.wrong:disabled:hover{background:var(--bad-bg);color:var(--bad-ink);border-color:var(--red)}
.option:disabled{opacity:1}.option:disabled:hover{background:var(--paper)}.option.selected:disabled:hover{background:var(--selected-bg)}
.alert{background:var(--alert-bg);color:var(--alert-ink)}
.result-strip{background:var(--good-bg);color:var(--good-ink);border-color:var(--line)}.result-strip p{color:inherit}
.solution,.note,.passage,.rich-pre{background:var(--light);border-color:var(--line);color:var(--ink)}
.bar{background:var(--line)}.tag{background:var(--light);border-color:var(--line);color:var(--ink)}
.rich-table th{background:var(--light)}
.appearance-grid{display:grid;grid-template-columns:1fr 1fr;gap:15px}.appearance-grid select{width:100%}
.appearance-grid.colors{margin:14px 0}.appearance-grid.colors label{display:flex;gap:10px;align-items:center;justify-content:space-between;margin:0;font-size:12px}
.appearance-grid input[type=color]{width:52px;height:38px;padding:3px;cursor:pointer}
.dialog input[type=range]{display:block;width:100%;padding:0;accent-color:var(--green);margin:12px 0 20px}
.reading-sample{padding:18px;border:1px solid var(--line);border-radius:10px;background:var(--paper);color:var(--ink);margin:18px 0}
.reading-sample p{margin:10px 0 0;font-size:inherit;line-height:inherit}.book-figure{margin:20px 0;padding:10px;border:1px solid var(--line);border-radius:12px;background:#fff;color:#27312c}
.figure-zoom{display:block;width:100%;padding:0;border:0;border-radius:0;background:#fff;cursor:zoom-in}.figure-zoom:hover{background:#fff}
.book-figure img{display:block;max-width:100%;height:auto;margin:auto;max-height:620px;object-fit:contain}.book-figure figcaption{padding:9px 5px 2px;font-size:11px;color:#526055}
.image-view img{background:#fff}.source-ref{font-size:11px;color:var(--muted);margin-top:12px}
@media(max-width:650px){.appearance-grid.colors{grid-template-columns:1fr}.question-body{padding:18px 16px}.book-figure{padding:5px;margin:16px 0}.question-body .option{align-items:flex-start}.appearance-grid{gap:10px}}

.test-card{position:relative;overflow:visible}.test-card.result-red{--result-color:#bd4545;--result-tint:#bd45451b}.test-card.result-orange{--result-color:#c87a27;--result-tint:#c87a271b}.test-card.result-yellow{--result-color:#a18315;--result-tint:#c3a51b20}.test-card.result-blue{--result-color:#397bb7;--result-tint:#397bb71b}.test-card.result-green{--result-color:#36845c;--result-tint:#36845c1b}

.test-card .row{gap:7px;flex-wrap:wrap}.result-badge{display:inline-block;border:1px solid var(--result-color);border-radius:6px;padding:4px 7px;font-size:10px;font-weight:700;background:var(--paper);color:var(--ink)}.test-result{margin:15px 0 10px}.result-numbers{display:flex;gap:16px;font-size:11px}.result-numbers b{display:block;font-size:23px;line-height:1.25;color:var(--ink)}.result-percent{display:flex;flex-wrap:wrap;justify-content:space-between;gap:7px;font-size:11px;margin-top:10px;padding-top:9px;border-top:1px solid var(--line)}.result-percent span{color:var(--ink)}.test-result small,.test-duration{display:block;font-size:11px;color:var(--muted);margin:6px 0}.test-card .bar{margin-top:12px}.test-card[class*="result-"] .bar i{background:var(--result-color)}

.results-legend{display:flex;flex-wrap:wrap;gap:9px 18px;margin:0 0 25px;padding:15px 17px;background:var(--paper);border:1px solid var(--line);border-radius:12px;font-size:11px}.results-legend small{flex-basis:100%;color:var(--muted);font-size:10px}.legend-red{color:#ba4141}.legend-orange{color:#b56c20}.legend-yellow{color:#947b13}.legend-blue{color:#397bb7}.legend-green{color:#36845c}
[data-dark="1"] .legend-red{color:#f0a19c}[data-dark="1"] .legend-orange{color:#edb571}[data-dark="1"] .legend-yellow{color:#e6cf6c}[data-dark="1"] .legend-blue{color:#8abbe4}[data-dark="1"] .legend-green{color:#a1d1af}
.file-save-panel{padding:14px 16px;border:1px solid var(--line);border-radius:10px;background:var(--light);margin:15px 0}.file-save-panel p{margin:8px 0}.file-help{font-size:12px!important;margin-top:16px}.file-save-error{color:var(--red)!important}.save{max-width:410px;text-align:right}

.tts-btn:hover{border-color:var(--green)}
.tts-btn.tts-playing{background:var(--green);border-color:var(--green);color:#fff}
.tts-btn.tts-paused{border-color:var(--orange);color:var(--orange)}
.q-title-tools{display:flex;align-items:center;gap:6px;flex-wrap:wrap;justify-content:flex-end}

/* ── v4: içindekiler görünümleri, yarım testler, kontrol renkleri, eleme ── */
.view-switch{display:flex;gap:6px;margin:0 0 14px;flex-wrap:wrap}
.view-switch button.active{background:var(--selected-bg);border-color:var(--green);color:var(--ink)}
.test-list.view-list{grid-template-columns:1fr;gap:8px}
.test-list.view-list .test-card{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:4px 14px;padding:12px 16px;align-items:center}
.test-list.view-list .test-card>*{grid-column:1}
.test-list.view-list .test-card h3{margin:2px 0;font-size:15px}
.test-list.view-list .test-card .eyebrow,.test-list.view-list .test-card>p,.test-list.view-list .test-card .test-duration{display:none}
.test-list.view-list .test-card .test-result{grid-column:2;grid-row:1/span 3;margin:0}
.test-list.view-list .test-card .bar{margin-top:4px}

.test-list.view-grid .test-card{padding:10px;min-height:92px;display:flex;flex-direction:column;justify-content:space-between}
.test-list.view-grid .test-card h3{font-size:12px;line-height:1.3;margin:4px 0}
.test-list.view-grid .test-card .eyebrow,.test-list.view-grid .test-card>p,.test-list.view-grid .test-card .row,.test-list.view-grid .test-card .test-duration,.test-list.view-grid .test-card .result-numbers,.test-list.view-grid .test-card .result-percent span,.test-list.view-grid .test-card .test-result small,.test-list.view-grid .perfect-sparkles{display:none}

.test-list.view-grid .test-card .result-percent strong{font-size:12px}
.test-list.view-grid .test-card footer{font-size:10px}
.test-list.view-grid .test-card footer strong{display:none}
.test-card.in-progress{background:#ffffff;color:#1f2a28;border:2px solid #ffffff;box-shadow:0 0 0 1px var(--line),0 4px 14px #0000001a}
.test-card.in-progress h3,.test-card.in-progress footer,.test-card.in-progress p,.test-card.in-progress .eyebrow{color:#1f2a28}
.test-card.in-progress .tag{background:#f1f1f1;color:#1f2a28;border-color:#dddddd}
.test-card.in-progress .bar{background:#e8e8e8}
.test-card.in-progress .bar i{background:#555555}
.option.selected{background:color-mix(in srgb,var(--pick) 14%,var(--paper));border-color:var(--pick)}
.option.selected b{background:var(--pick);border-color:var(--pick);color:#fff}
.option.elim{border-color:#c0392b;border-style:dashed;background:color-mix(in srgb,#c0392b 9%,var(--paper))}
.option.elim span{text-decoration:line-through;text-decoration-color:#c0392b;opacity:.7}
.option.elim b{border-color:#c0392b;color:#c0392b}
.option.correct,.option.correct:disabled:hover{border-color:#2f6fb5;border-style:solid;background:color-mix(in srgb,#2f6fb5 14%,var(--paper))}
.option.correct b{background:#2f6fb5;border-color:#2f6fb5;color:#fff}
.option.wrong,.option.wrong:disabled:hover{border-color:#c0392b;border-style:solid;background:color-mix(in srgb,#c0392b 14%,var(--paper))}
.option.wrong b{background:#c0392b;border-color:#c0392b;color:#fff}
.option.correct span,.option.wrong span{text-decoration:none;opacity:1}
.palette button.good{background:color-mix(in srgb,#2f6fb5 22%,var(--paper));border-color:#2f6fb5;color:var(--ink)}
.palette button.bad{background:color-mix(in srgb,#c0392b 22%,var(--paper));border-color:#c0392b;color:var(--ink)}
.palette button.answered:not(.good):not(.bad){background:color-mix(in srgb,var(--pick) 20%,var(--paper));border-color:var(--pick)}
.peek-result.good{background:color-mix(in srgb,#2f6fb5 14%,var(--paper));color:var(--ink)}
.peek-result.bad{background:color-mix(in srgb,#c0392b 14%,var(--paper));color:var(--ink)}
.test-list.view-list .test-card .row{display:none}
.test-list.view-list .test-card{padding:9px 14px}
.test-list.view-list .test-card footer{font-size:11px}

.cloud-nag{position:fixed;left:50%;bottom:18px;transform:translateX(-50%);z-index:150;background:var(--alert-bg);color:var(--alert-ink);border:1px solid var(--orange);border-radius:12px;padding:10px 14px;font-size:13px;box-shadow:var(--shadow);max-width:92vw;display:flex;gap:8px;align-items:center;flex-wrap:wrap}

html[data-theme="love"] .topbar{background:color-mix(in srgb,var(--topbar) 82%,transparent);backdrop-filter:blur(2px)}

html[data-theme="love"] .test-card,html[data-theme="love"] .question,html[data-theme="love"] .aside-card,html[data-theme="love"] .book-card,html[data-theme="love"] .stat,html[data-theme="love"] .dialog{border-radius:20px}

html[data-theme="love"] .cover{background:linear-gradient(160deg,#d86aa0,#9d6bc8)!important;color:#fff5fa}
html[data-theme="love"] h1{color:#a6457a}
html[data-theme="love"] .primary{background:linear-gradient(135deg,#d0629a,#a46ccb);border-color:#c4568f}
html[data-theme="love"] .bar i{background:linear-gradient(90deg,#e48ab5,#a978d3)}

/* ── Odak sesleri mini oynatıcı ── */
.focus-chip{position:relative;display:inline-flex;align-items:center;gap:5px;border-color:var(--line);background:var(--paper)}
.focus-chip.on{border-color:var(--green);background:var(--selected-bg)}
.focus-eq{display:inline-flex;gap:2px;align-items:flex-end;height:12px}
.focus-eq i{width:3px;background:var(--green);border-radius:2px;animation:focusEq 1s ease-in-out infinite}
.focus-eq i:nth-child(2){animation-delay:.25s}.focus-eq i:nth-child(3){animation-delay:.5s}
@keyframes focusEq{0%,100%{height:3px}50%{height:12px}}
@media(prefers-reduced-motion:reduce){.focus-eq i{animation:none;height:8px}}
.focus-panel{position:fixed;top:70px;right:16px;z-index:120;width:min(340px,calc(100vw - 32px));max-height:min(72vh,560px);overflow:auto;background:var(--paper);color:var(--ink);border:1px solid var(--line);border-radius:16px;box-shadow:0 14px 50px #0003;padding:12px}
.focus-head{display:flex;justify-content:space-between;align-items:center;margin-bottom:6px}
.focus-group{font-size:10px;letter-spacing:1.5px;text-transform:uppercase;color:var(--muted);font-weight:700;margin:10px 4px 4px}
.focus-item{display:flex;gap:10px;align-items:center;width:100%;text-align:left;padding:7px 9px;border:1px solid transparent;background:transparent;border-radius:10px;font-weight:600;font-size:13px}
.focus-item b{display:grid;place-items:center;width:26px;height:26px;border-radius:50%;background:var(--light);color:var(--green);font-size:10px;flex-shrink:0}
.focus-item small{display:block;font-weight:400;color:var(--muted);font-size:11px}
.focus-item:hover{background:var(--light)}
.focus-item.on{border-color:var(--green);background:var(--selected-bg)}
.focus-item.on b{background:var(--green);color:#fff}
.focus-foot{display:flex;align-items:center;gap:8px;margin-top:10px;padding-top:10px;border-top:1px solid var(--line)}
.focus-foot input{flex:1}
.focus-foot label{font-size:12px;color:var(--muted)}
@media(max-width:650px){.focus-panel{top:auto;bottom:12px;right:12px;left:12px;width:auto}}

/* ── v5.0: bilmiyorum (?), bilinmeyen ifadeler, dikkatsizlik (🤦), kılavuz ── */
.unk-btn{display:inline-grid;place-items:center;flex-shrink:0;width:34px;height:34px;align-self:center;padding:0;border:1px solid var(--line);border-radius:8px;background:var(--paper);color:var(--muted);font-weight:800;font-size:15px}
.unk-btn.on{background:#7b5ea7;border-color:#7b5ea7;color:#fff}
.unk-btn:hover{border-color:#7b5ea7}
.option span{user-select:text;-webkit-user-select:text}
.unk-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 12px;font-size:12px;color:var(--muted)}
.unk-chip{font-size:12px;padding:4px 8px;border-radius:999px;border:1px solid #7b5ea7;background:color-mix(in srgb,#7b5ea7 10%,var(--paper));color:var(--ink);font-weight:600}
.unk-chip small{margin-left:5px;color:var(--muted);font-weight:400}
::highlight(ta-sel){background:#3b82f644;color:inherit}
.unk-menu{position:fixed;z-index:200;display:flex;flex-direction:column;min-width:195px;max-width:calc(100vw - 16px);background:var(--paper);border:1px solid var(--line);border-radius:10px;box-shadow:0 10px 30px #0003;overflow:hidden;user-select:none;-webkit-user-select:none}
.unk-menu button{border:0;border-radius:0;text-align:left;padding:9px 14px;font-size:13px;background:transparent}
.unk-menu button:hover{background:var(--light)}
.unk-menu .menu-divider{height:1px;background:var(--line);margin:3px 0}
.unk-menu .menu-subtle{color:var(--muted);font-size:12px}
.unk-menu .sys-menu-head{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;padding:6px 14px 4px;color:var(--muted);background:var(--light);border-bottom:1px solid var(--line)}
.unk-menu.touch{flex-direction:row;gap:6px;padding:4px;border-radius:24px;background:var(--paper);box-shadow:0 6px 20px #0004}
.unk-menu.touch button{width:40px;height:40px;padding:0;text-align:center;font-size:18px;font-weight:800;background:#7b5ea7;color:#fff;border-radius:50%}
.oops-btn.on{background:color-mix(in srgb,#e0a100 20%,var(--paper));border-color:#c98f00}
.palette button.unk::before{content:'?';position:absolute;left:3px;top:0;font-size:9px;font-weight:800;color:#7b5ea7}
.palette button.oops::after{content:'🤦';position:absolute;right:-4px;bottom:-6px;font-size:11px;background:none;width:auto;height:auto}
.guide-article{grid-column:1/-1}
.guide-article h3 small{font-weight:400;color:var(--muted);font-size:12px;margin-left:6px}
.guide-table{width:100%;border-collapse:collapse;font-size:13px}
.guide-table td{border-top:1px solid var(--line);padding:8px 10px;vertical-align:top}
.guide-table td:first-child{width:34%;white-space:normal}
.oops-sample{font-size:18px}
@media(max-width:650px){.guide-table td:first-child{width:40%}.option-row>.unk-btn{width:30px;height:30px}}

.unk-mark{background:none;color:inherit;text-decoration:underline;text-decoration-color:#3cc6b8;text-decoration-thickness:2px;text-underline-offset:3px;text-decoration-skip-ink:none}

/* ── v5.11: Vurgu (🖍️), vurgu menüsü ve popover stilleri ── */
.ta-hl{background:var(--hl-c,#fff59d);color:inherit;border-radius:3px;padding:1px 2px;cursor:pointer;transition:outline .15s,box-shadow .15s;text-decoration:none}
.ta-hl:hover{outline:1px solid color-mix(in srgb,var(--hl-c,#fff59d) 65%,#000);box-shadow:0 1px 4px #0002}
.ta-hl.is-underline{background:transparent!important;text-decoration:underline!important;text-decoration-color:var(--hl-c,#fff59d)!important;text-decoration-thickness:2.5px!important;text-underline-offset:3px!important;text-decoration-skip-ink:none!important;padding:0!important;outline:none!important;box-shadow:none!important}
.ta-hl.is-underline:hover{text-decoration-thickness:3.5px!important}

.hl-popover{position:fixed;z-index:210;display:flex;flex-wrap:wrap;align-items:center;gap:6px;max-width:calc(100vw - 16px);padding:6px 10px;background:var(--paper,#fff);border:1px solid var(--line,#ddd);border-radius:12px;box-shadow:0 8px 24px #0003}
.hl-pop-colors{display:flex;gap:5px;align-items:center}
.hl-color-btn{width:20px;height:20px;min-width:20px;padding:0;border-radius:50%;border:2px solid var(--paper,#fff);cursor:pointer;outline:1px solid var(--line,#ccc);transition:transform .12s}
.hl-color-btn:hover{transform:scale(1.15)}
.hl-color-btn.selected{outline:2.5px solid var(--ink,#222);outline-offset:1px;transform:scale(1.15)}
.hl-pop-divider{width:1px;height:18px;background:var(--line);margin:0 2px}
.hl-pop-modes{display:flex;gap:4px}
.hl-mode-btn{border:1px solid var(--line);background:transparent;padding:4px 8px;font-size:11px;font-weight:600;border-radius:6px;cursor:pointer}
.hl-mode-btn:hover{background:var(--light)}
.hl-mode-btn.active{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.hl-del-btn{border:0;background:transparent;color:var(--red,#ae493e);font-size:12px;font-weight:700;padding:4px 8px;border-radius:6px;cursor:pointer}
.hl-del-btn:hover{background:#faece8}

.hl-chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:0 0 10px;font-size:12px;color:var(--muted)}
.hl-chip{font-size:12px;padding:3px 8px;border-radius:999px;border:1px solid color-mix(in srgb,var(--hl-c,#fff59d) 70%,var(--line));background:color-mix(in srgb,var(--hl-c,#fff59d) 35%,var(--paper));color:var(--ink);font-weight:600;display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.hl-chip.is-underline{border-bottom:2px solid var(--hl-c,#fff59d)}
.hl-chip small{color:var(--muted);font-weight:400}

/* ── v5.1: kütüphaneler, son kullanılanlar, favoriler ── */

.lib-section.drop{border-color:var(--green);background:var(--selected-bg)}
.lib-section .section-title .row{gap:10px}
.lib-empty{padding:22px;text-align:center;color:var(--muted);border:1px dashed var(--line);border-radius:14px;font-size:13px}
.mini-row{display:grid;grid-template-columns:repeat(auto-fill,minmax(250px,1fr));gap:10px;margin-bottom:22px}
.mini-book{display:flex;gap:12px;align-items:center;text-align:left;padding:10px;border:1px solid var(--line);border-radius:14px;background:var(--paper);box-shadow:var(--shadow);position:relative}
.mini-cover{display:grid;place-items:center;width:52px;height:66px;flex-shrink:0;border-radius:4px 9px 9px 4px;background:var(--green);color:#f1edd7;font:600 11px/1.15 Georgia,serif;text-align:center;padding:4px}
.mini-info{flex:1;min-width:0;display:flex;flex-direction:column;gap:3px}
.mini-info b{font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mini-info small{color:var(--muted);font-size:11px}
.mini-info .bar{margin:2px 0 0;display:block}
.mini-star{font-size:18px;color:#d4a017;padding:4px;cursor:pointer}
.fav-btn.on{color:#b8860b;border-color:#d4a017}

.lib-tools{display:flex;justify-content:flex-end;margin:-4px 0 6px}
.lib-tag{cursor:pointer;font:inherit;font-size:11px;font-weight:600}
.lib-tag:hover{border-color:var(--green)}
.lib-edit{display:grid;gap:8px;margin:10px 0}
.lib-edit .row{flex-wrap:nowrap}.lib-edit input{flex:1;min-width:0}.lib-edit small{color:var(--muted);white-space:nowrap}

.lib-toggle{border:0;background:none;font:inherit;color:var(--green);cursor:pointer;padding:0 4px;width:1.4em}
.lib-section.closed{margin-bottom:6px}
.lib-views{display:inline-flex;gap:4px}.lib-vbtn.on{background:var(--selected-bg);border-color:var(--green)}
.lib-list{display:grid;gap:6px;margin-bottom:10px}
.lib-row{display:flex;align-items:center;gap:8px;padding:8px 12px;border:1px solid var(--line);border-radius:12px;background:var(--paper)}
.lib-row-main{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px;text-align:left;border:0;background:none;font:inherit;color:inherit;cursor:pointer;padding:0}
.lib-row-main b{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.lib-row-main small{color:var(--muted);font-size:11px}
.lib-section .section-title .row{flex-wrap:wrap;justify-content:flex-end}

.lib-grip{cursor:grab;touch-action:none;user-select:none;padding:4px 6px;color:var(--muted);font-size:18px}

.edu-sec-pill.done,.vocab-card.mastered{border-color:color-mix(in srgb,var(--good-ink) 35%,var(--line))}
.course-toc-list .toc-test.active{border-color:color-mix(in srgb,var(--green) 35%,var(--line))}
.edu-paired-cta{border-color:color-mix(in srgb,var(--green) 38%,var(--line))}
.edu-article th{background:var(--primary-bg);color:var(--primary-ink)}
.edu-article tr:nth-child(even) td{background:color-mix(in srgb,var(--bg) 55%,var(--paper))}
.edu-article .worked{border-color:color-mix(in srgb,var(--green) 28%,var(--line));background:color-mix(in srgb,var(--light) 45%,var(--paper))}
.edu-article .passage-box{border-left-color:var(--green)}
.edu-article .en{color:var(--green)}
.edu-article .mono{background:color-mix(in srgb,var(--ink) 8%,var(--paper));color:var(--ink)}
.edu-article .ok{color:var(--good-ink)}
.edu-article .err{color:var(--bad-ink)}
.ex-match-btn.sel{box-shadow:0 0 0 2px color-mix(in srgb,var(--green) 24%,transparent)}
.ex-bucket{border-color:color-mix(in srgb,var(--green) 45%,var(--line))}
.unk-btn.on,.unk-menu.touch button{background:var(--green);border-color:var(--green);color:var(--primary-ink)}
.unk-btn:hover{border-color:var(--green)}
.unk-chip{border-color:color-mix(in srgb,var(--green) 55%,var(--line));background:color-mix(in srgb,var(--green) 10%,var(--paper))}
.palette button.unk::before{color:var(--green)}
.edu-note-box,.nb-item,.aside-card:has(#qNote){border-left:3.5px solid var(--note-accent,var(--green));background:color-mix(in srgb,var(--note-accent,var(--green)) 5%,var(--paper))}
.edu-note-box h3,.nb-item h4,.aside-card:has(#qNote) h3{color:var(--note-accent,var(--green))}
.edu-note-box textarea:focus,#qNote:focus,.nb-composer textarea:focus{outline:2px solid color-mix(in srgb,var(--note-accent,var(--green)) 45%,transparent);border-color:var(--note-accent,var(--green))}

/* === Flashcards (Bilmediğim Şeyleri Öğren) & Kategori Çubuğu === */
.fc-cat-bar{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:12px}
.fc-prog{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;padding:4px 10px;border-radius:999px;background:var(--light);border:1px solid var(--line)}
.fc-prog.done{background:#e7f6ec;color:#1b6640;border-color:#a5d6b7}
.fc-prog.err{background:#faece8;color:#ae493e;border-color:#e5b2a8}
.fc-prog-bar{width:64px;height:7px;border-radius:999px;background:var(--line);overflow:hidden;display:inline-block}
.fc-prog-bar i{display:block;height:100%;background:var(--green);transition:width .25s}
.fc-stats-line{display:flex;justify-content:space-between;align-items:center;margin-bottom:10px;font-size:13px;color:var(--muted)}
.fc-card{padding:24px;text-align:center;max-width:680px;margin:0 auto}
.fc-badge-row{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px}
.fc-word{font-size:24px;margin:10px 0 14px;color:var(--ink)}
.fc-hr{border:0;border-top:1px solid var(--line);margin:18px 0}
.fc-meaning{font-size:16px;line-height:1.55;margin:0 0 8px}
.fc-flip-wrap{margin-top:18px}
.fc-rate-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;margin-top:16px}
.fc-rate{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 6px;border-radius:10px;border:1px solid var(--line);background:var(--bg);cursor:pointer}
.fc-rate:hover{filter:brightness(.96)}
.fc-rate.again{border-color:#e09b92;color:#a12828}
.fc-rate.hard{border-color:#e6c082;color:#9a5d00}
.fc-rate.good{border-color:#93c5a6;color:#1b6640}
.fc-rate.easy{border-color:#8eb8e5;color:#1b4f91}
.fc-rate small{font-size:11px;opacity:.85}
.fc-cat-select{font-size:12px;padding:4px 8px;border-radius:8px;border:1px solid var(--line);background:var(--bg);color:var(--ink);max-width:170px}
.fc-done-card{text-align:center;padding:28px 20px}
@media(max-width:600px){.fc-rate-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.fc-ai-panel{margin-top:14px;padding:12px;border:1px solid var(--line);border-radius:12px;background:var(--bg);text-align:left}
.fc-ai-panel textarea{width:100%;margin-top:8px;box-sizing:border-box}

/* === Çocuk Dostu Oyun Atölyesi & Yeni Mini Oyun Motorları === */
.kid-hero{background:linear-gradient(135deg,#fef9c3,#e0f2fe 55%,#dcfce7);border:2px solid #7dd3fc;border-radius:16px;padding:18px 20px;margin-bottom:18px}
.kid-hero h1{margin:4px 0 6px;color:#0f172a;font-size:26px}
.kid-hero p{margin:0;color:#334155;font-size:14px}
.kid-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(210px,1fr));gap:12px;margin:14px 0}
.kid-card{border:1.5px solid #cbd5e1;border-radius:14px;padding:13px 15px;background:#fff;box-shadow:0 3px 0 #e2e8f0}
.kid-card.sky{background:#f0f9ff;border-color:#7dd3fc;box-shadow:0 3px 0 #bae6fd}
.kid-card.mint{background:#f0fdf4;border-color:#86efac;box-shadow:0 3px 0 #bbf7d0}
.kid-card.sun{background:#fefce8;border-color:#fde047;box-shadow:0 3px 0 #fef08a}
.kid-card.rose{background:#fff1f2;border-color:#fda4af;box-shadow:0 3px 0 #fecdd3}
.kid-card h4{margin:0 0 6px;font-size:15px;color:#0f172a;display:flex;align-items:center;gap:6px}
.kid-card p,.kid-card li{font-size:13.5px;color:#1e293b;margin:0}
.kid-card ul{margin:6px 0 0;padding-left:18px}
[data-dark="1"] .kid-hero{background:linear-gradient(135deg,#1e293b,#164e63);border-color:#38bdf8}
[data-dark="1"] .kid-hero h1,[data-dark="1"] .kid-hero p{color:#f8fafc}
[data-dark="1"] .kid-card,[data-dark="1"] .kid-card.sky,[data-dark="1"] .kid-card.mint,[data-dark="1"] .kid-card.sun,[data-dark="1"] .kid-card.rose{background:var(--paper);border-color:var(--line);box-shadow:none}
[data-dark="1"] .kid-card h4,[data-dark="1"] .kid-card p,[data-dark="1"] .kid-card li{color:var(--ink)}

.ex-mem-bar{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;font-size:12.5px;color:var(--muted)}
.ex-mem-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(130px,1fr));gap:9px}
.ex-mem-card{min-height:76px;padding:10px 8px;border-radius:12px;border:2px solid #93c5fd;background:linear-gradient(155deg,#eff6ff,#dbeafe);color:#1e3a8a;font-weight:700;font-size:12.5px;display:grid;place-items:center;text-align:center;cursor:pointer;transition:transform .15s,background .15s,border-color .15s;line-height:1.3}
.ex-mem-card:hover{transform:translateY(-2px)}
.ex-mem-card.open{background:#fff;border-color:#0284c7;color:#0f172a}
.ex-mem-card.matched{background:var(--good-bg);border-color:#4b9467;color:var(--good-ink);cursor:default;transform:none}
.ex-mem-card.miss{background:var(--bad-bg);border-color:#d4847c;color:var(--bad-ink)}
[data-dark="1"] .ex-mem-card{background:#1e293b;border-color:#3b82f6;color:#dbeafe}
[data-dark="1"] .ex-mem-card.open{background:var(--paper);color:var(--ink)}

.ex-seq-pool,.ex-seq-slots{display:grid;gap:7px}
.ex-seq-slots{padding:10px;border-radius:12px;background:var(--paper);border:1.5px dashed #8eb6a3}
.ex-seq-btn{text-align:left;padding:9px 12px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);color:var(--ink);font-size:13px;display:flex;align-items:center;gap:9px;cursor:pointer}
.ex-seq-btn:hover{border-color:var(--green);background:var(--light)}
.ex-seq-btn.placed{background:var(--selected-bg);border-color:var(--green)}
.ex-seq-btn.ok{background:var(--good-bg);border-color:#69a980;color:var(--good-ink)}
.ex-seq-btn.bad{background:var(--bad-bg);border-color:#c96e66;color:var(--bad-ink)}
.ex-stars{font-size:15px;letter-spacing:2px}

/* === 3. Sınıf Fen Bilimleri İnteraktif Web Mini Oyunları (.fg-*) === */
.fen-game-slot{margin:20px 0}
.fg-card{border:2px solid #7dd3fc;border-radius:18px;padding:18px;background:#f8fafc;box-shadow:0 4px 0 #cbd5e1;display:grid;gap:12px}
.fg-card.sky{background:#f0f9ff;border-color:#38bdf8;box-shadow:0 4px 0 #bae6fd}
.fg-card.sun{background:#fefce8;border-color:#facc15;box-shadow:0 4px 0 #fef08a}
.fg-card.mint{background:#f0fdf4;border-color:#4ade80;box-shadow:0 4px 0 #bbf7d0}
.fg-card.rose{background:#fff1f2;border-color:#fb7185;box-shadow:0 4px 0 #fecdd3}
[data-dark="1"] .fg-card,[data-dark="1"] .fg-card.sky,[data-dark="1"] .fg-card.sun,[data-dark="1"] .fg-card.mint,[data-dark="1"] .fg-card.rose{background:var(--paper);border-color:var(--line);box-shadow:none}
.fg-head{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;flex-wrap:wrap}
.fg-head h4{margin:4px 0 2px;font-size:17px;color:var(--ink)}
.fg-sub{margin:0;font-size:13px;color:var(--muted)}
.fg-badge{display:inline-block;background:#0284c7;color:#fff;font-size:10.5px;font-weight:700;letter-spacing:.7px;padding:3px 9px;border-radius:999px}
.fg-head-right{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.fg-won{background:#dcfce7;color:#166534;border:1px solid #86efac;padding:3px 9px;border-radius:999px;font-size:12px;font-weight:700}
.fg-msg{padding:9px 12px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-size:13.5px;color:var(--ink)}
.fg-q-label{margin:6px 0 4px;font-size:13.5px}

/* Su Tankı Oyunu */
.fg-sink-layout{display:grid;grid-template-columns:1.15fr .85fr;gap:16px;align-items:start}
.fg-shelf{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:7px}
.fg-obj-btn{position:relative;padding:8px 6px;border-radius:10px;border:1.5px solid var(--line);background:var(--paper);display:grid;place-items:center;gap:2px;cursor:pointer}
.fg-obj-btn.sel{border-color:#0284c7;background:#e0f2fe;box-shadow:0 0 0 2px #0284c733}
.fg-obj-btn.done{opacity:.88}
.fg-ico{font-size:22px}
.fg-mini-tag{position:absolute;top:4px;right:5px;font-size:11px}
.fg-controls{display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0}
.fg-guess-row{display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.fg-tank{position:relative;height:215px;border:3px solid #334155;border-top:none;border-radius:0 0 16px 16px;background:#fff;overflow:hidden;display:grid;grid-template-rows:55px 1fr 22px}
.fg-air{display:grid;place-items:center;background:#f8fafc}
.fg-held-item{display:inline-flex;align-items:center;gap:6px;padding:4px 10px;border-radius:999px;background:#e0f2fe;border:1px solid #7dd3fc;font-size:13px;font-weight:700;animation:fgBob 1.6s ease-in-out infinite}
.fg-water{position:relative;background:linear-gradient(180deg,#bae6fd88,#38bdf8bb);border-top:2px solid #0284c7}
.fg-float-row{position:absolute;top:-14px;left:10px;right:10px;display:flex;gap:12px;justify-content:center;font-size:24px}
.fg-sink-row{position:absolute;bottom:4px;left:10px;right:10px;display:flex;gap:12px;justify-content:center;font-size:24px}
.fg-in-water.floater{animation:fgBob 2s ease-in-out infinite}
.fg-drop-anim{position:absolute;left:50%;transform:translateX(-50%);font-size:28px}
.fg-drop-anim.to-top{animation:fgDropTop .55s ease-out forwards}
.fg-drop-anim.to-bot{animation:fgDropBot .55s ease-in forwards}
.fg-sand{background:repeating-linear-gradient(45deg,#eab30855,#eab30855 8px,#fde04755 8px,#fde04755 16px)}
.fg-notebook{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px}
.fg-notebook h5{margin:0 0 8px;font-size:14px}
.fg-tbl{width:100%;border-collapse:collapse;font-size:12px;margin-top:8px}
.fg-tbl th,.fg-tbl td{padding:5px 6px;border-bottom:1px solid var(--line);text-align:left}
.fg-conclusion{margin-top:10px;padding:9px 11px;border-radius:10px;background:#dcfce7;color:#14532d;font-size:12.5px}
@keyframes fgBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes fgDropTop{0%{top:-36px}70%{top:28px}100%{top:-12px}}
@keyframes fgDropBot{0%{top:-36px}100%{top:100px}}

/* Balon Canvas & Kahramanlar */
.fg-bal-bar{display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap;font-size:14px}
.fg-canvas-wrap{display:flex;justify-content:center}
#fgBalCanvas{width:100%;max-width:680px;height:auto;border-radius:14px;border:2px solid #7dd3fc;cursor:crosshair;touch-action:none}
.fg-capsule{padding:11px 14px;border-radius:12px;background:#fef9c3;border:1.5px solid #facc15;color:#713f12;font-size:14px}
.fg-heroes-grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(145px,1fr));gap:10px;margin-top:8px}
.fg-hero-card{padding:12px 10px;border-radius:12px;border:1.5px solid var(--line);background:var(--paper);display:grid;gap:4px;text-align:center;cursor:pointer}
.fg-hero-card.open{background:#dcfce7;border-color:#4ade80;color:#14532d}
.fg-hero-ico{font-size:28px}

/* Mikroskop & Gizemli Kutu & Kelebek */
.fg-micro-layout,.fg-mys-layout,.fg-dig-layout,.fg-fossil-layout{display:grid;grid-template-columns:1fr 1fr;gap:16px;align-items:start}
.fg-slides{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px}
.fg-lens-wrap{position:relative;width:240px;height:240px;margin:0 auto;border-radius:50%;border:8px solid #1e293b;box-shadow:0 0 0 4px #64748b,inset 0 0 18px #00000033;overflow:hidden}
.fg-zoom-badge{position:absolute;bottom:10px;left:50%;transform:translateX(-50%);background:#0f172acc;color:#fff;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px}
.fg-zoom-bar{display:grid;gap:5px;margin-top:10px;font-size:13px}
.fg-zoom-bar input{width:100%}
.fg-group-btns{display:flex;flex-wrap:wrap;gap:7px;margin:8px 0}
.fg-progress-pills{margin-top:12px;font-size:13px}

.fg-box-stage{display:grid;place-items:center;gap:12px;padding:14px;border-radius:14px;background:var(--paper);border:1px solid var(--line)}
.fg-mystery-box{font-size:64px;line-height:1;padding:12px;transition:transform .25s}
.fg-mystery-box:not(.opened){animation:fgWiggle 2.2s ease-in-out infinite}
.fg-mystery-box.opened{transform:scale(1.18)}
@keyframes fgWiggle{0%,85%,100%{transform:rotate(0)}90%{transform:rotate(-6deg)}95%{transform:rotate(6deg)}}
.fg-sense-row{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.fg-clue-log{display:grid;gap:6px;max-height:165px;overflow:auto;padding:10px;border-radius:10px;background:var(--paper);border:1px solid var(--line);font-size:12.5px}
.fg-clue-item{padding:4px 6px;border-radius:6px;background:var(--bg)}

.fg-bf-stage{display:grid;grid-template-columns:auto 1fr;gap:14px;align-items:center}
.fg-bf-info h5{margin:0 0 6px;font-size:16px}
.fg-bf-info p{margin:0 0 10px;font-size:13.5px}

/* Kazı & Fosil Canvas */
.fg-rock-box,.fg-mine-area,.fg-time-machine{background:var(--paper);border:1px solid var(--line);border-radius:12px;padding:12px;display:grid;gap:8px;justify-items:center;text-align:center}
.fg-mine-area,.fg-time-machine{justify-items:stretch;text-align:left}
.fg-rock-btn{width:128px;height:128px;border-radius:20px;border:2px solid #94a3b8;background:#f1f5f9;display:grid;place-items:center;cursor:pointer;transition:transform .1s}
.fg-rock-btn:active{transform:scale(.94)}
.fg-rock-ico{font-size:40px}
.fg-rock-info{margin:0;font-size:12.5px}
.fg-mine-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.fg-tile{min-height:60px;border-radius:10px;border:2px solid #92400e;background:#b45309;color:#fef3c7;font-weight:700;font-size:12.5px;display:grid;place-items:center;cursor:pointer}
.fg-tile.dug{background:#fefce8;border-color:#eab308;color:#0f172a}
.fg-tile.sel{box-shadow:0 0 0 3px #0284c7}
.fg-tile.done{background:#dcfce7;border-color:#22c55e;color:#14532d}
.fg-tile-ico{font-size:22px}
.fg-use-grid{display:flex;flex-wrap:wrap;gap:6px}

.fg-excavation{position:relative;display:grid;justify-items:center;gap:6px}
.fg-fossil-under{position:absolute;top:0;width:320px;height:220px;border-radius:12px;background:#fef3c7;border:2px solid #d97706;display:grid;place-content:center;text-align:center;padding:14px;gap:4px;z-index:1}
.fg-fossil-big{font-size:52px}
#fgFossilCanvas{position:relative;z-index:2;border-radius:12px;border:2px solid #b45309;cursor:grab;touch-action:none;max-width:100%}
.fg-brush-bar{display:flex;justify-content:space-between;align-items:center;width:100%;max-width:320px;font-size:12.5px}
.fg-tm-text{margin:0;font-size:13.5px;font-weight:600}
.fg-tm-labels{display:flex;justify-content:space-between;font-size:11px;color:var(--muted)}
.fg-tm-box{padding:14px;border-radius:10px;background:#f8fafc;border:1px dashed #94a3b8;text-align:center;font-size:16px;font-weight:700;color:#0f172a}

@media(max-width:760px){.fg-sink-layout,.fg-micro-layout,.fg-mys-layout,.fg-dig-layout,.fg-fossil-layout,.fg-bf-stage,.fg-grid-3,.fg-farm-meters,.fg-farm-stage{grid-template-columns:1fr}}

/* === Fen Kaşifi Karnesi & Ünite 1–8 Gelişmiş Oyun Stilleri === */
.fg-banner{margin-bottom:14px}
.fg-banner-inner{display:grid;gap:6px;padding:12px 16px;border-radius:14px;background:linear-gradient(135deg,#fffbeb,#e0f2fe);border:1.5px solid #93c5fd;font-size:13.5px}
.fg-banner-bar{height:9px;border-radius:999px;background:#e2e8f0;overflow:hidden}
.fg-banner-bar i{display:block;height:100%;background:linear-gradient(90deg,#10b981,#0ea5e9);transition:width .3s}
.fg-banner-stars{font-size:14px;letter-spacing:2px;min-height:20px}
[data-dark="1"] .fg-banner-inner{background:var(--paper);border-color:var(--line)}

.fg-water-switch{display:flex;gap:6px;margin-bottom:8px}
.fg-tank.salty .fg-water{background:linear-gradient(180deg,#bae6fdcc,#0ea5e9cc)}
.fg-raft-box,.fg-tool-box{margin-top:10px;padding:10px 12px;border-radius:10px;background:var(--bg);border:1.5px dashed #7dd3fc}
.fg-raft-box h6,.fg-tool-box p{margin:0 0 6px;font-size:13px}
.fg-hero-card.sel{border-color:#0284c7;background:#e0f2fe}

.fg-cup-stage{display:grid;place-items:center;gap:10px;padding:12px;border-radius:12px;background:var(--bg);border:1px solid var(--line);text-align:center}
.fg-cup{position:relative;border:3px solid #334155;border-top:none;border-radius:0 0 12px 12px;background:#fff;overflow:hidden;transition:width .3s,height .3s}
.fg-cup.tall{width:74px;height:130px}
.fg-cup.wide{width:170px;height:74px}
.fg-cup-fill{position:absolute;bottom:0;left:0;right:0;transition:all .3s}
.fg-cup-fill.tas{width:46px;height:46px;margin:0 auto;bottom:6px;border-radius:12px;background:#64748b;border:2px solid #334155}
.fg-cup-fill.su{height:58%;background:linear-gradient(180deg,#7dd3fc,#0284c7)}
.fg-cup-fill.gaz{top:0;height:100%;background:radial-gradient(circle,#fde04788,#bae6fd55)}

.fg-grid-3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:12px}
.fg-list-col{display:grid;gap:6px}
.fg-list-col button{text-align:left}

.fg-farm-meters{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;font-size:13px}
.fg-farm-stage{display:grid;grid-template-columns:110px 1fr;gap:14px;align-items:center}
.fg-plant-icon{height:110px;border-radius:16px;background:var(--paper);border:1.5px solid #86efac;display:grid;place-items:center;font-size:48px}

/* === Hayat Bilgisi Kroki & Renk Atölyesi === */
.hb-grid-map{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px;max-width:300px;margin:0 auto}
.hb-cell{aspect-ratio:1/1;border-radius:10px;border:1.5px solid var(--line);background:var(--bg);display:grid;place-items:center;font-size:12px;font-weight:700;text-align:center;padding:3px}
.hb-cell.me{background:#dbeafe;border-color:#0284c7;font-size:22px}
.hb-cell.tgt{background:#fef9c3;border-color:#eab308;box-shadow:inset 0 0 0 2px #facc15}
.hb-mix-box{padding:12px;border-radius:10px;border:1.5px dashed #94a3b8;text-align:center;font-size:13.5px}

function updateSaveStatus(){const el=$('#saveText');if(!el)return;el.textContent=saveLabel()+cloudLabel()+syncLabel();el.title=htmlFile?(htmlFile.name+' · '+(htmlLastSavedAt?'Son HTML kaydı: '+new Date(htmlLastSavedAt).toLocaleTimeString('tr-TR'):'Dosya bağlantısı hazır')):'İlerleme tarayıcıda kayıtlı. Dosyaya da yazmak için “HTML’ye otomatik kayıt” bölümünü açın.';el.classList.toggle('file-save-error',htmlFilePermission==='error'||!storageOK);}
function portableHTML(snapshot=JSON.stringify(store),extra=JSON.stringify(imported)){
 if(!portableShell){const clone=document.documentElement.cloneNode(true);clone.querySelector('#app').innerHTML='';clone.querySelector('#modal').innerHTML='';clone.querySelector('#toast').classList.add('hidden');clone.querySelector('#sessionSeed').textContent='__ATOLYE_SESSION_PAYLOAD__';let extras=clone.querySelector('#extraBooks');if(!extras){extras=document.createElement('script');extras.id='extraBooks';extras.type='application/json';clone.querySelector('#sessionSeed').after(extras);}extras.textContent='__ATOLYE_EXTRA_PAYLOAD__';portableShell='<!doctype html>\n'+clone.outerHTML;}
 // Replacement callbacks preserve literal dollar sequences in personal notes.
 return portableShell.replace('__ATOLYE_SESSION_PAYLOAD__',()=>snapshot.replace(/</g,'\\u003c')).replace('__ATOLYE_EXTRA_PAYLOAD__',()=>extra.replace(/</g,'\\u003c'));
}
function fileHandleStore(action,value){return new Promise((resolve,reject)=>{const request=indexedDB.open('test-atolyesi-html-file-v1',1);request.onupgradeneeded=()=>request.result.createObjectStore('handles');request.onerror=()=>reject(request.error);request.onsuccess=()=>{const connection=request.result;const transaction=connection.transaction('handles',action==='get'?'readonly':'readwrite');const store=transaction.objectStore('handles');const operation=action==='get'?store.get('active'):action==='delete'?store.delete('active'):store.put(value,'active');transaction.oncomplete=()=>{const result=operation.result;connection.close();resolve(result);};transaction.onerror=()=>{connection.close();reject(transaction.error);};};});}
async function restoreHTMLFile(){if(typeof window.showSaveFilePicker!=='function')return;try{const handle=await fileHandleStore('get');if(!handle)return;htmlFile=handle;htmlFilePermission=await handle.queryPermission({mode:'readwrite'});if(htmlFilePermission==='granted')queueHTMLWrite();else htmlFilePermission='prompt';updateSaveStatus();}catch(e){/* Browser recovery storage still works when handle persistence is unavailable. */}}
function queueHTMLWrite(){if(locked||!ready||!htmlFile||htmlFilePermission!=='granted')return htmlWritePromise||Promise.resolve();const snapshot=JSON.stringify(store),extra=JSON.stringify(imported),signature=snapshot+'\n'+extra;if(signature===htmlActiveSignature){htmlWritePending=null;return htmlWritePromise||Promise.resolve();}if(htmlWritePending?.signature===signature||(!htmlWriting&&signature===htmlLastSignature))return htmlWritePromise||Promise.resolve();htmlWritePending={snapshot,extra,signature};if(!htmlWritePromise){htmlWritePromise=drainHTMLWrites().finally(()=>{htmlWritePromise=null;});}return htmlWritePromise;}
async function drainHTMLWrites(){htmlWriting=true;updateSaveStatus();try{while(htmlWritePending&&htmlFile&&htmlFilePermission==='granted'&&!locked){const next=htmlWritePending,handle=htmlFile;htmlWritePending=null;htmlActiveSignature=next.signature;let writer;try{writer=await handle.createWritable();await writer.write(portableHTML(next.snapshot,next.extra));await writer.close();htmlLastSignature=next.signature;htmlLastSavedAt=Date.now();htmlFileError='';}catch(e){try{if(writer)await writer.abort();}catch(_){}htmlFilePermission='error';htmlFileError=e.message||'Dosyaya yazılamadı.';toast('HTML’ye yazılamadı. Son değişiklikler tarayıcıda korunuyor. “HTML’ye otomatik kayıt” bölümünden yeniden bağlayın.');break;}}}finally{htmlActiveSignature='';htmlWriting=false;updateSaveStatus();}}
async function chooseHTMLFile(){if(typeof window.showSaveFilePicker!=='function'){htmlFileDialog();return;}try{const handle=await window.showSaveFilePicker({suggestedName:'Egitim-Atolyesi.html',types:[{description:'Eğitim Atölyesi HTML dosyası',accept:{'text/html':['.html']}}]});if(htmlWritePromise)await htmlWritePromise;htmlFile=handle;htmlFilePermission='granted';htmlLastSignature='';htmlLastSavedAt=null;htmlWritePending=null;try{await fileHandleStore('put',handle);}catch(e){toast('Dosya bağlantısı bu oturum için açıldı; yeniden açılışta tekrar seçmeniz gerekebilir.');}save();await queueHTMLWrite();htmlFileDialog();}catch(e){if(e.name!=='AbortError'){htmlFileError=e.message;toast('Dosya bağlantısı kurulamadı. Tarayıcı kaydı korunuyor.');}}}
async function resumeHTMLFile(){if(!htmlFile)return chooseHTMLFile();try{htmlFilePermission=await htmlFile.requestPermission({mode:'readwrite'});if(htmlFilePermission==='granted'){htmlLastSignature='';htmlFileError='';save();await queueHTMLWrite();}else toast('HTML’ye yazma izni verilmedi. Tarayıcı kaydı korunuyor.');htmlFileDialog();}catch(e){htmlFilePermission='error';htmlFileError=e.message;htmlFileDialog();}}
async function disconnectHTMLFile(){const pending=htmlWritePromise;htmlFile=null;htmlFilePermission='none';htmlWritePending=null;htmlLastSignature='';if(pending)await pending;try{await fileHandleStore('delete');}catch(e){}htmlFileDialog();}
function htmlFileDialog(){if(host){dialog('Cihaza otomatik kayıt','<p>Android uygulamasında profiller, cevaplar, notlar, süreler ve ayarlar her değişiklikte cihazın uygulama depolamasına otomatik kaydedilir; ayrıca dosya bağlamana gerek yoktur.</p><p>Başka bir cihaza taşımak için “Yedek ve taşıma” bölümünden JSON yedeğini ya da kaydı içeren HTML dosyasını paylaş.</p><button data-act="portable">Kaydı içeren HTML paylaş</button>');return;}const supported=typeof window.showSaveFilePicker==='function';dialog('HTML’ye otomatik kayıt',`<p>Her işaretleme önce anında tarayıcıya kaydedilir. Dosya bağlantısı açıldığında cevaplar, notlar, süreler ve görünüm ayarları ayrıca seçtiğiniz HTML dosyasının içine yazılır.</p>${supported?`<div class="file-save-panel"><strong>${htmlFile?esc(htmlFile.name):'Henüz HTML dosyası seçilmedi'}</strong><p>${htmlFilePermission==='granted'?'Bağlı. Her değişiklik dosyaya otomatik yazılır.':htmlFile?'Dosyaya yazmak için izni yenileyin.':'Aşağıdaki düğmeyle kaydedilecek Test-Atolyesi.html dosyasını seçin. Mevcut dosyayı seçerseniz içeriği güncel uygulama ve kayıtlarınızla değiştirilir.'}</p>${htmlLastSavedAt?`<small>Son dosya kaydı: ${esc(new Date(htmlLastSavedAt).toLocaleString('tr-TR'))}</small>`:''}${htmlFileError?`<p class="danger">${esc(htmlFileError)}</p>`:''}</div><div class="row">${htmlFile?'<button class="primary" data-act="resumeHTML">İzni yenile / şimdi kaydet</button>':''}<button ${htmlFile?'':'class="primary"'} data-act="chooseHTML">${htmlFile?'Başka HTML dosyası seç':'HTML dosyasını seç ve bağla'}</button>${htmlFile?'<button data-act="disconnectHTML">Dosya bağlantısını kes</button>':''}</div><p class="file-help">Tarayıcı dosya erişimi için bir kez izin ister. Sonraki açılışlarda yeniden izin gerekirse üst çubukta “HTML iznini yenile” görünür. Dosyaya yazılırken sayfayı kapatmadan önce “HTML kaydı ✓” durumunu bekleyin.</p>`:'<div class="alert">Bu tarayıcı dosyanın üzerine yazma özelliğini sunmuyor. Bu pencerede sessizce HTML dosyasını değiştirmek mümkün değil. Çalışmanız tarayıcıda kaydedilir; aşağıdaki düğme mevcut ilerlemenizi içeren yeni HTML oluşturur. Doğrudan dosyaya kayıt için dosya yazma özelliğini destekleyen bir tarayıcıda açın.</div>'}<button data-act="portable">Kaydı içeren HTML indir</button>`);}

function save(){if(locked)return;state.last=state.last||null;const p=activeProfile();p.state=state;const current=JSON.stringify(state);if(current!==lastLocalSnapshot||!Number.isFinite(state.updatedAt)){state.updatedAt=Date.now();store.updatedAt=Date.now();lastLocalSnapshot=JSON.stringify(state);}const all=JSON.stringify(store);try{localStorage.setItem(STORE_KEY,all);storageOK=true;}catch(e){storageOK=!!host;if(!host)running=false;}if(host&&all!==lastHostSnapshot){try{const r=host.saveState(all);storageOK=r==null||r==='ok';if(storageOK)lastHostSnapshot=all;}catch(e){storageOK=false;}}queueHTMLWrite();cloudQueue();updateSaveStatus();}

function claim(force=false){try{const owner=JSON.parse(localStorage.getItem(LOCK)||'null');if(!force&&owner&&owner.id!==tabId&&Date.now()-owner.at<6500){locked=true;return false;}localStorage.setItem(LOCK,JSON.stringify({id:tabId,at:Date.now()}));locked=false;return true;}catch(e){storageOK=false;return true;}}
claim();

function diagnosticGuide(b,t){const d=b.meta?.diagnostic;if(!d)return '';return `<details class="alert diagnostic-guide" ${t?'':'open'}><summary><b>Tanılama yönergesi${t?' · '+esc(t.difficulty||''):''}</b></summary><p>${esc(t?.instructions||d.instructions)}</p><p>${esc(t?'Güçlükler içerik incelemesine dayalı ön sınıflamadır. İlk uygulamada dış yardım ve cevap kontrolü kullanma.':d.difficultyMethod)}</p></details>`;}
function getState(b,t){const k=b.id+'/'+t.id;if(!state.tests[k])state.tests[k]={index:0,answers:{},times:{},flags:{},notes:{},elapsed:0,limit:Number.isFinite(t.recommendedSeconds)?Math.max(0,t.recommendedSeconds):0,qLimit:0,checked:false,history:[]};const s=state.tests[k];if(t.legacyTestIds&&!s.unitsMigrated){for(const id of t.legacyTestIds){const old=state.tests[b.id+'/'+id];if(!old)continue;for(const f of ['answers','times','flags','notes','elims','peeks','keyOverrides','stamp','unk','unkText','oops','trail','hl'])s[f]={...(old[f]||{}),...(s[f]||{})};s.elapsed+=Number(old.elapsed)||0;}s.unitsMigrated=true;}s.history=s.history||[];s.peeks=s.peeks&&typeof s.peeks==='object'?s.peeks:{};s.index=Math.min(Math.max(0,s.index||0),t.questions.length-1);return s;}
function counts(t,s){let correct=0,wrong=0,blank=0,unknown=0,answered=0;for(const q of t.questions){const a=s.answers[q.id];if(a)answered++;if(!q.answer){unknown++;continue;}if(!a)blank++;else if(a===q.answer)correct++;else wrong++;}return{correct,wrong,blank,unknown,answered,known:t.questions.length-unknown};}
function totalStats(){let answered=0,time=0,started=0;for(const b of books)for(const t of b.tests){const s=state.tests[b.id+'/'+t.id];if(s){const n=Object.keys(s.answers).length;answered+=n;time+=s.elapsed||0;if(n||s.elapsed)started++;}}return{answered,time,started};}
