// İfade seçimi: hem soru alanındaki (.question-body) hem konu anlatımındaki (.course-article) seçili metni yakalar.
function selInfo(){
  const sel=window.getSelection();
  if(!sel||sel.isCollapsed||!sel.rangeCount)return null;
  const t=sel.toString().replace(/\s+/g,' ').trim();
  if(t.length<2||t.length>4000)return null;
  const node=sel.anchorNode?.nodeType===1?sel.anchorNode:sel.anchorNode?.parentElement;
  if(!node)return null;
  const range=sel.getRangeAt(0).cloneRange();
  let r=range.getBoundingClientRect();
  if(!r||(r.width===0&&r.height===0))r=node.getBoundingClientRect();
  const eduArt=node.closest?.('.course-article');
  if(eduArt&&view==='course'){
    const exCard=node.closest?.('.edu-ex-card');
    const blk=exCard||node.closest?.('.worked,.callout,.table-scroll,table,ul,ol,p,blockquote,section');
    const localText=(blk?.innerText||'').replace(/\s+/g,' ').trim().slice(0,1500);
    return{scope:'edu',t,cid:eduArt.dataset.cid,sid:eduArt.dataset.sid,exId:exCard?.dataset.exCard||'',localText,r,range};
  }
  if(view==='study'){
    const area=node.closest?.('.question-body');
    if(!area)return null;
    const opt=node.closest('[data-id].option');
    const w=opt?opt.dataset.id:node.closest('.solution')?'açıklama':node.closest('.passage')?'parça':'soru';
    return{scope:'study',t,w,r,range};
  }
  return null;
}

function addUnkText(info){
  if(!info||info.scope!=='study'||locked)return;
  const s=currentState,q=currentTest.questions[s.index],list=marksOf(s,'unkText',q.id)||[];
  if(!list.some(x=>x.t===info.t&&x.w===info.w))list.push({t:info.t,w:info.w});
  s.unkText[q.id]=list.slice(-30);
  stampQ(s,q.id);
  window.getSelection()?.removeAllRanges();
  hideUnkMenu();
  save();
  render();
  toast('“'+info.t.slice(0,40)+'” bilmediğin ifadelere eklendi.');
}

function addHighlight(info){
  if(!info||info.scope!=='study'||locked)return;
  const s=currentState,q=currentTest.questions[s.index],list=marksOf(s,'hl',q.id)||[];
  const color=getLastHlColor(),style=getLastHlStyle();
  const hl={id:'hl-'+Date.now()+'-'+Math.random().toString(36).slice(2,7),t:info.t,w:info.w,color,style,at:Date.now()};
  list.push(hl);
  s.hl[q.id]=list.slice(-50);
  stampQ(s,q.id);
  window.getSelection()?.removeAllRanges();
  hideUnkMenu();
  hideHlPopover();
  save();
  render();
  toast('“'+info.t.slice(0,35)+'” vurgulandı.');
}

function hideUnkMenu(){$('#unkMenu')?.remove();try{window.CSS?.highlights?.delete('ta-sel');}catch(e){}}
function hideHlPopover(){$('#hlPopover')?.remove();}

function positionFloating(el,x,y){
  if(!el)return;
  const w=el.offsetWidth||220,h=el.offsetHeight||160;
  el.style.left=Math.max(8,Math.min(innerWidth-w-8,x))+'px';
  el.style.top=Math.max(8,Math.min(innerHeight-h-8,y))+'px';
}

function copyTextFallback(t){
  if(!t)return;
  if(navigator.clipboard?.writeText){
    navigator.clipboard.writeText(t).then(()=>toast('Kopyalandı')).catch(()=>legacyCopy(t));
  } else {
    legacyCopy(t);
  }
}
function legacyCopy(t){
  try{
    const ta=document.createElement('textarea');
    ta.value=t;ta.style.position='fixed';ta.style.opacity='0';
    document.body.append(ta);ta.select();
    const ok=document.execCommand('copy');
    ta.remove();
    if(ok)toast('Kopyalandı');
  }catch(e){}
}

let allowNativeContextMenu=false;
let nativeBypassText='';
let suppressSelChange=false;
let lastPointerType='';
let isPointerActive=false;
let selTimer=null;
const isTouchOrPen=()=>lastPointerType==='touch'||lastPointerType==='pen'||matchMedia('(pointer:coarse)').matches||(/Android|iPhone|iPad|iPod/i.test(navigator.userAgent)&&navigator.maxTouchPoints>0);

function scheduleTouchMenu(delay=380){
  clearTimeout(selTimer);
  selTimer=setTimeout(()=>{
    if(suppressSelChange||isPointerActive||!isTouchOrPen())return;
    const cur=$('#unkMenu');
    const info=selInfo();
    if(!info){nativeBypassText='';return;}
    if(nativeBypassText&&info.t===nativeBypassText)return;
    nativeBypassText='';
    if(cur?._info&&cur._info.t===info.t&&cur._info.scope===info.scope)return;
    const y=info.r.bottom+10+210<=innerHeight?info.r.bottom+10:Math.max(8,info.r.top-215);
    showUnkMenu(info,info.r.left,y);
  },delay);
}

document.addEventListener('pointerdown',e=>{
  if(e.pointerType)lastPointerType=e.pointerType;
  if(!e.target.closest?.('#unkMenu')){
    isPointerActive=true;
    clearTimeout(selTimer);
  }
},true);

document.addEventListener('pointerup',()=>{
  if(!isPointerActive)return;
  isPointerActive=false;
  if(isTouchOrPen())scheduleTouchMenu(380);
},true);

document.addEventListener('pointercancel',()=>{
  isPointerActive=false;
},true);

function triggerNativeSystemMenu(m){
  const info=m?._info;
  allowNativeContextMenu=true;
  nativeBypassText=info?.t||'';
  hideUnkMenu();
  if(info?.range){
    try{
      suppressSelChange=true;
      const sel=window.getSelection();
      sel.removeAllRanges();
      sel.addRange(info.range);
      setTimeout(()=>{suppressSelChange=false;},250);
    }catch(e){suppressSelChange=false;}
  }
  if(window.AndroidHost&&typeof window.AndroidHost.openSystemTextMenu==='function'){
    try{window.AndroidHost.openSystemTextMenu(info?.t||'');return;}catch(e){}
  }
  if(!isTouchOrPen()){
    toast('Tarayıcı sistem menüsü için şimdi sağ tıklayın.');
  }
}

// Tek tip metin bazlı sağ tık / seçim menüsü (Windows & Android tutarlı)

    <button type="button" data-act="eduSelSpeak">🔊 Dinle (EN)</button>
    <button type="button" data-act="selAskAi">🤖 Yapay zekâya sor</button>
    <div class="menu-divider"></div>
    <button type="button" data-act="showSysMenu" class="menu-subtle">⋯ Sistem menüsünü göster</button>`;
  } else {
    m.innerHTML=`<button type="button" data-act="unkTextAdd">❓ Bu ifadeyi bilmiyorum</button>
    <button type="button" data-act="hlAdd">🖍️ Vurgula</button>
    <button type="button" data-act="selAskAi">🤖 Yapay zekâya sor</button>
    <div class="menu-divider"></div>
    <button type="button" data-act="showSysMenu" class="menu-subtle">⋯ Sistem menüsünü göster</button>`;
  }
  m._info=info;
  m.addEventListener('mousedown',ev=>ev.preventDefault());
  document.body.append(m);
  positionFloating(m,x,y);
  // Dokunmatik / kalem cihazlarda yerel sistem barının aynı anda açılmasını engellemek için
  // seçimi CSS Custom Highlight ile görsel olarak koruyup native selection'ı temizle.
  if(isTouchOrPen()&&info.range){

      if(window.CSS?.highlights&&typeof Highlight==='function'){
        window.CSS.highlights.set('ta-sel',new Highlight(info.range));
      }
      suppressSelChange=true;
      window.getSelection()?.removeAllRanges();
      setTimeout(()=>{suppressSelChange=false;},200);
    }catch(e){suppressSelChange=false;}
  }
}

function showHlPopover(hl,ctx,targetEl){
  hideHlPopover();
  hideUnkMenu();
  const p=document.createElement('div');
  p.id='hlPopover';
  p.className='hl-popover';

  <button type="button" class="hl-del-btn" data-act="hlDel" title="Vurguyu sil">× Kaldır</button>`;
  document.body.append(p);
  const r=targetEl.getBoundingClientRect();

// DOM içinde metin eşleştirme ve <mark> sarmalama yardımcısı (hem soru hem konu anlatımı için)
function applyTextMark(root,text,makeMark){
  if(!root||!text)return;
  const kel=text.split(/\s+/).filter(Boolean).map(k=>k.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'));
  if(!kel.length)return;
  const nodes=[];
  const tw=document.createTreeWalker(root,NodeFilter.SHOW_TEXT);
  let full='',n,prevBlock=null;
  while((n=tw.nextNode())){
    if(n.parentElement.closest('.ta-hl,.unk-mark,button.tts-btn,svg,script,style'))continue;
    const blk=n.parentElement.closest('p,li,div,td,th,h1,h2,h3,h4,h5,h6,blockquote');
    if(prevBlock&&blk!==prevBlock&&full&&!/\s$/.test(full))full+=' ';
    prevBlock=blk;
    nodes.push({n,at:full.length});
    full+=n.nodeValue;
  }
  const m=new RegExp(kel.join('\\s+'),'i').exec(full);
  if(!m)return;
  const bas=m.index,son=m.index+m[0].length;
  for(const {n:tn,at} of nodes.slice().reverse()){
    const a=Math.max(bas,at),b=Math.min(son,at+tn.nodeValue.length);
    if(a>=b)continue;
    try{
      const r=document.createRange();
      r.setStart(tn,a-at);
      r.setEnd(tn,b-at);
      r.surroundContents(makeMark());
    }catch(e){}
  }
}

// Bilinmeyen ifadeleri turkuaz alt çizgiyle, vurguları ise hafif renk tonu veya alt çizgiyle göster.
function markUnk(){
  if(view==='course'){
    const art=document.querySelector('.course-article');
    if(!art)return;
    const cid=art.dataset.cid,sid=art.dataset.sid;
    const e2=ensureEduState(state);
    const hlList=e2.hl?.[cid+'/'+sid]||[];
    for(const x of hlList){
      applyTextMark(art,x.t,()=>{
        const mk=document.createElement('mark');
        mk.className='ta-hl'+(x.style==='underline'?' is-underline':'');
        mk.dataset.hlId=x.id;
        mk.dataset.hlScope='edu';
        mk.dataset.hlCid=cid;
        mk.dataset.hlSid=sid;
        mk.style.setProperty('--hl-c',x.color);
        mk.title='Vurgu (rengi/stili değiştirmek veya silmek için tıkla)';
        return mk;
      });
    }
    const unkVocab=(e2.vocab||[]).filter(v=>!v.deleted&&v.word&&v.word.length>=2);
    for(const v of unkVocab){
      applyTextMark(art,v.word,()=>{
        const mk=document.createElement('mark');
        mk.className='unk-mark';
        mk.title='Bilmediğin ifade (Kelime Havuzu)';
        return mk;
      });
    }
    return;
  }
  if(view!=='study'||!currentTest)return;
  const s=currentState,q=currentTest.questions[s.index];
  const unkList=s.unkText?.[q.id]||[];
  const hlList=s.hl?.[q.id]||[];
  if(!unkList.length&&!hlList.length)return;
  const yer=w=>w==='soru'?'.question-body .q-text':w==='parça'?'.question-body .passage':w==='açıklama'?'.question-body .solution':`.question-body .option[data-id="${CSS.escape(w)}"] span`;

  // 1. Vurguları işaretle
  for(const x of hlList){
    const root=document.querySelector(yer(x.w));
    applyTextMark(root,x.t,()=>{
      const mk=document.createElement('mark');
      mk.className='ta-hl'+(x.style==='underline'?' is-underline':'');
      mk.dataset.hlId=x.id;
      mk.dataset.hlQid=q.id;
      mk.style.setProperty('--hl-c',x.color);
      mk.title='Vurgu (rengi/stili değiştirmek veya silmek için tıkla)';
      return mk;
    });
  }

  // 2. Bilinmeyen ifadeleri işaretle
  for(const x of unkList){
    const root=document.querySelector(yer(x.w));
    applyTextMark(root,x.t,()=>{
      const mk=document.createElement('mark');
      mk.className='unk-mark';
      mk.title='Bilmediğin ifade';
      return mk;
    });
  }
}

// senkronlanır (P olayı). Atanmamış her kitap "Diğer"dedir; yeni profilde bütün kitaplar "Diğer"de görünür.

const LIBS_KEY='test-atolyesi:libs', DIGER='Diğer';
function libCur(){if(state.libCfg&&Array.isArray(state.libCfg.libs))return state.libCfg;let c={libs:[],assign:{},t:0};
 if(activeProfile().id==='p-nayas'){let g=null;try{g=JSON.parse(localStorage.getItem(LIBS_KEY)||'null');}catch(e){}c={libs:g?.libs?.length?[...g.libs]:[...DEF_LIBS],assign:{...(g?.assign||{})},t:0};}
 state.libCfg=c;return c;}

function aiExtract(text){return String(text||'').match(/(?:^|[^0-9A-Za-z_.\-])((?:AIza[0-9A-Za-z_\-]{35}|AQ\.[0-9A-Za-z_\-]{32,2048}))(?![0-9A-Za-z_.\-])/)?.[1]||'';}

const aiB64=bytes=>btoa(String.fromCharCode(...bytes));

function aiMakePass(){
 // 4 × 1024 kelime birleşimi + 4 rakam: yaklaşık 53 bit; modulo yanlılığı yok.
 const a='ak al ay bal bas boz cam can dal dis dus es gol gun gur hos kar kas kis kor kum kus nar pak pul saf sar saz sel son tas tek'.split(' '),b='ada ari at ay bag bal bel buz cam can dal dag dem dil dut ev fil gol gun han ip iz kar kas kil kis kol kum kus nar sel yaz'.split(' ');
 const r=crypto.getRandomValues(new Uint8Array(10));let n;do{n=crypto.getRandomValues(new Uint16Array(1))[0];}while(n>=60000);
 return [0,2,4,6].map(i=>a[r[i]&31]+b[r[i+1]&31]).concat(String(n%10000).padStart(4,'0')).join('-');
}
async function aiEncrypt(pid,key,pass,after=0){const salt=crypto.getRandomValues(new Uint8Array(16)),iv=crypto.getRandomValues(new Uint8Array(12)),k=await aiDerive(pid,pass,salt),ct=await crypto.subtle.encrypt({name:'AES-GCM',iv},k,new TextEncoder().encode(key));return {v:1,salt:aiB64(salt),iv:aiB64(iv),ct:aiB64(new Uint8Array(ct)),updatedAt:Math.max(Date.now(),after+1)};}
async function aiDecrypt(pid,box,pass){if(!aiValidBox(box))throw Error('Şifreli anahtar kutusu okunamadı. İlk cihazdan yeniden eşitleyin.');try{const k=await aiDerive(pid,pass,aiBytes(box.salt)),plain=await crypto.subtle.decrypt({name:'AES-GCM',iv:aiBytes(box.iv)},k,aiBytes(box.ct));const key=new TextDecoder().decode(plain);if(aiExtract(key)!==key)throw Error();return key;}catch(e){throw Error('Taşıma kodu hatalı. Lütfen ilk cihazınızdaki kodu kontrol edin.');}}

let selAiState=null;
function selAiBuildContext(info){
 if(!info)return {label:'',system:'',payload:{}};
 if(info.scope==='study'&&typeof currentTest!=='undefined'&&currentTest){
  const q=currentTest.questions[currentState.index];
  const reveal=!!(currentState.checked||peekOpen(currentState,q));
  const qctx=aiQuestionContext(reveal);
  if(qctx.passage&&qctx.passage.length>1500)qctx.passage=qctx.passage.slice(0,1500)+'…';
  if(qctx.explanation&&qctx.explanation.length>900)qctx.explanation=qctx.explanation.slice(0,900)+'…';
  return {
   label:`Soru ${(currentState.index||0)+1} · ${info.w||'soru'}`,
   system:'Türkçe bir öğretmensin. Öğrenci çözdüğü sorudan bir ifade seçti. '+(reveal?'Soru kontrol edilmiş; gerekirse doğru cevabı ve mantığını açıklayabilirsin.':'SPOILER KORUMASI: Kullanıcı doğrudan cevabı sormadıkça doğru şıkkı söyleme; seçili ifadeyi soru bağlamında açıkla ve ipucu ver.'),
   payload:{selectedText:info.t,selectedIn:info.w,question:qctx}
  };
 }
 const c=typeof currentCourse==='function'?currentCourse():null;
 const s=typeof currentCourseSection==='function'?currentCourseSection(c):null;
 const exObj=info.exId&&typeof EDU_EXERCISES!=='undefined'?EDU_EXERCISES[info.exId]:null;
 if(info.exId){
  return {
   label:`${s?.dayTag||'Eğitim'} · Alıştırma (${exObj?.title||info.exId})`,
   system:'Türkçe akademik bir eğitmensin. Öğrenci ders içi etkileşimli alıştırmadan bir ifade seçti. Alıştırma bloğunu ve seçili ifadeyi dikkate alarak kısa, net ve öğretici yanıt ver.',
   payload:{selectedText:info.t,course:c?.title,section:s?.title,exercise:{id:info.exId,title:exObj?.title,prompt:exObj?.prompt,visibleBlock:info.localText}}
  };
 }
 return {
  label:`${s?.dayTag||'Eğitim'} · ${s?.title||'Bölüm'}`,
  system:'Türkçe akademik bir eğitmensin. Öğrenci konu anlatımı bölümünden bir ifade seçti. İlgili bölüm ve seçilen blok bağlamında kısa, net ve örnekli yanıt ver.',
  payload:{selectedText:info.t,course:c?.title,section:s?.title,subtitle:s?.subtitle,selectedBlock:info.localText||'',sectionExcerpt:(s?.searchText||'').slice(0,1400)}
 };
}

 return `<div id="selAiWrap"><div class="row" style="margin-bottom:10px"><span class="tag">Seçili: “${esc(st.info.t.slice(0,80))}${st.info.t.length>80?'…':''}”</span><small class="muted">${esc(st.ctx.label)}</small></div>`+
 `<div class="ai-messages" aria-live="polite">${st.history.map(m=>`<div class="ai-message ${m.role}"><b>${m.role==='user'?'Siz':'Asistan'}</b><div>${esc(m.parts[0].text)}</div></div>`).join('')}</div>`+
 `<div class="ai-chips">${chips.map(t=>`<button class="small" data-act="selAiChip" data-text="${esc(t)}" ${st.busy?'disabled':''}>${esc(t)}</button>`).join('')}</div>`+
 `<label for="selAiInput">Sorunuz</label><textarea id="selAiInput" rows="2" maxlength="3000" placeholder="Seçili ifadeyle ilgili istediğinizi sorun…" ${st.busy?'disabled':''}></textarea>`+
 `<div class="row" style="margin-top:8px"><button class="primary" data-act="selAiSend" ${st.busy?'disabled':''}>${st.busy?'Yanıt hazırlanıyor…':'Gönder'}</button>`+
 `${st.history.length?`<button data-act="selAiClear" ${st.busy?'disabled':''}>Temizle</button>`:''}</div>`+
 `${st.error?`<p class="ai-error" role="status">${esc(st.error)}</p>`:''}</div>`;
}

function openSelAiDialog(info){
 const p=activeProfile();
 if(!aiLocalKey(p)){toast('Önce YZ Ayarları’ndan Gemini API anahtarını ekle.');aiSettings();return;}
 selAiState={info,ctx:selAiBuildContext(info),history:[],busy:false,error:''};
 dialog('🤖 Seçili İfade Hakkında YZ’ye Sor',selAiRenderBody());
 $('#selAiInput')?.focus();
}

async function selAiSendMsg(text){
 const st=selAiState;if(!st||st.busy)return;
 const p=activeProfile(),key=aiLocalKey(p);
 if(!key){toast('Önce YZ Ayarları’ndan API anahtarını girin.');return;}
 const q=(text||$('#selAiInput')?.value||'').trim().slice(0,3000);
 if(!q){toast('Önce bir soru yazın veya hızlı butonlardan seçin.');return;}
 st.busy=true;st.error='';
 const wrap=$('#selAiWrap');if(wrap)wrap.outerHTML=selAiRenderBody();
 const msg={role:'user',parts:[{text:q}]};
 const ctxTurn=[{role:'user',parts:[{text:'Bağlam: '+JSON.stringify(st.ctx.payload)}]},{role:'model',parts:[{text:'Bağlamı ve seçili ifadeyi dikkate alarak yardımcı olacağım.'}]}];
 try{
  const reply=await aiGenerate(key,aiModel(p),st.ctx.system,[...ctxTurn,...st.history.slice(-10),msg],900);
  st.history.push(msg,{role:'model',parts:[{text:reply}]});
  st.history=st.history.slice(-12);
 }catch(e){
  st.error=e.message||'Yanıt alınamadı';
 }finally{
  st.busy=false;
  const w2=$('#selAiWrap');if(w2)w2.outerHTML=selAiRenderBody();
 }
}

document.addEventListener('click',e=>{
 const el=e.target.closest('[data-act]'),a=el?.dataset.act;
 if(!['selAiChip','selAiSend','selAiClear'].includes(a)||el.disabled)return;
 e.stopImmediatePropagation();
 if(a==='selAiChip')void selAiSendMsg(el.dataset.text);
 else if(a==='selAiSend')void selAiSendMsg();
 else if(a==='selAiClear'&&selAiState&&!selAiState.busy){selAiState.history=[];selAiState.error='';const w=$('#selAiWrap');if(w)w.outerHTML=selAiRenderBody();}
},true);

ler</h1><p class=\"chapter-desc\">Zaman uyumları, kipler, edilgen aktarma, koşul/devrik yapılar, fiilimsiler, ilgi-isim cümlecikleri ve miktar sistematiği.</p></div><h2 class=\"sec-head\"><span class=\"sec-num\">1.1</span>Zamanlar, Zaman Uyumu ve Zaman Zarfları</h2><div class=\"svg-wrap\"><svg viewBox=\"0 0 720 158\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, Calibri, sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"158\" fill=\"#ffffff\"/>\n  <!-- Main Axis -->\n  <line x1=\"28\" y1=\"78\" x2=\"692\" y2=\"78\" stroke=\"#0f2438\" stroke-width=\"2\"/>\n  <polygon points=\"692,74 702,78 692,82\" fill=\"#0f2438\"/>\n  <!-- Past Earlier Node -->\n  <circle cx=\"115\" cy=\"78\" r=\"6\" fill=\"#0f2438\"/>\n  <rect x=\"24\" y=\"14\" width=\"182\" height=\"48\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#0f2438\" stroke-width=\"1\"/>\n  <text x=\"115\" y=\"29\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" fill=\"#0f2438\">ÖNCEKİ GEÇMİŞ (had V3)</text>\n  <text x=\"115\" y=\"42\" text-anchor=\"middle\" font-size=\"8.2\" fill=\"#334155\">by + geçmiş · decades earlier</text>\n  <text x=\"115\" y=\"54\" text-anchor=\"middle\" font-size=\"8.2\" fill=\"#0e7490\" font-weight=\"600\">after + had V3, V2 | before + V2, had V3</text>\n  <line x1=\"115\" y1=\"62\" x2=\"115\" y2=\"72\" stroke=\"#0f2438\" stroke-width=\"1\"/>\n\n  <!-- Closed Past Node -->\n  <circle cx=\"272\" cy=\"78\" r=\"6\" fill=\"#9f1239\"/>\n  <rect x=\"214\" y=\"94\" width=\"144\" height=\"54\" rx=\"3\" fill=\"#fffafa\" stroke=\"#9f1239\" stroke-width=\"1\"/>\n  <text x=\"286\" y=\"109\" text-anchor=\"middle\" font-size=\"9.5\" font-weight=\"700\" fill=\"#9f1239\">KAPALI GEÇMİŞ (V2)</text>\n  <text x=\"286\" y=\"122\" text-anchor=\"middle\" font-size=\"8\" fill=\"#334155\">in the 20th c. · ago · in 1964</text>\n  <text x=\"286\" y=\"134\" text-anchor=\"middle\" font-size=\"8\" fill=\"#334155\">until recently · last ice age</text>\n  <text x=\"286\" y=\"144\" text-anchor=\"middle\" font-size=\"7.6\" font-weight=\"700\" fill=\"#9f1239\">have V3 KESİN ELENİR</text>\n  <line x1=\"272\" y1=\"84\" x2=\"272\" y2=\"94\" stroke=\"#9f1239\" stroke-width=\"1\"/>\n\n  <!-- FIDOW Bridge Arc -->\n  <path d=\"M 332 76 Q 408 38 484 76\" fill=\"none\" stroke=\"#0e7490\" stroke-width=\"2.2\" stroke-dasharray=\"4,2\"/>\n  <polygon points=\"482,70 488,77 479,77\" fill=\"#0e7490\"/>\n  <rect x=\"322\" y=\"12\" width=\"186\" height=\"44\" rx=\"3\" fill=\"#f0f9ff\" stroke=\"#0e7490\" stroke-width=\"1.1\"/>\n  <text x=\"415\" y=\"26\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#0e7490\">ŞİMDİYE KÖPRÜ (have/has V3)</text>\n  <text x=\"415\" y=\"38\" text-anchor=\"middle\" font-size=\"7.6\" fill=\"#0f2438\">FIDOW: for/in/during/over/within + last X</text>\n  <text x=\"415\" y=\"49\" text-anchor=\"middle\" font-size=\"7.8\" fill=\"#334155\">so far · to date · since + V2 · recently</text>\n\n  <!-- NOW Barrier -->\n  <line x1=\"488\" y1=\"58\" x2=\"488\" y2=\"100\" stroke=\"#0f2438\" stroke-width=\"2\"/>\n  <text x=\"488\" y=\"114\" text-anchor=\"middle\" font-size=\"9\" font-weight=\"700\" fill=\"#0f2438\">ŞİMDİ</text>\n  <text x=\"488\" y=\"126\" text-anchor=\"middle\" font-size=\"7.8\" fill=\"#475569\">date back to (V1)</text>\n  <text x=\"488\" y=\"137\" text-anchor=\"middle\" font-size=\"7.8\" fill=\"#475569\">recent studies (V1/have V3)</text>\n\n  <!-- Future Closed Deadline -->\n  <circle cx=\"628\" cy=\"78\" r=\"6\" fill=\"#0e7490\"/>\n  <rect x=\"536\" y=\"14\" width=\"174\" height=\"48\" rx=\"3\" fill=\"#f0f9ff\" stroke=\"#0e7490\" stroke-width=\"1.1\"/>\n  <text x=\"623\" y=\"29\" text-anchor=\"middle\" font-size=\"9.2\" font-weight=\"700\" fill=\"#0e7490\">GELECEK BİTİŞ (will have V3)</text>\n  <text x=\"623\" y=\"42\" text-anchor=\"middle\" font-size=\"8\" fill=\"#0f2438\">by + gelecek tarih (by 2050)</text>\n  <text x=\"623\" y=\"53\" text-anchor=\"middle\" font-size=\"8\" fill=\"#334155\">by the time + V1, will have V3</text>\n  <line x1=\"628\" y1=\"62\" x2=\"628\" y2=\"72\" stroke=\"#0e7490\" stroke-width=\"1\"/>\n\n  <!-- Past-in-Future Note -->\n  <rect x=\"546\" y=\"96\" width=\"160\" height=\"46\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1\"/>\n  <text x=\"626\" y=\"110\" text-anchor=\"middle\" font-size=\"8.4\" font-weight=\"700\" fill=\"#0f2438\">Zaman Bağlacı Altın Kuralı</text>\n  <text x=\"626\" y=\"123\" text-anchor=\"middle\" font-size=\"7.8\" fill=\"#334155\">when/until/before/once + V1/V2</text>\n  <text x=\"626\" y=\"135\" text-anchor=\"middle\" font-size=\"7.8\" font-weight=\"700\" fill=\"#9f1239\">Yan cümlede WILL / WOULD OLMAZ</text>\n</svg><div class=\"svg-cap\">Şema 1.1 — YDS Zaman Eksenleri, \"By + Tarih\" Çift Yönlü Aynası ve Yan Cümle Kısıtı</div></div><div class=\"table-scroll\"><table><thead><tr><th style=\"width:22%\">Zaman</th><th style=\"width:40%\">Kesin Tetikleyici Zarflar</th><th style=\"width:38%\">Sınav Mekaniği ve Kısıtlar</th></tr></thead><tbody><tr><td><b>Simple Present (V1/s)</b></td><td><span class='en'>always, generally, nowadays, date/trace back to, recent studies show</span></td><td>Genel gerçek, bilimsel kanun, tarihsel köken (<span class='en'>Writing dates back to Sumerians</span>).</td></tr><tr><td><b>Simple Past (V2)</b></td><td><span class='en'>ago, in 1964, in the 20th c., until recently, last ice age, from 1939 to 1945, at that time, originate/emerge</span></td><td>Şimdiyle bağı kopmuş kapalı geçmiş. <span class='en'>Until recently</span> (= eskiden) kesinlikle V2 alır.</td></tr><tr><td><b>Present Perfect (have/has V3)</b></td><td><b>FIDOW</b> (<span class='en'>for / in / during / over / within + the last / past X</span>), <span class='en'>so far, to date, up to now, recently, lately, (ever) since + V2</span></td><td>Geçmişte başlayıp <b>bugüne dayanan</b> süreç/etki. Kapalı tarih (<span class='en'>ago / 20th c.</span>) varsa ELENİR.</td></tr><tr><td><b>Past Perfect (had V3)</b></td><td><span class='en'>by + geçmiş tarih (by 1960s), decades earlier, before + V2, after + had V3, It wasn't until ... that</span></td><td>Referans bir V2 olayından/tarihinden <b>daha önce</b> tamamlanmış eylem. Tek başına geçmiş yoksa kullanılmaz.</td></tr><tr><td><b>Future Perfect (will have V3)</b></td><td><span class='en'>by + gelecek tarih (by 2050, by the end of this fiscal year), by the time + V1</span></td><td>Gelecekteki belirli bir eşiğe gelindiğinde <b>tamamlanmış olacak</b> eylem.</td></tr><tr><td><b>Future in the Past (would V1)</b></td><td><span class='en'>claimed/predicted/was hoped that ... (past ana fiil)</span></td><td>Geçmiş bakış açısından gelecek (<span class='en'>They knew it would fail</span>). Koşulsuz tahmin aktarımında kullanılır.</td></tr></tbody></table></div><div class=\"callout amber\"><div class=\"callout-title\">Zaman Uyumu Kuralları ve 4 İstisna</div><b>1. Temel Kural:</b> Ana cümle ve yan cümle aynı zaman yarımküresinde kalır (Present ↔ Present/Future/Present Perfect; Past ↔ Past/Past Perfect/would V1). <b>2. Zaman Bağlacı Kilidi:</b> <span class='en'>when, while, as, before, after, until, as soon as, once, by the time</span> içine <span class='err'>will / would / be going to</span> gelmez (<span class='en'>Once you have found a fossil...</span>). <b>3. İstisnalar (Uyum Bozabilir):</b> (a) Evrensel gerçek / bilimsel yasa (<span class='en'>Galileo proved that the Earth orbits...</span>), (b) <span class='en'>Since + V2, have/has V3</span>, (c) Zıtlık/Sıfat cümleciği (<span class='en'>Although invented in 1920, radar is still used...</span>), (d) <span class='en'>Recent studies</span> hem V1 hem have V3 alabilir.</div><div class=\"worked\"><div class=\"worked-hdr\"><span>Çözümlü Örnek · Telafi M1 #1 &amp; #2</span><span>Zaman Aynası ve By + Tarih</span></div><div class=\"worked-stem\">1) The physics of elementary particles <b>in the 20th century</b> ---- by the observation of particles whose existence ---- by theorists <b>decades earlier</b>.<br>2) A social networking site says if everything ---- as planned, they ---- a new messaging service <b>by the end of 2020</b>.</div><div class=\"worked-row\"><span class='ok'>[+] 1. Doğru (was distinguished / had been predicted):</span> <span class='en'>in the 20th century</span> kapalı geçmişi → Simple Past (<span class='en'>was distinguished</span>). <span class='en'>decades earlier</span> ise bu gözlemden on yıllar öncesini gösterdiği için Past Perfect (<span class='en'>had been predicted</span>) zorunludur.</div><div class=\"worked-row\"><span class='err'>[-] Tuzak:</span> <span class='en'>has been distinguished</span> kapalı yüzyıl zarfıyla elenir.</div><div class=\"worked-row\"><span class='ok'>[+] 2. Doğru (goes / will have started):</span> <span class='en'>if</span> yan cümlesinde geniş zaman (<span class='en'>goes</span>), ana cümlede <span class='en'>by the end of 2020</span> hedef eşiği nedeniyle Future Perfect (<span class='en'>will have started</span>) gelir (<span class='err'>had spent / had gone</span> geçmiş eşiğe aittir).</div></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-1-1\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">1.2</span>Kipler (Modals), Edilgen Aktarma ve Ettirgen Yapılar</h2><div class=\"table-scroll\"><table><thead><tr><th style=\"width:21%\">Kip İşlevi</th><th style=\"width:29%\">Formül</th><th style=\"width:50%\">YDS Karar Kuralı ve Tuzaklar</th></tr></thead><tbody><tr><td><b>Olasılık (Şimdi/Gelecek)</b></td><td><span class='en'>may / might / could + V1</span></td><td><span class='en'>could</span> yalnız geçmiş yetenek değildir; gelecek/genel olasılıkta <span class='en'>may/might</span> eşdeğeridir (<span class='en'>Temperature rise could endanger...</span>).</td></tr><tr><td><b>Olasılık (Geçmiş Tahmin)</b></td><td><span class='en'>may / might / could have V3</span></td><td>Geçmişte olmuş olabilir ama kesin değil.</td></tr><tr><td><b>Kuvvetli Çıkarım</b></td><td><span class='en'>must V1</span> / <span class='en'>must have V3</span></td><td>Olumsuz mantıksal imkânsızlık <span class='err'>mustn't</span> değil <b><span class='en'>can't / couldn't have V3</span></b>'tür.</td></tr><tr><td><b>Gereklilik &amp; Tavsiye</b></td><td><span class='en'>should / ought to / must / have to V1</span></td><td>Geçmişte mecbur kalıp yaptı → <span class='en'>had to V1</span> (<span class='err'>must</span>'ın geçmişi yoktur). Güncel uyarı → <span class='en'>should V1</span>.</td></tr><tr><td><b>Gerçekleşmemiş Geçmiş</b></td><td><span class='en'>should have V3 · could have V3 · would have V3</span></td><td>Yapmalıydı (yapmadı) · Yapabilirdi (yapmadı) · Type 3 şartı sağlanmadığı için olurdu (olmadı).</td></tr><tr><td><b>Gereksizlik Ayrımı</b></td><td><span class='en'>didn't need to V1</span> vs <span class='en'>needn't have V3</span></td><td><span class='en'>didn't need to</span>: gerek yoktu (ve yapmadı). <span class='en'>needn't have V3</span>: gerek yoktu AMA boşuna yaptı.</td></tr><tr><td><b>Geçmiş Alışkanlık</b></td><td><span class='en'>used to V1</span> vs <span class='en'>would V1</span></td><td>İkisi de geçmiş alışkanlık anlatır; ancak <span class='en'>be/have/know/live</span> gibi <b>durum fiilleriyle yalnız <span class='en'>used to</span></b> kullanılır.</td></tr></tbody></table></div><div class=\"table-scroll\"><table><thead><tr><th style=\"width:33%\">Edilgen Aktarma (is said / believed / known / thought / estimated / expected)</th><th style=\"width:18%\">Zorunlu Mastar</th><th style=\"width:49%\">Örnek Cümle ve Zaman İlişkisi</th></tr></thead><tbody><tr><td>Eşzamanlı Etken (Genel / Süreç)</td><td><span class='en'>to V1</span> / <span class='en'>to be V-ing</span></td><td><span class='en'>He is said to know several languages. / Social workers were thought to be doing well.</span></td></tr><tr><td>Eşzamanlı Edilgen</td><td><span class='en'>to be V3</span></td><td><span class='en'>Harrie is known to be treated badly.</span></td></tr><tr><td>Ana Fiilden ÖNCE Etken</td><td><span class='en'>to have V3</span></td><td><span class='en'>Kathy is known to have killed her husband.</span> (bilme şimdi, öldürme daha önce)</td></tr><tr><td>Ana Fiilden ÖNCE Edilgen</td><td><span class='en'>to have been V3</span></td><td><span class='en'>Grey cats are said to have been brought to Europe during the Crusades.</span></td></tr></tbody></table></div>\n    <div class=\"grid-2\">\n      <div class=\"rule-card\">\n        <h4>Verb + Object + Fiil Dizilimi ve Ettirgenler</h4>\n        <ul>\n          <li><b>Varsayılan (<span class='en'>to V1 / to be V3</span>):</b> <span class='en'>allow, enable, cause, force, compel, persuade, expect, remind, warn</span> (<span class='en'>allowed them to feel...</span>). Pasifte daima <span class='en'>to V1</span> gelir (<span class='en'>I was made to carry...</span>).</li>\n          <li><b>5 Yalın Fiil (<span class='en'>+ obj + V1</span>):</b> <span class='en'>have, make, let, help (to/Ø), see/hear</span> (eylemin tamamı).</li>\n          <li><b><span class='en'>+ obj + V-ing</span>:</b> <span class='en'>catch, find, spend, waste, see/hear</span> (anlık parça: <span class='en'>was caught stealing</span>; ancak <span class='en'>find</span> = tespit etmek ise <span class='en'>is found to V1</span>!).</li>\n          <li><b>Ettirgen (<span class='en'>Causative</span>):</b> <span class='en'>have/get + [nesne] + V3</span> (<span class='en'>got her tooth pulled</span>); <span class='en'>have + [kişi] + V1</span> vs <span class='en'>get + [kişi] + to V1</span>.</li>\n        </ul>\n      </div>\n      <div class=\"rule-card\">\n        <h4><span class='en'>have V3</span> Mıknatıs Tuzağı &amp; Çift Çatılı Fiiller</h4>\n        <ul>\n          <li><b>Kural 1:</b> Pasif aktarma (<span class='en'>are said / believed</span>) ardından <span class='err'>having been V3 / being V3</span> asla gelmez; doğrudan <span class='en'>to</span>'ya kilitle!</li>\n          <li><b>Kural 2:</b> Geçmiş bağlamda genel yetenek/olasılık varsa <span class='err'>would have V3</span> değil <span class='ok'>could V1</span> seç (<span class='en'>held that only a live virus could prompt...</span>).</li>\n          <li><b>Kural 3:</b> Tarihsel anlatıda güncel uyarı veya genel öneri varsa (<span class='en'>in the recent past ... before taking again</span>) <span class='ok'>has had / should let</span> seç; <span class='err'>might have V3</span> geçmişte kalır.</li>\n          <li><b>Ergatif (Çift Çatılı) Fiiller:</b> <span class='en'>open, close, develop, grow, sell, start, finish, increase</span> nesnesiz etken görünümde pasif anlam verebilir (<span class='en'>The book sold well</span>).</li>\n        </ul>\n      </div>\n    </div>\n    <div class=\"worked\"><div class=\"worked-hdr\"><span>Çözümlü Örnek · Tam Tanı M2 #8 &amp; Telafi M1 #4</span><span>Pasif Aktarma ve Zaman Uyumu</span></div><div class=\"worked-stem\">1) Grey cats <b>are said</b> ---- to Europe from Syria during the Crusades, and <b>by the 18th century</b>, one of these cats ---- well-established.<br>2) The discovery <b>that</b> the Universe ---- at an accelerating rate ---- two rival teams of scientists a Nobel Prize in Physics.</div><div class=\"worked-row\"><span class='ok'>[+] 1. Doğru (to have been brought / had become):</span> Aktarma pasifi (<span class='en'>are said</span>) asla <span class='err'>having been</span> almaz (<span class='en'>to</span> şart!). Getirilme Haçlı Seferleri'nde, yani söylenmeden <b>önce</b> ve edilgen olduğu için <span class='en'>to have been brought</span>; <span class='en'>by the 18th century</span> kapalı sınırı da <span class='en'>had become</span> gerektirir.</div><div class=\"worked-row\"><span class='ok'>[+] 2. Doğru (is expanding / has earned):</span> Evrenin genişlemesi süregelen güncel olgu (<span class='en'>is expanding</span>); keşfin Nobel kazandırması da bugüne uzanan güncel sonuçtur (<span class='en'>has earned</span>).</div></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-1-2\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">1.3</span>Koşul Cümleleri, Mixed Types, Devrik ve Gizli Koşullar</h2><div class=\"svg-wrap\"><svg viewBox=\"0 0 720 144\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, Calibri, sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"144\" fill=\"#ffffff\"/>\n  <!-- Left: Type Matrix -->\n  <rect x=\"6\" y=\"6\" width=\"424\" height=\"132\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#cbd5e1\" stroke-width=\"1\"/>\n  <text x=\"16\" y=\"21\" font-size=\"9\" font-weight=\"700\" fill=\"#0f2438\">KOŞUL VE KARIŞIK TİP (MIXED) DİZİLİMİ</text>\n  <line x1=\"12\" y1=\"26\" x2=\"424\" y2=\"26\" stroke=\"#cbd5e1\" stroke-width=\"0.8\"/>\n\n  <text x=\"16\" y=\"41\" font-size=\"8.2\" font-weight=\"700\" fill=\"#0e7490\">Type 1 (Gerçek):</text>\n  <text x=\"108\" y=\"41\" font-size=\"8.2\" fill=\"#1e293b\">If + V1  →  will / can / may / must + V1 (veya will have V3)</text>\n\n  <text x=\"16\" y=\"60\" font-size=\"8.2\" font-weight=\"700\" fill=\"#0e7490\">Type 2 (Şimdi Dışı):</text>\n  <text x=\"108\" y=\"60\" font-size=\"8.2\" fill=\"#1e293b\">If + V2 / were  →  would / could / might + V1</text>\n\n  <text x=\"16\" y=\"79\" font-size=\"8.2\" font-weight=\"700\" fill=\"#0e7490\">Type 3 (Geçmiş Dışı):</text>\n  <text x=\"108\" y=\"79\" font-size=\"8.2\" fill=\"#1e293b\">If + had V3  →  would / could / might + have V3</text>\n\n  <line x1=\"12\" y1=\"88\" x2=\"424\" y2=\"88\" stroke=\"#e2e8f0\" stroke-width=\"0.8\"/>\n  <text x=\"16\" y=\"104\" font-size=\"8.2\" font-weight=\"700\" fill=\"#92400e\">Mixed 3 → 2:</text>\n  <text x=\"108\" y=\"104\" font-size=\"8.2\" fill=\"#1e293b\">If + had V3 (geçmiş koşul) → would V1 + now / today</text>\n\n  <text x=\"16\" y=\"124\" font-size=\"8.2\" font-weight=\"700\" fill=\"#92400e\">Mixed 2 → 3:</text>\n  <text x=\"108\" y=\"124\" font-size=\"8.2\" fill=\"#1e293b\">If + V2/were (kalıcı özellik) → would have V3 (geçmiş)</text>\n\n  <!-- Right: Inversion Transform -->\n  <rect x=\"440\" y=\"6\" width=\"274\" height=\"132\" rx=\"3\" fill=\"#f0f9ff\" stroke=\"#0e7490\" stroke-width=\"1\"/>\n  <text x=\"452\" y=\"21\" font-size=\"9\" font-weight=\"700\" fill=\"#0e7490\">IF ATILARAK DEVRİK KOŞUL (INVERSION)</text>\n  <line x1=\"448\" y1=\"26\" x2=\"706\" y2=\"26\" stroke=\"#bae6fd\" stroke-width=\"0.8\"/>\n\n  <text x=\"452\" y=\"45\" font-size=\"8.1\" font-weight=\"700\" fill=\"#0f2438\">Type 1:</text>\n  <text x=\"498\" y=\"45\" font-size=\"8.1\" fill=\"#1e293b\">Should + S + V1  (olasılık koşulu)</text>\n\n  <text x=\"452\" y=\"66\" font-size=\"8.1\" font-weight=\"700\" fill=\"#0f2438\">Type 2:</text>\n  <text x=\"498\" y=\"66\" font-size=\"8.1\" fill=\"#1e293b\">Were + S + (to V1 / NP / it not for)</text>\n\n  <text x=\"452\" y=\"87\" font-size=\"8.1\" font-weight=\"700\" fill=\"#0f2438\">Type 3:</text>\n  <text x=\"498\" y=\"87\" font-size=\"8.1\" fill=\"#1e293b\">Had + S + V3  /  Had it not been for</text>\n\n  <rect x=\"450\" y=\"99\" width=\"254\" height=\"31\" rx=\"2\" fill=\"#fffafa\" stroke=\"#fecdd3\" stroke-width=\"0.9\"/>\n  <text x=\"577\" y=\"112\" text-anchor=\"middle\" font-size=\"7.9\" font-weight=\"700\" fill=\"#9f1239\">CRITICAL: Only if + SVO → ANA CÜMLE devrik!</text>\n  <text x=\"577\" y=\"124\" text-anchor=\"middle\" font-size=\"7.6\" fill=\"#334155\">Provided that / As long as / Unless devrik YAPMAZ</text>\n</svg><div class=\"svg-cap\">Şema 1.2 — Koşul Matrisi, Zaman Karışımları (Mixed) ve Devrik Koşul Kuralları</div></div><div class=\"table-scroll\"><table><thead><tr><th style=\"width:27%\">Yapı</th><th style=\"width:22%\">Anlam</th><th style=\"width:51%\">Sınav Kuralı ve Ayrım</th></tr></thead><tbody><tr><td><span class='en'>Unless</span></td><td>= <span class='en'>if ... not</span> (-medikçe)</td><td>Yan cümle <b>olumsuz yapılmaz</b>; ana cümlede çoğunlukla uyarma/olumsuz sonuç olur (<span class='en'>unless the task is involving...</span>).</td></tr><tr><td><span class='en'>Only if</span></td><td>ancak ... koşuluyla</td><td>Cümle <b>başında</b> ise <b>ana cümle devrik olur</b> (<span class='en'>Only if X are explained CAN a complete understanding be obtained</span>).</td></tr><tr><td><span class='en'>Provided / As long as / On condition that</span></td><td>-mesi şartıyla / sürece</td><td>Yüksek sınav frekansı; başa gelse bile <b>asla devrik yapmaz</b>.</td></tr><tr><td><span class='en'>Even if</span></td><td>-sa bile</td><td>Koşul görünümlü zıtlık kurar; koşul gerçekleşse/gerçekleşmese de ana yargı değişmez.</td></tr><tr><td><span class='en'>In case</span> vs <span class='en'>So that</span></td><td>önlem / ihtimal vs amaç</td><td><span class='en'>in case</span> (olur diye tedbir: <span class='en'>V1 / V2 / should</span>); <span class='en'>so that</span> (-ebilsin diye amaç: <span class='en'>can / could / may / might</span>).</td></tr><tr><td><span class='en'>Without / But for</span> (+ NP)</td><td>olmasa / olmasaydı</td><td>Arkasına isim öbeği alır; ana cümlede <span class='en'>would V1</span> (Type 2) veya <span class='en'>would have V3</span> (Type 3) ister.</td></tr><tr><td><span class='en'>If it weren't / hadn't been for</span></td><td>olmasa / olmasaydı</td><td>Devrik halleri: <span class='en'>Were it not for + NP</span> / <span class='en'>Had it not been for + NP</span>.</td></tr><tr><td><span class='en'>If we are to + V1</span></td><td>eğer ... yapmak istiyorsak</td><td>Amaç/hedef bildirir; ana cümlede <span class='en'>must / should / have to</span> ister.</td></tr><tr><td><span class='en'>Wish / If only</span> · <span class='en'>As if / As though</span></td><td>keşke · sanki ...-miş gibi</td><td><span class='en'>Wish</span>: şimdi için <span class='en'>V2/were</span>, geçmiş için <span class='en'>had V3</span>, şikayet için <span class='en'>would</span>. <span class='en'>As if</span>: gerçekdışı/varsayım → <span class='en'>V2/were</span> (<span class='en'>appear as if they were moving</span>).</td></tr></tbody></table></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-1-3\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">1.4</span>Fiilimsiler (Gerund/Infinitive) ve Kısaltmalar</h2><div class=\"svg-wrap\"><svg viewBox=\"0 0 720 156\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, Calibri, sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"156\" fill=\"#ffffff\"/>\n  <!-- Step 1 -->\n  <rect x=\"8\" y=\"10\" width=\"166\" height=\"58\" rx=\"3\" fill=\"#0f2438\"/>\n  <text x=\"91\" y=\"27\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"#ffffff\">1. ADIM: ORTAK ÖZNE</text>\n  <text x=\"91\" y=\"42\" text-anchor=\"middle\" font-size=\"7.9\" fill=\"#e2e8f0\">Boşluktaki fiili yapan mı,</text>\n  <text x=\"91\" y=\"55\" text-anchor=\"middle\" font-size=\"7.9\" fill=\"#e2e8f0\">yoksa etkilenen nesne mi?</text>\n\n  <line x1=\"174\" y1=\"39\" x2=\"196\" y2=\"39\" stroke=\"#0f2438\" stroke-width=\"1.5\"/>\n  <polygon points=\"196,35 203,39 196,43\" fill=\"#0f2438\"/>\n\n  <!-- Step 2 -->\n  <rect x=\"204\" y=\"10\" width=\"176\" height=\"58\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#0f2438\" stroke-width=\"1.1\"/>\n  <text x=\"292\" y=\"27\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"#0f2438\">2. ADIM: SAĞDA NESNE?</text>\n  <text x=\"292\" y=\"42\" text-anchor=\"middle\" font-size=\"7.9\" fill=\"#334155\">İsim öbeği var (by hariç) → AKTİF</text>\n  <text x=\"292\" y=\"55\" text-anchor=\"middle\" font-size=\"7.9\" fill=\"#334155\">Edat / by / virgül var → PASİF</text>\n\n  <!-- Branches to Step 3 -->\n  <line x1=\"380\" y1=\"25\" x2=\"414\" y2=\"25\" stroke=\"#0e7490\" stroke-width=\"1.4\"/>\n  <polygon points=\"414,21 421,25 414,29\" fill=\"#0e7490\"/>\n  <line x1=\"380\" y1=\"53\" x2=\"414\" y2=\"95\" stroke=\"#9f1239\" stroke-width=\"1.4\"/>\n  <polygon points=\"412,90 420,97 410,97\" fill=\"#9f1239\"/>\n\n  <!-- Active Outcomes -->\n  <rect x=\"422\" y=\"8\" width=\"290\" height=\"66\" rx=\"3\" fill=\"#f0f9ff\" stroke=\"#0e7490\" stroke-width=\"1\"/>\n  <text x=\"432\" y=\"23\" font-size=\"8.6\" font-weight=\"700\" fill=\"#0e7490\">AKTİF KISALTMA SEÇİMİ</text>\n  <text x=\"432\" y=\"38\" font-size=\"8\" fill=\"#0f2438\">• Eşzamanlı / Genel / İsim arkası:  V-ing</text>\n  <text x=\"432\" y=\"51\" font-size=\"8\" fill=\"#0f2438\">• Ana fiilden ÖNCE bitmişse:  Having V3</text>\n  <text x=\"432\" y=\"64\" font-size=\"8\" fill=\"#0f2438\">• Amaç / First-Only-Best sonrası:  to V1</text>\n\n  <!-- Passive Outcomes -->\n  <rect x=\"422\" y=\"82\" width=\"290\" height=\"66\" rx=\"3\" fill=\"#fffafa\" stroke=\"#9f1239\" stroke-width=\"1\"/>\n  <text x=\"432\" y=\"97\" font-size=\"8.6\" font-weight=\"700\" fill=\"#9f1239\">PASİF KISALTMA SEÇİMİ</text>\n  <text x=\"432\" y=\"112\" font-size=\"8\" fill=\"#0f2438\">• Eşzamanlı / İsim arkası:  V3 (veya Being V3)</text>\n  <text x=\"432\" y=\"125\" font-size=\"8\" fill=\"#0f2438\">• Ana fiilden ÖNCE bitmişse:  Having been V3</text>\n  <text x=\"432\" y=\"138\" font-size=\"8\" fill=\"#0f2438\">• Amaç / Sıfat / First sonrası:  to be V3</text>\n\n  <!-- Bottom Trap Alert Box -->\n  <rect x=\"8\" y=\"82\" width=\"372\" height=\"66\" rx=\"3\" fill=\"#fffdf5\" stroke=\"#fde68a\" stroke-width=\"1\"/>\n  <text x=\"18\" y=\"98\" font-size=\"8.4\" font-weight=\"700\" fill=\"#92400e\">KESİN YDS ELEME KİLİTLERİ</text>\n  <text x=\"18\" y=\"113\" font-size=\"7.9\" fill=\"#1e293b\">1. Cümle başında amaç için \"To have V3\" KULLANILMAZ (Having V3 seç).</text>\n  <text x=\"18\" y=\"126\" font-size=\"7.9\" fill=\"#1e293b\">2. \"are said / believed / known\" sonrası ASLA V-ing gelmez (\"to...\" gelir).</text>\n  <text x=\"18\" y=\"139\" font-size=\"7.9\" fill=\"#1e293b\">3. \"date back / stem from / consist of / belong to\" pasif (V3) OLMAZ.</text>\n</svg><div class=\"svg-cap\">Şema 1.3 — Fiilimsi ve Sıfat Cümlesi Kısaltmalarında 3 Adımlı Çatı–Zaman Karar Ağacı</div></div>\n    <div class=\"grid-3\">\n      <div class=\"rule-card\">\n        <h4><span class='en'>to + V-ing</span> İstisnaları (Edat Olan <span class='en'>to</span>)</h4>\n        <ul class=\"en-list\">\n          <li><b>Fiiller:</b> look forward to · object to · resort to · contribute to · lead to · adapt/adjust to</li>\n          <li><b>Edat Öbekleri:</b> prior to · in addition to · with a view to · when it comes to</li>\n          <li><b>Sıfatlar (+ be):</b> accustomed/used to · committed/dedicated/devoted to · prone/liable/vulnerable/susceptible/subject to</li>\n        </ul>\n      </div>\n      <div class=\"rule-card\">\n        <h4>Zorunlu <span class='en'>to V1</span> (Infinitive) Tetikleyicileri</h4>\n        <ul>\n          <li><b>Pasif sonrası:</b> <span class='en'>is believed to have V3 / was made to V1</span></li>\n          <li><b>Sıfat sonrası:</b> <span class='en'>hard to solve · easy to miss</span></li>\n          <li><b>Soyut isim sonrası:</b> <span class='en'>ability, attempt, effort, tendency, right, decision, chance + to V1</span></li>\n          <li><b>Sıra / Teklik / Süperlatif:</b> <span class='en'>the first / second / last / only / best + N + to V1 / to be V3</span></li>\n          <li><b>Amaç:</b> <span class='en'>to / in order to / so as to + V1</span> (<span class='err'>to Ving OLMAZ</span>)</li>\n          <li><b>Derece:</b> <span class='en'>too adj to V1</span> · <span class='en'>adj enough to V1</span></li>\n        </ul>\n      </div>\n      <div class=\"rule-card\">\n        <h4>Zorunlu <span class='en'>V-ing</span> &amp; Geçişsiz İstisnalar</h4>\n        <ul>\n          <li><b>Tüm Edatlar sonrası:</b> <span class='en'>by, for, upon, without, in, despite, instead of + V-ing</span></li>\n          <li><b>Özel Fiiller:</b> <span class='en'>end up + V-ing, spend/waste + time + V-ing, acknowledge, avoid, consider, deny, enjoy, facilitate, miss, necessitate, postpone, prevent, recall, recommend, resist, risk, suggest</span></li>\n          <li><b>Durum Fiilleri Pasif (V3) OLMAZ:</b> <span class='en'>consisting of, dating back to, stemming from, resulting from, belonging to, lacking, existing</span></li>\n          <li><b>Anlam Farkı:</b> <span class='en'>remember/forget/stop/try/regret + to V1</span> (gelecek/amaç/denemek) vs <span class='en'>V-ing</span> (geçmiş anı/bırakmak/yöntem denemek).</li>\n        </ul>\n      </div>\n    </div>\n    <div class=\"worked\"><div class=\"worked-hdr\"><span>Çözümlü Örnek · Tam Tanı M2 #5, #10 &amp; Telafi M1 #3</span><span>Gerund/Infinitive ve Ortak Özne Önceliği</span></div><div class=\"worked-stem\">1) By 2.5 million years ago, when they <b>began</b> ---- stone tools, early humans had understood that they ---- the natural world.<br>2) ---- <b>the application of radioactive decay to dating rocks</b>, British geologist Arthur Holmes ---- throughout the 1920s...<br>3) ---- <b>the types of individuals it seeks to attract</b>, an organization ---- to consider what methods to use.</div><div class=\"worked-row\"><span class='ok'>[+] 1. Doğru (making / could alter):</span> <span class='en'>begin</span> eşzamanlı eylemle <span class='en'>to V1 / V-ing</span> alır (<span class='err'>to have made</span> öncelik kurar); genel yeti <span class='en'>could alter</span>'dır.</div><div class=\"worked-row\"><span class='ok'>[+] 2. Doğru (Having pioneered / worked):</span> Sağda nesne var (aktif!). Başta öncelik için <span class='err'>To have V3</span> kullanılmaz → <span class='en'>Having pioneered</span>. <span class='en'>throughout the 1920s</span> kapalı dönem = <span class='en'>worked</span>.</div><div class=\"worked-row\"><span class='ok'>[+] 3. Doğru (Having established / needs):</span> Virgülden sonraki özne (<span class='en'>an organization</span>) türleri belirleyen faildir (aktif, önce biten) + genel gereklilik <span class='en'>needs</span>.</div></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-1-4\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">1.5</span>İlgi ve İsim Cümlecikleri, Devrik Yapılar ve Miktar/Kıyas</h2><div class=\"svg-wrap\"><svg viewBox=\"0 0 720 148\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, Calibri, sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"148\" fill=\"#ffffff\"/>\n  <!-- Root -->\n  <rect x=\"10\" y=\"42\" width=\"144\" height=\"62\" rx=\"3\" fill=\"#0f2438\"/>\n  <text x=\"82\" y=\"61\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"#ffffff\">BOŞLUKTAN HEMEN ÖNCE</text>\n  <text x=\"82\" y=\"75\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#e2e8f0\">Nitelenecek bir İSİM</text>\n  <text x=\"82\" y=\"89\" text-anchor=\"middle\" font-size=\"8.5\" fill=\"#e2e8f0\">(Noun Phrase) var mı?</text>\n\n  <!-- Upper Branch: YES -> Relative Clause -->\n  <line x1=\"154\" y1=\"56\" x2=\"196\" y2=\"34\" stroke=\"#0e7490\" stroke-width=\"1.5\"/>\n  <text x=\"166\" y=\"38\" font-size=\"7.8\" font-weight=\"700\" fill=\"#0e7490\">EVET</text>\n  <rect x=\"196\" y=\"8\" width=\"142\" height=\"54\" rx=\"3\" fill=\"#f0f9ff\" stroke=\"#0e7490\" stroke-width=\"1\"/>\n  <text x=\"267\" y=\"23\" text-anchor=\"middle\" font-size=\"8.6\" font-weight=\"700\" fill=\"#0e7490\">RELATIVE CLAUSE</text>\n  <text x=\"267\" y=\"36\" text-anchor=\"middle\" font-size=\"7.7\" fill=\"#334155\">Boşluğun SAĞINDA</text>\n  <text x=\"267\" y=\"49\" text-anchor=\"middle\" font-size=\"7.7\" font-weight=\"700\" fill=\"#0f2438\">Özne/Nesne tam mı?</text>\n\n  <line x1=\"338\" y1=\"22\" x2=\"366\" y2=\"20\" stroke=\"#0e7490\" stroke-width=\"1.2\"/>\n  <rect x=\"366\" y=\"6\" width=\"346\" height=\"31\" rx=\"2\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n  <text x=\"374\" y=\"19\" font-size=\"7.7\" fill=\"#1e293b\"><tspan font-weight=\"700\" fill=\"#0f2438\">TAM CÜMLE (SVO):</tspan> where · when · why · whereby · in/on/by+which</text>\n  <text x=\"374\" y=\"31\" font-size=\"7.3\" fill=\"#0e7490\">Örnek: regulations whereby goods could be controlled · whose + isim</text>\n\n  <line x1=\"338\" y1=\"48\" x2=\"366\" y2=\"52\" stroke=\"#0e7490\" stroke-width=\"1.2\"/>\n  <rect x=\"366\" y=\"40\" width=\"346\" height=\"30\" rx=\"2\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n  <text x=\"374\" y=\"53\" font-size=\"7.7\" fill=\"#1e293b\"><tspan font-weight=\"700\" fill=\"#0f2438\">EKSİK ÖGE (S/O):</tspan> which · who · whom · that (virgül sonrası that YOK)</text>\n  <text x=\"374\" y=\"64\" font-size=\"7.3\" fill=\"#9f1239\">Uyarı: İsim arkasına ASLA \"what\" gelmez! (the thing what X → that/which)</text>\n\n  <!-- Lower Branch: NO -> Noun Clause -->\n  <line x1=\"154\" y1=\"90\" x2=\"196\" y2=\"110\" stroke=\"#92400e\" stroke-width=\"1.5\"/>\n  <text x=\"163\" y=\"112\" font-size=\"7.8\" font-weight=\"700\" fill=\"#92400e\">HAYIR</text>\n  <rect x=\"196\" y=\"82\" width=\"142\" height=\"58\" rx=\"3\" fill=\"#fffdf5\" stroke=\"#d97706\" stroke-width=\"1\"/>\n  <text x=\"267\" y=\"98\" text-anchor=\"middle\" font-size=\"8.6\" font-weight=\"700\" fill=\"#92400e\">NOUN CLAUSE</text>\n  <text x=\"267\" y=\"111\" text-anchor=\"middle\" font-size=\"7.7\" fill=\"#334155\">Fiil / Sıfat / Edat sonrası</text>\n  <text x=\"267\" y=\"124\" text-anchor=\"middle\" font-size=\"7.7\" fill=\"#334155\">veya cümle başında Özne</text>\n\n  <line x1=\"338\" y1=\"110\" x2=\"366\" y2=\"110\" stroke=\"#92400e\" stroke-width=\"1.2\"/>\n  <rect x=\"366\" y=\"77\" width=\"346\" height=\"65\" rx=\"2\" fill=\"#fffdf5\" stroke=\"#fde68a\"/>\n  <text x=\"374\" y=\"91\" font-size=\"7.7\" fill=\"#1e293b\"><tspan font-weight=\"700\" fill=\"#0f2438\">• Olgu / Belirsizlik:</tspan> that · the fact that (edat/baş) · whether (if başa gelmez)</text>\n  <text x=\"374\" y=\"106\" font-size=\"7.7\" fill=\"#1e293b\"><tspan font-weight=\"700\" fill=\"#0f2438\">• Eksik Özne/Nesne:</tspan> what (= the thing which) · whatever · whoever</text>\n  <text x=\"374\" y=\"121\" font-size=\"7.7\" fill=\"#1e293b\"><tspan font-weight=\"700\" fill=\"#0f2438\">• Soru / Derece:</tspan> how + adj/adv + SVO (\"reveal how well Orwell understood\")</text>\n  <text x=\"374\" y=\"135\" font-size=\"7.3\" font-weight=\"700\" fill=\"#9f1239\">İstisna: Soyut isim + SVO açıklıyorsa (\"the claim that...\") appositive THAT tam alır.</text>\n</svg><div class=\"svg-cap\">Şema 1.4 — İlgi Cümlecikleri (Relative) ile İsim Cümleciklerini (Noun Clause) Ayırma Ağacı</div></div><div class=\"table-scroll\"><table><thead><tr><th style=\"width:25%\">Cümlecik Yapısı</th><th style=\"width:20%\">Tamlık / Konum</th><th style=\"width:55%\">Ayırt Edici YDS Kuralı</th></tr></thead><tbody><tr><td><b><span class='en'>whereby</span> (= by which)</b></td><td>Tam cümle (SVO) alır</td><td>Yöntem, yasa, düzenleme, sistem niteler (<span class='en'>regulations whereby goods could be controlled</span>). Edatsız <span class='err'>which</span> gelemez.</td></tr><tr><td><b>Zaman/Yer <span class='en'>which</span> vs <span class='en'>when/where</span></b></td><td>Eksik (SV/VO) vs Tam (SVO)</td><td><span class='en'>the day which Americans celebrate</span> (neyi? nesne eksik) vs <span class='en'>the day when/on which Americans celebrate their independence</span> (tam cümle).</td></tr><tr><td><b><span class='en'>prep + which/whom/whose+N</span></b></td><td>Tam cümle alır</td><td><span class='en'>the platform on which, the reason why/for which</span>. Edat sonrası asla <span class='err'>that</span> veya <span class='err'>who</span> gelmez.</td></tr><tr><td><b>Miktar + <span class='en'>of + whom/which</span></b></td><td>Virgül sonrası</td><td><span class='en'>30 modular units, each of which is equipped...</span> veya <span class='en'>of which most are...</span></td></tr><tr><td><b>Cümle Niteleyen <span class='en'>, which</span></b></td><td>Virgül sonrası</td><td>Tüm cümleyi niteler (<span class='en'>She failed, which surprised us</span>). Bu konumda <span class='err'>what / that</span> kullanılamaz.</td></tr><tr><td><b><span class='en'>how + adj/adv + SVO</span></b></td><td>Noun Clause</td><td><span class='en'>reveal how well Orwell understood...</span> (<span class='err'>so well</span> bağlaç değildir, fiili cümleye bağlayamaz).</td></tr><tr><td><b><span class='en'>whether</span> vs <span class='en'>if</span></b></td><td>Noun Clause</td><td>Belirsizlik/seçenek bildirir; <b>cümle başında, edat sonrasında ve <span class='en'>or not</span> bitişiğinde yalnız <span class='en'>whether</span></b> kullanılır.</td></tr></tbody></table></div><div class=\"table-scroll\"><table><thead><tr><th style=\"width:23%\">Devrik / Miktar Başlığı</th><th style=\"width:38%\">Kalıp ve Öğeler</th><th style=\"width:39%\">Kritik Sınav Ayrımı</th></tr></thead><tbody><tr><td><b>Gecikmeli Devrik (Ana Cümle Devrik!)</b></td><td><span class='en'>Only if / Only when / Only after / Only by / Only in / Not until + [yan cümle/öbek] + <b>Aux + S + V</b></span></td><td><span class='en'>Only if the links are explained <b>can a complete understanding be obtained</b>.</span> (<span class='err'>Provided that</span> başa gelince devrik yapmaz!)</td></tr><tr><td><b>Anında Devrik (Negatif Zarf Başta)</b></td><td><span class='en'>Never, Rarely, Seldom, Little, Hardly/Scarcely...when, No sooner...than, Not only...but also, Under no circumstances, At no time</span></td><td><span class='en'>No sooner <b>had I opened</b> the door than...</span> · <span class='en'>Under no circumstances <b>will he accept</b>...</span></td></tr><tr><td><b>Derece &amp; Kıyas Devriği</b></td><td><span class='en'>So + adj/adv + aux + S ... that</span> · <span class='en'>Such + be + S + that</span> · <span class='en'>as/than + aux + S</span></td><td><span class='en'>So rapid was the shift that...</span> · <span class='en'>Cities need water, as <b>do</b> rural areas.</span></td></tr><tr><td><b>Sayılabilir Tekil / Çoğul Uyumu</b></td><td>Tekil: <span class='en'>each, every, either, neither, another</span> · Çoğul: <span class='en'>few/a few, many, several, both, other+N</span></td><td><span class='err'>each women</span> HATA (<span class='en'>each woman</span>); <span class='en'>few women</span> (yok denecek az, olumsuz vurgu). <span class='en'>a number of</span> + <b>çoğul V</b> vs <span class='en'>the number of</span> + <b>tekil V</b>.</td></tr><tr><td><b>Sayılamayan &amp; Ortak Miktar</b></td><td><span class='en'>little/a little, much, a great deal/amount of</span> · Ortak: <span class='en'>some, any, most, all, none of, plenty of</span></td><td><span class='en'>none of + çoğul/sayılamayan</span>; <span class='en'>neither of + çoğul N + tekil/çoğul V</span> (akademik yazımda tekil öncelikli).</td></tr><tr><td><b>Karşılaştırma &amp; Derece Kalıpları</b></td><td><span class='en'>much / far / a lot / even / still / rather + comparative</span> · <span class='en'>by far + superlative</span> · <span class='en'>such+adj+N+that / as</span></td><td><span class='err'>*more better / *more faster</span> HATA. Doğrusu: <span class='en'>much better than</span>, <span class='en'>the more..., the more...</span>, <span class='en'>the former / the latter</span>, <span class='en'>such costs as travel</span>.</td></tr></tbody></table></div><div class=\"worked\"><div class=\"worked-hdr\"><span>Çözümlü Örnek · Tam Tanı M2 #13, #16 &amp; #18</span><span>Cümlecik Sınırı ve Devrik Yapı Kilidi</span></div><div class=\"worked-stem\">1) The governments of the EU passed new <b>regulations</b> ---- goods purchased from various countries <b>could be taken under control</b>.<br>2) His <i>Collected Essays</i> continues to <b>reveal</b> ---- George Orwell understood the basic conflicts of the modern world.<br>3) ---- the connections between biological and social approaches are explained in detail <b>can a complete understanding be obtained</b>.</div><div class=\"worked-row\"><span class='ok'>[+] 1. (whereby):</span> Sağdaki pasif cümlede özne (<span class='en'>goods</span>) ve tümleç eksiksiz (SVO); edatsız <span class='err'>which</span> tam cümleye bağlanamaz (<span class='en'>whereby = by which</span>).</div><div class=\"worked-row\"><span class='ok'>[+] 2. (how well):</span> <span class='en'>reveal</span> geçişli fiilinden sonra tam cümle bağlayacak Noun Clause öğesi gerekir; <span class='err'>so well</span> bağlaç değildir.</div><div class=\"worked-row\"><span class='ok'>[+] 3. (Only if):</span> Ana cümledeki <span class='en'>can a complete understanding be obtained</span> soru sırasıyla devriktir; bunu cümle başından tetikleyen tek koşul <span class='en'>Only if</span>'tir (<span class='err'>Provided that</span> devrik yapmaz).</div></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-1-5\"></div>", "searchText": "BÖLÜM 1 · GÜN 1 Test Atölyesi: Modül 1 (20 Soru · 22 dk) Akademik Sözdizim, Fiil Sistemi ve Cümlecikler Zaman uyumları, kipler, edilgen aktarma, koşul/devrik yapılar, fiilimsiler, ilgi-isim cümlecikleri ve miktar sistematiği. 1.1 Zamanlar, Zaman Uyumu ve Zaman Zarfları Şema 1.1 — YDS Zaman Eksenleri, \"By + Tarih\" Çift Yönlü Aynası ve Yan Cümle Kısıtı Zaman Kesin Tetikleyici Zarflar Sınav Mekaniği ve Kısıtlar Simple Present (V1/s) always, generally, nowadays, date/trace back to, recent studies show Genel gerçek, bilimsel kanun, tarihsel köken ( Writing dates back to Sumerians ). Simple Past (V2) ago, in 1964, in the 20th c., until recently, last ice age, from 1939 to 1945, at that time, originate/emerge Şimdiyle bağı kopmuş kapalı geçmiş. Until recently (= eskiden) kesinlikle V2 alır. Present Perfect (have/has V3) FIDOW ( for / in / during / over / within + the last / past X ), so far, to date, up to now, recently, lately, (ever) since + V2 Geçmişte başlayıp bugüne dayanan süreç/etki. Kapalı tarih ( ago / 20th c. ) varsa ELENİR. Past Perfect (had V3) by + geçmiş tarih (by 1960s), decades earlier, before + V2, after + had V3, It wasn't until ... that Referans bir V2 olayından/tarihinden daha önce tamamlanmış eylem. Tek başına geçmiş yoksa kullanılmaz. Future Perfect (will have V3) by + gelecek tarih (by 2050, by the end of this fiscal year), by the time + V1 Gelecekteki belirli bir eşiğe gelindiğinde tamamlanmış olacak eylem. Future in the Past (would V1) claimed/predicted/was hoped that ... (past ana fiil) Geçmiş bakış açısından gelecek ( They knew it would fail ). Koşulsuz tahmin aktarımında kullanılır. Zaman Uyumu Kuralları ve 4 İstisna 1. Temel Kural: Ana cümle ve yan cümle aynı zaman yarımküresinde kalır (Present ↔ Present/Future/Present Perfect; Past ↔ Past/Past Perfect/would V1). 2. Zaman Bağlacı Kilidi: when, while, as, before, after, until, as soon as, once, by the time içine will / would / be going to gelmez ( Once you have found a fossil... ). 3. İstisnalar (Uyum Bozabilir): (a) Evrensel gerçek / bilimsel yasa ( Galileo proved that the Earth orbits... ), (b) Since + V2, have/has V3 , (c) Zıtlık/Sıfat cümleciği ( Although invented in 1920, radar is still used... ), (d) Recent studies hem V1 hem have V3 alabilir. Çözümlü Örnek · Telafi M1 #1 & #2 Zaman Aynası ve By + Tarih 1) The physics of elementary particles in the 20th century ---- by the observation of particles whose existence ---- by theorists decades earlier . 2) A social networking site says if everything ---- as planned, they ---- a new messaging service by the end of 2020 . [+] 1. Doğru (was distinguished / had been predicted): in the 20th century kapalı geçmişi → Simple Past ( was distinguished ). decades earlier ise bu gözlemden on yıllar öncesini gösterdiği için Past Perfect ( had been predicted ) zorunludur. [-] Tuzak: has been distinguished kapalı yüzyıl zarfıyla elenir. [+] 2. Doğru (goes / will have started): if yan cümlesinde geniş zaman ( goes ), ana cümlede by the end of 2020 hedef eşiği nedeniyle Future Perfect ( will have started ) gelir ( had spent / had gone geçmiş eşiğe aittir). 1.2 Kipler (Modals), Edilgen Aktarma ve Ettirgen Yapılar Kip İşlevi Formül YDS Karar Kuralı ve Tuzaklar Olasılık (Şimdi/Gelecek) may / might / could + V1 could yalnız geçmiş yetenek değildir; gelecek/genel olasılıkta may/might eşdeğeridir ( Temperature rise could endanger... ). Olasılık (Geçmiş Tahmin) may / might / could have V3 Geçmişte olmuş olabilir ama kesin değil. Kuvvetli Çıkarım must V1 / must have V3 Olumsuz mantıksal imkânsızlık mustn't değil can't / couldn't have V3 'tür. Gereklilik & Tavsiye should / ought to / must / have to V1 Geçmişte mecbur kalıp yaptı → had to V1 ( must 'ın geçmişi yoktur). Güncel uyarı → should V1 . Gerçekleşmemiş Geçmiş should have V3 · could have V3 · would have V3 Yapmalıydı (yapmadı) · Yapabilirdi (yapmadı) · Type 3 şartı sağlanmadığı için olurdu (olmadı). Gereksizlik Ayrımı didn't need to V1 vs needn't have V3 didn't need to : gerek yoktu (ve yapmadı). needn't have V3 : gerek yoktu AMA boşuna yaptı. Geçmiş Alışkanlık used to V1 vs would V1 İkisi de geçmiş alışkanlık anlatır; ancak be/have/know/live gibi durum fiilleriyle yalnız used to kullanılır. Edilgen Aktarma (is said / believed / known / thought / estimated / expected) Zorunlu Mastar Örnek Cümle ve Zaman İlişkisi Eşzamanlı Etken (Genel / Süreç) to V1 / to be V-ing He is said to know several languages. / Social workers were thought to be doing well. Eşzamanlı Edilgen to be V3 Harrie is known to be treated badly. Ana Fiilden ÖNCE Etken to have V3 Kathy is known to have killed her husband. (bilme şimdi, öldürme daha önce) Ana Fiilden ÖNCE Edilgen to have been V3 Grey cats are said to have been brought to Europe during the Crusades. Verb + Object + Fiil Dizilimi ve Ettirgenler Varsayılan ( to V1 / to be V3 ): allow, enable, cause, force, compel, persuade, expect, remind, warn ( allowed them to feel... ). Pasifte daima to V1 gelir ( I was made to carry... ). 5 Yalın Fiil ( + obj + V1 ): have, make, let, help (to/Ø), see/hear (eylemin tamamı). + obj + V-ing : catch, find, spend, waste, see/hear (anlık parça: was caught stealing ; ancak find = tespit etmek ise is found to V1 !). Ettirgen ( Causative ): have/get + [nesne] + V3 ( got her tooth pulled ); have + [kişi] + V1 vs get + [kişi] + to V1 . have V3 Mıknatıs Tuzağı & Çift Çatılı Fiiller Kural 1: Pasif aktarma ( are said / believed ) ardından having been V3 / being V3 asla gelmez; doğrudan to 'ya kilitle! Kural 2: Geçmiş bağlamda genel yetenek/olasılık varsa would have V3 değil could V1 seç ( held that only a live virus could prompt... ). Kural 3: Tarihsel anlatıda güncel uyarı veya genel öneri varsa ( in the recent past ... before taking again ) has had / should let seç; might have V3 geçmişte kalır. Ergatif (Çift Çatılı) Fiiller: open, close, develop, grow, sell, start, finish, increase nesnesiz etken görünümde pasif anlam verebilir ( The book sold well ). Çözümlü Örnek · Tam Tanı M2 #8 & Telafi M1 #4 Pasif Aktarma ve Zaman Uyumu 1) Grey cats are said ---- to Europe from Syria during the Crusades, and by the 18th century , one of these cats ---- well-established. 2) The discovery that the Universe ---- at an accelerating rate ---- two rival teams of scientists a Nobel Prize in Physics. [+] 1. Doğru (to have been brought / had become): Aktarma pasifi ( are said ) asla having been almaz ( to şart!). Getirilme Haçlı Seferleri'nde, yani söylenmeden önce ve edilgen olduğu için to have been brought ; by the 18th century kapalı sınırı da had become gerektirir. [+] 2. Doğru (is expanding / has earned): Evrenin genişlemesi süregelen güncel olgu ( is expanding ); keşfin Nobel kazandırması da bugüne uzanan güncel sonuçtur ( has earned ). 1.3 Koşul Cümleleri, Mixed Types, Devrik ve Gizli Koşullar Şema 1.2 — Koşul Matrisi, Zaman Karışımları (Mixed) ve Devrik Koşul Kuralları Yapı Anlam Sınav Kuralı ve Ayrım Unless = if ... not (-medikçe) Yan cümle olumsuz yapılmaz ; ana cümlede çoğunlukla uyarma/olumsuz sonuç olur ( unless the task is involving... ). Only if ancak ... koşuluyla Cümle başında ise ana cümle devrik olur ( Only if X are explained CAN a complete understanding be obtained ). Provided / As long as / On condition that -mesi şartıyla / sürece Yüksek sınav frekansı; başa gelse bile asla devrik yapmaz . Even if -sa bile Koşul görünümlü zıtlık kurar; koşul gerçekleşse/gerçekleşmese de ana yargı değişmez. In case vs So that önlem / ihtimal vs amaç in case (olur diye tedbir: V1 / V2 / should ); so that (-ebilsin diye amaç: can / could / may / might ). Without / But for (+ NP) olmasa / olmasaydı Arkasına isim öbeği alır; ana cümlede would V1 (Type 2) veya would have V3 (Type 3) ister. If it weren't / hadn't been for olmasa / olmasaydı Devrik halleri: Were it not for + NP / Had it not been for + NP . If we are to + V1 eğer ... yapmak istiyorsak Amaç/hedef bildirir; ana cümlede must / should / have to ister. Wish / If only · As if / As though keşke · sanki ...-miş gibi Wish : şimdi için V2/were , geçmiş için had V3 , şikayet için would . As if : gerçekdışı/varsayım → V2/were ( appear as if they were moving ). 1.4 Fiilimsiler (Gerund/Infinitive) ve Kısaltmalar Şema 1.3 — Fiilimsi ve Sıfat Cümlesi Kısaltmalarında 3 Adımlı Çatı–Zaman Karar Ağacı to + V-ing İstisnaları (Edat Olan to ) Fiiller: look forward to · object to · resort to · contribute to · lead to · adapt/adjust to Edat Öbekleri: prior to · in addition to · with a view to · when it comes to Sıfatlar (+ be): accustomed/used to · committed/dedicated/devoted to · prone/liable/vulnerable/susceptible/subject to Zorunlu to V1 (Infinitive) Tetikleyicileri Pasif sonrası: is believed to have V3 / was made to V1 Sıfat sonrası: hard to solve · easy to miss Soyut isim sonrası: ability, attempt, effort, tendency, right, decision, chance + to V1 Sıra / Teklik / Süperlatif: the first / second / last / only / best + N + to V1 / to be V3 Amaç: to / in order to / so as to + V1 ( to Ving OLMAZ ) Derece: too adj to V1 · adj enough to V1 Zorunlu V-ing & Geçişsiz İstisnalar Tüm Edatlar sonrası: by, for, upon, without, in, despite, instead of + V-ing Özel Fiiller: end up + V-ing, spend/waste + time + V-ing, acknowledge, avoid, consider, deny, enjoy, facilitate, miss, necessitate, postpone, prevent, recall, recommend, resist, risk, suggest Durum Fiilleri Pasif (V3) OLMAZ: consisting of, dating back to, stemming from, resulting from, belonging to, lacking, existing Anlam Farkı: remember/forget/stop/try/regret + to V1 (gelecek/amaç/denemek) vs V-ing (geçmiş anı/bırakmak/yöntem denemek). Çözümlü Örnek · Tam Tanı M2 #5, #10 & Telafi M1 #3 Gerund/Infinitive ve Ortak Özne Önceliği 1) By 2.5 million years ago, when they began ---- stone tools, early humans had understood that they ---- the natural world. 2) ---- the application of radioactive decay to dating rocks , British geologist Arthur Holmes ---- throughout the 1920s... 3) ---- the types of individuals it seeks to attract , an organization ---- to consider what methods to use. [+] 1. Doğru (making / could alter): begin eşzamanlı eylemle to V1 / V-ing alır ( to have made öncelik kurar); genel yeti could alter 'dır. [+] 2. Doğru (Having pioneered / worked): Sağda nesne var (aktif!). Başta öncelik için To have V3 kullanılmaz → Having pioneered . throughout the 1920s kapalı dönem = worked . [+] 3. Doğru (Having established / needs): Virgülden sonraki özne ( an organization ) türleri belirleyen faildir (aktif, önce biten) + genel gereklilik needs . 1.5 İlgi ve İsim Cümlecikleri, Devrik Yapılar ve Miktar/Kıyas Şema 1.4 — İlgi Cümlecikleri (Relative) ile İsim Cümleciklerini (Noun Clause) Ayırma Ağacı Cümlecik Yapısı Tamlık / Konum Ayırt Edici YDS Kuralı whereby (= by which) Tam cümle (SVO) alır Yöntem, yasa, düzenleme, sistem niteler ( regulations whereby goods could be controlled ). Edatsız which gelemez. Zaman/Yer which vs when/where Eksik (SV/VO) vs Tam (SVO) the day which Americans celebrate (neyi? nesne eksik) vs the day when/on which Americans celebrate their independence (tam cümle). prep + which/whom/whose+N Tam cümle alır the platform on which, the reason why/for which . Edat sonrası asla that veya who gelmez. Miktar + of + whom/which Virgül sonrası 30 modular units, each of which is equipped... veya of which most are... Cümle Niteleyen , which Virgül sonrası Tüm cümleyi niteler ( She failed, which surprised us ). Bu konumda what / that kullanılamaz. how + adj/adv + SVO Noun Clause reveal how well Orwell understood... ( so well bağlaç değildir, fiili cümleye bağlayamaz). whether vs if Noun Clause Belirsizlik/seçenek bildirir; cümle başında, edat sonrasında ve or not bitişiğinde yalnız whether kullanılır. Devrik / Miktar Başlığı Kalıp ve Öğeler Kritik Sınav Ayrımı Gecikmeli Devrik (Ana Cümle Devrik!) Only if / Only when / Only after / Only by / Only in / Not until + [yan cümle/öbek] + Aux + S + V Only if the links are explained can a complete understanding be obtained . ( Provided that başa gelince devrik yapmaz!) Anında Devrik (Negatif Zarf Başta) Never, Rarely, Seldom, Little, Hardly/Scarcely...when, No sooner...than, Not only...but also, Under no circumstances, At no time No sooner had I opened the door than... · Under no circumstances will he accept ... Derece & Kıyas Devriği So + adj/adv + aux + S ... that · Such + be + S + that · as/than + aux + S So rapid was the shift that... · Cities need water, as do rural areas. Sayılabilir Tekil / Çoğul Uyumu Tekil: each, every, either, neither, another · Çoğul: few/a few, many, several, both, other+N each women HATA ( each woman ); few women (yok denecek az, olumsuz vurgu). a number of + çoğul V vs the number of + tekil V . Sayılamayan & Ortak Miktar little/a little, much, a great deal/amount of · Ortak: some, any, most, all, none of, plenty of none of + çoğul/sayılamayan ; neither of + çoğul N + tekil/çoğul V (akademik yazımda tekil öncelikli). Karşılaştırma & Derece Kalıpları much / far / a lot / even / still / rather + comparative · by far + superlative · such+adj+N+that / as *more better / *more faster HATA. Doğrusu: much better than , the more..., the more... , the former / the latter , such costs as travel . Çözümlü Örnek · Tam Tanı M2 #13, #16 & #18 Cümlecik Sınırı ve Devrik Yapı Kilidi 1) The governments of the EU passed new regulations ---- goods purchased from various countries could be taken under control . 2) His Collected Essays continues to reveal ---- George Orwell understood the basic conflicts of the modern world. 3) ---- the connections between biological and social approaches are explained in detail can a complete understanding be obtained . [+] 1. (whereby): Sağdaki pasif cümlede özne ( goods ) ve tümleç eksiksiz (SVO); edatsız which tam cümleye bağlanamaz ( whereby = by which ). [+] 2. (how well): reveal geçişli fiilinden sonra tam cümle bağlayacak Noun Clause öğesi gerekir; so well bağlaç değildir. [+] 3. (Only if): Ana cümledeki can a complete understanding be obtained soru sırasıyla devriktir; bunu cümle başından tetikleyen tek koşul Only if 'tir ( Provided that devrik yapmaz)."}, {"id": "sec-2-baglac-edat", "dayTag": "Bölüm 2 · Gün 2", "title": "Zıtlık Dışı Bağlaçlar, Geçiş İfadeleri ve Edat Sistematiği", "subtitle": "3 sütunlu sözdizim matrisi, kutup testi, ikili kalıplar ve ~100 yüksek frekanslı edat eşdizimi.", "pairedBookId": "yds-telafi-programi-2026", "pairedTestId": "m2-baglac-ve-edat-gri-alani", "estMin": 20, "html": "<div class=\"chapter\"><div class=\"chapter-top\"><span class=\"chapter-tag\">BÖLÜM 2 · GÜN 2</span><span class=\"chapter-mod\">Test Atölyesi: Modül 2 (22 Soru · 20 dk)</span></div><h1>Zıtlık Dışı Bağlaçlar, Geçiş İfadeleri ve Edat Sistematiği</h1><p class=\"chapter-desc\">Zıtlık bağlaçlarında 7/7 sağlandığından kapsam dışı bırakılmıştır. Odak: 3 sütunlu sözdizim matrisi, kutup refleksi ve yüksek frekanslı edat eşdizimleri (1/4 → 3–4/4).</p></div><h2 class=\"sec-head\"><span class=\"sec-num\">2.1</span>Bağlaç Sözdizimi: Üçlü Yapı Matrisi ve Kutup Refleksi</h2><div class=\"svg-wrap\"><svg viewBox=\"0 0 720 120\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, Calibri, sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"120\" fill=\"#ffffff\"/>\n  <!-- Slot 1 -->\n  <rect x=\"8\" y=\"8\" width=\"226\" height=\"104\" rx=\"3\" fill=\"#f0f9ff\" stroke=\"#0e7490\" stroke-width=\"1\"/>\n  <text x=\"121\" y=\"23\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"#0e7490\">1. YAN CÜMLE BAĞLACI (CONJ)</text>\n  <text x=\"121\" y=\"38\" text-anchor=\"middle\" font-size=\"8.2\" font-family=\"Cascadia Mono, Consolas, monospace\" fill=\"#0f2438\">[Bağlaç + S + V] , [S + V]</text>\n  <text x=\"121\" y=\"51\" text-anchor=\"middle\" font-size=\"8.2\" font-family=\"Cascadia Mono, Consolas, monospace\" fill=\"#0f2438\">[S + V] + [Bağlaç + S + V]</text>\n  <line x1=\"18\" y1=\"59\" x2=\"224\" y2=\"59\" stroke=\"#bae6fd\" stroke-width=\"0.8\"/>\n  <text x=\"18\" y=\"73\" font-size=\"7.7\" fill=\"#1e293b\">• Tam cümle (çekimli fiil) şarttır.</text>\n  <text x=\"18\" y=\"86\" font-size=\"7.7\" fill=\"#1e293b\">• İçinde \"that\" varsa bu gruptur.</text>\n  <text x=\"18\" y=\"99\" font-size=\"7.5\" fill=\"#9f1239\" font-weight=\"600\">Ör: because, now that, unless, so that</text>\n\n  <!-- Slot 2 -->\n  <rect x=\"247\" y=\"8\" width=\"226\" height=\"104\" rx=\"3\" fill=\"#fffdf5\" stroke=\"#d97706\" stroke-width=\"1\"/>\n  <text x=\"360\" y=\"23\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"#92400e\">2. EDAT ÖBEĞİ (PREP PHRASE)</text>\n  <text x=\"360\" y=\"38\" text-anchor=\"middle\" font-size=\"8.2\" font-family=\"Cascadia Mono, Consolas, monospace\" fill=\"#0f2438\">[Edat + NP / V-ing] , [S + V]</text>\n  <text x=\"360\" y=\"51\" text-anchor=\"middle\" font-size=\"8.2\" font-family=\"Cascadia Mono, Consolas, monospace\" fill=\"#0f2438\">[S + V] + [Edat + NP / V-ing]</text>\n  <line x1=\"257\" y1=\"59\" x2=\"463\" y2=\"59\" stroke=\"#fde68a\" stroke-width=\"0.8\"/>\n  <text x=\"257\" y=\"73\" font-size=\"7.7\" fill=\"#1e293b\">• Sonunda \"to / of / from\" → isim alır.</text>\n  <text x=\"257\" y=\"86\" font-size=\"7.7\" fill=\"#1e293b\">• Cümle için \"+ the fact that\" eklenir.</text>\n  <text x=\"257\" y=\"99\" font-size=\"7.5\" fill=\"#92400e\" font-weight=\"600\">Ör: due to, thanks to, in case of, despite</text>\n\n  <!-- Slot 3 -->\n  <rect x=\"486\" y=\"8\" width=\"226\" height=\"104\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#0f2438\" stroke-width=\"1\"/>\n  <text x=\"599\" y=\"23\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"#0f2438\">3. CÜMLE ZARFI (TRANSITION)</text>\n  <text x=\"599\" y=\"38\" text-anchor=\"middle\" font-size=\"8.2\" font-family=\"Cascadia Mono, Consolas, monospace\" fill=\"#0f2438\">[S+V] . / ;  Zarf ,  [S+V]</text>\n  <text x=\"599\" y=\"51\" text-anchor=\"middle\" font-size=\"8.2\" font-family=\"Cascadia Mono, Consolas, monospace\" fill=\"#0f2438\">[S] , Zarf , [V]</text>\n  <line x1=\"496\" y1=\"59\" x2=\"702\" y2=\"59\" stroke=\"#cbd5e1\" stroke-width=\"0.8\"/>\n  <text x=\"496\" y=\"73\" font-size=\"7.7\" fill=\"#1e293b\">• İki bağımsız cümleyi nokta/; ile bağlar.</text>\n  <text x=\"496\" y=\"86\" font-size=\"7.7\" fill=\"#1e293b\">• Tek başına virgülle 2 cümle bağlayamaz.</text>\n  <text x=\"496\" y=\"99\" font-size=\"7.5\" fill=\"#0f2438\" font-weight=\"600\">Ör: therefore, thus, indeed, moreover</text>\n</svg><div class=\"svg-cap\">Şema 2.1 — Bağlaç Boşluklarında Noktalama ve Sağdaki Öbek Türüne Göre Üçlü Sözdizim Elemesi</div></div><div class=\"table-scroll\"><table><thead><tr><th style=\"width:16%\">Anlam Sınıfı</th><th style=\"width:30%\">1. Yan Cümle Bağlacı (+ SVO)</th><th style=\"width:29%\">2. Edat Öbeği (+ NP / V-ing)</th><th style=\"width:25%\">3. Cümle Zarfı (; zarf, SVO)</th></tr></thead><tbody><tr><td><b>Sebep / Gerekçe</b></td><td><span class='en'>because, since, as, now that</span> (geçmişle olmaz), <span class='en'>in that, for</span> (başa gelmez), <span class='en'>seeing that, given that</span></td><td><span class='en'>because of, due to, owing to, thanks to, on account of, in view of, as a result of</span></td><td>— (Eylem sebepse yan cümle bağlacı veya <span class='en'>+ the fact that</span> kullan)</td></tr><tr><td><b>Sonuç / Çıkarım</b></td><td><span class='en'>so + adj/adv + that</span> · <span class='en'>such + NP + that</span></td><td><span class='en'>thereby + V-ing</span> (sayesinde / böylece ... yaparak)</td><td><span class='en'>therefore, thus (+ V-ing de alır), hence, consequently, accordingly, as a result</span></td></tr><tr><td><b>Ekleme / Pekiştirme</b></td><td><span class='en'>not only ... but also</span> · <span class='en'>besides + SVO</span></td><td><span class='en'>in addition to, besides, as well as, along with, apart from, coupled with</span></td><td><span class='en'>moreover, furthermore, in addition, what is more, indeed, besides</span></td></tr><tr><td><b>Koşul / Önlem / Amaç</b></td><td><span class='en'>if, unless, only if, provided/as long as, in case, so that, in order that</span></td><td><span class='en'>in case of, in the event of, without, but for, with a view to + Ving, in order to + V1</span></td><td><span class='en'>otherwise, or else</span> (aksi halde)</td></tr><tr><td><b>Benzetme / Örnekleme</b></td><td><span class='en'>just as ... (so)</span> (nasıl ki ... aynı şekilde), <span class='en'>as if / as though</span></td><td><span class='en'>like, such as, such + N + as</span> (araya isim girer), <span class='en'>unlike</span></td><td><span class='en'>similarly, likewise, for example, for instance, namely</span></td></tr><tr><td><b>Konu / Kapsam / Hariç</b></td><td><span class='en'>as far as + S + be concerned</span></td><td><span class='en'>regarding, concerning, as to, as for, with respect to, in terms of, regardless of, except for</span></td><td><span class='en'>on the whole, in general, as a matter of fact</span></td></tr></tbody></table></div>\n    <div class=\"grid-2\">\n      <div class=\"rule-card\">\n        <h4>Karıştırılan Bağlaç Çiftleri ve Kutup Testi</h4>\n        <ul>\n          <li><b>Zıtlık Refleksi Tedavisi:</b> Cümle 1 ile Cümle 2'ye kutup ver: <b>(+)→(+)</b> ya da <b>(-)→(-)</b> iken biri diğerinin sonucuysa <span class='err'>however / even so</span> değil <b><span class='ok'>thus / as a result</span></b> seç!</li>\n          <li><b><span class='en'>such as</span> vs <span class='en'>thanks to / in case of</span>:</b> <span class='en'>such as</span> yalnızca üst kategorinin alt örneğini verir. Cümlede zaten <span class='en'>like</span> örn
