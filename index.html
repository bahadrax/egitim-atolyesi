ctiveProfile().name)} · Kitaplar ortak; testlerin, konu ilerlemen, programın ve notların profiline kayıtlı.</p></div>`}<div class="side-foot"><div class="save" id="saveText">${saveLabel()+cloudLabel()+syncLabel()}</div><span class="status-dot"></span> Çevrimdışı kullanıma hazır<br><span>İnternet veya hesap gerektirmez.</span><br><span>Sürüm ${APP_VERSION}</span></div></aside>`;}
function render(){applyAppearance();const labels={library:'Test Kitaplığı',education:'Eğitim & Konu Anlatımı',course:(typeof currentCourse==='function'?currentCourse()?.shortTitle:'Konu Anlatımı'),tracker:'Program & Takip',notebook:'Notlar',contents:'İçindekiler',study:currentTest?.title,help:'Kullanım ve AI formatı'};$('#app').innerHTML=`<div class="shell ${isPanelCollapsed('side')?'side-collapsed':''}">${sidebar()}<div><button class="mobile-menu small floating-menu" data-act="menu" aria-label="Menüyü aç">☰ Menü</button><main>${locked?'<div class="alert">Bu uygulama başka bir sekmede açık. Çakışmayı önlemek için bu sekme salt okunur. <button class="small" data-act="takeover">Burada devam et</button></div>':''}${!storageOK?'<div class="alert">Tarayıcı kayda izin vermedi veya depolama dolu. Çalışmayı sürdürmeden önce yedek indirin ve normal tarayıcı penceresinde açın.</div>':''}${view==='library'?library():view==='education'&&typeof educationView==='function'?educationView():view==='course'&&typeof courseView==='function'?courseView():view==='tracker'&&typeof trackerView==='function'?trackerView():view==='notebook'&&typeof notebookView==='function'?notebookView():view==='contents'?contents():view==='study'?study():help()}</main></div></div>`;updateClocks();ttsRefresh();if(window.markUnk)markUnk();}
function bookCard(b,i){let n=0,a=0;for(const t of b.tests){n+=t.questionCount??t.questions.length;const s=state.tests[b.id+'/'+t.id];if(s)a+=Object.keys(s.answers).length;}return `<article class="book-card"><div class="cover" style="${i?'background:#455168':''}"><small>SORU KİTAPLIĞI / ${esc(b.year||'')}</small><strong>${/^DHBT [12] ·/.test(b.title)?'DHBT<br>'+esc(b.title.match(/^DHBT (\d)/)[1]):esc(b.title.slice(0,20))}</strong><span>${esc(b.author||'Kişisel kitaplık')}</span></div><div class="book-content"><button class="tag lib-tag" data-act="libMove" data-id="${esc(b.id)}" title="Kütüphaneyi değiştir">📚 ${esc(libOf(b))} ✎</button><h2>${esc(b.title)}</h2><p>${esc(b.author||'')} ${b.year?'· '+esc(b.year):''}</p><div class="book-meta"><span><b>${b.tests.length}</b> test</span><span><b>${n.toLocaleString('tr')}</b> soru</span><span><b>${new Set(b.tests.map(t=>t.section)).size}</b> bölüm</span></div><div class="bar"><i style="width:${n?a/n*100:0}%"></i></div><p>${a} / ${n} soru işaretlendi</p><div class="row"><button class="primary" data-act="book" data-id="${esc(b.id)}">${b._catalog?'↓ İndir ve aç ('+((b.size||0)/1048576).toFixed(2)+' MB)':'Kitabı aç →'}</button><button class="small fav-btn ${isFav(b.id)?'on':''}" data-act="fav" data-id="${esc(b.id)}">${isFav(b.id)?'★ Favori':'☆ Favorilere ekle'}</button>${typeof courseForBook==='function'&&courseForBook(b.id)?`<button class="small" data-act="eduCourseDrawer" data-book="${esc(b.id)}">📘 Konu Özeti</button>`:''}${!b._catalog&&b.id!==builtin?.id?`<button class="small danger" data-act="removeBook" data-id="${esc(b.id)}">Cihazdan kaldır</button>`:''}</div></div></article>`;}
function library(){const st=totalStats();return `<section class="intro"><div><div class="eyebrow">KİŞİSEL TEST KİTAPLIĞIN</div><h1>Her kitap, yeni bir başlangıç.</h1><p>Sorularını çöz, zamanını yönet, kaldığın yerden devam et.<br>Çalışma alanın her adımını hatırlar.</p></div><div class="row"><button data-act="import">＋ Kitap ekle</button>${state.last?'<button class="primary" data-act="resume">Çalışmaya devam et →</button>':''}</div></section><section class="stats" aria-label="Çalışma özeti"><div class="stat"><small>Kitaplığındaki kitap</small><strong>${books.length.toLocaleString('tr')}</strong></div><div class="stat"><small>Toplam soru</small><strong>${allQuestions().toLocaleString('tr')}</strong></div><div class="stat"><small>İşaretlediğin soru</small><strong>${st.answered.toLocaleString('tr')}</strong></div><div class="stat"><small>Toplam çalışma süren</small><strong>${duration(st.time)}</strong></div></section>${libraryView()}<div class="note"><strong>Her şey kaldığı yerde.</strong> Cevaplar, notlar ve süreler otomatik kaydedilir. Tarayıcı verilerinin silinmesine karşı “Yedek ve taşıma” bölümünden düzenli yedek alabilirsin.</div>`;}
function contents(){const b=books.find(b=>b.id===bookId)||books[0];if(!b)return library();return `<div class="intro"><div><div class="eyebrow">KİTAP / İÇİNDEKİLER</div><h1>${esc(b.title)}</h1><p>${esc(b.author||'')} · ${b.tests.length} test. Bir konu seç ve çalışmaya başla.</p></div><button data-act="nav" data-view="library">← Kitaplık</button></div>${diagnosticGuide(b)}<div class="filter"><input id="search" type="search" placeholder="Konu veya test ara…" value="${esc(filter)}" aria-label="Test ara"><select id="sectionFilter" aria-label="Bölüm seç"><option value="">Tüm bölümler</option>${[...new Set(b.tests.map(t=>t.section||'Diğer'))].map(s=>`<option ${s===sectionFilter?'selected':''}>${esc(s)}</option>`).join('')}</select></div>${resultsLegend()}${contentsViewSwitch()}<div class="test-list view-${contentsView()}" id="testList">${testCards(b)}</div>`;}
function testOutcome(t,s){if(!s?.checked)return null;const c=counts(t,s),miss=c.wrong+c.blank,ratio=c.known?miss/c.known:0;let tone,label;if(miss===0){tone='green';label='Yanlış yok';}else if(ratio>=1/2){tone='red';label='Öncelikli tekrar';}else if(ratio>=0.3){tone='orange';label='Tekrar gerekli';}else if(ratio>1/6){tone='yellow';label='Gözden geçir';}else if(ratio>1/10){tone='blue';label='İyi';}else{tone='green';label='Çok iyi';}const perfect=c.known>0&&ratio<1/50;return{...c,tone,label,perfect,wrongPercent:Math.round(ratio*100),successPercent:c.known?Math.round(c.correct/c.known*100):0};}
function resultSummary(r){return `<div class="test-result" aria-label="${r.correct} doğru, ${r.wrong} yanlış, ${r.blank} boş, yüzde ${r.wrongPercent} yanlış"><div class="result-numbers"><span><b>${r.correct}</b> Doğru</span><span><b>${r.wrong}</b> Yanlış</span><span><b>${r.blank}</b> Boş</span></div><div class="result-percent"><strong>%${r.successPercent} başarı</strong><span>%${r.wrongPercent} yanlış</span></div>${r.unknown?`<small>${r.unknown} sorunun anahtarı bekleniyor</small>`:''}</div>`;}
function testCards(b){return b.tests.filter(t=>(!sectionFilter||(t.section||'Diğer')===sectionFilter)&&(!filter||(t.title+' '+t.section).toLocaleLowerCase('tr').includes(filter.toLocaleLowerCase('tr')))).map(t=>{const s=state.tests[b.id+'/'+t.id],n=s?Object.keys(s.answers).length:0,r=testOutcome(t,s);return `<button class="test-card ${r?'result-'+r.tone:''} ${r?.perfect?'perfect-test':''} ${!r&&n?'in-progress':''}" data-act="test" data-book="${esc(b.id)}" data-test="${esc(t.id)}">${r?.perfect?'<span class="perfect-sparkles" aria-hidden="true">✦ <span>✧</span> ✨</span>':''}<span class="eyebrow">${esc(t.section||'Testler')}</span><h3>${esc(t.title)}</h3><div class="row"><span class="tag">${t.questions.length} soru</span>${r?`<span class="result-badge">${r.perfect?'✦ Tam doğru':r.label}</span>`:''}</div>${r?resultSummary(r):`<p>${n?'Kaldığın yerden devam et':'Çalışmaya hazır'}</p>`}${s?.elapsed?`<small class="test-duration">Çalışma: ${duration(s.elapsed)}</small>`:''}<div class="bar"><i style="width:${n/t.questions.length*100}%"></i></div><footer><span>${n} / ${t.questions.length} işaretlendi</span><strong>→</strong></footer></button>`;}).join('')||'<div class="empty">Bu aramaya uygun test bulunamadı.</div>';}
function resultsLegend(){return `<div class="results-legend" aria-label="Test sonuç renkleri"><span class="legend-item legend-red">● Yarısı veya fazlası yanlış</span><span class="legend-item legend-orange">● Yaklaşık üçte biri yanlış</span><span class="legend-item legend-yellow">● Yaklaşık dörtte biri yanlış</span><span class="legend-item legend-blue">● Altıda biri veya azı yanlış</span><span class="legend-item legend-green">● Onda biri veya azı yanlış</span><span>✦ Ellide birden az yanlış</span><small>Boş bırakılan sorular yanlış sayılır. Renkler son kontrol edilen cevapları gösterir; kontrol edilmemiş testler nötrdür. Oranlar soru sayısına göre hesaplanır — 20 soruda: 10+ kırmızı · 6–9 turuncu · 4–5 sarı · 3 mavi · 0–2 yeşil; 100 soruda: 50+ · 30–49 · 17–29 · 11–16 · 0–10, ✦ en çok 1 yanlış.</small></div>`;}


function study(){const t=currentTest,s=currentState,q=t.questions[s.index],c=counts(t,s),a=s.answers[q.id],flag=s.flags[q.id],peek=!s.checked&&peekOpen(s,q),revealed=s.checked||peek;let result='';if(s.checked){const pct=c.known?Math.round(c.correct/c.known*100):0;result=`<section class="result-strip"><div><strong>%${pct}</strong><p>Cevap anahtarı olan ${c.known} soruda</p></div><span><b>${c.correct}</b> doğru</span><span><b>${c.wrong}</b> yanlış</span><span><b>${c.blank}</b> boş</span>${c.unknown?`<span>${c.unknown} cevap anahtarı bekliyor</span>`:''}<button class="small" data-act="uncheck">Düzenlemeye dön</button></section>`;}
const options=q.options.map((o,i)=>{const key=typeof o==='string'?String.fromCharCode(65+i):o.id;const text=typeof o==='string'?o:o.text;return `<div class="option-row"><button class="option ${a===key?'selected':''} ${(s.elims?.[q.id]||[]).includes(key)?'elim':''} ${revealed&&q.answer===key?'correct':''} ${revealed&&a===key&&q.answer&&a!==q.answer?'wrong':''}" data-act="answer" data-id="${esc(key)}" aria-pressed="${a===key}" ${revealed||locked?'disabled':''}><b>${esc(key)}</b>${q.image&&text===key?'':`<span dir="auto">${questionMarkup(text)}${typeof o==='object'&&o.blocks?`<div class="rich-content">${blocksHTML(o.blocks)}</div>`:''}</span>`}</button>${q.image&&text===key?'':ttsButton(key,key+' şıkkı')}${unkButton(s,q,key)}</div>`;}).join('');
return `<div class="study-head"><div><div class="eyebrow">${esc(t.section||currentBook.title)}</div><h2>${esc(t.title)}</h2><p>${c.answered} / ${t.questions.length} işaretli · ${s.checked?'Sonuç incelemesi':'Çalışma oturumu'}</p></div><div class="timer-panel"><div class="clock" id="testClock"></div><button data-act="pause" id="pauseBtn" class="${running?'':'primary'}" ${s.checked||locked?'disabled':''}>${running?'Ⅱ Duraklat':'▶ Devam et'}</button>${typeof courseForBook==='function'&&courseForBook(currentBook.id)?`<button class="small" data-act="eduCourseDrawer" data-book="${esc(currentBook.id)}">📘 Konu Özeti</button>`:''}<button class="small" data-act="settings" aria-label="Süre ayarları">⚙ Süre</button>${isPanelCollapsed('studyAside')?'<button class="small" data-act="toggleStudyAside">☷ Soru Haritası</button>':''}</div></div>${diagnosticGuide(currentBook,t)}${result}<div class="workspace ${isPanelCollapsed('studyAside')?'aside-collapsed':''}"><article class="question"><header class="question-title"><strong>Soru ${s.index+1} ${q.difficulty?.label?`<b style="color:#c62828;font-weight:800;margin-left:8px">${esc(q.difficulty.label)}</b>`:''} <span style="color:var(--muted);font-weight:400">/ ${t.questions.length}</span>${q.topic?`<small class="q-topic">${esc(q.topic)}</small>`:''}</strong><span class="q-title-tools">${q.image?'':ttsButton('q','Soru','Soruyu oku','Soru')+ttsButton('all','Bütün şıklar','Şıkları oku','Şıklar')}<span class="inline-time" id="qClock"></span></span></header><div class="question-body">${!running&&!s.checked?'<div class="alert">Oturum duraklatıldı. Süreyi başlatmak için “Devam et”e bas.</div>':''}${q.passage?`<div class="passage">${esc(q.passage)}</div>`:''}${q.image?`<img class="q-image" src="${q.image}" alt="${esc(t.title)} — ${q.number||s.index+1}. sorunun özgün görüntüsü" data-act="zoomQ">`:`<div class="q-text" dir="auto">${questionMarkup(q.text)}</div>`}${q.blocks?.length?`<div class="rich-content">${blocksHTML(q.blocks)}</div>`:''}${figuresHTML(q.figures,'question')}<div class="options ${q.image?'answer-row':''}" role="group" aria-label="Cevap seçenekleri">${options}</div>${unkTextChips(s,q)}${typeof hlChips==='function'?hlChips(s,q):''}${peek?peekResultHTML(s,q):''}<div class="q-tools">${!s.checked?`<button class="peek-btn ${peek?'active':''}" data-act="peek" ${locked?'disabled':''} title="Testi bitirmeden yalnız bu soruyu kontrol et (K)">${peek?'Kontrolü gizle':a?'✓ Bu soruyu kontrol et':'✓ Cevabı göster'}</button>`:''}${revealed?oopsButton(s,q):''}<button data-act="clearAnswer" ${revealed||locked?'disabled':''}>Seçimi sil</button><button data-act="flag" ${locked?'disabled':''}>${flag?'◆ İşaretli':'◇ Sonra bak'}</button><button data-act="resetQuestionTime" ${locked?'disabled':''}>Soru süresini sıfırla</button>${s.checked?'<button data-act="solution">'+(showSolution?'Çözümü gizle':'Çözümü göster')+'</button>':''}</div>${revealed&&showSolution?`<section class="solution"><h3>${q.answer?'Doğru cevap: '+esc(q.answer):'Cevap harfi doğrulanamadı'} ${ttsButton('x','Açıklama','Açıklamayı oku','Oku')}</h3>${q.keyDoubt?`<div class="alert key-doubt"><b>⚠ Anahtar şüphesi:</b> ${esc(q.keyDoubt)} Kaynak PDF’yi inceleyip gerekirse “Cevap anahtarını düzelt” ile değiştirebilirsin.</div>`:''}${!q.answer?'<p>Bu sorunun cevap harfi otomatik puanlamaya alınmadı. Kaynak PDF ve kitap açıklamasını inceleyip cevap anahtarını düzeltebilirsin.</p>':''}${q.explanationImage?`<img src="${q.explanationImage}" alt="Kitaptaki çözüm" data-act="zoomSolution">`:(q.explanation||q.explanationBlocks?.length)?`<div class="q-text" dir="auto">${esc(q.explanation||'')}</div><div class="rich-content">${blocksHTML(q.explanationBlocks)}</div>`:'<p>Bu soru için kitapta açıklama bulunmuyor.</p>'}${figuresHTML(q.explanationFigures,'explanation')}<p style="margin-top:15px;margin-bottom:0">${q.sourcePage?'Soru: PDF s. '+q.sourcePage:''}${q.solutionPage?' · Çözüm: PDF s. '+q.solutionPage:''}</p><button class="small" style="margin-top:12px" data-act="editKey">Cevap anahtarını düzelt</button></section>`:''}${aiQuestionPanel()}</div><footer class="q-footer"><button data-act="prev" ${s.index===0?'disabled':''}>← Önceki</button><span class="eyebrow" style="align-self:center">${s.checked?'İNCELEME':'1–5 İLE İŞARETLE'}</span><button class="primary" data-act="${s.index===t.questions.length-1?'check':'next'}">${s.index===t.questions.length-1?'Testi kontrol et ✓':'Sonraki →'}</button></footer></article><aside class="study-aside"><section class="aside-card"><div class="row" style="justify-content:space-between;margin-bottom:8px"><h3 style="margin:0">Soru haritası</h3><button class="small panel-hide-btn" data-act="toggleStudyAside" title="Paneli gizle">▶</button></div><div class="palette">${t.questions.map((x,i)=>`<button class="${s.answers[x.id]?'answered ':''}${s.flags[x.id]?'flag ':''}${i===s.index?'current ':''}${(s.checked||s.peeks?.[x.id]?.open)&&s.answers[x.id]&&x.answer?(s.answers[x.id]===x.answer?'good':'bad'):''}${s.peeks?.[x.id]?' peeked':''}${(s.unk?.[x.id]?.length||s.unkText?.[x.id]?.length)?' unk':''}${s.oops?.[x.id]?' oops':''}" data-act="jump" data-index="${i}" aria-label="${i+1}. soru${s.answers[x.id]?', işaretli':''}" ${i===s.index?'aria-current="true"':''}>${i+1}</button>`).join('')}</div><div class="legend">Yeşil: işaretli · Nokta: sonra bak<br>Çerçeve: bulunduğun soru · Alt çizgi: tek başına kontrol edildi</div></section><section class="aside-card"><div class="mini-stats"><div><strong>${c.answered}</strong>İşaretli</div><div><strong>${t.questions.length-c.answered}</strong>Boş</div><div><strong>${Object.values(s.flags).filter(Boolean).length}</strong>Sonra bak</div></div><div class="bar" style="margin-top:16px"><i style="width:${c.answered/t.questions.length*100}%"></i></div><button class="primary" style="width:100%;margin-top:12px" data-act="check">Testi kontrol et</button></section><section class="aside-card"><h3>Bu soruya notun</h3><textarea id="qNote" rows="4" placeholder="Kısa bir hatırlatma…" ${locked?'disabled':''}>${esc(s.notes[q.id]||'')}</textarea><span class="legend">Yazdıkça kaydedilir.</span></section><section class="aside-card"><h3>Oturum araçları</h3><div style="display:grid;gap:7px"><button class="small" data-act="resetTestTime">Test sürelerini sıfırla</button><button class="small" data-act="clearTestAnswers">Tüm seçimleri sil</button><button class="small danger" data-act="resetTest">Testi tamamen sıfırla</button><button class="small" data-act="history">Önceki kontroller (${s.history.length})</button></div></section></aside></div>`;}
function help(){return `<div class="intro"><div><div class="eyebrow">KILAVUZ</div><h1>Kitaptan çalışma alanına.</h1><p>Yeni kitaplarını yapay zekâ ile dönüştür. Ortak format sayesinde aynı uygulamada çalış.</p></div><button class="primary" data-act="prompt">AI yönergesini indir</button></div><button data-act="aiSettings">🤖 Yapay Zekâ Ayarları ve Yardım</button><div class="help-grid">${guideHTML()}<article><h3>01 / Kitabını dönüştür</h3><p>Bu HTML dosyasını ve PDF’yi kullandığın yapay zekâya ver. Dosyanın başındaki importContract alanı tüm şemayı ve kuralları içerir. “Eğitim Atölyesi JSON v1” biçiminde bir dosya iste.</p><p>Yapay zekâ kitabın soru, seçenek, doğru cevap ve varsa açıklamalarını aktarır. Tablolar, maddeler ve ortak parçalar yapısal veri olarak saklanır. Soru ve çözümlerde ana yöntem metindir.</p><button data-act="format">Format örneğini indir</button></article><article><h3>02 / Kitaplığına ekle</h3><p>“Kitap ekle” ile JSON dosyasını seç. Biçimi kontrol edilen kitap otomatik olarak kitaplığına kaydedilir.</p><p>Soru sohbeti ve yardım asistanı kendi Gemini anahtarınızla çalışır. Ham PDF’yi uygulama içinde dönüştürmez. Dönüştürme işlemini seçtiğin yapay zekâ yapar.</p><button data-act="import">＋ Kitap ekle</button></article><article><h3>03 / Süreyi kendin yönet</h3><p>Test süresi ve her soruda geçirdiğin süre ayrı tutulur. “Süre” düğmesinden toplam test veya soru başına sınır belirleyebilirsin. Sınıra gelindiğinde oturum durur.</p><p>Sekme arka plana geçtiğinde oturum otomatik duraklatılır ve kaydedilir. Sekmeyi kapatıp açınca son kaydedilen süreyle duraklatılmış olarak dönersin; kapalı kalınan zaman eklenmez.</p><p>Kısayollar: 1–5 seçenekler, ← → sorular, boşluk duraklat/devam.</p></article><article><h3>04 / Kayıt ve taşınabilirlik</h3><p>HTML dosyasının üzerine otomatik yazmak için sol menüde “HTML’ye otomatik kayıt” bölümünü açın, dosyayı seçin ve tarayıcının yazma iznini verin. Bağlantı kurulduğunda tüm mevcut ilerleme de dosyaya aktarılır. Üstte “HTML kaydı ✓” görünmeden dosya yazımı tamamlanmış sayılmaz.</p><p>Cevaplar ve süreler her saniyede; notlar ve seçimler her değişiklikte tarayıcıya kaydedilir. Dosya bağlantısı kurulmamışsa değişiklikler yalnız tarayıcıda kalır. Dosya yazmayı desteklemeyen tarayıcılarda kaydı içeren HTML indirebilirsiniz.</p><p>“Kaydı içeren HTML indir” tüm kitapların ve mevcut ilerlemenle yeni, tek bir HTML üretir. JSON yedeği ise diğer kopyaya ilerleme taşır. Dosyayı başka tarayıcıda açarsan yedeğini geri yükle.</p><button data-act="backup">Yedek ve taşıma</button></article><article><h3>Kitabın aktarımı hakkında</h3><p>Rauf Şara DHBT 1 kitabının metinleri düzeltilerek aktarılır. Gerekli harita, şema ve tablolar kaynak PDF’den alınan küçük görsellerle korunur. Soru kökü, seçenekler, doğru cevap ve kitaptaki açıklama ayrı alanlarda tutulur. PDF sayfa numaraları kaynak kontrolü için korunur.</p><p>OCR kaynaklı yazım ve dizgi hataları için metin düzeltmeleri uygulanmıştır. Kaynakla karşılaştırılarak yeniden yazılan bölümler ve küçük özgün şekiller bu sürüme eklenmiştir. Okunamayan cevap harfleri “anahtar bekliyor” olarak tutulur; puanlamaya katılmaz. Kaynak PDF’den inceleyebilir, “Cevap anahtarını düzelt” ile doğru harfi kaydedebilirsin.</p></article>${helpExtra()}<article><h3>Görünüm ve okuma ayarları</h3><p>Sol menüdeki “Görünüm ayarları” ile 14–30 px yazı boyutu, yazı tipi, satır aralığı ve açık/beyaz/sepya/koyu tema seçebilirsiniz. Sayfa zemini, kart zemini, metin ve vurgu rengini ayrı değiştirebilirsiniz. Ayarlar anında kaydedilir; yedek ve taşınabilir HTML’ye de eklenir.</p></article><article><h3>Kontrol ve tekrar</h3><p>“Testi kontrol et” tüm seçimlerini değerlendirir. Çözümler ancak kontrolden sonra açılır. Kontrol sonuçları tarihleriyle saklanır.</p><p>“Düzenlemeye dön” ile cevapları değiştirebilir, seçimi silebilir ve yeniden kontrol edebilirsin. Soruya tekrar tıkladığında seçimin kaldırılır.</p></article></div>`;}
function updateClocks(){if(view!=='study')return;const s=currentState,q=currentTest.questions[s.index];const el=$('#testClock'),qe=$('#qClock');if(el)el.innerHTML=`${duration(s.limit?Math.max(0,s.limit-s.elapsed):s.elapsed)}<small>${s.limit?'Kalan test süresi':'Toplam çalışma süresi'}${running?' · sürüyor':' · duraklatıldı'}</small>`;if(qe)qe.textContent='◷ '+duration(s.times[q.id]||0)+(s.qLimit?' / '+duration(s.qLimit):'');}
function pulse(){const now=performance.now(),delta=(now-lastTick)/1000;lastTick=now;if(!running||view!=='study'||locked||!ready)return;const s=currentState,q=currentTest.questions[s.index];let add=delta;if(s.limit)add=Math.min(add,Math.max(0,s.limit-s.elapsed));if(s.qLimit)add=Math.min(add,Math.max(0,s.qLimit-(s.times[q.id]||0)));s.elapsed+=add;s.times[q.id]=(s.times[q.id]||0)+add;if((s.limit&&s.elapsed>=s.limit-.01)||(s.qLimit&&s.times[q.id]>=s.qLimit-.01)){running=false;save();render();toast('Süre sınırına ulaştın. Süre ayarlarını değiştirebilir veya testi kontrol edebilirsin.');}updateClocks();}
function toggleRun(){pulse();if(locked||currentState.checked)return;const s=currentState,q=currentTest.questions[s.index];if(!running&&((s.limit&&s.elapsed>=s.limit)||(s.qLimit&&(s.times[q.id]||0)>=s.qLimit))){toast('Süre sınırına ulaşıldı. Devam etmek için süreyi sıfırla veya sınırı değiştir.');return;}running=!running;lastTick=performance.now();save();render();}
function jump(i){pulse();if(i<0||i>=currentTest.questions.length)return;ttsStop();currentState.index=i;showSolution=false;save();render();window.scrollTo({top:0,behavior:'smooth'});}
function answer(a){if(locked||currentState.checked)return;pulse();const q=currentTest.questions[currentState.index];if(peekOpen(currentState,q)){toast('Bu sorunun kontrolü açık. Cevabı değiştirmek için önce “Kontrolü gizle”ye bas.');return;}const s=currentState;s.elims=s.elims&&typeof s.elims==='object'?s.elims:{};const el=new Set(s.elims[q.id]||[]);if(s.answers[q.id]===a){delete s.answers[q.id];el.add(a);}else if(el.has(a))el.delete(a);else{s.answers[q.id]=a;el.delete(a);trailPush(s,q.id,a);}if(el.size)s.elims[q.id]=[...el];else delete s.elims[q.id];stampQ(s,q.id);save();render();}
function dialog(title,body,buttons=''){pulse();running=false;render();$('#modal').innerHTML=`<div class="dialog-back"><section class="dialog" role="dialog" aria-modal="true" aria-label="${esc(title)}"><h2>${esc(title)}</h2>${body}<div class="end"><button data-act="close">Kapat</button>${buttons}</div></section></div>`;$('#modal button')?.focus();}
function closeDialog(){ $('#modal').innerHTML='';lastTick=performance.now();}
function confirmAction(title,body,fn){dialog(title,`<p>${esc(body)}</p>`,'<button class="primary" id="confirmAction">Onayla</button>');$('#confirmAction').onclick=()=>{closeDialog();if(locked)return;fn();save();render();};}
function settings(){const s=currentState;dialog('Süre ayarları',`<p>Süreler yalnız açık oturumda işler. 0 değeri sınırsızdır. Ayar değişikliği mevcut süreleri silmez.</p><label for="limit">Testin toplam süre sınırı (dakika)</label><input id="limit" type="number" min="0" max="10080" step="0.5" value="${s.limit/60}"><label for="qlimit">Her soru için süre sınırı (saniye)</label><input id="qlimit" type="number" min="0" max="86400" step="1" value="${s.qLimit}"><p style="margin-top:15px">Test süresi: ${duration(s.elapsed)}. Bir sınır dolduğunda oturum durur; otomatik cevap değiştirilmez.</p>`,'<button class="primary" id="saveSettings">Ayarları kaydet</button>');$('#saveSettings').onclick=()=>{const l=Number($('#limit').value),q=Number($('#qlimit').value);if(!Number.isFinite(l)||l<0||l>10080||!Number.isFinite(q)||q<0||q>86400){toast('Geçerli bir süre gir.');return;}s.limit=l*60;s.qLimit=Math.floor(q);save();closeDialog();render();};}
function check(){if(locked)return;confirmAction('Testi kontrol et',`${counts(currentTest,currentState).answered} / ${currentTest.questions.length} soru işaretledin. Cevaplar değerlendirilecek ve kitap çözümleri açılacak.`,()=>{running=false;currentState.checked=true;stampT(currentState);const result=counts(currentTest,currentState);currentState.history.push({at:new Date().toISOString(),...result,elapsed:currentState.elapsed,answers:{...currentState.answers}});showSolution=true;});}
function download(name,data,type='application/json'){if(host&&typeof host.exportFile==='function'){try{host.exportFile(name,type,data);return;}catch(e){}}const blob=new Blob([data],{type}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=name;document.body.append(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),30000);}
function backupDialog(){dialog('Yedek ve taşıma','<p>JSON yedeği: tüm ilerlemen, notların, cevap anahtarı düzeltmelerin ve eklediğin kitaplar. Yerleşik DHBT kitabı uygulamada zaten bulunur.</p><p>Taşınabilir HTML: yerleşik kitap ve eklediğin kitaplar dahil, mevcut kayıtlarını içeren tek dosya. Dosya büyük olabilir.</p><p>Doğrudan dosyaya kayıt: “HTML’ye otomatik kayıt” bölümünden HTML dosyanızı seçip bağlayın. Bağlandıktan sonra her işaretleme ve süre değişikliği dosyanın içine yazılır. Üst çubukta dosya kaydının tamamlandığını görebilirsiniz.</p><button data-act="htmlFile">HTML’ye otomatik kayıt</button><div class="row"><button class="primary" data-act="exportBackup">JSON yedeği indir</button><button data-act="restore">Yedekten geri yükle</button><button data-act="portable">Kaydı içeren HTML indir</button></div>');}
const sample={format:'test-atolyesi',version:1,books:[{id:'kitap-kimligi',title:'Kitabın adı',author:'Yazar',year:2026,contentVersion:1,meta:{purpose:'Kitabın amacı',scope:'Kapsadığı konular',audience:'Hedef kitle',exam:'Hedef sınav',sectionsOverview:'Bölümlerin kısa özeti'},tests:[{id:'test-01',title:'Bölüm 1 · Test 1',section:'Bölüm 1',topic:'Testin konusu',questions:[{id:'q1',number:1,text:'I. Birinci öncül\nII. İkinci öncül\nYukarıdakilerden hangileri doğrudur?',stem:'Yukarıdakilerden hangileri doğrudur?',context:'I. Birinci öncül\nII. İkinci öncül',stemFirst:true,topic:'Konu — alt konu',concepts:['ölçülen kavram'],level:'kavrama',options:[{id:'A',text:'Yalnız I',diagnosis:'II. öncüldeki bilgiyi yanlış biliyor.'},{id:'B',text:'I ve II',diagnosis:'Doğru: iki öncülün de doğru olduğunu biliyor.'},{id:'C',text:'Yalnız II',diagnosis:'I. öncüldeki kuralı bilmiyor.'},{id:'D',text:'Hiçbiri',diagnosis:'Konunun temel kurallarını tanımıyor.'},{id:'E',text:'Belirlenemez',diagnosis:'Öncülleri değerlendirmeden kaçınıyor; konuyu tanımıyor olabilir.'}],answer:'B',explanation:'Yalnız kitapta açıklama varsa aktarılır.',sourcePage:1,solutionPage:2}]}]}]};

function validateBlocks(bs){if(bs==null)return;if(!Array.isArray(bs))throw Error('blocks bir dizi olmalı.');for(const b of bs){if(!b||!['text','table','list','pre'].includes(b.type))throw Error('İçerik bloğu türü geçersiz.');if(['text','pre'].includes(b.type)&&typeof b.text!=='string')throw Error('Blok metni eksik.');if(b.type==='table'&&(!Array.isArray(b.rows)||b.rows.some(r=>!Array.isArray(r)||r.some(x=>typeof x!=='string'))||(b.headers&&(!Array.isArray(b.headers)||b.headers.some(x=>typeof x!=='string')))))throw Error('Tablo satırları düz metin hücrelerinden oluşmalı.');if(b.type==='list'&&(!Array.isArray(b.items)||b.items.some(x=>typeof x!=='string')))throw Error('Liste maddeleri düz metin olmalı.');}}
function validateFigures(figures){if(figures==null)return;if(!Array.isArray(figures)||figures.length>30)throw Error('Görsel listesi geçersiz.');for(const f of figures){if(!f||!validImage(f.src)||(f.alt!=null&&typeof f.alt!=='string')||(f.caption!=null&&typeof f.caption!=='string'))throw Error('Şekiller PNG, JPEG veya WebP veri adresi ve metin açıklamasından oluşmalı.');}}
function figuresHTML(figures,kind){return (figures||[]).map((f,i)=>`<figure class="book-figure"><button class="figure-zoom" data-act="figure" data-kind="${kind}" data-index="${i}" aria-label="${esc((f.alt||'Kitaptaki şekil')+' · Büyüt')}"><img src="${f.src}" alt="${esc(f.alt||'Kitaptaki şekil')}" loading="lazy"></button>${f.caption?`<figcaption>${esc(f.caption)} · Büyütmek için tıkla</figcaption>`:''}</figure>`).join('');}
function validImage(x){return typeof x==='string'&&/^data:image\/(png|jpeg|webp);base64,[A-Za-z0-9+/=\r\n]+$/.test(x);}
function validateBook(b){if(!b||typeof b.id!=='string'||!b.id.trim()||b.id.length>150||/[\/]/.test(b.id)||['__proto__','constructor','prototype'].includes(b.id)||typeof b.title!=='string'||!b.title.trim()||!Array.isArray(b.tests)||!b.tests.length)throw Error('Kitap kimliği, adı ve testler zorunlu.');const testIds=new Set();for(const t of b.tests){if(!t||typeof t.id!=='string'||!t.id.trim()||testIds.has(t.id)||/[\/]/.test(t.id)||['__proto__','constructor','prototype'].includes(t.id)||typeof t.title!=='string'||!Array.isArray(t.questions)||!t.questions.length)throw Error('Test kimlikleri tekil, test adı ve sorular dolu olmalı.');testIds.add(t.id);const ids=new Set();for(const q of t.questions){if(!q||typeof q.id!=='string'||!q.id.trim()||ids.has(q.id)||['__proto__','constructor','prototype'].includes(q.id))throw Error(t.title+': soru kimlikleri tekil olmalı.');ids.add(q.id);if(!q.text&&!q.image&&!q.blocks?.length)throw Error(t.title+': soru metni veya görüntüsü eksik.');for(const k of ['text','passage','explanation'])if(q[k]!=null&&typeof q[k]!=='string')throw Error(k+' düz metin olmalı.');validateFigures(q.figures);validateFigures(q.explanationFigures);for(const k of ['image','explanationImage'])if(q[k]&&!validImage(q[k]))throw Error('Görseller PNG, JPEG veya WebP base64 olmalı.');if(!Array.isArray(q.options)||q.options.length<2||q.options.length>8)throw Error('Her soruda 2–8 seçenek olmalı.');const keys=q.options.map((o,i)=>typeof o==='string'?String.fromCharCode(65+i):o?.id);if(keys.some((k,i)=>k!==String.fromCharCode(65+i))||q.options.some(o=>typeof o!=='string'&&typeof o?.text!=='string'))throw Error('Seçenekler A’dan başlayarak sırayla tanımlanmalı.');for(const blocks of [q.blocks,q.explanationBlocks,...q.options.filter(o=>typeof o==='object').map(o=>o.blocks)])validateBlocks(blocks);if(q.answer!=null&&!keys.includes(q.answer))throw Error('Doğru cevap seçenekler arasında yok.');}}return b;}
function idb(action,key,value){return new Promise((resolve,reject)=>{if(!db){reject(Error('Kitap deposu açılamadı.'));return;}const tr=db.transaction('books',action==='get'?'readonly':'readwrite'),os=tr.objectStore('books');let req=action==='get'?os.getAll():action==='delete'?os.delete(key):os.put(value);tr.oncomplete=()=>resolve(req.result);tr.onerror=()=>reject(tr.error);tr.onabort=()=>reject(tr.error||Error('Kayıt iptal edildi'));});}
const originalKeys=new WeakMap();
function rememberKey(q){if(!originalKeys.has(q))originalKeys.set(q,q.answer??null);}

async function importFile(file){if(locked)return;if(file.size>250*1024*1024){toast('Dosya 250 MB sınırını aşıyor.');return;}try{const data=JSON.parse(await file.text());if(inputMode==='backup'){const incomingStore=data.version===2?normalizeStore(data.store):null;if(data.format!=='test-atolyesi-backup'||!Array.isArray(data.books)||(data.version===1?!validProfileState(data.state):!incomingStore))throw Error('Bu dosya geçerli bir Eğitim Atölyesi yedeği değil.');const newBooks=data.books.map(validateBook);if(newBooks.some(b=>b.id===builtin?.id)||new Set(newBooks.map(b=>b.id)).size!==newBooks.length)throw Error('Yedekte ek kitap kimlikleri geçersiz.');if(incomingStore)for(const pr of incomingStore.profiles)validateState(pr.state,newBooks);else validateState(data.state,newBooks);confirmAction('Yedeği geri yükle',incomingStore?'Bu dosyadaki tüm profiller ('+incomingStore.profiles.map(x=>x.name).join(', ')+') mevcut profillerin yerine geçecek. Mevcut ek kitaplar korunur. Önce JSON yedeği alabilirsin.':'Eski biçimli (tek kişilik) yedek, etkin profilin ('+activeProfile().name+') ilerlemesinin yerine geçecek. Mevcut ek kitaplar korunur.',async()=>{try{for(const b of newBooks){await idb('put',b.id,b);imported=imported.filter(x=>x.id!==b.id);imported.push(b);}if(incomingStore){store=incomingStore;state=activeProfile().state;if(typeof ensureEduState==='function')ensureEduState(state);}else{state=data.state;activeProfile().state=state;}lastLocalSnapshot='';books=[...baseBooks(),...imported];applyKeyOverrides();view='library';save();render();toast('Yedek geri yüklendi.');}catch(e){toast('Geri yükleme tamamlanamadı: '+e.message);}});return;}if(data.format!=='test-atolyesi'||data.version!==1||!Array.isArray(data.books)||!data.books.length)throw Error('Eğitim Atölyesi JSON v1 biçiminde bir kitap dosyası seç.');const incoming=data.books.map(validateBook);if(new Set(incoming.map(b=>b.id)).size!==incoming.length)throw Error('Dosyadaki kitap kimlikleri tekil olmalı.');if(incoming.some(b=>b.id===builtin?.id))throw Error('Yerleşik kitabın kimliği yeni bir kitapta kullanılamaz.');const clashes=incoming.filter(b=>books.some(x=>x.id===b.id));const proceed=async()=>{try{for(const b of incoming){if(pendingLib&&pendingLib!==DIGER){b.library=pendingLib;libCur().assign[b.id]=pendingLib;}await idb('put',b.id,b);imported=imported.filter(x=>x.id!==b.id);imported.push(b);}books=[...baseBooks(),...imported];bookId=incoming[0].id;libSave();if(window.cloudBooksChanged)cloudBooksChanged(incoming);save();closeDialog();view='contents';render();toast(incoming.length+' kitap eklendi.');}catch(e){toast('Kitap kaydedilemedi: '+e.message);}};if(clashes.length)confirmAction('Aynı kimlikte kitap var','Bu kitaplar değiştirilecek ve bu kitaplardaki ilerleme sıfırlanacak: '+clashes.map(b=>b.title).join(', '),proceed);else await proceed();}catch(e){toast('Dosya alınamadı: '+e.message);}}
function validateState(st,extra){const map=new Map([...baseBooks(),...imported,...extra].map(b=>[b.id,b]));if(st.last&&(typeof st.last.book!=='string'||typeof st.last.test!=='string'))throw Error('Yedekte son oturum geçersiz.');for(const [key,s]of Object.entries(st.tests)){if(!s||!Number.isFinite(s.elapsed)||s.elapsed<0||!Number.isFinite(s.limit)||s.limit<0||!Number.isFinite(s.qLimit)||s.qLimit<0||!Number.isInteger(s.index)||s.index<0)throw Error('Yedekte süre veya soru konumu geçersiz.');for(const f of ['answers','times','flags','notes'])if(!s[f]||typeof s[f]!=='object'||Array.isArray(s[f]))throw Error('Yedekte '+f+' geçersiz.');if(s.history&&(!Array.isArray(s.history)||s.history.some(h=>!h||!['correct','wrong','blank','elapsed'].every(k=>Number.isFinite(h[k])&&h[k]>=0)||typeof h.at!=='string')))throw Error('Yedekte kontrol geçmişi geçersiz.');if(Object.values(s.answers).some(x=>typeof x!=='string'||!/^([A-H])$/.test(x)))throw Error('Yedekte seçenek geçersiz.');if(Object.values(s.times).some(x=>!Number.isFinite(x)||x<0)||Object.values(s.notes).some(x=>typeof x!=='string'))throw Error('Yedekte soru kaydı geçersiz.');}}

// Zenginleştirilmiş kitaplarda q.stem/q.context hazırdır; eski kitaplarda son soru cümlesi kök sayılır.
const STEM_HINT=/\?|hangi|nedir|kaçtır|değildir|yanlıştır|doğrudur|aşağıdakiler|yukarıdaki|buna göre|verilenler/i;
function splitStem(q){const text=String(q.text||'').trim();if(typeof q.stem==='string'&&q.stem.trim()){const context=typeof q.context==='string'?q.context.trim():'';return{stem:q.stem.trim(),context,stemFirst:typeof q.stemFirst==='boolean'?q.stemFirst:context.length>140};}const i=text.lastIndexOf('\n');if(i>0){const tail=text.slice(i+1).trim();if(STEM_HINT.test(tail)&&tail.length<400){const context=text.slice(0,i).trim();return{stem:tail,context,stemFirst:context.length>140};}}const m=text.match(/^([\s\S]*[.!:;])\s+([^.!:;]*\?)\s*$/);if(m&&m[1].length>60)return{stem:m[2].trim(),context:m[1].trim(),stemFirst:m[1].length>140};return{stem:text,context:'',stemFirst:false};}
function blocksSpeech(blocks){return (blocks||[]).map(b=>b.type==='table'?[(b.headers||[]).join(', '),...(b.rows||[]).map(r=>r.join(', '))].filter(Boolean).join('. '):b.type==='list'?(b.items||[]).map((x,i)=>(i+1)+'. '+x).join('. '):b.text||'').filter(Boolean).join('. ');}
function optionText(o){return typeof o==='string'?o:[o.text,blocksSpeech(o.blocks)].filter(Boolean).join('. ');}
function optionKey(o,i){return typeof o==='string'?String.fromCharCode(65+i):o.id;}

const ttsSupported=()=>!!ttsHost||('speechSynthesis' in window&&typeof SpeechSynthesisUtterance==='function');
function ttsSettings(){const t=state.tts&&typeof state.tts==='object'?state.tts:{};const num=(v,d,a,b)=>Number.isFinite(Number(v))?Math.min(b,Math.max(a,Number(v))):d;return{voice:typeof t.voice==='string'?t.voice:'',arabicVoice:typeof t.arabicVoice==='string'?t.arabicVoice:'',rate:num(t.rate,1,.5,2),pitch:num(t.pitch,1,.5,1.5),announce:t.announce!==false,arabic:['voice','name','skip'].includes(t.arabic)?t.arabic:'voice'};}
function ttsVoices(){if(ttsHost){try{return JSON.parse(ttsHost.ttsVoices()||'[]').map(v=>({id:String(v.id),name:String(v.name||v.id),lang:String(v.lang||'')}));}catch(e){return[];}}return('speechSynthesis' in window?speechSynthesis.getVoices():[]).map(v=>({id:v.voiceURI||v.name,name:v.name,lang:v.lang||'',native:v,local:v.localService}));}
function pickVoice(lang,preferred){const vs=ttsVoices();return vs.find(v=>v.id===preferred&&v.lang.toLowerCase().startsWith(lang))||(preferred&&lang==='tr'?vs.find(v=>v.id===preferred):null)||vs.find(v=>v.lang.toLowerCase().startsWith(lang)&&v.local)||vs.find(v=>v.lang.toLowerCase().startsWith(lang))||null;}
function speechClean(t){return String(t||'').replace(/(\p{L})-\s*\n\s*(\p{L})/gu,'$1$2').replace(/^\s*(IV|V|I{1,3})\s*[.)]\s*/gm,(m,r)=>({I:'1',II:'2',III:'3',IV:'4',V:'5'}[r])+'. ').replace(/(^|[\s,(\-–])(IV|V|I{1,3})(?=$|[\s,.;:?)\-–])/gm,(m,sp,r)=>sp+{I:'1',II:'2',III:'3',IV:'4',V:'5'}[r]).replace(/_{3,}|\.{4,}|…{2,}/g,' boşluk ').replace(/\s*\n\s*/g,' ').replace(/\s{2,}/g,' ').trim();}
function speechChunks(text){const out=[];for(const part of speechClean(text).split(ARABIC_RUN)){const p=part.trim();if(!p||!/[\p{L}\p{N}]/u.test(p))continue;const lang=ARABIC_CHAR.test(p)?'ar':'tr';if(lang==='ar'){out.push({text:p,lang});continue;}let buf='';for(const piece of p.match(/[^.!?;]+[.!?;]*\s*/g)||[p]){if(buf&&(buf+piece).length>220){out.push({text:buf.trim(),lang});buf='';}buf+=piece;while(buf.length>300){const cut=Math.max(buf.lastIndexOf(', ',260),buf.lastIndexOf(' ',260));out.push({text:buf.slice(0,cut>80?cut:260).trim(),lang});buf=buf.slice(cut>80?cut:260);}}if(buf.trim())out.push({text:buf.trim(),lang});}return out;}
function speechForQuestion(q,n){const cfg=ttsSettings(),st=splitStem(q),info=[q.passage,st.context,blocksSpeech(q.blocks),...(q.figures||[]).map(f=>f.alt?'Şekil: '+f.alt:'')].filter(Boolean);const lead=cfg.announce?'Soru '+n+'. ':'';if(st.stemFirst&&info.length)return speechChunks(lead+st.stem).concat(speechChunks((cfg.announce?'Soruya ait bilgiler. ':'')+info.join('. ')));return speechChunks(lead+[q.passage,st.context,st.stem,blocksSpeech(q.blocks)].filter(Boolean).join('. '));}
function speechForOption(o,i){const k=optionKey(o,i);return speechChunks((ttsSettings().announce?k+' şıkkı. ':'')+optionText(o));}
function speechForAllOptions(q){return q.options.flatMap((o,i)=>speechForOption(o,i));}
function speechForSolution(q){return speechChunks([q.answer?'Doğru cevap '+q.answer+'.':'',q.explanation,blocksSpeech(q.explanationBlocks)].filter(Boolean).join(' '));}
function ttsCancelEngine(){try{if(ttsHost)ttsHost.ttsStop();else if('speechSynthesis' in window)speechSynthesis.cancel();}catch(e){}}
function ttsStop(){if(tts.status==='idle'&&!tts.key)return;tts={key:null,chunks:[],index:0,status:'idle',uid:tts.uid+1};ttsHostDone=null;ttsCancelEngine();ttsRefresh();}
function ttsPause(){tts.status='paused';tts.uid++;ttsHostDone=null;ttsCancelEngine();ttsRefresh();}
function ttsToggle(key,build){if(!ttsSupported()){toast('Bu cihazda/tarayıcıda yerleşik sesli okuma bulunamadı.');return;}if(tts.key===key&&tts.status==='playing'){ttsPause();return;}if(tts.key===key&&tts.status==='paused'){tts.status='playing';ttsRefresh();ttsNext();return;}ttsStop();const chunks=build();if(!chunks.length){toast('Okunacak metin bulunamadı.');return;}tts={key,chunks,index:0,status:'playing',uid:tts.uid+1};ttsRefresh();ttsNext();}
function ttsNext(){const my=++tts.uid;if(tts.status!=='playing')return;if(tts.index>=tts.chunks.length){tts={key:null,chunks:[],index:0,status:'idle',uid:tts.uid};ttsRefresh();return;}const c=tts.chunks[tts.index],cfg=ttsSettings();let text=c.text,lang=c.lang,voice=null;if(lang==='ar'){if(cfg.arabic==='skip'){tts.index++;ttsNext();return;}voice=cfg.arabic==='voice'?pickVoice('ar',cfg.arabicVoice):null;if(!voice){text='Arapça ifade.';lang='tr';}}if(lang==='tr')voice=pickVoice('tr',cfg.voice);const done=()=>{if(my!==tts.uid||tts.status!=='playing')return;tts.index++;ttsNext();};if(ttsHost){ttsHostDone=done;try{ttsHost.ttsSpeak('u'+my,text,lang==='ar'?'ar':'tr-TR',voice?.id||'',cfg.rate);}catch(e){ttsStop();toast('Cihazın sesli okuma motoru yanıt vermedi.');}return;}const u=new SpeechSynthesisUtterance(text);u.lang=voice?.lang||(lang==='ar'?'ar-SA':'tr-TR');if(voice?.native)u.voice=voice.native;u.rate=cfg.rate;u.pitch=cfg.pitch;u.onend=done;u.onerror=e=>{if(e.error==='interrupted'||e.error==='canceled')return;done();};ttsUtterance=u;speechSynthesis.speak(u);}
function ttsPrefix(){return view==='study'&&currentTest?currentBook.id+'/'+currentTest.id+'/'+currentTest.questions[currentState.index].id+':':'';}
function ttsRefresh(){const prefix=ttsPrefix();for(const el of document.querySelectorAll('[data-tts]')){const on=tts.key===prefix+el.dataset.tts,st=on?tts.status:'idle';el.classList.toggle('tts-playing',st==='playing');el.classList.toggle('tts-paused',st==='paused');el.querySelector('i').textContent=st==='playing'?'❚❚':st==='paused'?'▶':'🔊';el.setAttribute('aria-pressed',String(st==='playing'));el.title=(st==='playing'?'Duraklat · ':st==='paused'?'Sürdür · ':'Sesli oku · ')+el.dataset.label;}}
function ttsButton(part,label,text='',short=''){return `<button class="tts-btn" type="button" data-act="tts" data-tts="${esc(part)}" data-label="${esc(label)}" aria-label="${esc(label)} — sesli oku" title="Sesli oku · ${esc(label)}"><i aria-hidden="true">🔊</i>${text?`<span class="tts-long">${esc(text)}</span>`:''}${short?`<span class="tts-short">${esc(short)}</span>`:''}</button>`;}
function ttsRun(part){const q=currentTest.questions[currentState.index],key=ttsPrefix()+part;if(part==='q')ttsToggle(key,()=>speechForQuestion(q,currentState.index+1));else if(part==='all')ttsToggle(key,()=>speechForAllOptions(q));else if(part==='x')ttsToggle(key,()=>speechForSolution(q));else{const i=q.options.findIndex((o,j)=>optionKey(o,j)===part);if(i>=0)ttsToggle(key,()=>speechForOption(q.options[i],i));}}
function voiceOptions(lang,selected){const vs=ttsVoices(),match=vs.filter(v=>v.lang.toLowerCase().startsWith(lang)),rest=lang==='tr'?vs.filter(v=>!v.lang.toLowerCase().startsWith(lang)):[];const opt=v=>`<option value="${esc(v.id)}" ${v.id===selected?'selected':''}>${esc(v.name)} · ${esc(v.lang)}${v.local===false?' · çevrimiçi':''}</option>`;return `<option value="">Otomatik (${lang==='tr'?'Türkçe':'Arapça'} ses varsa)</option>${match.length?`<optgroup label="${lang==='tr'?'Türkçe sesler':'Arapça sesler'}">${match.map(opt).join('')}</optgroup>`:''}${rest.length?`<optgroup label="Diğer diller">${rest.map(opt).join('')}</optgroup>`:''}`;}
function ttsDialog(){const c=ttsSettings(),vs=ttsVoices(),hasTr=vs.some(v=>v.lang.toLowerCase().startsWith('tr')),hasAr=vs.some(v=>v.lang.toLowerCase().startsWith('ar'));dialog('Sesli okuma ayarları',`${ttsSupported()?'':'<div class="alert">Bu tarayıcı yerleşik sesli okumayı desteklemiyor. Güncel Chrome, Edge veya Safari deneyin; Android uygulamasında cihaz sesi kullanılır.</div>'}<p>Okuma, cihazının yerleşik metin okuma (TTS) motoruyla yapılır; internet gerekmez (bazı “çevrimiçi” sesler hariç). Soru düğmesi önce soru kökünü, sonra soruya ait bilgileri okur. Her şıkkın kendi düğmesi vardır. Okurken düğmeye yeniden basmak duraklatır, bir daha basmak kaldığı yerden sürdürür.</p>${vs.length&&!hasTr?'<div class="alert">Cihazında Türkçe ses bulunamadı. İşletim sisteminin dil/konuşma ayarlarından Türkçe ses paketi ekleyebilirsin.</div>':''}<label for="ttsVoice">Ses</label><select id="ttsVoice">${voiceOptions('tr',c.voice)}</select><label for="ttsRate">Okuma hızı: <output id="ttsRateValue">${c.rate.toFixed(2)}×</output></label><input id="ttsRate" type="range" min="0.5" max="2" step="0.05" value="${c.rate}"><label for="ttsPitch">Ses tonu: <output id="ttsPitchValue">${c.pitch.toFixed(2)}</output></label><input id="ttsPitch" type="range" min="0.5" max="1.5" step="0.05" value="${c.pitch}" ${ttsHost?'disabled':''}><label for="ttsArabic">Arapça ifadeler</label><select id="ttsArabic"><option value="voice" ${c.arabic==='voice'?'selected':''}>Arapça sesle oku (yoksa “Arapça ifade” de)</option><option value="name" ${c.arabic==='name'?'selected':''}>Yalnız “Arapça ifade” de</option><option value="skip" ${c.arabic==='skip'?'selected':''}>Atla</option></select>${hasAr?`<label for="ttsArabicVoice">Arapça ses</label><select id="ttsArabicVoice">${voiceOptions('ar',c.arabicVoice)}</select>`:''}<label class="check-row"><input id="ttsAnnounce" type="checkbox" ${c.announce?'checked':''}> Okumaya “Soru 5.”, “A şıkkı.” gibi başlık ekle</label><div class="row"><button data-act="ttsTest">🔊 Sesi dene</button></div><p class="file-help">${vs.length} ses bulundu. Sesler ilk açılışta geç yüklenebilir; liste boşsa pencereyi kapatıp yeniden aç. Kısayol: soru ekranında <b>R</b> soruyu okur/duraklatır.</p>`);}
function ttsInput(e){const t={...ttsSettings()};const id=e.target.id;if(id==='ttsVoice')t.voice=e.target.value;else if(id==='ttsArabicVoice')t.arabicVoice=e.target.value;else if(id==='ttsRate'){t.rate=Number(e.target.value);$('#ttsRateValue').textContent=t.rate.toFixed(2)+'×';}else if(id==='ttsPitch'){t.pitch=Number(e.target.value);$('#ttsPitchValue').textContent=t.pitch.toFixed(2);}else if(id==='ttsArabic')t.arabic=e.target.value;else if(id==='ttsAnnounce')t.announce=e.target.checked;else return;state.tts=t;save();syncSettingsSoon();}

function togglePeek(){if(locked||currentState.checked)return;pulse();const s=currentState,q=currentTest.questions[s.index],a=s.answers[q.id]||null;const p=s.peeks[q.id];if(p?.open){p.open=false;showSolution=false;}else{if(!q.answer){toast('Bu sorunun cevap anahtarı yok; tek başına kontrol edilemez.');return;}const tryRec={at:new Date().toISOString(),answer:a,correct:a?a===q.answer:null};if(p){p.open=true;p.tries=[...(p.tries||[]),tryRec].slice(-20);}else s.peeks[q.id]={...tryRec,open:true,tries:[tryRec]};}stampQ(s,q.id);save();render();}

function touchedTest(s){return !!s&&(Object.keys(s.answers||{}).length>0||Object.values(s.notes||{}).some(x=>String(x).trim())||(s.history||[]).length>0||Object.keys(s.peeks||{}).length>0||Object.keys(s.hl||{}).length>0);}
function analysisPackage(scope){const p=activeProfile(),out={format:'test-atolyesi-analysis',version:1,generatedAt:new Date().toISOString(),readFirst:'ÖNCE readFirstGuide alanını oku. Sonra books[].meta (kitabın amacı/kapsamı), ardından tests[].questions[] içindeki userAnswer, result, options[userAnswer].diagnosis, note ve singleCheck alanlarını değerlendir.',readFirstGuide:aiGuideText(),app:{name:'Eğitim Atölyesi',schema:'importContract (HTML başında) + bu paket'},profile:{name:p.name},summary:{tests:0,answered:0,correct:0,wrong:0,blank:0,notes:0,singleChecks:0},books:[]};
 for(const b of books){if(scope&&scope!==b.id)continue;const tests=[];for(const t of b.tests){const s=state.tests[b.id+'/'+t.id];if(!touchedTest(s))continue;const qs=t.questions.map((q,i)=>{const st=splitStem(q),a=s.answers[q.id]||null,pk=s.peeks?.[q.id],note=String(s.notes?.[q.id]||'').trim(),result=!q.answer?'anahtar-yok':!a?'boş':a===q.answer?'doğru':'yanlış';if(a)out.summary.answered++;if(result==='doğru')out.summary.correct++;else if(result==='yanlış')out.summary.wrong++;else if(result==='boş')out.summary.blank++;if(note)out.summary.notes++;if(pk)out.summary.singleChecks++;const rec={id:q.id,number:q.number||i+1,topic:q.topic,concepts:q.concepts,level:q.level,stem:st.stem,context:st.context||undefined,passage:q.passage||undefined,tables:q.blocks?.length?blocksSpeech(q.blocks):undefined,figures:(q.figures||[]).map(f=>f.alt).filter(Boolean),options:Object.fromEntries(q.options.map((o,j)=>[optionKey(o,j),{text:optionText(o),diagnosis:o.diagnosis||undefined}])),answer:q.answer??null,userAnswer:a,result,timeSec:Math.round(s.times?.[q.id]||0),time:timeInfo(Math.round(s.times?.[q.id]||0),(s.elapsed||0)>0),eliminated:s.elims?.[q.id]?.length?s.elims[q.id]:undefined,notEliminated:q.answer&&s.elims?.[q.id]?.length?q.options.map((o,j)=>optionKey(o,j)).filter(k=>!s.elims[q.id].includes(k)):undefined,answerTrail:s.trail?.[q.id]?.length>1?s.trail[q.id]:undefined,unknownOptions:s.unk?.[q.id]?.length?s.unk[q.id]:undefined,unknownPhrases:s.unkText?.[q.id]?.length?s.unkText[q.id]:undefined,highlights:s.hl?.[q.id]?.length?s.hl[q.id].map(h=>({text:h.t,where:h.w,color:h.color,style:h.style,at:h.at})):undefined,carelessMistake:s.oops?.[q.id]?true:undefined,flaggedForLater:!!s.flags?.[q.id],note:note||undefined,singleCheck:pk?{firstAt:pk.at,answerAtFirstCheck:pk.answer,correctAtFirstCheck:pk.correct,checks:(pk.tries||[]).length}:undefined,keyEditedByUser:Object.hasOwn(s.keyOverrides||{},q.id)||undefined,keyDoubt:q.keyDoubt||undefined,bookExplanation:q.explanation||undefined};if(!rec.figures.length)delete rec.figures;return rec;});out.summary.tests++;tests.push({id:t.id,title:t.title,section:t.section,topic:t.topic,checked:!!s.checked,elapsedSec:Math.round(s.elapsed||0),limits:{testSec:s.limit||0,questionSec:s.qLimit||0},result:s.checked?counts(t,s):null,attempts:(s.history||[]).map(h=>({at:h.at,correct:h.correct,wrong:h.wrong,blank:h.blank,elapsedSec:Math.round(h.elapsed||0),answers:h.answers})),questions:qs});}
  if(tests.length)out.books.push({id:b.id,title:b.title,author:b.author,year:b.year,description:b.description,meta:b.meta,testsInBook:b.tests.length,questionsInBook:b.tests.reduce((n,t)=>n+t.questions.length,0),sections:[...new Set(b.tests.map(t=>t.section).filter(Boolean))],tests});}
 const topics=new Map();for(const b of out.books)for(const t of b.tests)for(const q of t.questions){if(q.result==='anahtar-yok')continue;const k=b.title+' › '+(q.topic||t.topic||t.section||'Konu belirtilmemiş');const r=topics.get(k)||{topic:k,questions:0,correct:0,wrong:0,blank:0};r.questions++;if(q.result==='doğru')r.correct++;else if(q.result==='yanlış')r.wrong++;else r.blank++;topics.set(k,r);}
 out.summary.topics=[...topics.values()].sort((x,y)=>y.wrong-x.wrong||y.blank-x.blank);out.summary.note='summary.topics yalnız ham sayımdır; yorum için soru düzeyindeki şık tanılarını ve notları kullan.';
 return out;}

function helpExtra(){return `<article><h3>Profiller</h3><p>Üst çubuktaki 👤 düğmesinden profil oluşturabilir, profiller arasında geçebilirsin. Kitaplar herkese ortaktır; cevaplar, notlar, süreler, tek soru kontrolleri, cevap anahtarı düzeltmeleri ve ayarlar profile özeldir.</p><p>Profiller HTML dosyasının içinde tutulur: “HTML’ye otomatik kayıt” bağlıyken her değişiklik dosyaya yazılır, dosyayı başka cihaza taşıdığında profiller de gelir. Profil adı parola değildir.</p></article><article><h3>Tek soru kontrolü</h3><p>Testi bitirmeden bir sorunun cevabını merak edersen “✓ Bu soruyu kontrol et” düğmesine bas (kısayol: <b>K</b>). Yalnız o sorunun doğru/yanlış sonucu ve istersen kitap açıklaması açılır; kontrol açıkken cevap kilitlenir, “Kontrolü gizle” ile kapatırsın.</p><p>İlk kontrol anındaki cevabın ayrıca kaydedilir; yapay zekâ analizinde “bakarak düzeltilmiş” cevaplar ayırt edilir.</p></article><article><h3>Sesli okuma</h3><p>Soru başlığındaki 🔊 düğmesi soruyu, her şıkkın yanındaki 🔊 o şıkkı, “Şıkları oku” bütün şıkları okur. Okurken aynı düğmeye basmak duraklatır, yeniden basmak sürdürür. Uzun sorularda önce soru kökü, sonra soruya ait bilgiler okunur.</p><p>Ses ve okuma hızı sol menüdeki “Sesli okuma” bölümünden seçilir; cihazının yerleşik sesleri listelenir.</p></article><article><h3>Yapay zekâ ile analiz</h3><p>Sol menüdeki “YZ analizi” profilinin çözümlerini tek bir JSON paketine dönüştürür. Pakette, seçilen her yanlış şıkkın hangi bilgi eksikliğine işaret ettiğini anlatan şık tanıları ve notların bulunur. Paketi ve istem metnini bir yapay zekâya vererek konu konu güçlü ve eksik yönlerini çıkarttırabilirsin.</p><p>Bir yapay zekâ bu HTML dosyasını doğrudan okursa önce dosyanın başındaki <code>aiAnalysisGuide</code> ve <code>importContract</code> betiklerini okumalıdır.</p><button data-act="analysis">YZ analizi</button></article>`;}

function persist(){try{localStorage.setItem(key,JSON.stringify(strokes));}catch(e){toast('Çizim cihazda saklanamadı.');}}
function path(s){const p=s.points;if(!p.length)return;const w=canvas.clientWidth,h=canvas.clientHeight;ctx.strokeStyle=s.color;ctx.fillStyle=s.color;ctx.lineWidth=s.width;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(p[0][0]*w,p[0][1]*h);if(p.length===1){ctx.arc(p[0][0]*w,p[0][1]*h,s.width/2,0,Math.PI*2);ctx.fill();return;}for(let i=1;i<p.length-1;i++)ctx.quadraticCurveTo(p[i][0]*w,p[i][1]*h,(p[i][0]+p[i+1][0])*w/2,(p[i][1]+p[i+1][1])*h/2);const last=p[p.length-1];ctx.lineTo(last[0]*w,last[1]*h);ctx.stroke();}
function draw(){if(!ctx)return;ctx.clearRect(0,0,canvas.clientWidth,canvas.clientHeight);strokes.forEach(path);if(active)path(active);}
function resize(){if(!canvas?.isConnected)return;const r=canvas.parentElement.getBoundingClientRect(),d=window.devicePixelRatio||1;canvas.style.width=r.width+'px';canvas.style.height=r.height+'px';canvas.width=Math.round(r.width*d);canvas.height=Math.round(r.height*d);ctx=canvas.getContext('2d');ctx.setTransform(d,0,0,d,0,0);draw();}
function point(e){const r=canvas.getBoundingClientRect();return [(e.clientX-r.left)/r.width,(e.clientY-r.top)/r.height];}

function attach(){

 const title=document.querySelector('.question-title .q-title-tools'),paper=document.querySelector('article.question');if(!title||!paper)return;
 const toggle=document.createElement('button');toggle.className='small ink-toggle';toggle.title='Kalem araçlarını aç veya tamamen kapat';toggle.setAttribute('aria-label','Kalem araçları');toggle.textContent='✎';title.prepend(toggle);

 function update(){dock.hidden=!enabled;toggle.classList.toggle('primary',enabled);toggle.setAttribute('aria-pressed',String(enabled));canvas.style.pointerEvents=enabled&&drawing&&!locked?'auto':'none';palette.hidden=!panelOpen;handle.classList.toggle('is-drawing',drawing);handle.textContent=drawing?'✎':'✋';dock.querySelector('.ink-draw').classList.toggle('primary',drawing);dock.querySelector('.ink-pan').classList.toggle('primary',!drawing);dock.querySelector('select').value=String(width);dock.querySelectorAll('[data-color]').forEach(b=>b.classList.toggle('selected',b.dataset.color===color));position();}
 toggle.onclick=()=>{enabled=!enabled;drawing=enabled;panelOpen=false;update();};
 let drag=null,suppress=false;
 handle.onpointerdown=e=>{if(e.button!==0)return;handle.setPointerCapture(e.pointerId);drag={x:e.clientX,y:e.clientY,px:pos.x,py:pos.y,at:performance.now(),moved:false};suppress=false;};

 handle.onclick=()=>{if(suppress){suppress=false;return;}panelOpen=!panelOpen;update();};
 dock.querySelector('.ink-draw').onclick=()=>{drawing=true;panelOpen=false;update();};

 dock.querySelector('.ink-undo').onclick=()=>{strokes.pop();persist();draw();};dock.querySelector('.ink-clear').onclick=()=>{strokes=[];persist();draw();};
 const touches=new Map();let gesture=false,lastY=0;
 canvas.onpointerdown=e=>{if(!enabled||!drawing||locked||e.button!==0)return;e.preventDefault();canvas.setPointerCapture(e.pointerId);if(e.pointerType==='touch'){touches.set(e.pointerId,e.clientY);if(touches.size>1){active=null;gesture=true;lastY=[...touches.values()].reduce((a,b)=>a+b,0)/touches.size;draw();return;}}active={color,width,points:[point(e)]};draw();};

 observer=new ResizeObserver(()=>{resize();position();});observer.observe(paper);resize();update();
}

// ── Google Drive senkronu (web sürümü) ───────────────────────────────────────
// "Google ile giriş" (Google Identity Services, yalnız drive.file izni): uygulama Drive'da yalnız kendi açtığı
// "Test Atölyesi" klasörünü görür. Orada profiller.json (bütün profiller) ve kitap-<id>.json dosyaları durur.
// Çalışma her zaman cihazdaki kopyadadır; değişiklikler en geç 15 sn'de bir Drive'a yazılır, açılışta ve sekmeye
// dönüldüğünde Drive'daki sürüm çekilip profil profil birleştirilir (en yeni kayıt kazanır). Şifre uygulamaya hiç gelmez.
const CLOUD_CFG=(()=>{try{return JSON.parse($('#cloudConfig')?.textContent||'{}')||{};}catch(e){return{};}})();
const CLOUD_KEY='test-atolyesi:cloud', CLOUD_FOLDER='Test Atölyesi', CLOUD_STORE='profiller.json', DRIVE='https://www.googleapis.com/drive/v3', UPLOAD='https://www.googleapis.com/upload/drive/v3';
const cloudReady=()=>!!CLOUD_CFG.clientId&&(location.protocol==='https:'||/^(localhost|127\.0\.0\.1)$/.test(location.hostname));
let cloud={token:'',exp:0,status:'off',err:'',lastSync:0,busy:false,dirtyAt:0,lastUploaded:'',timer:null,tokenClient:null,gis:null};
const cloudMeta=(()=>{try{return JSON.parse(localStorage.getItem(CLOUD_KEY)||'{}')||{};}catch(e){return{};}})();
function cloudKeepToken(){try{if(cloud.token)sessionStorage.setItem('ta-oauth-token',JSON.stringify({t:cloud.token,e:cloud.exp}));else sessionStorage.removeItem('ta-oauth-token');}catch(e){}}
try{const k=JSON.parse(sessionStorage.getItem('ta-oauth-token')||'null');if(k&&k.e>Date.now()+60000){cloud.token=k.t;cloud.exp=k.e;}}catch(e){}
const cloudMode=()=>cloudMeta.mode==='dev'&&CLOUD_CFG.devFolderId?'dev':'own';
const cloudScope=()=>cloudMode()==='dev'?'https://www.googleapis.com/auth/drive':'https://www.googleapis.com/auth/drive.file';
function cloudSaveMeta(){try{localStorage.setItem(CLOUD_KEY,JSON.stringify(cloudMeta));}catch(e){}}
function cloudLabel(){if(!cloudReady()||!cloudMeta.enabled)return '';if((!cloud.token||Date.now()>cloud.exp-60000)&&cloudPending())return ' · ⚠ Drive’a gönderilmeyen değişiklik var';return{ok:' · Drive ✓',syncing:' · Drive eşitleniyor…',login:' · Drive: yeniden bağlan',error:' · Drive hatası',signing:' · Drive bağlanıyor…'}[cloud.status]||' · Drive';}
function cloudSet(status,err=''){cloud.status=status;cloud.err=err;updateSaveStatus();if($('#cloudPanel'))$('#cloudPanel').outerHTML=cloudPanelHTML();}
function loadGIS(){if(cloud.gis)return cloud.gis;cloud.gis=new Promise((res,rej)=>{if(window.google?.accounts?.oauth2)return res();const s=document.createElement('script');s.src='https://accounts.google.com/gsi/client';s.async=true;s.onload=()=>res();s.onerror=()=>{cloud.gis=null;rej(Error('Google giriş betiği yüklenemedi (internet?)'));};document.head.append(s);});return cloud.gis;}
// Giriş, açılır pencere yerine aynı sekmede Google'a gidip dönerek yapılır (telefonda/PWA'da pencere engellenmez).
// Dönüşte erişim anahtarı adres çubuğunun # kısmından alınır ve hemen silinir.
function cloudRedirectLogin(){$('#cloudNag')?.remove();pulse();save();const st=Math.random().toString(36).slice(2);try{sessionStorage.setItem('ta-oauth-state',st);}catch(e){}const p=new URLSearchParams({client_id:CLOUD_CFG.clientId,redirect_uri:CLOUD_CFG.url||location.origin+location.pathname,response_type:'token',scope:cloudScope(),include_granted_scopes:'true',state:st});if(cloudMeta.email)p.set('login_hint',cloudMeta.email);else p.set('prompt','select_account');delete cloudMeta.pickAccount;cloudSaveMeta();location.href='https://accounts.google.com/o/oauth2/v2/auth?'+p;}
(function cloudRedirectReturn(){if(!location.hash.includes('access_token='))return;const h=new URLSearchParams(location.hash.slice(1));let st='';try{st=sessionStorage.getItem('ta-oauth-state')||'';sessionStorage.removeItem('ta-oauth-state');}catch(e){}history.replaceState(null,'',location.pathname+location.search);if(!st||h.get('state')!==st)return;cloud.token=h.get('access_token');cloud.exp=Date.now()+(Number(h.get('expires_in'))||3600)*1000;cloudKeepToken();cloudMeta.enabled=true;cloudSaveMeta();})();
async function cloudToken(interactive){if(cloud.token&&Date.now()<cloud.exp-60000)return cloud.token;if(interactive){cloudRedirectLogin();return new Promise(()=>{});}await loadGIS();return new Promise((res,rej)=>{cloud.tokenClient=google.accounts.oauth2.initTokenClient({client_id:CLOUD_CFG.clientId,scope:cloudScope(),login_hint:cloudMeta.email||undefined,callback:r=>{if(r.error)return rej(Error(r.error_description||r.error));cloud.token=r.access_token;cloud.exp=Date.now()+(Number(r.expires_in)||3600)*1000;cloudKeepToken();res(cloud.token);},error_callback:e=>rej(Error(e?.message||e?.type||'Giriş penceresi kapandı'))});cloud.tokenClient.requestAccessToken({prompt:interactive&&!cloudMeta.enabled?'consent':''});});}
async function gapi(url,opt={},retry=true){const tok=await cloudToken(false);const r=await fetch(url,{...opt,headers:{...(opt.headers||{}),Authorization:'Bearer '+tok}});if(r.status===401&&retry){cloud.token='';return gapi(url,opt,false);}if(!r.ok)throw Error('Drive '+r.status+': '+(await r.text()).slice(0,160));return r;}
const enc=s=>encodeURIComponent(s);
async function cloudFind(query){const r=await gapi(DRIVE+'/files?spaces=drive&supportsAllDrives=true&includeItemsFromAllDrives=true&fields=files(id,name,modifiedTime,appProperties)&pageSize=200&q='+enc(query+' and trashed=false'));return (await r.json()).files||[];}
async function cloudFolder(){if(cloudMode()==='dev')return CLOUD_CFG.devFolderId;if(cloudMeta.folderId){try{const r=await gapi(DRIVE+'/files/'+cloudMeta.folderId+'?fields=id,trashed');const f=await r.json();if(!f.trashed)return f.id;}catch(e){}}const found=await cloudFind(`mimeType='application/vnd.google-apps.folder' and name='${CLOUD_FOLDER}'`);let id=found[0]?.id;if(!id){const r=await gapi(DRIVE+'/files?fields=id',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:CLOUD_FOLDER,mimeType:'application/vnd.google-apps.folder'})});id=(await r.json()).id;}cloudMeta.folderId=id;cloudSaveMeta();return id;}
async function cloudWrite(fileId,name,folder,text,props){if(fileId){await gapi(UPLOAD+'/files/'+fileId+'?uploadType=media',{method:'PATCH',headers:{'Content-Type':'application/json; charset=UTF-8'},body:text});return fileId;}const b='ta'+Math.random().toString(36).slice(2),meta={name,parents:[folder],mimeType:'application/json',appProperties:props||{}};const body=`--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${JSON.stringify(meta)}\r\n--${b}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n${text}\r\n--${b}--`;const r=await gapi(UPLOAD+'/files?uploadType=multipart&fields=id',{method:'POST',headers:{'Content-Type':'multipart/related; boundary='+b},body});return (await r.json()).id;}
async function cloudRead(id){return (await gapi(DRIVE+'/files/'+id+'?alt=media')).text();}
function adoptStore(merged){const active=store.active;store=merged;if(store.profiles.some(p=>p.id===active))store.active=active;state=activeProfile().state;lastLocalSnapshot='';applyKeyOverrides();if(view==='study'&&currentBook&&currentTest)currentState=getState(currentBook,currentTest);}
async function cloudSync(interactive=false){if(!cloudReady()||locked||cloud.busy)return;cloud.busy=true;cloudSet(cloud.token?'syncing':'signing');try{await cloudToken(interactive);if(!cloudMeta.email){try{const r=await gapi(DRIVE+'/about?fields=user(emailAddress)');cloudMeta.email=(await r.json()).user?.emailAddress||'';}catch(e){}}cloudMeta.enabled=true;cloudSaveMeta();cloudSet('syncing');const folder=await cloudFolder();
  // Profiller: Drive'daki sürümle birleştir, sonucu geri yaz.
  pulse();save();const sf=(await cloudFind(`name='${CLOUD_STORE}' and '${folder}' in parents`))[0];let remote=null;if(sf){try{remote=normalizeStore(JSON.parse(await cloudRead(sf.id)));}catch(e){remote=null;}}const merged=remote?mergeStores(store,remote):store;const before=JSON.stringify(store);if(JSON.stringify(merged)!==before){adoptStore(merged);save();render();}const text=JSON.stringify(store);if(!remote||text!==JSON.stringify(remote))cloudMeta.storeId=await cloudWrite(sf?.id,CLOUD_STORE,folder,text);else cloudMeta.storeId=sf.id;cloud.lastUploaded=text;
  // Kitaplar: eksik olanı indir, Drive'da olmayanı yükle.
  const remoteBooks=(cloudMode()==='dev'?await cloudFind(`'${folder}' in parents and name contains 'kitap-'`):await cloudFind(`'${folder}' in parents and appProperties has { key='kind' and value='book' }`)).filter(f=>/^kitap-.+\.json$/.test(f.name)).map(f=>({...f,appProperties:{kind:'book',bookId:f.appProperties?.bookId||f.name.slice(6,-5),contentVersion:f.appProperties?.contentVersion||''}}));for(const f of remoteBooks){const id=f.appProperties.bookId;const old=bookCatalog.find(b=>b.id===id);if(old)old._driveId=f.id;else bookCatalog.push({id,title:f.name.slice(6,-5),tests:[],_driveId:f.id});}refreshBookList();render();
  for(const b of books.filter(b=>!b._catalog)){if(remoteBooks.some(f=>f.appProperties?.bookId===b.id&&(!f.appProperties?.contentVersion||Number(f.appProperties.contentVersion)>=Number(b.contentVersion||0))))continue;const old=remoteBooks.find(f=>f.appProperties?.bookId===b.id);await cloudWrite(old?.id,'kitap-'+b.id+'.json',folder,JSON.stringify({format:'test-atolyesi',version:1,books:[b]}),{kind:'book',bookId:b.id,contentVersion:String(b.contentVersion||0)});if(old)await gapi(DRIVE+'/files/'+old.id,{method:'PATCH',headers:{'Content-Type':'application/json'},body:JSON.stringify({appProperties:{kind:'book',bookId:b.id,contentVersion:String(b.contentVersion||0)}})});}
  cloudSaveMeta();cloud.lastSync=Date.now();cloud.dirtyAt=0;cloudSet('ok');}catch(e){const m=String(e.message||e);cloudSet(/popup|consent|interaction|closed|denied|access_denied|login/i.test(m)?'login':'error',cloudErrText(m));}finally{cloud.busy=false;}}
// Sık kaydetme (süre her saniye işler) Drive'ı yormasın: değişiklik varsa en geç 15 sn'de bir yükle.
async function cloudPush(){cloud.timer=null;if(!cloudMeta.enabled||!cloud.token||cloud.busy||locked)return;const text=JSON.stringify(store);if(text===cloud.lastUploaded)return;cloud.busy=true;try{const folder=await cloudFolder();cloudMeta.storeId=await cloudWrite(cloudMeta.storeId,CLOUD_STORE,folder,text);cloudSaveMeta();cloud.lastUploaded=text;cloud.lastSync=Date.now();cloudSet('ok');}catch(e){cloudSet('error',cloudErrText(String(e.message||e)));}finally{cloud.busy=false;}}
function cloudPending(){return cloudMeta.enabled&&JSON.stringify(store)!==cloud.lastUploaded;}
function cloudQueue(){if(!cloudReady()||!cloudMeta.enabled)return;if(!cloud.token||Date.now()>cloud.exp-60000){cloudNag();return;}if(!cloud.timer)cloud.timer=setTimeout(cloudPush,15000);}
function cloudFlush(){if(!cloudMeta.enabled||!cloud.token||!cloudMeta.storeId)return;const text=JSON.stringify(store);if(text===cloud.lastUploaded)return;try{fetch(UPLOAD+'/files/'+cloudMeta.storeId+'?uploadType=media',{method:'PATCH',keepalive:text.length<60000,headers:{Authorization:'Bearer '+cloud.token,'Content-Type':'application/json; charset=UTF-8'},body:text});cloud.lastUploaded=text;}catch(e){}}

async function syncPull(){if(!syncOn()||document.hidden||sync.pulling)return;sync.pulling=true;try{const r=await fetch(SYNC_URL+(SYNC_URL.includes('?')?'&':'?')+'since='+sync.cursor);if(!r.ok)throw Error('HTTP '+r.status);const j=await r.json();if(j.error)throw Error(j.error);let changed=false;for(const raw of j.ops||[]){let op;try{op=typeof raw==='string'?JSON.parse(raw):raw;}catch(e){continue;}if(op.d===syncDevice)continue;if(syncApply(op))changed=true;}const first=!sync.cursor;sync.cursor=Number(j.cursor)||sync.cursor;sync.ok=Date.now();sync.err='';syncSaveQ();if(changed){state=activeProfile().state;applyKeyOverrides();if(view==='study'&&currentBook&&currentTest)currentState=getState(currentBook,currentTest);lastLocalSnapshot='';save();if(!/TEXTAREA|INPUT|SELECT/.test(document.activeElement?.tagName||''))render();}if(first)syncSeed();if(j.more)setTimeout(()=>{sync.pulling=false;syncPull();},150);}catch(e){sync.err=String(e.message||e);}finally{sync.pulling=false;updateSaveStatus();}}

 let data;if(meta?._driveId){data=JSON.parse(await cloudRead(meta._driveId));}else{const r=await fetch(SYNC_URL+(SYNC_URL.includes('?')?'&':'?')+'book='+encodeURIComponent(id));if(!r.ok)throw Error('HTTP '+r.status);data=await r.json();}
 const b=validateBook(data.format==='test-atolyesi'?data.books[0]:data);if(b.id!==id)throw Error('Kitap kimliği uyuşmuyor');

 }catch(e){toast('Kitap indirilemedi: '+e.message+'. Profil kayıtların korunuyor.');return false;}finally{bookDownloads.delete(id);}})();

}

function noiseBuffer(ctx,kind,sec=12){const n=ctx.sampleRate*sec,b=ctx.createBuffer(2,n,ctx.sampleRate);for(let ch=0;ch<2;ch++){const d=b.getChannelData(ch);let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0,last=0;for(let i=0;i<n;i++){const w=Math.random()*2-1;if(kind==='brown'){last=(last+.02*w)/1.02;d[i]=last*3.5;}else{b0=.99886*b0+w*.0555179;b1=.99332*b1+w*.0750759;b2=.969*b2+w*.153852;b3=.8665*b3+w*.3104856;b4=.55*b4+w*.5329522;b5=-.7616*b5-w*.016898;d[i]=(b0+b1+b2+b3+b4+b5+b6+w*.5362)*.11;b6=w*.115926;}}
 // Döngü dikişini yumuşat (son 0,5 sn başa karışır)
 const f=Math.floor(ctx.sampleRate*.5);for(let i=0;i<f;i++){const t=i/f;d[i]=d[i]*t+d[n-f+i]*(1-t);}}return b;}
function focusLoop(ctx,kind){const s=ctx.createBufferSource();s.buffer=noiseBuffer(ctx,kind);s.loop=true;s.loopStart=.5;return s;}
function lfo(ctx,freq,depth,target,base){const o=ctx.createOscillator(),g=ctx.createGain();o.frequency.value=freq;g.gain.value=depth;o.connect(g);g.connect(target);if(base!=null)target.value=base;o.start();return o;}
function focusBuild(id){const ctx=focus.ctx,out=ctx.createGain(),N=[out],def=FOCUS_SOUNDS.find(s=>s.id===id);out.connect(focus.master);const add=n=>{N.push(n);return n;};
 if(id==='brown'||id==='pink'){const s=add(focusLoop(ctx,id));const lp=add(ctx.createBiquadFilter());lp.type='lowpass';lp.frequency.value=id==='brown'?900:5000;s.connect(lp);lp.connect(out);out.gain.value=id==='brown'?.9:.55;s.start();}
 else if(id==='rain'){const s=add(focusLoop(ctx,'pink')),hp=add(ctx.createBiquadFilter()),lp=add(ctx.createBiquadFilter()),g=add(ctx.createGain());hp.type='highpass';hp.frequency.value=500;lp.type='lowpass';lp.frequency.value=7000;s.connect(hp);hp.connect(lp);lp.connect(g);g.connect(out);g.gain.value=.5;add(lfo(ctx,.13,.12,g.gain));
  const d=add(focusLoop(ctx,'pink')),bp=add(ctx.createBiquadFilter()),dg=add(ctx.createGain());bp.type='bandpass';bp.frequency.value=2500;bp.Q.value=1.2;d.connect(bp);bp.connect(dg);dg.connect(out);dg.gain.value=.18;add(lfo(ctx,3.1,.16,dg.gain));s.start();d.start();}
 else if(id==='ocean'){const s=add(focusLoop(ctx,'brown')),lp=add(ctx.createBiquadFilter()),g=add(ctx.createGain());lp.type='lowpass';lp.frequency.value=700;s.connect(lp);lp.connect(g);g.connect(out);g.gain.value=.55;add(lfo(ctx,1/12,.45,g.gain));add(lfo(ctx,1/12,500,lp.frequency));
  const f=add(focusLoop(ctx,'pink')),hp=add(ctx.createBiquadFilter()),fg=add(ctx.createGain());hp.type='highpass';hp.frequency.value=1800;f.connect(hp);hp.connect(fg);fg.connect(out);fg.gain.value=.06;add(lfo(ctx,1/12,.06,fg.gain));s.start();f.start();}
 else if(def?.beat){for(const [side,hz] of [[-1,def.car],[1,def.car+def.beat]]){const o=add(ctx.createOscillator()),p=add(ctx.createStereoPanner()),g=add(ctx.createGain());o.type='sine';o.frequency.value=hz;p.pan.value=side;g.gain.value=.22;o.connect(g);g.connect(p);p.connect(out);o.start();}
  const bed=add(focusLoop(ctx,'brown')),bl=add(ctx.createBiquadFilter()),bg=add(ctx.createGain());bl.type='lowpass';bl.frequency.value=600;bed.connect(bl);bl.connect(bg);bg.connect(out);bg.gain.value=.25;bed.start();}
 else if(def?.hz){for(const [m,v] of [[1,.22],[.5,.12],[1.5,.05]]){const o=add(ctx.createOscillator()),g=add(ctx.createGain());o.type='sine';o.frequency.value=def.hz*m;g.gain.value=v;o.connect(g);g.connect(out);o.start();add(lfo(ctx,.07+m*.03,v*.35,g.gain));}}
 else if(id==='pad'){const notes=[110,164.81,220,261.63,329.63,392];const lp=add(ctx.createBiquadFilter());lp.type='lowpass';lp.frequency.value=1200;lp.connect(out);add(lfo(ctx,.03,500,lp.frequency));notes.forEach((hz,i)=>{for(const det of [-4,4]){const o=add(ctx.createOscillator()),g=add(ctx.createGain());o.type=i<2?'sine':'triangle';o.frequency.value=hz;o.detune.value=det;g.gain.value=.045;o.connect(g);g.connect(lp);o.start();add(lfo(ctx,.02+i*.011,.035,g.gain));}});}
 return N;}
function focusPlay(id){const ctx=focusCtx();if(!ctx){toast('Bu tarayıcı ses üretmeyi desteklemiyor.');return;}if(ctx.state==='suspended')ctx.resume();if(focus.el)focus.el.play().catch(()=>{});const old=focus.nodes;focus.nodes=focusBuild(id);focus.cur=id;focus.last=id;try{localStorage.setItem('test-atolyesi:focusLast',id);}catch(e){}
 const t=ctx.currentTime,m=focus.master.gain;m.cancelScheduledValues(t);m.setValueAtTime(m.value,t);m.linearRampToValueAtTime(focus.vol*.8,t+1.2);
 if(old.length){const og=old[0].gain;og.setValueAtTime(og.value,t);og.linearRampToValueAtTime(0,t+.8);setTimeout(()=>focusKill(old),1000);}
 if('mediaSession' in navigator){try{const s=FOCUS_SOUNDS.find(x=>x.id===id);navigator.mediaSession.metadata=new MediaMetadata({title:s.n,artist:'Test Atölyesi · Odak sesleri',album:s.g});navigator.mediaSession.playbackState='playing';}catch(e){}}focusRefresh();}
function focusKill(nodes){for(const n of nodes){try{n.stop&&n.stop();}catch(e){}try{n.disconnect();}catch(e){}}}
function focusStop(){if(!focus.ctx||!focus.cur){focusRefresh();return;}const t=focus.ctx.currentTime,m=focus.master.gain;m.cancelScheduledValues(t);m.setValueAtTime(m.value,t);m.linearRampToValueAtTime(0,t+.8);const old=focus.nodes;focus.nodes=[];focus.cur=null;setTimeout(()=>{focusKill(old);if(!focus.cur){focus.el?.pause();focus.ctx.suspend();}},900);if('mediaSession' in navigator)try{navigator.mediaSession.playbackState='paused';}catch(e){}focusRefresh();}
function focusSetVol(v){focus.vol=Math.min(1,Math.max(0,v));try{localStorage.setItem('test-atolyesi:focusVol',String(focus.vol));}catch(e){}if(focus.ctx&&focus.cur){const t=focus.ctx.currentTime;focus.master.gain.setTargetAtTime(focus.vol*.8,t,.1);}}
function focusButton(){return `<button class="small focus-chip ${focus.cur?'on':''}" data-act="focusToggle" title="Odak sesleri" aria-label="Odak sesleri">🎧${focus.cur?'<span class="focus-eq"><i></i><i></i><i></i></span>':''}</button>`;}
function focusPanelHTML(){let g='';return `<div class="focus-head"><strong>🎧 Odak sesleri</strong><button class="small" data-act="focusClose" aria-label="Kapat">✕</button></div><div class="focus-list">${FOCUS_SOUNDS.map(s=>{const h=s.g!==g?`<div class="focus-group">${esc(s.g)}</div>`:'';g=s.g;return h+`<button class="focus-item ${focus.cur===s.id?'on':''}" data-act="focusPick" data-id="${s.id}"><b>${focus.cur===s.id?'❚❚':'▶'}</b><span>${esc(s.n)}<small>${esc(s.d)}</small></span></button>`;}).join('')}</div><div class="focus-foot"><label for="focusVol">Ses</label><input id="focusVol" type="range" min="0" max="1" step="0.02" value="${focus.vol}"><button class="small ${focus.cur?'primary':''}" data-act="focusMain">${focus.cur?'■ Durdur':'▶ Çal'}</button></div><p class="file-help">Sesler cihazında üretilir; internet ve veri harcamaz. Binaural frekanslar için kulaklık tak.</p>`;}
function focusRefresh(){const p=$('#focusPanel');if(p&&focus.open)p.innerHTML=focusPanelHTML();for(const b of document.querySelectorAll('.focus-chip'))b.outerHTML=focusButton();}
function focusToggle(){let p=$('#focusPanel');if(!p){p=document.createElement('div');p.id='focusPanel';p.className='focus-panel';p.setAttribute('role','dialog');p.setAttribute('aria-label','Odak sesleri');document.body.append(p);}focus.open=!focus.open;p.classList.toggle('hidden',!focus.open);if(focus.open)p.innerHTML=focusPanelHTML();}
document.addEventListener('click',e=>{const el=e.target.closest('[data-act]');if(!el)return;const a=el.dataset.act;if(a==='focusToggle'){e.stopPropagation();focusToggle();}else if(a==='focusClose'){focus.open=false;$('#focusPanel')?.classList.add('hidden');}else if(a==='focusPick'){if(focus.cur===el.dataset.id)focusStop();else focusPlay(el.dataset.id);}else if(a==='focusMain'){if(focus.cur)focusStop();else focusPlay(focus.last);}},true);

// ── Bilmiyorum (?) ve dikkatsizlik (🤦) işaretleri ve Vurgular (🖍️) ───────────
// Test durumuna (profil) yazılır, soru damgasıyla (stampQ) senkronlanır ve YZ analiz paketine girer:
//   st.unk[soru]     → "bilmiyorum" denen şıklar ['A','C']
//   st.unkText[soru] → "bilmiyorum" denen ifadeler [{t:'metin', w:'soru'|'A'..'H'|'açıklama'|'parça'}]
//   st.hl[soru]      → vurgulanan ifadeler [{id, t:'metin', w, color:'#fff59d', style:'highlight'|'underline', at:1731500000000}]
//   st.oops[soru]    → true: kontrol sonrası "dikkatsizlik / sehven hata" beyanı
//   st.trail[soru]   → soruda sırayla seçilen şıklar (ör. ['B','D','B']); kararsızlığı gösterir
const APP_VERSION='6.8';
const HL_THEME='color-mix(in srgb,var(--note-accent,var(--green)) 32%,transparent)';
const HL_COLORS=[HL_THEME,'#fff59d','#c8e6c9','#bbdefb','#ffe0b2','#f8bbd0'];
function getLastHlColor(){try{return localStorage.getItem('test-atolyesi:lastHlColor')||HL_COLORS[0];}catch(e){return HL_COLORS[0];}}
function setLastHlColor(c){try{localStorage.setItem('test-atolyesi:lastHlColor',c);}catch(e){}}
function getLastHlStyle(){try{return localStorage.getItem('test-atolyesi:lastHlStyle')||'highlight';}catch(e){return 'highlight';}}
function setLastHlStyle(s){try{localStorage.setItem('test-atolyesi:lastHlStyle',s);}catch(e){}}

function marksOf(s,f,q){s[f]=s[f]&&typeof s[f]==='object'?s[f]:{};return s[f][q];}
function unkButton(s,q,key){const on=(marksOf(s,'unk',q.id)||[]).includes(key);return `<button class="unk-btn ${on?'on':''}" type="button" data-act="unk" data-id="${esc(key)}" aria-pressed="${on}" title="${on?'“Bilmiyorum” işaretini kaldır':'Bu şıkkı bilmiyorum'}" aria-label="${esc(key)} şıkkını bilmiyorum">?</button>`;}
function toggleUnk(key){if(locked)return;const s=currentState,q=currentTest.questions[s.index],set=new Set(marksOf(s,'unk',q.id)||[]);set.has(key)?set.delete(key):set.add(key);if(set.size)s.unk[q.id]=[...set];else delete s.unk[q.id];stampQ(s,q.id);save();render();}
function toggleOops(){if(locked)return;const s=currentState,q=currentTest.questions[s.index];marksOf(s,'oops',q.id);if(s.oops[q.id])delete s.oops[q.id];else s.oops[q.id]=true;stampQ(s,q.id);save();render();}
function trailPush(s,qid,a){if(!a)return;const t=marksOf(s,'trail',qid)||[];if(t[t.length-1]!==a)t.push(a);s.trail[qid]=t.slice(-12);}
function oopsButton(s,q){if(!q.answer)return '';const on=!!marksOf(s,'oops',q.id);return `<button class="oops-btn ${on?'on':''}" data-act="oops" aria-pressed="${on}" title="Normalde yapmayacağın bir dikkatsizlik/sehven hata olarak işaretle">🤦 ${on?'Dikkatsizlik işaretli':'Dikkatsizlik'}</button>`;}
