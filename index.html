eği varsa (<span class='en'>a catastrophic event like a nuclear blast</span>) veya sonuçtan teşekkür/katkı doğuyorsa <span class='en'>in case of / thanks to</span> seç.</li>\n          <li><b><span class='en'>for / in that</span>:</b> 'Çünkü / şu bakımdan ki' anlamında asla cümle başına gelmez.</li>\n          <li><b><span class='en'>as</span> çok anlamlılığı:</b> <span class='en'>as + NP</span> = 'olarak'; <span class='en'>as + SVO</span> = '-dığı için / -dıkça / iken'; <span class='en'>just as</span> = benzetme ('tıpkı ... olduğu gibi').</li>\n        </ul>\n      </div>\n      <div class=\"rule-card\">\n        <h4>İkili Bağlaçlar (Correlatives) — Paralellik Kuralı</h4>\n        <ul>\n          <li><b><span class='en'>not only ... but also</span>:</b> <span class='en'>only</span> yerine <span class='en'>just/merely/solely</span> gelebilir. İki parçanın <b>sağındaki dilbilgisel türler birebir aynı</b> olmalıdır (<span class='en'>not only on X but also [on] Y</span>).</li>\n          <li><b><span class='en'>both ... and</span> / <span class='en'>either ... or</span> / <span class='en'>neither ... nor</span>:</b> Eşit öge bağlar; <span class='en'>neither...nor</span> olumlu fiille olumsuz anlam verir.</li>\n          <li><b><span class='en'>not A but B</span>:</b> 'A değil B' (<span class='en'>not Turkey but Germany</span>).</li>\n          <li><b><span class='en'>so + adj/adv + that + SVO</span> vs <span class='en'>such + (a/an) adj N + that + SVO</span>:</b> Sağda isim öbeği varsa <span class='en'>that</span> yan cümlesi mutlaka tam cümle almalıdır; tam cümle yoksa <span class='en'>such...that</span> elenir (<span class='mono'>m3#S10</span>).</li>\n        </ul>\n      </div>\n    </div>\n    <div class=\"worked\"><div class=\"worked-hdr\"><span>Çözümlü Örnek · Tam Tanı M3 #8, #10 &amp; #12</span><span>Bağlaç Kutup ve Paralellik Kilidi</span></div><div class=\"worked-stem\">1) The idea of the Internet was initially to provide redundancy of communications ---- <b>a catastrophic event like a nuclear blast</b>...<br>2) Industrial nations consume nearly 75 to 80 percent of the fossil fuels burned each year; ----, they are responsible for the majority of greenhouse gas emissions.</div><div class=\"worked-row\"><span class='ok'>[+] 1. Doğru (in case of):</span> Boşluktan sonraki örnek zaten <span class='en'>like a nuclear blast</span> ile verilmiş! İletişim yedekliliği bu felaketin örneği değil, o duruma karşı önlemdir → <span class='en'>in case of</span> (<span class='err'>such as</span> kategori hatasıdır).</div><div class=\"worked-row\"><span class='ok'>[+] 2. Doğru (as a result):</span> Çok fosil yakıt tüketmek → emisyonun çoğuna yol açmak: doğal nedensellik akışıdır, beklenti dışı şaşırtıcı zıtlık (<span class='err'>however</span>) değildir.</div></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-2-1\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">2.2</span>Edatlar (Prepositions): Mekân Şeması ve Eşdizim Bankosu</h2><div class=\"svg-wrap\"><svg viewBox=\"0 0 720 138\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, Calibri, sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"138\" fill=\"#ffffff\"/>\n  <!-- Box 1: at/on/in/within -->\n  <rect x=\"8\" y=\"8\" width=\"170\" height=\"122\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n  <text x=\"93\" y=\"22\" text-anchor=\"middle\" font-size=\"8.3\" font-weight=\"700\" fill=\"#0f2438\">KONUM &amp; SINIR</text>\n  <rect x=\"26\" y=\"34\" width=\"134\" height=\"84\" rx=\"2\" fill=\"#f0f9ff\" stroke=\"#0e7490\" stroke-dasharray=\"3,2\"/>\n  <text x=\"33\" y=\"47\" font-size=\"7.4\" font-weight=\"700\" fill=\"#0e7490\">WITHIN (sınır/süre içi)</text>\n  <rect x=\"44\" y=\"54\" width=\"98\" height=\"52\" rx=\"2\" fill=\"#ffffff\" stroke=\"#0f2438\"/>\n  <text x=\"51\" y=\"66\" font-size=\"7.4\" font-weight=\"700\" fill=\"#0f2438\">IN (alan / ay / yıl)</text>\n  <line x1=\"44\" y1=\"86\" x2=\"142\" y2=\"86\" stroke=\"#92400e\" stroke-width=\"1.5\"/>\n  <text x=\"51\" y=\"81\" font-size=\"7.2\" font-weight=\"700\" fill=\"#92400e\">ON (yüzey / gün)</text>\n  <circle cx=\"93\" cy=\"96\" r=\"3.5\" fill=\"#9f1239\"/>\n  <text x=\"101\" y=\"99\" font-size=\"7.3\" font-weight=\"700\" fill=\"#9f1239\">AT (nokta)</text>\n\n  <!-- Box 2: throughout vs across vs through vs along -->\n  <rect x=\"188\" y=\"8\" width=\"212\" height=\"122\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n  <text x=\"294\" y=\"22\" text-anchor=\"middle\" font-size=\"8.3\" font-weight=\"700\" fill=\"#0f2438\">GEÇİŞ VE YAYILIM (MOVEMENT)</text>\n  <rect x=\"200\" y=\"32\" width=\"188\" height=\"22\" rx=\"2\" fill=\"#f0f9ff\" stroke=\"#0e7490\"/>\n  <text x=\"294\" y=\"46\" text-anchor=\"middle\" font-size=\"7.6\" fill=\"#0f2438\"><tspan font-weight=\"700\" fill=\"#0e7490\">THROUGHOUT:</tspan> tamamında / her köşesinde</text>\n  <line x1=\"205\" y1=\"67\" x2=\"375\" y2=\"67\" stroke=\"#0f2438\" stroke-width=\"1.4\"/>\n  <polygon points=\"375,64 382,67 375,70\" fill=\"#0f2438\"/>\n  <text x=\"294\" y=\"79\" text-anchor=\"middle\" font-size=\"7.4\" fill=\"#334155\"><tspan font-weight=\"700\">ACROSS</tspan> (yüzey/bölge karşıya) · <tspan font-weight=\"700\">ALONG</tspan> (hat boyu)</text>\n  <rect x=\"242\" y=\"88\" width=\"104\" height=\"16\" rx=\"2\" fill=\"#e2e8f0\" stroke=\"#64748b\"/>\n  <line x1=\"205\" y1=\"96\" x2=\"376\" y2=\"96\" stroke=\"#9f1239\" stroke-width=\"1.5\"/>\n  <polygon points=\"376,93 383,96 376,99\" fill=\"#9f1239\"/>\n  <text x=\"294\" y=\"117\" text-anchor=\"middle\" font-size=\"7.4\" fill=\"#9f1239\"><tspan font-weight=\"700\">THROUGH:</tspan> içinden / vasıtasıyla (tünel)</text>\n\n  <!-- Box 3: above / beyond / between / among -->\n  <rect x=\"410\" y=\"8\" width=\"302\" height=\"122\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n  <text x=\"561\" y=\"22\" text-anchor=\"middle\" font-size=\"8.3\" font-weight=\"700\" fill=\"#0f2438\">EŞİK, YÜKSEKLİK VE GRUP İLİŞKİSİ</text>\n  <line x1=\"426\" y1=\"62\" x2=\"554\" y2=\"62\" stroke=\"#64748b\" stroke-dasharray=\"3,2\"/>\n  <text x=\"490\" y=\"38\" text-anchor=\"middle\" font-size=\"7.6\" font-weight=\"700\" fill=\"#0e7490\">ABOVE (seviye/rakam üstü: 6x above)</text>\n  <text x=\"490\" y=\"52\" text-anchor=\"middle\" font-size=\"7.4\" fill=\"#334155\">BEYOND (sınır ötesi) · OVER (kapsam/süre)</text>\n  <text x=\"490\" y=\"76\" text-anchor=\"middle\" font-size=\"7.5\" fill=\"#9f1239\">BELOW (eşik altı) · UNDER (kontrol/baskı)</text>\n  <text x=\"490\" y=\"92\" text-anchor=\"middle\" font-size=\"7.2\" fill=\"#475569\">under control / risk (at risk from!)</text>\n  <line x1=\"564\" y1=\"30\" x2=\"564\" y2=\"122\" stroke=\"#cbd5e1\"/>\n  <text x=\"638\" y=\"42\" text-anchor=\"middle\" font-size=\"7.7\" font-weight=\"700\" fill=\"#0f2438\">BETWEEN vs AMONG</text>\n  <text x=\"638\" y=\"57\" text-anchor=\"middle\" font-size=\"7.4\" fill=\"#1e293b\">A ↔ B ↔ C</text>\n  <text x=\"638\" y=\"70\" text-anchor=\"middle\" font-size=\"7.3\" fill=\"#0e7490\" font-weight=\"600\">BETWEEN: tek tek ayrık</text>\n  <text x=\"638\" y=\"81\" text-anchor=\"middle\" font-size=\"7.1\" fill=\"#334155\">öğeler arası ilişki (3 olsa bile)</text>\n  <text x=\"638\" y=\"99\" text-anchor=\"middle\" font-size=\"7.3\" fill=\"#92400e\" font-weight=\"600\">AMONG: çoğul belirsiz</text>\n  <text x=\"638\" y=\"110\" text-anchor=\"middle\" font-size=\"7.1\" fill=\"#334155\">küme içinde (among children)</text>\n</svg><div class=\"svg-cap\">Şema 2.2 — YDS Edatlarının Konumsal ve Soyut İlişki Haritası</div></div>\n    <div class=\"grid-2\">\n      <div class=\"rule-card\">\n        <h4>İki Boşluklu Edat Çözüm Algoritması</h4>\n        <ol style=\"margin:2pt 0; padding-left:13pt\">\n          <li><b>Önce Kilit Boşluğu Bul:</b> İki boşluktan biri sabit eşdizime oturur (<span class='en'>at risk from, at the centre of, capable of, collision with, variations in, exceed by 56%</span>). O boşluktan seçenekleri 5'ten 2'ye indir.</li>\n          <li><b>Sonra Alan / Yön / Eşik Kontrolü:</b> Çoğul ülke/alan kapsamı için <span class='err'>at</span> değil <span class='ok'>throughout / across / in</span>; rakamsal eşik aşımı için <span class='ok'>above / over / beyond</span>; sayılardan önce fark bildirmede <span class='ok'>by (%34.5)</span>.</li>\n        </ol>\n      </div>\n      <div class=\"rule-card\">\n        <h4><span class='en'>BY</span> Edatının 5 Sınav Anlamı</h4>\n        <ul>\n          <li><b>Tarih/Eşik (<span class='en'>-e dek</span>):</b> <span class='en'>by 1950</span> (had V3) · <span class='en'>by 2050</span> (will have V3)</li>\n          <li><b>Oran Farkı (<span class='en'>oranında</span>):</b> <span class='en'>exceed their budget by 56%</span></li>\n          <li><b>Yöntem (<span class='en'>-erek / vasıtasıyla</span>):</b> <span class='en'>by prompting them / by means of</span></li>\n          <li><b>Edilgen Fail (<span class='en'>tarafından</span>):</b> <span class='en'>discovered by archaeologists</span></li>\n          <li><b>Yakınlık / Araç / Ezbere:</b> <span class='en'>by the river / by train / by heart</span></li>\n        </ul>\n      </div>\n    </div>\n    <div class=\"table-scroll\"><table class=\"allow-split\"><thead><tr><th style=\"width:24%\">Kategori</th><th style=\"width:76%\">Yüksek Frekanslı YDS Eşdizim Bankosu</th></tr></thead><tbody><tr><td><b>Sıfat + TO (Yatay/Eğilim)</b></td><td><span class='en'>prone, liable, susceptible, vulnerable, subject, immune, indifferent, relevant, identical, prior, essential, vital, superior, inferior, committed, accustomed + <b>to</b></span></td></tr><tr><td><b>Sıfat + OF / FOR / IN / WITH / FROM</b></td><td><b>OF:</b> <span class='en'>capable, aware, conscious, characteristic, deprived, devoid, free, guilty, short, suspicious, typical, worthy</span> · <b>FOR:</b> <span class='en'>responsible, eligible, famous, essential, appropriate, suitable, noted, eager</span> · <b>WITH:</b> <span class='en'>associated, consistent, compatible, content, familiar, obsessed, plagued, satisfied</span> · <b>IN:</b> <span class='en'>absorbed, deficient, engaged, experienced, instrumental, involved, lacking, proficient, rich</span> · <b>FROM:</b> <span class='en'>different, derived, distinct, immune/free, protected, separate</span></td></tr><tr><td><b>Fiil + TO / FROM / ON / WITH / IN / FOR</b></td><td><b>TO:</b> <span class='en'>attribute, ascribe, owe, contribute, lead, give rise, object, resort, adhere, conform, adapt, react, refer, expose</span> · <b>FROM:</b> <span class='en'>stem, arise, emerge, derive, originate, result, prevent, prohibit, deter, refrain, suffer, distinguish, discriminate</span> · <b>ON:</b> <span class='en'>rely, depend, focus, insist, impose, embark, center</span> · <b>WITH:</b> <span class='en'>cope, comply, deal, collide, coincide, supply</span> · <b>IN:</b> <span class='en'>result, participate, specialize, succeed, persist, invest, culminate</span> · <b>FOR:</b> <span class='en'>account, compensate, allow, strive, search</span></td></tr><tr><td><b>İsim + Edat</b></td><td><span class='en'>access to, threat to, solution to, exposure to, resistance to, reaction to, appeal to</span> · <span class='en'>collision with</span> · <span class='en'>link/relationship between</span> · <span class='en'>variation/change/increase in</span> · <span class='en'>ban/restriction/effect/impact/emphasis/pressure on</span> · <span class='en'>search/demand/implication/cure for</span> · <span class='en'>barrier against / revolt against</span></td></tr><tr><td><b>Sabit Edat + İsim Öbekleri</b></td><td><span class='en'>at the centre of · at risk (from/of) · at the expense of · at a constant rate · at least · at the turn of</span> · <span class='en'>in favour of · in terms of · in accordance with · in response to · in search of · in common · in contrast to</span> · <span class='en'>on average · on behalf of · on purpose · on the verge of · on duty · on a large scale</span> · <span class='en'>under control · under pressure · under these circumstances · within budget/reach · beyond control · out of danger</span></td></tr></tbody></table></div><div class=\"table-scroll\"><table><thead><tr><th style=\"width:29%\">Karıştırılan Edat Çifti</th><th style=\"width:71%\">Anlam ve Yapı Ayrımı</th></tr></thead><tbody><tr><td><span class='en'>result in</span> vs <span class='en'>result from</span></td><td><b><span class='en'>result in</span></b> = yol açmak (<span class='en'>lead to</span>) · <b><span class='en'>result from</span></b> = -den kaynaklanmak (<span class='en'>stem from</span>)</td></tr><tr><td><span class='en'>consist of</span> vs <span class='en'>consist in</span></td><td><b><span class='en'>consist of</span></b> = -den oluşmak (parçalar) · <b><span class='en'>consist in</span></b> = özünde ... yatmak</td></tr><tr><td><span class='en'>comply with</span> vs <span class='en'>conform/adhere to</span></td><td>İkisi de 'kurala uymak'tır ama edatları farklıdır: <span class='en'>comply <b>with</b> rules</span> · <span class='en'>conform / adhere <b>to</b> rules</span>.</td></tr><tr><td><span class='en'>agree with / on / to</span></td><td><b><span class='en'>agree with</span></b> = kişi/fikirle anlaşmak · <b><span class='en'>agree on</span></b> = bir konuda uzlaşmak · <b><span class='en'>agree to</span></b> = öneriyi kabul etmek</td></tr><tr><td><span class='en'>concerned about</span> vs <span class='en'>concerned with</span></td><td><b><span class='en'>concerned about</span></b> = endişeli · <b><span class='en'>concerned with</span></b> = ilgili, alakalı</td></tr><tr><td><span class='en'>differ from</span> vs <span class='en'>differ in</span></td><td><b><span class='en'>differ from</span></b> = X'ten farklı olmak · <b><span class='en'>differ in</span></b> = boyut/renk bakımından farklılık göstermek</td></tr></tbody></table></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-2-2\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">2.3</span>Edat Tuzakları, Zaman/Amaç Kesişimleri ve Uygulama Seti</h2>\n    <div class=\"grid-2\">\n      <div class=\"rule-card\">\n        <h4>ÖSYM Çift Boşluklu Edatlarda Kesin Eleme Kuralları</h4>\n        <ul>\n          <li><b><span class='en'>among</span> vs <span class='en'>between</span>:</b> Birebir iki uç/sınır arası <span class='en'>between</span>; çoğul topluluk içi tekillik <span class='en'>among</span> ister (<span class='en'>most common among women</span>, <span class='err'>among everyone</span> HATA).</li>\n          <li><b><span class='en'>be of + soyut isim</span> (= Sıfat):</b> <span class='en'>be of great importance / of concern / of value</span> kalıbında yüklem edatı daima <b><span class='en'>of</span></b>'tur (<span class='en'>of much importance to food industry</span>).</li>\n          <li><b>Temel, Yüzey ve Teslimat:</b> <span class='en'>built/erected/based <b>on</b></span> · <span class='en'>land <b>on</b></span> · <span class='en'>deliver/supply <b>to</b></span> · <span class='en'>with responsibility <b>for</b></span> · <span class='en'>capable <b>of</b> + Ving</span>.</li>\n          <li><b><span class='en'>for + N + to V1</span> Amaç/Strateji Yapısı:</b> <span class='en'>the strategy for dealing <b>with</b> fire used to be <b>for</b> the train to continue</span>.</li>\n        </ul>\n      </div>\n      <div class=\"rule-card\">\n        <h4>Zaman, Araç ve İkili Edat Ayırıcıları</h4>\n        <ul>\n          <li><b>An vs Süreç vs Sınır:</b> <span class='en'>at present / at the turn of</span> (noktasal an) · <span class='en'>during + süreç</span> (<span class='en'>during sleep</span>) · <span class='en'>over time</span> (kademeli değişim) · <span class='en'>within a system/week</span> (yapı/süre sınırı).</li>\n          <li><b>Alet (<span class='en'>with</span>) vs Kanal (<span class='en'>through</span>) vs Dönüşüm (<span class='en'>into</span>):</b> El aletiyle dinleme (<span class='en'>with a stethoscope</span>), mercek/aracı içinden görme (<span class='en'>visible through a microscope</span>), kategorilere ayırma (<span class='en'>classify into groups</span>).</li>\n          <li><b>Kapsam ve Üretkenlik Amaçlı <span class='en'>for</span>:</b> <span class='en'>mined for export</span> (ihracat için), <span class='en'>constant throughout the Universe</span> (bütün uzayda sabit).</li>\n        </ul>\n      </div>\n    </div>\n    <div class=\"worked\"><div class=\"worked-hdr\"><span>Çözümlü Örnek · Tam Tanı M3 #13, #14, #15 &amp; Modadil Prep #8</span><span>Edat Eşdizim Kilitleme</span></div><div class=\"worked-stem\">1) ...place their characters ---- the centre of a terrifying human conflict... avoiding a collision ---- the conflict.<br>2) Children's developing bodies are most ---- risk from toxic air... six times ---- the required guidelines.<br>3) ---- many countries in which adoption is practiced, there are variations ---- the age...<br>4) The World Commission on Dams found that, ---- average, large dams exceed their budget ---- 56%.</div><div class=\"worked-row\"><span class='ok'>[+] 1. (at / with):</span> Sabit kalıp <span class='en'>at the centre of</span> ve <span class='en'>collision with</span> (tartışma fiili olmadığı için <span class='err'>about</span> elenir).</div><div class=\"worked-row\"><span class='ok'>[+] 2. (at / above):</span> Sabit kalıp <span class='en'>be at risk from</span> (<span class='err'>in/of risk</span> değil) ve sayısal eşik aşımı <span class='en'>six times above guidelines</span>.</div><div class=\"worked-row\"><span class='ok'>[+] 3. (Throughout / in):</span> Çoğul ülkelerin tamamını kapsamak için noktasal <span class='err'>at</span> kullanılmaz (<span class='en'>throughout</span>); konu başlığı <span class='en'>variations in</span> alır.</div><div class=\"worked-row\"><span class='ok'>[+] 4. (on / by):</span> Sabit öbek <span class='en'>on average</span> (ortalama olarak) + yüzde farkında artış/aşım miktarı için <span class='en'>exceed by 56%</span>.</div></div><div class=\"worked\"><div class=\"worked-hdr\"><span>Adli İnceleme · ÖSYM / Modadil Gerçek Edat Testi (#13–18)</span><span>İkinci Boşluktan Tek Atış Kilitleme</span></div><div class=\"worked-stem\">1) What is really ---- <b>issue</b> is the political structure ---- which Soviet communism was <b>erected</b>.<br>2) Provincial governments play a big role in the lives of Canadians, ---- primary <b>responsibility</b> ---- health, education and welfare.<br>3) Each of these mini antennas is <b>capable</b> ---- absorbing energy ---- short-wavelength electromagnetic radiation.<br>4) Such information is not used in engineering applications ---- <b>present</b>, but it is ---- <b>much importance</b> to the food industry.</div><div class=\"worked-row\"><span class='ok'>[+] 1. (at / on):</span> <span class='en'>at issue</span> ('söz konusu/tartışılan nokta') ve <span class='en'>erected on the structure</span> ('yapının üzerine inşa edilen') geri okuması kesin kilittir.</div><div class=\"worked-row\"><span class='ok'>[+] 2. (with / for):</span> Kuruma özellik ekleyen <span class='en'>with + primary responsibility</span> ve sabit <span class='en'>responsibility for</span> eşdizimi.</div><div class=\"worked-row\"><span class='ok'>[+] 3. (of / from):</span> <span class='en'>capable of + V-ing</span> kalıbı tüm diğer şıkları tek hamlede eler; enerjinin kaynağı da <span class='en'>from radiation</span>.</div><div class=\"worked-row\"><span class='ok'>[+] 4. (at / of):</span> Sabit zaman kalıbı <span class='en'>at present</span> + isimleştirilmiş sıfat yapısı <span class='en'>be of much importance</span>.</div></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-2-3\"></div>", "searchText": "BÖLÜM 2 · GÜN 2 Test Atölyesi: Modül 2 (22 Soru · 20 dk) Zıtlık Dışı Bağlaçlar, Geçiş İfadeleri ve Edat Sistematiği Zıtlık bağlaçlarında 7/7 sağlandığından kapsam dışı bırakılmıştır. Odak: 3 sütunlu sözdizim matrisi, kutup refleksi ve yüksek frekanslı edat eşdizimleri (1/4 → 3–4/4). 2.1 Bağlaç Sözdizimi: Üçlü Yapı Matrisi ve Kutup Refleksi Şema 2.1 — Bağlaç Boşluklarında Noktalama ve Sağd an class='en'>in-access-ible</span> (erişilemez), <span class='en'>dis-proportion-ately</span> (orantısızca), <span class='en'>over-whelm-ingly</span> (ezici biçimde).</div><div class=\"edu-ex-slot\" data-ex-id=\"ex-3-1\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">3.2</span>Yalancı Arkadaşlar (False Friends) ve Çok Anlamlı Tuzak Kökler</h2><div class=\"table-scroll\"><table><thead><tr><th style=\"width:14%\">Kelime</th><th style=\"width:14%\">Yanlış Çağrışım</th><th style=\"width:22%\">Gerçek YDS Anlamı</th><th style=\"width:14%\">Kelime</th><th style=\"width:13%\">Yanlış Çağrışım</th><th style=\"width:23%\">Gerçek YDS Anlamı</th></tr></thead><tbody><tr><td><b><span class='en'>adverse</span></b></td><td><span class='err'>reklam</span> (<span class='en'>advert</span>)</td><td><b>olumsuz, zararlı, ters</b> (<span class='en'>adverse reviews/effects</span>)</td><td><b><span class='en'>redundant</span></b></td><td><span class='err'>eksik</span></td><td><b>gereğinden fazla, yedek</b> (<span class='en'>redundancy</span>)</td></tr><tr><td><b><span class='en'>audible</span></b></td><td>olumsuz niteleyici</td><td><b>işitilebilir, duyulur</b> (yazılı gazetede <span class='err'>olmaz</span>)</td><td><b><span class='en'>subtle</span></b></td><td>önemsiz / sıradan</td><td><b>ince, güç fark edilen</b> (karşıtı: <span class='en'>obvious</span>)</td></tr><tr><td><b><span class='en'>eventually</span></b></td><td><span class='err'>muhtemelen</span></td><td><b>nihayet, en sonunda</b> (süreç sonu)</td><td><b><span class='en'>dramatic</span></b></td><td><span class='err'>tiyatral / acıklı</span></td><td><b>ani, çarpıcı, çok belirgin</b> (<span class='en'>dramatic fall</span>)</td></tr><tr><td><b><span class='en'>comprehensive</span></b></td><td><span class='err'>anlaşılır</span> (<span class='en'>comprehensible</span>)</td><td><b>kapsamlı, geniş çaplı</b></td><td><b><span class='en'>exploitation</span></b></td><td>yalnız sömürü / patlama</td><td><b>(kaynaktan) yararlanma, işletme</b> + sömürü</td></tr><tr><td><b><span class='en'>considerate</span></b></td><td><span class='err'>büyük / önemli</span> (<span class='en'>considerable</span>)</td><td><b>düşünceli, nazik</b> (<span class='en'>considerable</span> = kayda değer)</td><td><b><span class='en'>discriminate</span></b></td><td>yalnız ırkçı ayrım</td><td><b>ince farkları ayırt etmek</b> (<span class='en'>discriminate differences</span>)</td></tr><tr><td><b><span class='en'>sensitive</span></b></td><td><span class='err'>mantıklı</span> (<span class='en'>sensible</span>)</td><td><b>hassas, duyarlı</b> (<span class='en'>sensible</span> = makul, sağduyulu)</td><td><b><span class='en'>undertake / undergo</span></b></td><td>altına girmek</td><td><b><span class='en'>undertake</span></b> = üstlenmek · <b><span class='en'>undergo</span></b> = geçirmek, maruz kalmak</td></tr><tr><td><b><span class='en'>virtually</span></b></td><td><span class='err'>sanal olarak</span></td><td><b>neredeyse, hemen hemen</b> (= <span class='en'>almost, practically</span>)</td><td><b><span class='en'>trivial</span></b></td><td>üçlü / teknik</td><td><b>önemsiz, ufak tefek</b> (= <span class='en'>minor, negligible</span>)</td></tr><tr><td><b><span class='en'>scarcely / barely</span></b></td><td>yüksek sıklık</td><td><b>neredeyse hiç, güç bela</b> (cümleyi olumsuz yapar)</td><td><b><span class='en'>buried</span></b> vs <span class='en'>burial</span></td><td>eşanlamlı sanma</td><td><span class='en'>bury</span> = toprağa gömüp gizlemek · <span class='en'>burial site</span> = mezarlık</td></tr></tbody></table></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-3-2\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">3.3</span>Kişisel [?] Havuzu ve Yüksek Frekanslı Akademik Kelime Bankosu</h2><div class=\"table-scroll\"><table class=\"allow-split\"><thead><tr><th style=\"width:22%\">Fiil (Verbs)</th><th style=\"width:32%\">Türkçe Karşılığı ve Bağlam</th><th style=\"width:26%\">YDS Eşanlamlıları</th><th style=\"width:20%\">Zıt Anlam / Eşdizim</th></tr></thead><tbody><tr><td><span class='en'>inhibit</span> <span class='tag-q'>m1#1</span></td><td>baskılamak, frenlemek (<span class='en'>inhibit an urge</span>)</td><td><span class='en'>restrain, curb, suppress</span></td><td><span class='en'>stimulate, foster</span></td></tr><tr><td><span class='en'>constitute</span> <span class='tag-q'>m1#6</span></td><td>(oran/parça) oluşturmak, teşkil etmek</td><td><span class='en'>make up, account for, comprise</span></td><td>— (+ yüzde/oran)</td></tr><tr><td><span class='en'>span</span> <span class='tag-q'>m1#7</span></td><td>(çağ/kıta/süre) kapsamak, boyunca uzanmak</td><td><span class='en'>extend over, cover, stretch across</span></td><td>— (+ eras/continents)</td></tr><tr><td><span class='en'>foster</span> <span class='tag-q'>m1#8</span></td><td>destekleyip geliştirmek, teşvik etmek</td><td><span class='en'>promote, nurture, encourage</span></td><td><span class='en'>hinder, impede, deter</span></td></tr><tr><td><span class='en'>hinder / hamper / impede</span></td><td>engellemek, sekte vurmak, yavaşlatmak</td><td><span class='en'>obstruct, retard, curb</span></td><td><span class='en'>facilitate, accelerate</span></td></tr><tr><td><span class='en'>undermine</span></td><td>altını oymak, zamanla zayıflatmak</td><td><span class='en'>weaken, erode, sabotage</span></td><td><span class='en'>reinforce, strengthen</span></td></tr><tr><td><span class='en'>mitigate / alleviate</span></td><td>(acıyı/zararı) hafifletmek, azaltmak</td><td><span class='en'>ease, lessen, soothe</span></td><td><span class='en'>aggravate, exacerbate</span></td></tr><tr><td><span class='en'>undergo</span></td><td>(ameliyat/değişim) geçirmek, maruz kalmak</td><td><span class='en'>experience, be subjected to</span></td><td>— (+ operation/change)</td></tr><tr><td><span class='en'>owe ... to</span> <span class='tag-q'>m5#9</span></td><td>varlığını/başarısını ...-e borçlu olmak</td><td><span class='en'>be indebted to, attribute to</span></td><td>— (<span class='en'>owe existence to</span>)</td></tr><tr><td><span class='en'>coincide (with)</span></td><td>aynı zamana rastlamak, örtüşmek</td><td><span class='en'>correspond to, concur, match</span></td><td><span class='en'>differ, diverge</span></td></tr><tr><td><span class='en'>incorporate</span></td><td>bünyesine katmak, dahil etmek</td><td><span class='en'>integrate, blend, include</span></td><td><span class='en'>exclude, omit</span></td></tr><tr><td><span class='en'>reinstate</span></td><td>yeniden yürürlüğe koymak, görevine iade etmek</td><td><span class='en'>restore, reestablish</span></td><td><span class='en'>abolish, dismiss</span></td></tr><tr><td><span class='en'>broach</span> <span class='tag-q'>m6#11</span></td><td>(konuyu/sorunu) ilk kez açmak, ortaya atmak</td><td><span class='en'>bring up, introduce, raise</span></td><td>— (<span class='en'>broach a topic</span>)</td></tr><tr><td><span class='en'>prevail / dwindle</span> <span class='tag-q'>m5#10</span></td><td>hüküm sürmek, yaygınlaşmak / giderek azalmak</td><td><span class='en'>predominate / decline, diminish</span></td><td>birbirinin zıddı</td></tr></tbody></table></div><div class=\"table-scroll\"><table class=\"allow-split\"><thead><tr><th style=\"width:26%\">İsim / Sıfat / Zarf</th><th style=\"width:30%\">Türkçe Karşılığı</th><th style=\"width:26%\">YDS Eşanlamlıları</th><th style=\"width:18%\">Not / Zıt Anlam</th></tr></thead><tbody><tr><td><span class='en'>implication (for)</span> <span class='tag-q'>m1#4</span></td><td><b>(n)</b> doğurgu, olası sonuç/etki</td><td><span class='en'>consequence, ramification</span></td><td>İsim (+ for study)</td></tr><tr><td><span class='en'>prevalence / diversity</span></td><td><b>(n)</b> yaygınlık / çeşitlilik (<span class='en'>emotional models</span>)</td><td><span class='en'>widespread presence / variety</span></td><td>İsim</td></tr><tr><td><span class='en'>scarcity / discrepancy / ambiguity</span></td><td><b>(n)</b> kıtlık / tutarsızlık / belirsizlik</td><td><span class='en'>shortage / inconsistency / vagueness</span></td><td>İsim</td></tr><tr><td><span class='en'>counterpart / constituent / prerequisite</span></td><td><b>(n)</b> muadil / bileşen / önkoşul</td><td><span class='en'>equivalent / component / requirement</span></td><td>İsim</td></tr><tr><td><span class='en'>resilience / incentive / expenditure</span> <span class='tag-q'>m5#10</span></td><td><b>(n)</b> dayanıklılık-esneklik / teşvik / harcama</td><td><span class='en'>durability / stimulus / spending</span></td><td>İsim</td></tr><tr><td><span class='en'>exclusive</span> <span class='tag-q'>m1#11</span></td><td><b>(adj)</b> münhasır, yalnız hak sahibine ait, özel</td><td><span class='en'>sole, unique, restricted</span></td><td>Zıt: <span class='en'>shared, public</span></td></tr><tr><td><span class='en'>feasible / viable / attainable</span> <span class='tag-q'>m6#9</span></td><td><b>(adj)</b> uygulanabilir, olası, ulaşılabilir</td><td><span class='en'>workable, achievable, obtainable</span></td><td>Zıt: <span class='en'>unfeasible, unattainable</span></td></tr><tr><td><span class='en'>empirical / profound / paramount</span></td><td><b>(adj)</b> deneysel-gözlemsel / derin / en önemli</td><td><span class='en'>experimental / deep / vital, supreme</span></td><td>Zıt: <span class='en'>theoretical / superficial / trivial</span></td></tr><tr><td><span class='en'>stringent / rigorous / supplementary</span></td><td><b>(adj)</b> sıkı, katı / titiz / ek, tamamlayıcı</td><td><span class='en'>strict, thorough / additional</span></td><td>Zıt: <span class='en'>lenient, lax</span></td></tr><tr><td><span class='en'>obscure / elusive / sarcastic</span> <span class='tag-q'>m6#8,11</span></td><td><b>(adj)</b> belirsiz, az bilinen / yakalanması güç / alaycı</td><td><span class='en'>vague, unclear / hard to pin down / ironic</span></td><td><span class='en'>sarcastic</span> = tutum sorusu!</td></tr><tr><td><span class='en'>conspicuous / erratic / scarce</span></td><td><b>(adj)</b> göze çarpan / düzensiz, değişken / kıt</td><td><span class='en'>noticeable, obvious / unpredictable / rare</span></td><td>Zıt: <span class='en'>subtle / steady / abundant</span></td></tr><tr><td><span class='en'>precisely / overwhelmingly / respectively</span> <span class='tag-q'>m5#2</span></td><td><b>(adv)</b> tam olarak / ezici biçimde / sırasıyla</td><td><span class='en'>accurately / predominantly / consecutively</span></td><td><span class='en'>respectively</span> = sıralı %</td></tr><tr><td><span class='en'>adversely / disproportionately / vaguely</span> <span class='tag-q'>m4#3</span></td><td><b>(adv)</b> olumsuz biçimde / orantısızca / hayal meyal</td><td><span class='en'>harmfully / unequally / unclearly</span></td><td>Zıt: <span class='en'>truly, precisely</span></td></tr></tbody></table></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-3-3\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">3.4</span>Phrasal Verb Sözlüğü: İki ve Üç Parçalı Çekirdek Liste</h2><div class=\"table-scroll\"><table class=\"allow-split\"><thead><tr><th style=\"width:23%\">Phrasal Verb</th><th style=\"width:34%\">Türkçe Anlamı &amp; Nesne</th><th style=\"width:20%\">Eşanlam</th><th style=\"width:23%\">Zıt / Tuzak Ayrımı</th></tr></thead><tbody><tr><td><span class='en'>come up with</span> <span class='tag-q'>m1#16</span></td><td><b>fikir / çözüm / yeni ürün üretmek, bulmak</b> (<span class='en'>creative solutions</span>)</td><td><span class='en'>devise, invent</span></td><td><b><span class='err'>≠ make up for</span></b> (telafi etmek)</td></tr><tr><td><span class='en'>make up for</span> <span class='tag-q'>m4#20</span></td><td>bir eksiği / hatayı <b>telafi etmek</b> (<span class='en'>lack of resources</span>)</td><td><span class='en'>compensate for</span></td><td>Nesnesi kayıp/eksikliktir</td></tr><tr><td><span class='en'>rest on / rely on</span> <span class='tag-q'>m1#17</span></td><td>(kuram/iddia) bir varsayıma, temele <b>dayanmak</b></td><td><span class='en'>depend on, be based on</span></td><td><b><span class='err'>≠ take down</span></b> (not almak, sökmek)</td></tr><tr><td><span class='en'>do away with</span></td><td><b>yürürlükten kaldırmak, ortadan kaldırmak</b></td><td><span class='en'>abolish, eliminate</span></td><td><b><span class='err'>↔ put up with</span></b> (katlanmak)</td></tr><tr><td><span class='en'>put up with</span></td><td><b>katlanmak, tahammül etmek</b></td><td><span class='en'>tolerate, endure</span></td><td>—</td></tr><tr><td><span class='en'>keep up with</span></td><td><b>ayak uydurmak, hızına yetişmek</b></td><td><span class='en'>catch up with, pace</span></td><td><b>↔ fall behind (with)</b> (geri kalmak)</td></tr><tr><td><span class='en'>look down on</span></td><td><b>hor görmek, küçümsemek</b></td><td><span class='en'>despise, scorn</span></td><td><b>↔ look up to</b> (saygı duymak)</td></tr><tr><td><span class='en'>cut down on</span></td><td><b>tüketimi / masrafı azaltmak, kısmak</b></td><td><span class='en'>reduce, curtail</span></td><td><b>↔ run out of</b> (tüketip bitirmek)</td></tr><tr><td><span class='en'>account for</span></td><td><b>1) açıklamak  2) oranını/payını oluşturmak</b></td><td><span class='en'>explain / constitute</span></td><td>YDS'nin en sık 2 anlamlı PV'si</td></tr><tr><td><span class='en'>bring about / give rise to</span></td><td><b>yol açmak, meydana getirmek</b></td><td><span class='en'>cause, trigger, lead to</span></td><td><b>↔ stem from</b> (-den kaynaklanmak)</td></tr><tr><td><span class='en'>rule out / wipe out</span></td><td><b>olasılığı dışlamak, elemek / kökünü kazımak</b></td><td><span class='en'>exclude / eradicate</span></td><td><span class='en'>root out</span> = kökünden sökmek</td></tr><tr><td><span class='en'>carry out / figure out</span></td><td><b>(deney/araştırma) yürütmek / çözüp anlamak</b></td><td><span class='en'>conduct / solve</span></td><td><span class='en'>sort out</span> = düzene koyup çözmek</td></tr><tr><td><span class='en'>put forward / put off</span></td><td><b>(tez/öneri) ileri sürmek / ertelemek</b></td><td><span class='en'>propose / postpone</span></td><td><span class='en'>put aside</span> = bir kenara bırakmak</td></tr><tr><td><span class='en'>hand down / turn down</span></td><td><b>kuşaktan kuşağa aktarmak / reddetmek</b></td><td><span class='en'>pass on / reject</span></td><td><span class='en'>turn out</span> = ... olduğu ortaya çıkmak</td></tr><tr><td><span class='en'>take up / take over</span></td><td><b>(hobi/zaman/yer) kaplamak, başlamak / devralmak</b></td><td><span class='en'>occupy / assume control</span></td><td><span class='en'>wear off</span> = etkisi geçmek</td></tr><tr><td><span class='en'>end up (+ V-ing)</span> <span class='tag-q'>m4#18</span></td><td>sonunda kendini ... yaparken bulmak</td><td><span class='en'>eventually turn out</span></td><td><span class='en'>live up to</span> = beklentiyi karşılamak</td></tr></tbody></table></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-3-4\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">3.5</span>Kök, Ön Ek ve Son Ek Çözümleme + Çözümlü Uygulamalar</h2><div class=\"table-scroll\"><table><thead><tr><th style=\"width:42%\">Ön Ek / Son Ek Kuralı</th><th style=\"width:58%\">YDS Kök Çözümleme Örnekleri</th></tr></thead><tbody><tr><td><b>Zaman / Sıra:</b> <span class='en'>pre-</span> (önce) ↔ <span class='en'>post-</span> (sonra)</td><td><span class='en'>pre-war, predate, prerequisite</span> ↔ <span class='en'>post-war, postpone</span></td></tr><tr><td><b>Olumsuzluk / Tersi:</b> <span class='en'>un-, in-/im-/ir-, dis-, non-</span></td><td><span class='en'>unearthed</span> (topraktan çıkardı), <span class='en'>inaccessible</span>, <span class='en'>disagreeable</span>, <span class='en'>discrepancy</span></td></tr><tr><td><b>Aşırılık / Eksiklik:</b> <span class='en'>over-, out-</span> ↔ <span class='en'>under-, mis-</span></td><td><span class='en'>outweigh</span> (ağır basmak), <span class='en'>overwhelming</span>, <span class='en'>undermine</span> (altını oymak), <span class='en'>mislead</span></td></tr><tr><td><b>Karşılık / Birliktelik:</b> <span class='en'>counter-, inter-, co-</span></td><td><span class='en'>counterpart</span> (muadil), <span class='en'>counterproductive</span>, <span class='en'>interconnected</span>, <span class='en'>coincide</span></td></tr><tr><td><b>Tür Ekleri:</b> <span class='en'>-ive/-ous/-able</span> (sıfat) · <span class='en'>-ity/-tion/-ness</span> (isim) · <span class='en'>-ize/-ify/-ate</span> (fiil)</td><td><span class='en'>feasible, elusive, adverse</span> (adj) · <span class='en'>redundancy, prevalence</span> (n) · <span class='en'>foster, constitute</span> (v)</td></tr></tbody></table></div><div class=\"worked\"><div class=\"worked-hdr\"><span>Çözümlü Örnek · Telafi M3 #1–4 &amp; Tam Tanı M1 #16–17</span><span>Eşdizim ve Kutup Kilidi</span></div><div class=\"worked-stem\">1) Sanitized surroundings are ---- <b>allergic disorders</b> in children, which have doubled in the last decade.<br>2) Paracetamol was discovered in the 1890s, but ---- <b>how it relieves pain</b> remains a mystery.<br>3) The brain needs space to ---- <b>creative solutions</b> to problems you have been struggling with.<br>4) Social psychology theories ---- <b>assumptions</b> about social behaviour.</div><div class=\"worked-row\"><span class='ok'>[+] 1. (fostering):</span> Alerjik hastalıkların 2 kat artması bağlamında besleyip tetikleyen anlamı (<span class='en'>extract/unify</span> değil).</div><div class=\"worked-row\"><span class='ok'>[+] 2. (precisely):</span> 'Tam olarak nasıl ağrıyı kestiği' (<span class='err'>adversely/mistakenly</span> anlamsal olarak bozar).</div><div class=\"worked-row\"><span class='ok'>[+] 3. (come up with):</span> 'Yaratıcı çözüm üretmek' (<span class='err'>make up for</span> eksikliği telafi etmektir).</div><div class=\"worked-row\"><span class='ok'>[+] 4. (rest on):</span> Kuramlar varsayımlara 'dayanır' (<span class='err'>take down</span> = not almak/sökmek).</div></div>\n    <div class=\"grid-2\">\n      <div class=\"rule-card\">\n        <h4>Çok Anlamlı Akademik Fiil Tuzakları</h4>\n        <ul>\n          <li><b><span class='en'>address</span> (v):</b> Adreslemek değil <b>(sorunu/konuyu) ele almak</b> (<span class='en'>address climate issues</span>).</li>\n          <li><b><span class='en'>yield</span> (v/n):</b> Ürün/veri vermek, sonuç doğurmak veya <b>boyun eğmek</b> (<span class='en'>yield to pressure</span>).</li>\n          <li><b><span class='en'>exercise</span> (v):</b> Egzersiz değil <b>(kontrol/etki/hak) kullanmak</b> (<span class='en'>exercise influence over</span>).</li>\n          <li><b><span class='en'>harbor</span> (v):</b> Liman değil <b>(şüphe/düşünce/virüs) barındırmak, beslemek</b> (<span class='en'>harbor doubts</span>).</li>\n        </ul>\n      </div>\n      <div class=\"rule-card\">\n        <h4>Soru Kökü Hızlı Kutup Ayırıcı (+ / - Sözlüğü)</h4>\n        <ul>\n          <li><b>Kesin Olumsuz (-):</b> <span class='en'>detrimental, jeopardize, deteriorate, exacerbate, hamper, impair, futile, bleak, erratic, reluctant, scarcity</span>.</li>\n          <li><b>Kesin Olumlu (+):</b> <span class='en'>conducive to, foster, bolster, alleviate, mitigate, feasible, paramount, rigorous, indispensable, resilience, thrive</span>.</li>\n          <li><b>Nötr / Bilimsel Değişim:</b> <span class='en'>stem from, attribute to, coincide with, prevail, fluctuate, constitute, entail, trigger</span>.</li>\n        </ul>\n      </div>\n    </div>\n    <div class=\"edu-ex-slot\" data-ex-id=\"ex-3-5\"></div>", "searchText": "BÖLÜM 3 · GÜN 3 Test Atölyesi: Modül 3 (22 Soru · 18 dk) Akademik Kelime Hazinesi, Yalancı Arkadaşlar ve Phrasal Verb Kelime sorularında 4 kademeli eleme protokolü, fonetik/anlamsal yalancı arkadaşlar, kişisel [?] havuzu + yüksek frekanslı YDS kelime bankası ve phrasal verb sözlüğü. 3.1 Kelime Sorularında 4 Kademeli Çözüm Protokolü Anlamı Bilmeden Eleme ve Kök Çözümleme 1. Dilbilgisel Tür & Geçişlilik: Fiil boşluğu s rs in children, which have doubled in the last decade. 2) Paracetamol was discovered in the 1890s, but ---- how it relieves pain remains a mystery. 3) The brain needs space to ---- creative solutions to problems you have been struggling with. 4) Social psychology theories ---- assumptions about social behaviour. [+] 1. (fostering): Alerjik hastalıkların 2 kat artması bağlamında besleyip tetikleyen anlamı ( extract/unify değil). [+] 2. (precisely): 'Tam olarak nasıl ağrıyı kestiği' ( adversely/mistakenly anlamsal olarak bozar). [+] 3. (come up with): 'Yaratıcı çözüm üretmek' ( make up for eksikliği telafi etmektir). [+] 4. (rest on): Kuramlar varsayımlara 'dayanır' ( take down = not almak/sökmek). Çok Anlamlı Akademik Fiil Tuzakları address (v): Adreslemek değil (sorunu/konuyu) ele almak ( address climate issues ). yield (v/n): Ürün/veri vermek, sonuç doğurmak veya boyun eğmek ( yield to pressure ). exercise (v): Egzersiz değil (kontrol/etki/hak) kullanmak ( exercise influence over ). harbor (v): Liman değil (şüphe/düşünce/virüs) barındırmak, beslemek ( harbor doubts ). Soru Kökü Hızlı Kutup Ayırıcı (+ / - Sözlüğü) Kesin Olumsuz (-): detrimental, jeopardize, deteriorate, exacerbate, hamper, impair, futile, bleak, erratic, reluctant, scarcity . Kesin Olumlu (+): conducive to, foster, bolster, alleviate, mitigate, feasible, paramount, rigorous, indispensable, resilience, thrive . Nötr / Bilimsel Değişim: stem from, attribute to, coincide with, prevail, fluctuate, constitute, entail, trigger ."}, {"id": "sec-4-cloze-tamamlama", "dayTag": "Bölüm 4 · Gün 4", "title": "Cloze Test, Cümle Tamamlama ve Paragraf Tamamlama", "subtitle": "Cloze 3 katmanlı çözüm, SC ortak özne kilidi, ParComp çift yönlü zamir/işaret takibi.", "pairedBookId": "yds-telafi-programi-2026", "pairedTestId": "m4-cloze-tamamlama-ve-akis", "estMin": 24, "html": "<div class=\"chapter\"><div class=\"chapter-top\"><span class=\"chapter-tag\">BÖLÜM 4 · GÜN 4</span><span class=\"chapter-mod\">Test Atölyesi: Modül 4 (20 Soru · 24 dk)</span></div><h1>Cloze Test, Cümle Tamamlama ve Paragraf Tamamlama</h1><p class=\"chapter-desc\">Cloze 3-katman yöntemi, ortak özne kilidi ve paragraf tamamlamada çift yönlü zamir/işaret takibi.</p></div><h2 class=\"sec-head\"><span class=\"sec-num\">4.1</span>Cloze Test 3-Katmanlı Çözüm ve Tam Çözümlü Uygulama</h2><p>YDS'de her 5 soruluk Cloze parçası standart bir dağılımla gelir: <b>1 Tense/Modal/Gerund</b>, <b>1 Edat</b>, <b>1 Bağlaç/Geçiş</b>, <b>1 Kelime/Phrasal Verb</b> ve <b>1 Cümlecik/Kip</b>. Cümle içi kelimeler/edatlar için yalnızca boşluğun sağına-soluna bakılır; bağlaç ve zaman için bir önceki ve sonraki cümle taranır.</p>\n    <div class=\"passage-box\">\n      <b>Tam Çözümlü Uygulama (Telafi Modül 4 #1–5 · Kentleşme ve Kırsal Göç):</b><br>\n      Cities, large and small, are at the heart of a fast changing global economy – they are a cause of, and a response to world economic growth. Many urban areas are growing <b>(17)----</b> their rural hinterlands are depressed, which forces impoverished rural people to move to the cities in search of work. These newcomers often end up not <b>(18)----</b> the opportunities they are looking for, so they become part of the urban poor. <b>(19)----</b> arrival to the city, they often encounter lack of housing and infrastructure services. To <b>(20)----</b> the lack of available homes, newcomers often set up shelters on the city outskirts, usually on public-owned land. They often live without electricity, running water, a sewerage system, roads and other urban services. <b>(21)----</b> dealing with poor sanitation and pollution from dirty cooking fuels and primitive stoves, they are exposed to modern environmental hazards, such as urban air pollution, exhaust fumes and industrial pollution.\n    </div>\n    <div class=\"table-scroll\"><table><thead><tr><th style=\"width:16%\">Boşluk &amp; Tür</th><th style=\"width:34%\">Seçenek Havuzu</th><th style=\"width:50%\">Analiz ve Çözüm Kilidi</th></tr></thead><tbody><tr><td><b>(17) Bağlaç</b></td><td><span class='en'>unless, in case, so that, whenever, <b>because</b></span></td><td><b>E (<span class='en'>because</span>)</b>: Kırsal bölgelerin çöküntü içinde olması, kentlerin büyümesinin <b>doğrudan nedenidir</b> (+ tam cümle SVO).</td></tr><tr><td><b>(18) Fiilimsi</b></td><td><span class='en'>to find, <b>finding</b>, to have found, being found, to be found</span></td><td><b>B (<span class='en'>finding</span>)</b>: <span class='en'>end up (+ not) + V-ing</span> kalıbı aktif gerund ister; sağda <span class='en'>the opportunities</span> nesnesi mevcut.</td></tr><tr><td><b>(19) Edat</b></td><td><span class='en'>About, To, For, <b>Upon</b>, By</span></td><td><b>D (<span class='en'>Upon</span>)</b>: <span class='en'>Upon/On arrival</span> ('kente varır varmaz / varışta') sabit zamansal kalıptır.</td></tr><tr><td><b>(20) Phrasal Verb</b></td><td><span class='en'>cut down on, go in for, turn back on, fall behind with, <b>make up for</b></span></td><td><b>E (<span class='en'>make up for</span>)</b>: Sağdaki nesne <i>the lack of available homes</i> (konut eksikliğini telafi etmek/kapatmak).</td></tr><tr><td><b>(21) Edat Bağlaç</b></td><td><span class='en'>Despite, Owing to, For the sake of, <b>In addition to</b>, Unlike</span></td><td><b>D (<span class='en'>In addition to</span>)</b>: İlk kıtlık/sağlıksız koşulların <i>yanı sıra</i> modern çevre tehlikelerine de maruz kalıyorlar (ekleme, <span class='en'>+ Ving</span>).</td></tr></tbody></table></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-4-1\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">4.2</span>Cümle Tamamlama (SC): 4 Yapısal Kilitleme Kuralı</h2>\n    <div class=\"grid-2\">\n      <div class=\"rule-card\">\n        <h4>Kilit 1–2: Ortak Özne ve Bağlaç Kutbu</h4>\n        <ul>\n          <li><b>Ortak Özne Kısaltma Kilidi:</b> Cümle <span class='en'>Having V3 / To V1 / In order to V1 / Although V3 / Treated as...</span> ile başlıyorsa virgülden hemen sonraki ana özne o eylemin gerçek öznesi olmak zorundadır.</li>\n          <li><b>Kutup &amp; Kavram Eşleme:</b> <span class='en'>Although (+)</span> görürsen mutlaka zıt (-) ama <b>aynı özneye/konuya</b> bağlı yargıyı ara; sadece sözcük çağrışımına atlama (<span class='en'>citizenship ≠ social service</span>).</li>\n        </ul>\n      </div>\n      <div class=\"rule-card\">\n        <h4>Kilit 3–4: Zaman Uyumu ve Karşılaştırma Kalıbı</h4>\n        <ul>\n          <li><b>Zaman / Zamir Uyumu:</b> İlk yarı geçmiş ve tekil özne (<span class='en'>Hong Kong... when it was returned</span>) veya çoğul isimse diğer yarıdaki zamir (<span class='en'>they/these/its</span>) birebir tutmalıdır.</li>\n          <li><b><span class='en'>The + comparative, the + comparative</span>:</b> İkinci yarı <span class='en'>the more other people will respect you</span> şeklinde verilmişse ilk yarı da paralel <span class='en'>The more...</span> ile kurulur.</li>\n        </ul>\n      </div>\n    </div>\n    <div class=\"worked\"><div class=\"worked-hdr\"><span>Çözümlü Örnek · Tam Tanı M4 #11 &amp; Telafi M4 #11</span><span>Ortak Özne Düşmesi ve Amaç Öncülü</span></div><div class=\"worked-stem\">1) <b>Although often treated</b> by citizens and politicians alike <b>as a social service</b>, ----.<br>2) <b>In order to make</b> the first vessels to cross stretches of water, ----.</div><div class=\"worked-row\"><span class='ok'>[+] 1. Doğru (C: education is best understood as an investment in human resources):</span> Pasif kısaltmanın gizli öznesi 'sosyal hizmet olarak görülen şey'dir (<span class='en'>education</span>). Seçtiğin <span class='err'>B (citizenship denotes...)</span> hem sözlük tanımıdır hem de 'vatandaşlık' sosyal hizmet olarak görülmez.</div><div class=\"worked-row\"><span class='ok'>[+] 2. Doğru (E: early humans employed materials ranging from animal skins...):</span> <span class='en'>In order to make</span> amaç eylemini kim yapabilir? <i>'ancient civilizations depended on these'</i> veya <i>'early attempts'</i> değil, doğrudan yapan özne: <b>early humans</b>!</div></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-4-2\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">4.3</span>Paragraf Tamamlama: Çift Yönlü Kanca ve İşaret Takibi</h2><div class=\"svg-wrap\"><svg viewBox=\"0 0 720 124\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, Calibri, sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"124\" fill=\"#ffffff\"/>\n  <!-- Prev Sentence -->\n  <rect x=\"8\" y=\"16\" width=\"194\" height=\"72\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#334155\" stroke-width=\"1\"/>\n  <text x=\"105\" y=\"31\" text-anchor=\"middle\" font-size=\"8.4\" font-weight=\"700\" fill=\"#0f2438\">ÖNCEKİ CÜMLE (%10–25)</text>\n  <text x=\"105\" y=\"46\" text-anchor=\"middle\" font-size=\"7.6\" fill=\"#334155\">Konuyu ve alt başlığı kurar.</text>\n  <text x=\"105\" y=\"59\" text-anchor=\"middle\" font-size=\"7.6\" fill=\"#334155\">Boşluk son cümle ise özet</text>\n  <text x=\"105\" y=\"72\" text-anchor=\"middle\" font-size=\"7.6\" fill=\"#334155\">ya da doğal sonuç ister.</text>\n\n  <!-- Blank Slot -->\n  <rect x=\"238\" y=\"12\" width=\"224\" height=\"80\" rx=\"3\" fill=\"#f0f9ff\" stroke=\"#0e7490\" stroke-width=\"1.4\"/>\n  <text x=\"350\" y=\"29\" text-anchor=\"middle\" font-size=\"8.8\" font-weight=\"700\" fill=\"#0e7490\">DOĞRU SEÇENEK (KÖPRÜ)</text>\n  <text x=\"350\" y=\"44\" text-anchor=\"middle\" font-size=\"7.7\" fill=\"#0f2438\">1. Sağdaki zamirin gerçek öncülüdür.</text>\n  <text x=\"350\" y=\"58\" text-anchor=\"middle\" font-size=\"7.7\" fill=\"#0f2438\">2. Alt konuyu daraltıp somutlar.</text>\n  <text x=\"350\" y=\"72\" text-anchor=\"middle\" font-size=\"7.7\" fill=\"#9f1239\" font-weight=\"700\">3. Metindeki tutumla asla çelişmez.</text>\n\n  <!-- Next Sentence -->\n  <rect x=\"498\" y=\"16\" width=\"214\" height=\"72\" rx=\"3\" fill=\"#fffafa\" stroke=\"#9f1239\" stroke-width=\"1.1\"/>\n  <text x=\"605\" y=\"31\" text-anchor=\"middle\" font-size=\"8.4\" font-weight=\"700\" fill=\"#9f1239\">SONRAKİ CÜMLE (%90 KİLİDİ)</text>\n  <text x=\"605\" y=\"46\" text-anchor=\"middle\" font-size=\"7.6\" fill=\"#1e293b\">This / These features / Such</text>\n  <text x=\"605\" y=\"59\" text-anchor=\"middle\" font-size=\"7.6\" fill=\"#1e293b\">They / It / But / However / Thus</text>\n  <text x=\"605\" y=\"72\" text-anchor=\"middle\" font-size=\"7.6\" font-weight=\"700\" fill=\"#0f2438\">Zamir öncesi çoğul/tekil uyumu şart</text>\n\n  <!-- Arrows -->\n  <line x1=\"202\" y1=\"52\" x2=\"236\" y2=\"52\" stroke=\"#334155\" stroke-width=\"1.4\"/>\n  <polygon points=\"232,48 238,52 232,56\" fill=\"#334155\"/>\n  <line x1=\"498\" y1=\"52\" x2=\"464\" y2=\"52\" stroke=\"#9f1239\" stroke-width=\"1.8\"/>\n  <polygon points=\"468,48 462,52 468,56\" fill=\"#9f1239\"/>\n\n  <text x=\"360\" y=\"112\" text-anchor=\"middle\" font-size=\"7.6\" font-weight=\"600\" fill=\"#475569\">Kural: Paragraf ilk cümlesi ise zamirsiz (\"This/They\" içermeyen) genel giriş şıkkı seçilir; orta boşlukta sonraki cümle kilidi belirleyicidir.</text>\n</svg><div class=\"svg-cap\">Şema 4.1 — Paragraf Tamamlama Sorularında Çift Yönlü Kanca ve Zamir Öncülü Kilidi</div></div><div class=\"table-scroll\"><table><thead><tr><th style=\"width:24%\">Boşluk Konumu</th><th style=\"width:76%\">Aranacak Yapısal Bağ ve Eleme Kuralı</th></tr></thead><tbody><tr><td><b>Boşluk 1. Cümle (Giriş)</b></td><td>Paragrafın üst çerçevesini kurar. <b>İçinde <span class='en'>this, these, such, they, however, thus</span> geçen şıkları ELENİR</b> çünkü öncülleri yoktur. İkinci cümledeki zamirin tekil/çoğul öncülünü vermelidir.</td></tr><tr><td><b>Boşluk Ortada (%90 Sağ Kilit)</b></td><td>Boşluktan <b>sonraki ilk cümledeki</b> işaret sıfatını (<span class='en'>these features</span>), zamiri (<span class='en'>such diversity</span>) ya da zıtlık bağlacını (<span class='en'>But butter is made from other mammals as well</span>) doğrudan tamamlar.</td></tr><tr><td><b>Boşluk Son Cümle (Kapanış)</b></td><td>Parçada hiç geçmemiş yeni kavram veya mutlak iddia (<span class='en'>outright rejection</span>) içeremez; yazarın tezini özetler veya pratik sonucunu verir.</td></tr></tbody></table></div><div class=\"worked\"><div class=\"worked-hdr\"><span>Adli İnceleme · Tam Tanı M5 #10 (Gotik), #11 (Gandhi) &amp; Tereyağı Örneği</span><span>Kelime Çakışması vs Zamir Kancası</span></div><div class=\"worked-stem\">1) [Gotik] ...condemned as barbaric. <b>----</b> <b>None of these features</b> was first used in the Gothic period... created a new type of <b>skeletal structure</b>... very different from <b>Romanesque buildings</b>.<br>2) [Gandhi] ...<b>His favourite machines were the sewing machine</b>, invented 'out of love', <b>and the bicycle</b>, a means of transport he used all his life. <b>----</b><br>3) [Tereyağı · Çözüm Tek.] It consists of butterfat surrounding droplets... <b>----</b> <b>But</b> butter is made from the milk of <b>other mammals as well</b>, including sheep, goats...</div><div class=\"worked-row\"><span class='ok'>[+] 1. Doğru (A):</span> <i>'...characterised chiefly in terms of architecture — pointed arches, rib vaults, and flying buttresses.'</i> Sonraki <b>'None of these features'</b> mimari ögelerini verir. <span class='err'>C ('Gothic figures')</span> yalnızca <span class='en'>Romanesque</span> kelime örtüşmesine düşürür.</div><div class=\"worked-row\"><span class='ok'>[+] 2. Doğru (B):</span> Köylüleri güçlendirip kendi kendine yeterli kılan teknoloji vizyonunu tamamlar (<span class='en'>empowered / self-reliant</span>); <span class='err'>C ('outright rejection')</span> parçadaki sevgi/övgüyle çelişir.</div><div class=\"worked-row\"><span class='ok'>[+] 3. Doğru (C: Butter from cow's milk is the most common):</span> Sonraki cümledeki <b>But + other mammals as well</b> zıtlığının zorunlu karşıtı yalnız inek sütüdür (<span class='en'>cow's milk</span>).</div></div><div class=\"worked\"><div class=\"worked-hdr\"><span>Uygulama · Telafi Modül 4 #19–20 (Virüs Proteinleri &amp; Alfabe)</span><span>İşaret Sıfatı ve İkili Bağlaç Köprüsü</span></div><div class=\"worked-stem\">1) A molecule of a protein consists of a long chain of amino acids. <b>----</b> <b>These</b> can be arranged in almost any order to make millions of different proteins.<br>2) <b>In contrast</b>, non-alphabetic writing tends to represent concepts rather than individual sounds. <b>----</b> <b>Thus</b>, for example, in written Chinese there are thousands of characters...</div><div class=\"worked-row\"><span class='ok'>[+] 1. Doğru (E: There are about 20 different kinds of amino acid in proteins):</span> Boşluktan sonraki <b>These</b> zamiri ancak çoğul amino asit türlerine gönderebilir; konuyu virüs enfeksiyonuna (<span class='err'>infected cell</span>) veya DNA tedavisine (<span class='err'>genetically modified</span>) kaydıran şıklar sağdaki zamirle kırılır.</div><div class=\"worked-row\"><span class='ok'>[+] 2. Doğru (A: While there are a small number of phonemes in any language, there are numerous concepts and symbols):</span> Soldaki <b>In contrast</b> zıtlığını (ses az ↔ kavram çok) kurup sağdaki <b>Thus + thousands of characters</b> sonucuna doğrudan zemin hazırlar.</div></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-4-3\"></div>", "searchText": "BÖLÜM 4 · GÜN 4 Test Atölyesi: Modül 4 (20 Soru · 24 dk) Cloze Test, Cümle Tamamlama ve Paragraf Tamamlama Cloze 3-katman yöntemi, ortak özne kilidi ve paragraf tamamlamada çift yönlü zamir/işaret takibi. 4.1 Cloze Test 3-Katmanlı Çözüm ve Tam Çözümlü Uygulama YDS'de her 5 soruluk Cloze parçası standart bir dağılımla gelir: 1 Tense/Modal/Gerund , 1 Edat , 1 Bağlaç/Geçiş , 1 Kelime/Phrasal Verb ve 1 Cümlecik/Kip . Cümle içi kelimeler/edatlar için yalnızca boşluğun sağına-soluna bakılır; bağlaç ve zaman için bir önceki ve sonraki cümle taranır. Tam Çözümlü Uygulama (Telafi Modül 4 #1–5 · Kentleşme ve Kırsal Göç): Cities, large and small, are at the heart of a fast changing global economy – they are a cause of, and a response to world economic growth. Many urban areas are growing (17)---- their rural hinterlands are depressed, which forces impoverished rural people to move to the cities in search of work. These newcomers often end up not (18)---- the opportunities they are looking for, so they become part of the urban poor. (19)---- arrival to the city, they often encounter lack of housing and infrastructure services. To (20)---- the lack of available homes, newcomers often set up shelters on the city outskirts, usually on public-owned land. They often live without electricity, running water, a sewerage system, roads and other urban services. (21)---- dealing with poor sanitation and pollution from dirty cooking fuels and primitive stoves, they are exposed to modern environmental hazards, such as urban air pollution, exhaust fumes and industrial pollution. Boşluk & Tür Seçenek Havuzu Analiz ve Çözüm Kilidi (17) Bağlaç unless, in case, so that, whenever, because E ( because ) : Kırsal bölgelerin çöküntü içinde olması, kentlerin büyümesinin doğrudan nedenidir (+ tam cümle SVO). (18) Fiilimsi to find, finding , to have found, being found, to be found B ( finding ) : end up (+ not) + V-ing kalıbı aktif gerund ister; sağda the opportunities nesnesi mevcut. (19) Edat About, To, For, Upon , By D ( Upon ) : Upon/On arrival ('kente varır varmaz / varışta') sabit zamansal kalıptır. (20) Phrasal Verb cut down on, go in for, turn back on, fall behind with, make up for E ( make up for ) : Sağdaki nesne the lack of available homes (konut eksikliğini telafi etmek/kapatmak). (21) Edat Bağlaç Despite, Owing to, For the sake of, In addition to , Unlike D ( In addition to ) : İlk kıtlık/sağlıksız koşulların yanı sıra modern çevre tehlikelerine de maruz kalıyorlar (ekleme, + Ving ). 4.2 Cümle Tamamlama (SC): 4 Yapısal Kilitleme Kuralı Kilit 1–2: Ortak Özne ve Bağlaç Kutbu Ortak Özne Kısaltma Kilidi: Cümle Having V3 / To V1 / In order to V1 / Although V3 / Treated as... ile başlıyorsa virgülden hemen sonraki ana özne o eylemin gerçek öznesi olmak zorundadır. Kutup & Kavram Eşleme: Although (+) görürsen mutlaka zıt (-) ama aynı özneye/konuya bağlı yargıyı ara; sadece sözcük çağrışımına atlama ( citizenship ≠ social service ). Kilit 3–4: Zaman Uyumu ve Karşılaştırma Kalıbı Zaman / Zamir Uyumu: İlk yarı geçmiş ve tekil özne ( Hong Kong... when it was returned ) veya çoğul isimse diğer yarıdaki zamir ( they/these/its ) birebir tutmalıdır. The + comparative, the + comparative : İkinci yarı the more other people will respect you şeklinde verilmişse ilk yarı da paralel The more... ile kurulur. Çözümlü Örnek · Tam Tanı M4 #11 & Telafi M4 #11 Ortak Özne Düşmesi ve Amaç Öncülü 1) Although often treated by citizens and politicians alike as a social service , ----. 2) In order to make the first vessels to cross stretches of water, ----. [+] 1. Doğru (C: education is best understood as an investment in human resources): Pasif kısaltmanın gizli öznesi 'sosyal hizmet olarak görülen şey'dir ( education ). Seçtiğin B (citizenship denotes...) hem sözlük tanımıdır hem de 'vatandaşlık' sosyal hizmet olarak görülmez. [+] 2. Doğru (E: early humans employed materials ranging from animal skins...): In order to make amaç eylemini kim yapabilir? 'ancient civilizations depended on these' veya 'early attempts' değil, doğrudan yapan özne: early humans ! 4.3 Paragraf Tamamlama: Çift Yönlü Kanca ve İşaret Takibi Şema 4.1 — Paragraf Tamamlama Sorularında Çift Yönlü Kanca ve Zamir Öncülü Kilidi Boşluk Konumu Aranacak Yapısal Bağ ve Eleme Kuralı Boşluk 1. Cümle (Giriş) Paragrafın üst çerçevesini kurar. İçinde this, these, such, they, however, thus geçen şıkları ELENİR çünkü öncülleri yoktur. İkinci cümledeki zamirin tekil/çoğul öncülünü vermelidir. Boşluk Ortada (%90 Sağ Kilit) Boşluktan sonraki ilk cümledeki işaret sıfatını ( these features ), zamiri ( such diversity ) ya da zıtlık bağlacını ( But butter is made from other mammals as well ) doğrudan tamamlar. Boşluk Son Cümle (Kapanış) Parçada hiç geçmemiş yeni kavram veya mutlak iddia ( outright rejection ) içeremez; yazarın tezini özetler veya pratik sonucunu verir. Adli İnceleme · Tam Tanı M5 #10 (Gotik), #11 (Gandhi) & Tereyağı Örneği Kelime Çakışması vs Zamir Kancası 1) [Gotik] ...condemned as barbaric. ---- None of these features was first used in the Gothic period... created a new type of skeletal structure ... very different from Romanesque buildings . 2) [Gandhi] ... His favourite machines were the sewing machine , invented 'out of love', and the bicycle , a means of transport he used all his life. ---- 3) [Tereyağı · Çözüm Tek.] It consists of butterfat surrounding droplets... ---- But butter is made from the milk of other mammals as well , including sheep, goats... [+] 1. Doğru (A): '...characterised chiefly in terms of architecture — pointed arches, rib vaults, and flying buttresses.' Sonraki 'None of these features' mimari ögelerini verir. C ('Gothic figures') yalnızca Romanesque kelime örtüşmesine düşürür. [+] 2. Doğru (B): Köylüleri güçlendirip kendi kendine yeterli kılan teknoloji vizyonunu tamamlar ( empowered / self-reliant ); C ('outright rejection') parçadaki sevgi/övgüyle çelişir. [+] 3. Doğru (C: Butter from cow's milk is the most common): Sonraki cümledeki But + other mammals as well zıtlığının zorunlu karşıtı yalnız inek sütüdür ( cow's milk ). Uygulama · Telafi Modül 4 #19–20 (Virüs Proteinleri & Alfabe) İşaret Sıfatı ve İkili Bağlaç Köprüsü 1) A molecule of a protein consists of a long chain of amino acids. ---- These can be arranged in almost any order to make millions of different proteins. 2) In contrast , non-alphabetic writing tends to represent concepts rather than individual sounds. ---- Thus , for example, in written Chinese there are thousands of characters... [+] 1. Doğru (E: There are about 20 different kinds of amino acid in proteins): Boşluktan sonraki These zamiri ancak çoğul amino asit türlerine gönderebilir; konuyu virüs enfeksiyonuna ( infected cell ) veya DNA tedavisine ( genetically modified ) kaydıran şıklar sağdaki zamirle kırılır. [+] 2. Doğru (A: While there are a small number of phonemes in any language, there are numerous concepts and symbols): Soldaki In contrast zıtlığını (ses az ↔ kavram çok) kurup sağdaki Thus + thousands of characters sonucuna doğrudan zemin hazırlar."}, {"id": "sec-5-okuma-celdirici", "dayTag": "Bölüm 5 · Gün 5–6", "title": "Beşeri Bilimler Okuma Stratejisi ve Çeldirici Anatomisi", "subtitle": "Fen (%78,3) yöntemini Beşeri (%45,5) parçalara aktarım, 6 soru kökü ve 5 ÖSYM çeldirici tuzağı.", "pairedBookId": "yds-telafi-programi-2026", "pairedTestId": "m5-beseri-paradoksu-ve-hiz", "estMin": 24, "html": "<div class=\"chapter\"><div class=\"chapter-top\"><span class=\"chapter-tag\">BÖLÜM 5 · GÜN 5–6</span><span class=\"chapter-mod\">Test Atölyesi: Modül 5 (16s / 24 dk) &amp; Modül 6 (20s / 25 dk)</span></div><h1>Beşeri Bilimler Okuma Stratejisi ve Çeldirici Anatomisi</h1><p class=\"chapter-desc\">Fen (%78,3) parçalarındaki saf biçimsel akıl yürütme protokolünü Beşeri (%45,5) parçalara taşıma, 6 soru kökü ve 5 ÖSYM çeldirici tuzağı.</p></div><h2 class=\"sec-head\"><span class=\"sec-num\">5.1</span>Fen vs Beşeri Paradoksu ve Parça Katman Haritası</h2><div class=\"svg-wrap\"><svg viewBox=\"0 0 720 144\" width=\"100%\" xmlns=\"http://www.w3.org/2000/svg\" font-family=\"Segoe UI, Calibri, sans-serif\">\n  <rect x=\"0\" y=\"0\" width=\"720\" height=\"144\" fill=\"#ffffff\"/>\n  <!-- Top 4 Flow Boxes -->\n  <rect x=\"8\" y=\"8\" width=\"154\" height=\"58\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n  <text x=\"85\" y=\"23\" text-anchor=\"middle\" font-size=\"8.2\" font-weight=\"700\" fill=\"#0f2438\">1. ARKA PLAN / KABUL</text>\n  <text x=\"85\" y=\"37\" text-anchor=\"middle\" font-size=\"7.4\" fill=\"#475569\">Tarihsel bilgi, genel kanı,</text>\n  <text x=\"85\" y=\"49\" text-anchor=\"middle\" font-size=\"7.4\" fill=\"#475569\">önceki çalışma (\"in 1964...\")</text>\n\n  <line x1=\"162\" y1=\"37\" x2=\"180\" y2=\"37\" stroke=\"#0f2438\" stroke-width=\"1.4\"/>\n  <polygon points=\"178,33 185,37 178,41\" fill=\"#0f2438\"/>\n\n  <rect x=\"186\" y=\"8\" width=\"174\" height=\"58\" rx=\"3\" fill=\"#f0f9ff\" stroke=\"#0e7490\" stroke-width=\"1.2\"/>\n  <text x=\"273\" y=\"23\" text-anchor=\"middle\" font-size=\"8.2\" font-weight=\"700\" fill=\"#0e7490\">2. KIRILMA / YAZAR TEZİ</text>\n  <text x=\"273\" y=\"37\" text-anchor=\"middle\" font-size=\"7.4\" fill=\"#0f2438\" font-weight=\"600\">However / Yet / Indeed</text>\n  <text x=\"273\" y=\"49\" text-anchor=\"middle\" font-size=\"7.4\" fill=\"#334155\">Asıl tez &amp; yeni bulgu burada</text>\n\n  <line x1=\"360\" y1=\"37\" x2=\"378\" y2=\"37\" stroke=\"#0f2438\" stroke-width=\"1.4\"/>\n  <polygon points=\"376,33 383,37 376,41\" fill=\"#0f2438\"/>\n\n  <rect x=\"384\" y=\"8\" width=\"156\" height=\"58\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#cbd5e1\"/>\n  <text x=\"462\" y=\"23\" text-anchor=\"middle\" font-size=\"8.2\" font-weight=\"700\" fill=\"#0f2438\">3. MEKANİZMA / KAYNAK</text>\n  <text x=\"462\" y=\"37\" text-anchor=\"middle\" font-size=\"7.4\" fill=\"#475569\">Kime ait? (Author vs</text>\n  <text x=\"462\" y=\"49\" text-anchor=\"middle\" font-size=\"7.4\" fill=\"#475569\">Schmidt / Russell / Study)</text>\n\n  <line x1=\"540\" y1=\"37\" x2=\"558\" y2=\"37\" stroke=\"#0f2438\" stroke-width=\"1.4\"/>\n  <polygon points=\"556,33 563,37 556,41\" fill=\"#0f2438\"/>\n\n  <rect x=\"564\" y=\"8\" width=\"148\" height=\"58\" rx=\"3\" fill=\"#f8fafc\" stroke=\"#0f2438\"/>\n  <text x=\"638\" y=\"23\" text-anchor=\"middle\" font-size=\"8.2\" font-weight=\"700\" fill=\"#0f2438\">4. TUTUM &amp; SINIR</text>\n  <text x=\"638\" y=\"37\" text-anchor=\"middle\" font-size=\"7.4\" fill=\"#475569\">Kip gücü (might / must)</text>\n  <text x=\"638\" y=\"49\" text-anchor=\"middle\" font-size=\"7.4\" fill=\"#475569\">ve çıkarım sınırı</text>\n\n  <!-- Bottom Filter: Safe vs Trap -->\n  <rect x=\"8\" y=\"78\" width=\"346\" height=\"58\" rx=\"3\" fill=\"#f0f9ff\" stroke=\"#bae6fd\"/>\n  <text x=\"18\" y=\"93\" font-size=\"8.1\" font-weight=\"700\" fill=\"#0e7490\">DOĞRU ŞIK İMZASI (PARAFRAZ + İHTİYAT)</text>\n  <text x=\"18\" y=\"107\" font-size=\"7.5\" fill=\"#1e293b\">• Eş/yakın anlamlı sözcüklerle metindeki fikri taşır (kopya çekmez).</text>\n  <text x=\"18\" y=\"120\" font-size=\"7.5\" fill=\"#1e293b\">• Kapsamı dar tutar: may, could, potential to, imply, tend to.</text>\n\n  <rect x=\"366\" y=\"78\" width=\"346\" height=\"58\" rx=\"3\" fill=\"#fffafa\" stroke=\"#fecdd3\"/>\n  <text x=\"376\" y=\"93\" font-size=\"8.1\" font-weight=\"700\" fill=\"#9f1239\">5 ÖSYM ÇELDİRİCİ TUZAĞI (DOĞRUDAN ELE)</text>\n  <text x=\"376\" y=\"107\" font-size=\"7.5\" fill=\"#1e293b\">• Kip şişirme (might → clearly/prove) · Aşırı uç (only, always, never)</text>\n  <text x=\"376\" y=\"120\" font-size=\"7.5\" fill=\"#1e293b\">• Eşkökenli kelime tuzağı (buried → burial) · Özne/alıntı kaydırma</text>\n</svg><div class=\"svg-cap\">Şema 5.1 — Beşeri Bilimler Okuma Parçalarında Katman Haritası ve Şık Doğrulama Filtresi</div></div><div class=\"callout\"><div class=\"callout-title\">Beşeri Metinlerde 3 Bilişsel Tuzak</div>Fen metinlerinde ön bilgin olmadığı için yalnız metnin söylediğini okuyorsun (%78,3). Tarih, felsefe ve sosyoloji metinlerinde ise: <b>(1)</b> Gerçek dünya ön bilgisini metne enjekte etmek (Göbekli Tepe'de dış tarih bilgisini metnin önüne koymak), <b>(2)</b> Yazarın ihtiyatlı olasılıklarını (<span class='en'>might be, must have had, seems</span>) şıkta kesin olguya (<span class='en'>clearly, prove</span>) şişirmek, <b>(3)</b> Bilinmeyen kelime sonrası yakın sesli/köklü ilk şıkka atlamak (<span class='en'>buried → burial site</span>).</div><div class=\"edu-ex-slot\" data-ex-id=\"ex-5-1\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">5.2</span>ÖSYM Okuma Soru Kökleri ve Yazar Tutum Sözlüğü</h2><div class=\"table-scroll\"><table><thead><tr><th style=\"width:22%\">Soru Tipi</th><th style=\"width:32%\">Soru Kökü İfadeleri</th><th style=\"width:46%\">Çözüm Kuralı</th></tr></thead><tbody><tr><td><b>1. Konumlu Açık Bilgi</b></td><td><span class='en'>It is stated that 'in the early 20th c.' ... / According to the passage, Schmidt...</span></td><td>Soru kökündeki tarih/isim doğrudan paragraftaki hedef satırı işaret eder; metin dışı ekleme içeren şıkkı ele.</td></tr><tr><td><b>2. Açık Uçlu Parafraz</b></td><td><span class='en'>According to the passage / It is pointed out / stated that...</span></td><td>Metnin tamamına yayılabilir. Doğru şık, cümledeki fikri eşanlamlı ifadelerle yeniden kurar.</td></tr><tr><td><b>3. Çıkarım (Inference)</b></td><td><span class='en'>It can be inferred / implied / We can understand that...</span></td><td>Satır arasıdır ama <b>metin sınırı içindedir</b> (<span class='en'>purposely buried probably to unearth → deliberately left in disguise for future use</span>).</td></tr><tr><td><b>4. Yazar Üslup ve Tutumu</b></td><td><span class='en'>The author feels / is of the opinion / tone is...</span></td><td>Alıntılanan kişiyle yazarı ayır! Tutum sıfatları: <span class='en'>cautious</span> (temkinli), <span class='en'>skeptical</span> (kuşkucu), <span class='en'>critical</span> (eleştirel), <span class='en'>objective</span> (tarafsız), <span class='en'>admiring</span> (hayran), <span class='en'>sarcastic</span> (iğneleyici), <span class='en'>indifferent</span> (ilgisiz), <span class='en'>ambivalent</span> (kararsız).</td></tr><tr><td><b>5. Ana Fikir / Başlık</b></td><td><span class='en'>Main idea / Best title / Mainly concerned with...</span></td><td>Tek bir detaya sıkışan dar şıklar ile metinde hiç geçmeyen aşırı genel şıkları ele; ilk + son kırılma sentezi.</td></tr><tr><td><b>6. Olumsuz Soru Kökü</b></td><td><span class='en'>Which cannot be answered / is NOT true / EXCEPT...</span></td><td>Metinde karşılığını bulduğun 4 şıkkı satır numarasıyla işaretle (<span class='en'>social interactions</span> varsa C cevaplanabilir → C elenir).</td></tr></tbody></table></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-5-2\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">5.3</span>Doğru Şık İmzası vs 5 ÖSYM Çeldirici Kalıbı</h2><div class=\"table-scroll\"><table><thead><tr><th style=\"width:24%\">Çeldirici Tipi</th><th style=\"width:37%\">Somut Örnek (Tanı / Telafi)</th><th style=\"width:39%\">Eleme Kriteri</th></tr></thead><tbody><tr><td><b>1. Kip Şişirme + Metin Dışı Zarf</b></td><td>Metin: <span class='en'>must have had agriculture</span><br>Şık: <span class='en'>it has become clear ... <b>efficiently</b></span></td><td>Çıkarım/olasılık (<span class='en'>may/might/must have</span>) kesin olguya (<span class='en'>clear/prove</span>) döndürülmüşse veya <span class='en'>efficiently</span> eklenmişse ELE.</td></tr><tr><td><b>2. Extreme Modifier (Mutlaklık)</b></td><td><span class='en'>only, always, never, all, outright, entirely different, outweigh all others</span></td><td>Metin 'yakın tarihin en önemli bulgularından' derken şık '<b>tek</b> çarpıcı keşif' derse mutlaklıktan ELE.</td></tr><tr><td><b>3. Eşkökenli / Kelime Çakışması</b></td><td>Metin: <span class='en'>purposely <b>buried</b> the site under dirt</span><br>Şık: <span class='en'>was actually a <b>burial site</b></span></td><td>Metinde geçen aynı kelime kökünü bambaşka anlamda kullanıp göz tuzağı kurar.</td></tr><tr><td><b>4. Özne / Alıntı Kaydırma</b></td><td>Metin: <span class='en'>beneficiaries oppressing workers</span> / <span class='en'>laws vs legislation</span></td><td>Metinde iki grup/kavram geçerken X'e ait özelliği Y'ye mal eder (<span class='en'>priests over the rich</span> ×).</td></tr><tr><td><b>5. Nüans Düzleştirme</b></td><td>Metin: <span class='en'>roots in Mesolithic, <b>yet</b> created a new type</span><br>Şık: <span class='en'>are labeled as Mesolithic</span></td><td><span class='en'>yet / however</span> ile kurulan farkı yok sayıp önceki dönemle eşitleyen şıkkı ELE.</td></tr></tbody></table></div><div class=\"edu-ex-slot\" data-ex-id=\"ex-5-3\"></div><h2 class=\"sec-head\"><span class=\"sec-num\">5.4</span>Tam Metin Analizi (Bertrand Russell) &amp; Adli Vaka Eşlemesi</h2>\n    <div class=\"passage-box\">\n      <b>Tam Çözümlü Beşeri Parça (Telafi Modül 5 #1–4 · Felsefe / Sosyoloji):</b><br>\n      Bertrand Russell’s essay <i>In Praise of Idleness</i> was first published in 1932, in the middle of the Great Depression, a period of global economic crisis. It might seem distasteful to promote the virtues of idleness at such a time, when unemployment was rising to a third of the working population in some parts of the world. <b><u>For Russell, however</u></b>, the economic chaos of the time was itself the result of a set of deep-rooted and mistaken attitudes about work. <b><u>Indeed</u></b>, he claims that many of our ideas about work are little more than <b>superstitions, which should be swept away with rigorous thinking</b>. Russell distinguishes between two kinds of workers: labourers and supervisors. To these, he adds a third group of non-workers – the leisured landowners who depend on other people’s labour to support their own idleness. According to Russell, history is littered with examples of people working hard all their lives and being allowed to keep just enough for themselves and their families to survive, while any surplus they produce is appropriated by warriors, priests and the leisured ruling classes. And it is always these <b>beneficiaries of the system</b>, says Russell, who are heard <b>praising the virtues of ‘honest toil’, giving a moral mask to a system that is manifestly unjust</b>. And this fact alone should <b>prompt us to re-evaluate the ethics of work</b>.\n    </div>\n    <div class=\"table-scroll\"><table><thead><tr><th style=\"width:19%\">Parça / Soru</th><th style=\"width:40%\">Metindeki Dayanak Cümle</th><th style=\"width:41%\">Doğru Parafraz vs Elenecek Tuzak</th></tr></thead><tbody><tr><td><b>Russell #1</b> (Çıkarım)</td><td><span class='en'>beneficiaries ... praising 'honest toil', giving a moral mask to a system that is manifestly unjust.</span></td><td><span class='ok'>D: sees ethics of hard work as a mechanism used by the privileged class to ensure the continuation of the unjust system.</span> (<span class='err'>C</span> 'işsizliği kesin kucaklayın' uç genellemesi!)</td></tr><tr><td><b>Russell #2</b> (Açık Bilgi)</td><td><span class='en'>little more than superstitions, which should be swept away with rigorous thinking</span></td><td><span class='ok'>C: could easily be changed by thinking more deeply</span> (<span class='err'>B</span> bu fikirler işçilerce değil yararlananlarca övülür).</td></tr><tr><td><b>Russell #3</b> (Amaç/Zaman)</td><td><span class='en'>For Russell, however, the economic chaos ... was itself the result of mistaken attitudes about work.</span></td><td><span class='ok'>A: to show that the economic chaos was a direct consequence of established work ethics</span>.</td></tr><tr><td><b>Russell #4</b> (Sonuç)</td><td><span class='en'>prompt us to re-evaluate the ethics of work</span></td><td><span class='ok'>C: should be re-assessed to get rid of the unfair practices of the privileged class</span> (<span class='err'>E</span> özne ters: rahipler zenginleri değil ayrıcalıklılar işçiyi ezer).</td></tr><tr><td><b>Göbekli Tepe #1</b> <span class='mono'>(357s)</span></td><td><span class='en'>Klaus Schmidt, the man who first discovered Göbekli Tepe...</span></td><td><span class='ok'>A: Schmidt was the discoverer...</span> (<span class='err'>C</span> <i>must have → clear + efficiently</i> şişirmesidir; ilk seçiminden dönme!).</td></tr><tr><td><b>Göbekli Tepe #2 &amp; #4</b></td><td><span class='en'>importance was not recognized... · purposely buried probably to unearth it upon return</span></td><td><span class='ok'>#2 A: initially did not attract much scientific interest</span> · <span class='ok'>#4 C: deliberately left in disguise for future use</span> (<span class='err'>burial site</span> kökü tuzak!).</td></tr></tbody></table></div><div class=\"callout\"><div class=\"callout-title\">Okuma Parçasında Uygulama Sırası ve 150-Saniye Kuralı</div><b>1. Soru Kökü Taraması:</b> Metinden önce 4 soru kökündeki özel isim, tarih veya tırnaklı ifadeyi çiz. · <b>2. Bağlaçla Bölme:</b> <span class='en'>For Russell, however / yet / indeed</span> gördüğün satırı kalınlaştır — yazar tezi buradadır. · <b>3. 150-Saniye Sınırı:</b> İki şık arasında 150 saniye dolduğunda dış bilgini sustur, metinde kelimesi kelimesine dayanağı olan ilk seçeneği işaretle ve geç.</div>\n    <div class=\"grid-2\">\n      <div class=\"rule-card\">\n        <h4>Yazar vs Alıntılanan Görüş Ayrımı (Tutum Kilidi)</h4>\n        <ul>\n          <li><b>Üçüncü Kişi İsnatları:</b> <span class='en'>Early historians believed / Critics argue / Traditional views hold</span> yazarın görüşü DEĞİLDİR! Şık bunu yazarın tezi gibi sunarsa anında ELE.</li>\n          <li><b>Kırılma Noktası = Yazarın Sesi:</b> <span class='en'>However / Yet / Recent evidence suggests</span> sonrası yazarın gerçek yargısını verir.</li>\n          <li><b>Ton İpuçları:</b> <span class='en'>may/could/seems</span> → <i>cautious</i> · <span class='en'>superstition/unjust</span> → <i>critical</i> · <span class='en'>far from certain</span> → <i>skeptical</i>.</li>\n        </ul>\n      </div>\n      <div class=\"rule-card\">\n        <h4>ÖSYM Okuma Parafraz Sözlüğü (Metin → Doğru Şık)</h4>\n        <ul>\n          <li><span class='en'>is rarely, if ever, forgotten</span> ↔ <span class='en'>remains permanently retained</span></li>\n          <li><span class='en'>little more than superstitions</span> ↔ <span class='en'>mistaken / unfounded beliefs</span></li>\n          <li><span class='en'>prompt us to re-evaluate</span> ↔ <span class='en'>call for a re-assessment of</span></li>\n          <li><span class='en'>purposely left under dirt</span> ↔ <span class='en'>deliberately covered for protection</span></li>\n          <li><span class='en'>far from resolved / unclear</span> ↔ <span class='en'>not yet conclusively settled</span></li>\n        </ul>\n      </div>\n    </div>\n    <div class=\"edu-ex-slot\" data-ex-id=\"ex-5-4\"></div>", "searchText": "BÖLÜM 5 · GÜN 5–6 Test Atölyesi: Modül 5 (16s / 24 dk) & Modül 6 (20s / 25 dk) Beşeri Bilimler Okuma Stratejisi ve Çeldirici Anatomisi Fen (%78,3) parçalarındaki saf biçimsel akıl yürütme protokolünü Beşeri (%45,5) parçalara taşıma, 6 soru kökü ve 5 ÖSYM çeldirici tuzağı. 5.1 Fen vs Beşeri Paradoksu ve Parça Katman Haritası Şema 5.1 — Beşeri Bilimler Okuma Parçalarında Katman Haritası ve Şık Doğrulama Filtresi Beşeri Metinlerde 3 Bilişsel Tuzak Fen metinlerinde ön bilgin olmadığı için yalnız metnin söylediğini okuyorsun (%78,3). Tarih, felsefe ve sosyoloji metinlerinde ise: (1) Gerçek dünya ön bilgisini metne enjekte etmek (Göbekli Tepe'de dış tarih bilgisini metnin önüne koymak), (2) Yazarın ihtiyatlı olasılıklarını ( might be, must have had, seems ) şıkta kesin olguya ( clearly, prove ) şişirmek, (3) Bilinmeyen kelime sonrası yakın sesli/köklü ilk şıkka atlamak ( buried → burial site ). 5.2 ÖSYM Okuma Soru Kökleri ve Yazar Tutum Sözlüğü Soru Tipi Soru Kökü İfadeleri Çözüm Kuralı 1. Konumlu Açık Bilgi It is stated that 'in the early 20th c.' ... / According to the passage, Schmidt... Soru kökündeki tarih/isim doğrudan paragraftaki hedef satırı işaret eder; metin dışı ekleme içeren şıkkı ele. 2. Açık Uçlu Parafraz According to the passage / It is pointed out / stated that... Metnin tamamına yayılabilir. Doğru şık, cümledeki fikri eşanlamlı ifadelerle yeniden kurar. 3. Çıkarım (Inference) It can be inferred / implied / We can understand that... Satır arasıdır ama metin sınırı içindedir ( purposely buried probably to unearth → deliberately left in disguise for future use ). 4. Yazar Üslup ve Tutumu The author feels / is of the opinion / tone is... Alıntılanan kişiyle yazarı ayır! Tutum sıfatları: cautious (temkinli), skeptical (kuşkucu), critical (eleş
