  const FARM_DAYS = [
    { event: '1. Gün: Toprak kuruyor ve güneş az. Fidenin çimlenmesi için ne yapmalısın?', opts: [{ txt: '💧 Ölçülü sula & güneşe al', ok: true, dw: 25, ds: 20, dh: 0 }, { txt: '❄️ Karanlık dolaba koy', ok: false, dw: -10, ds: -30, dh: 0 }] },
    { event: '2. Gün: Kavurucu sıcak! Toprak çok kurudu, yapraklar büküldü.', opts: [{ txt: '💧 Sula & hafif gölgeye çek', ok: true, dw: 20, ds: -10, dh: 0 }, { txt: '🔥 Daha çok güneşte beklet', ok: false, dw: -35, ds: 15, dh: 0 }] },
    { event: '3. Gün: Gece çok yağmur yağdı, saksının içi göl gibi su doldu!', opts: [{ txt: '🕳️ Fazla suyu süz & toprağı havalandır', ok: true, dw: -20, ds: 10, dh: 20 }, { txt: '🚿 Üzerine bir kova daha su dök', ok: false, dw: 35, ds: -10, dh: -25 }] },
    { event: '4. Gün: Toprak sertleşip kabuk bağladı, kökler nefes alamıyor!', opts: [{ txt: '🪱 Toprağı çapala & doğal humus ekle', ok: true, dw: 0, ds: 0, dh: 25 }, { txt: '🪨 Üstünü taşla bastır', ok: false, dw: 0, ds: 0, dh: -30 }] },
    { event: '5. Gün: Çiçekler açtı! Ata tohumlu domatesin büyümesi için son karar:', opts: [{ txt: '☀️ Dengeli güneş, su ve hava sağla', ok: true, dw: 5, ds: 10, dh: 10 }, { txt: '🧪 Kimyasal atık dök', ok: false, dw: -40, ds: -20, dh: -40 }] }
  ];

  function mountFarmGame(slot) {
    let day = 0, water = 50, sun = 55, air = 60, msg = 'Ata tohumu domatesini 5 gün boyunca dengede tut! Su, Güneş veya Toprak Havası 15\'in altına düşerse fide solar!';

    function draw() {
      const dead = water < 15 || sun < 15 || air < 15 || water > 95;
      const won = day >= FARM_DAYS.length && !dead;
      const d = FARM_DAYS[Math.min(day, FARM_DAYS.length - 1)];
      slot.innerHTML = `<section class="fg-card mint">
        ${H().gameHeader('game-u7-farm', '🌱 STRATEJİK SERA SİMÜLASYONU', 'Oyun 13 · Toprağı Tanı & 5 Günde Ata Tohumunu Büyüt!', 'Bitkinin yaşaması için Su, Güneş ve Toprak Havası dengesini 5 gün boyunca koru!')}
        <div class="fg-farm-meters">
          <div>💧 Su: <b>%${water}</b><div class="fg-banner-bar"><i style="width:${water}%"></i></div></div>
          <div>☀️ Işık/Sıcaklık: <b>%${sun}</b><div class="fg-banner-bar"><i style="width:${sun}%"></i></div></div>
          <div>🪱 Toprak Havası/Humus: <b>%${air}</b><div class="fg-banner-bar"><i style="width:${air}%"></i></div></div>
        </div>
        <div class="fg-farm-stage">
          <div class="fg-plant-icon">${dead ? '🥀' : won ? '🍅🌿🍅' : day >= 3 ? '🌼🌿' : day >= 1 ? '🌱' : '🫘'}</div>
          <div>
            <div class="fg-capsule">${dead ? '🥀 Eyvah! Denge bozulduğu için fide soldu. Tekrar dene!' : won ? '🍅🏆 HARİKA ÇİFTÇİ! Ata tohumu domateslerin kızardı!' : d.event}</div>
            <div class="fg-msg" style="margin-top:8px">${msg}</div>
            ${!dead && !won ? `<div class="row" style="margin-top:8px">${d.opts.map((op, i) => `<button type="button" class="small primary" data-farm-opt="${i}">${op.txt}</button>`).join('')}</div>` : ''}
            <button type="button" class="small" data-farm-reset="1" style="margin-top:8px">🔄 Yeni Tohum Ek</button>
          </div>
        </div>
      </section>`;
    }

    slot.onclick = e => {
      const ob = e.target.closest('[data-farm-opt]');
      if (ob) {
        const op = FARM_DAYS[day].opts[Number(ob.dataset.farmOpt)];
        water = Math.max(0, Math.min(100, water + op.dw));
        sun = Math.max(0, Math.min(100, sun + op.ds));
        air = Math.max(0, Math.min(100, air + op.dh));
        if (op.ok) {
          day++; H().sfxGood();
          msg = day >= FARM_DAYS.length ? '🍅 Müthiş! Toprak, su, ışık ve havayı mükemmel yönettin!' : '✅ Doğru karar! Fide güçlenerek büyüdü!';
          if (day >= FARM_DAYS.length) { H().sfxWin(); H().saveGameProgress('game-u7-farm', 5, 5); }
        } else { H().sfxBad(); msg = '⚠️ Dikkat! Bu seçim bitkinin dengesini bozdu!'; }
        draw(); return;
      }
      if (e.target.closest('[data-farm-reset]')) { day = 0; water = 50; sun = 55; air = 60; msg = 'Yeni ata tohumu ekildi!'; draw(); }
    };
    draw();
  }

      slot.innerHTML = `<section class="fg-card sky">

            <div class="fg-capsule" style="margin-bottom:8px">${cDone ? '✅ Tüm canlılar yuvalarına yerleşti!' : `Canlı: <b>${cur.name}</b>`}</div>

function fcDefaultSettings() {
  return {
    newPerDay: 20,
    revPerDay: 100,
    startEase: 2.5,
    stepsMin: '10,1440',
    order: 'due-first',
    autoSpeak: false,
    speakLang: 'en'
  };
}

function fcEnsureCats(e) {
  if (!Array.isArray(e.fcCats)) e.fcCats = [];
  if (!e.fcCats.some(c => c.id === 'other')) {
    e.fcCats.unshift({
      id: 'other',
      name: 'Diğer',
      desc: 'Eğitim veya test sırasında yeni eklenen, henüz kategorize edilmemiş ifadeler',
      settings: fcDefaultSettings(),
      updatedAt: 1
    });
  }
  for (const c of e.fcCats) {
    c.settings = { ...fcDefaultSettings(), ...(c.settings || {}) };
  }
  if (!e.fcCards || typeof e.fcCards !== 'object' || Array.isArray(e.fcCards)) e.fcCards = {};
  if (!e.fcDaily || typeof e.fcDaily !== 'object') e.fcDaily = { date: '', newCount: {}, revCount: {} };
  const today = new Date().toISOString().slice(0, 10);
  if (e.fcDaily.date !== today) e.fcDaily = { date: today, newCount: {}, revCount: {} };

  if (!Array.isArray(e.hlCats)) e.hlCats = [];
  if (!e.hlCats.some(c => c.id === 'other')) {
    e.hlCats.unshift({
      id: 'other',
      name: 'Diğer',
      desc: 'Henüz konusuna göre kategorize edilmemiş vurgular',
      updatedAt: 1
    });
  }
  if (!e.hlCatMap || typeof e.hlCatMap !== 'object' || Array.isArray(e.hlCatMap)) e.hlCatMap = {};
  const profId = typeof activeProfile === 'function' ? activeProfile()?.id : '';
  if (profId === 'p-nayas' && !e.hlCatsSyncedOnce) {
    const customFc = e.fcCats.filter(c => c.id !== 'other');
    if (customFc.length) {
      for (const c of customFc) {
        if (!e.hlCats.some(h => h.id === c.id || h.name === c.name)) {
          const hlDesc = c.desc
            ? `${c.desc} (Vurgulanan cümle, kural ve notlar için)`
            : `${c.name} konusuyla ilgili vurgulanan ifadeler ve notlar`;
          e.hlCats.push({ id: c.id, name: c.name, desc: hlDesc, updatedAt: Date.now() });
        }
      }
      e.hlCatsSyncedOnce = true;
    }
  }
  return e;
}

let fcActiveCat = 'all';
let fcFlipped = false;

let fcAutoProgress = { fc: null, hl: null }; // null | { pct: 0..100, done: false, err: '' }

function fcCardState(e, id) {
  fcEnsureCats(e);
  const c = e.fcCards[id];
  if (c && typeof c === 'object') {
    if (!c.catId || !e.fcCats.some(x => x.id === c.catId)) c.catId = 'other';
    return c;
  }
  return { catId: 'other', reps: 0, interval: 0, ease: 2.5, lapses: 0, due: 0, lastReview: 0, updatedAt: 0 };
}

function fcCatOf(e, catId) {
  fcEnsureCats(e);
  return e.fcCats.find(c => c.id === catId) || e.fcCats[0];
}

function fcNextInterval(card, rating, settings) {
  const s = { ...fcDefaultSettings(), ...(settings || {}) };
  const startEase = Math.max(1.3, Math.min(3.5, Number(s.startEase) || 2.5));
  let ease = Number(card.ease) || startEase;
  let reps = Number(card.reps) || 0;
  let interval = Number(card.interval) || 0;
  let lapses = Number(card.lapses) || 0;
  const steps = String(s.stepsMin || '10,1440').split(',').map(x => Math.max(1, Number(x.trim()) || 10));
  const firstStepDays = (steps[0] || 10) / 1440;
  const gradDays = Math.max(1, Math.round((steps[1] || 1440) / 1440));

  if (rating === 'again') {
    reps = 0;
    lapses += 1;
    ease = Math.max(1.3, ease - 0.2);
    interval = firstStepDays;
  } else if (rating === 'hard') {
    if (reps === 0) interval = Math.max(firstStepDays * 1.5, 0.5);
    else interval = Math.max(1, interval * 1.2);
    ease = Math.max(1.3, ease - 0.15);
    reps += 1;
  } else if (rating === 'good') {
    if (reps === 0) interval = gradDays;
    else if (reps === 1) interval = Math.max(gradDays * 2, 3);
    else interval = Math.round(interval * ease);
    reps += 1;
  } else if (rating === 'easy') {
    if (reps === 0) interval = Math.max(gradDays * 2, 4);
    else interval = Math.round(interval * ease * 1.3);
    ease = Math.min(3.5, ease + 0.15);
    reps += 1;
  }
  return { interval, ease, reps, lapses, due: Date.now() + interval * 86400000 };
}

function fcFormatInterval(days) {
  if (days < 1 / 24) return Math.max(1, Math.round(days * 1440)) + ' dk';
  if (days < 1) return Math.max(1, Math.round(days * 24)) + ' sa';
  if (days < 30) return Math.round(days) + ' gün';
  if (days < 365) return (days / 30).toFixed(1).replace('.', ',') + ' ay';
  return (days / 365).toFixed(1).replace('.', ',') + ' yıl';
}

function fcBuildQueue(e, vocabAll, catFilter) {
  fcEnsureCats(e);
  const now = Date.now();
  const dueList = [];
  const newList = [];
  for (const v of vocabAll) {
    if (v.mastered) continue;
    const cs = fcCardState(e, v.id);
    if (catFilter !== 'all' && cs.catId !== catFilter) continue;
    const cat = fcCatOf(e, cs.catId);
    const limNew = Number(cat.settings?.newPerDay) || 20;
    const limRev = Number(cat.settings?.revPerDay) || 100;
    const usedNew = Number(e.fcDaily.newCount?.[cat.id]) || 0;
    const usedRev = Number(e.fcDaily.revCount?.[cat.id]) || 0;

    if (cs.reps === 0 && cs.due === 0) {
      if (usedNew < limNew) newList.push({ v, cs, isNew: true });
    } else if (cs.due <= now) {
      if (usedRev < limRev) dueList.push({ v, cs, isNew: false });
    }
  }
  const activeCatObj = catFilter !== 'all' ? fcCatOf(e, catFilter) : null;
  const order = activeCatObj?.settings?.order || 'due-first';
  let q = order === 'new-first' ? [...newList, ...dueList] : [...dueList, ...newList];
  if (order === 'random') {
    q = q.slice().sort((a, b) => ((a.v.id.charCodeAt(0) * 31) % 97) - ((b.v.id.charCodeAt(0) * 31) % 97));
  }
  return { queue: q, dueCount: dueList.length, newCount: newList.length };
}

function fcProgressBadgeHTML(kind) {
  const st = fcAutoProgress[kind];
  if (!st) return '';
  if (st.err) return `<span class="fc-prog err" title="${esc(st.err)}">⚠ ${esc(st.err)}</span>`;
  if (st.done) return `<span class="fc-prog done" title="Kategorizasyon tamamlandı">✓ %100</span>`;
  return `<span class="fc-prog busy"><span class="fc-prog-bar"><i style="width:${st.pct}%"></i></span> %${st.pct}</span>`;
}

            `<div class="row" style="justify-content:center;margin-top:10px"><button class="small ${aiOpen ? 'primary' : ''}" data-act="fcAiToggle" data-id="${esc(v.id)}" aria-expanded="${aiOpen}">🤖 AI ile Anlam / Örnek Üret</button><button class="small" data-act="eduToggleVocab" data-kind="${esc(v.kind)}" data-id="${esc(v.id)}">✓ Öğrendim (Arşivle)</button></div>` +

    }).join('')}</div>` : '<div class="empty">Bu filtrede ifade bulunamadı. Testlerde veya konu anlatımında bilmediğin ifadeleri ❓ ile işaretlediğinde otomatik olarak buraya (Diğer) düşer.</div>');

function hlCategoryView(hls, q) {
  const e = fcEnsureCats(ensureEduState(state));
  const activeCat = hlActiveCat === 'all' || e.hlCats.some(c => c.id === hlActiveCat) ? hlActiveCat : 'all';
  hlActiveCat = activeCat;
  const getCatId = h => {
    const k = h.kind + ':' + h.id;
    const cid = e.hlCatMap[k]?.catId || 'other';
    return e.hlCats.some(c => c.id === cid) ? cid : 'other';
  };
  const counts = {};
  for (const c of e.hlCats) counts[c.id] = 0;
  for (const h of hls) { const cid = getCatId(h); counts[cid] = (counts[cid] || 0) + 1; }

  const catBar = `<div class="fc-cat-bar">` +
    `<button class="small ${activeCat === 'all' ? 'primary' : ''}" data-act="hlSelectCat" data-cat="all">Tümü (${hls.length})</button>` +
    e.hlCats.map(c => `<button class="small ${activeCat === c.id ? 'primary' : ''}" data-act="hlSelectCat" data-cat="${esc(c.id)}" title="${esc(c.desc || '')}">${esc(c.name)} (${counts[c.id] || 0})</button>`).join('') +
    `<button class="small" data-act="hlNewCatModal">＋ Kategori Aç</button>` +
    `<button class="small" data-act="hlAutoCat" ${fcAutoProgress.hl && !fcAutoProgress.hl.done && !fcAutoProgress.hl.err ? 'disabled' : ''}>✨ Vurguları kategorize et</button>` +
    fcProgressBadgeHTML('hl') +
    `</div>`;

  const filtered = hls.filter(h => {
    if (activeCat !== 'all' && getCatId(h) !== activeCat) return false;
    if (q && !(h.t + ' ' + h.title).toLocaleLowerCase('tr').includes(q)) return false;
    return true;
  });
  const catOptions = (curId) => e.hlCats.map(c => `<option value="${esc(c.id)}" ${curId === c.id ? 'selected' : ''}>${esc(c.name)}</option>`).join('');

  return catBar + (filtered.length ? `<div class="nb-list">${filtered.map(h => {
    const key = h.kind + ':' + h.id;
    const cid = getCatId(h);
    return `<article class="aside-card nb-item"><div class="row" style="justify-content:space-between"><div><span class="hl-chip ${h.style === 'underline' ? 'is-underline' : ''}" style="--hl-c:${esc(h.color)}">${esc(h.t)}</span></div>` +
      `<div class="row"><select class="fc-cat-select" data-hl-key="${esc(key)}" aria-label="Vurgu kategorisi">${catOptions(cid)}</select>` +
      (h.kind === 'course' ? `<button class="small" data-act="openCourse" data-cid="${esc(h.cid)}" data-sid="${esc(h.sid)}">Bölüme Git →</button>` : `<button class="small" data-act="eduJumpQuestion" data-book="${esc(h.bookId)}" data-test="${esc(h.testId)}" data-index="${h.qIndex}">Soruya Git →</button>`) +
      `</div></div><small class="vocab-src">${esc(h.title)}${h.where ? ' · ' + esc(h.where) : ''}</small></article>`;
  }).join('')}</div>` : '<div class="empty">Bu kategoride vurgulanmış (🖍️) metin bulunmuyor.</div>');
}

async function fcRunAutoCategorize(kind) {
  if (locked) return;
  const p = activeProfile();
  const key = typeof aiLocalKey === 'function' ? aiLocalKey(p) : '';
  if (!key) {
    toast('Önce YZ Ayarları’ndan Gemini API anahtarını ekle.');
    if (typeof aiSettings === 'function') aiSettings();
    return;
  }
  const e = fcEnsureCats(ensureEduState(state));
  const cats = (kind === 'hl' ? e.hlCats : e.fcCats).filter(c => c.id !== 'other');
  if (!cats.length) {
    toast('Önce en az bir özel kategori açmalısın.');
    fcOpenNewCatModal(kind);
    return;
  }

  let items = [];
  if (kind === 'hl') {
    items = eduAllHighlights().filter(h => (e.hlCatMap[h.kind + ':' + h.id]?.catId || 'other') === 'other')
      .map(h => ({ id: h.kind + ':' + h.id, text: h.t, source: h.title }));
  } else {
    items = eduAllVocabItems().filter(v => fcCardState(e, v.id).catId === 'other')
      .map(v => ({ id: v.id, text: v.word, source: v.source }));
  }

  if (!items.length) {
    fcAutoProgress[kind] = { pct: 100, done: true, err: '' };
    render();
    toast('Diğer kategorisinde bekleyen yeni öğe yok.');
    return;
  }

  fcAutoProgress[kind] = { pct: 5, done: false, err: '' };
  render();

  const catPrompt = cats.map(c => `- id="${c.id}" | ad="${c.name}" | tanım="${c.desc || c.name}"`).join('\n');
  const validIds = new Set(cats.map(c => c.id));
  const batchSize = 15;
  let doneCount = 0;

  try {
    for (let i = 0; i < items.length; i += batchSize) {
      const batch = items.slice(i, i + batchSize);
      const sys = 'Sen bir sınıflandırma asistanısın. Verilen öğeleri yalnızca verilen kategori id’lerine ayır. Uygun değilse "other" bırak. Yalnızca geçerli JSON dizisi döndür: [{"id":"...","catId":"..."}]';
      const msg = `Kategoriler:\n${catPrompt}\n\nÖğeler:\n${JSON.stringify(batch)}`;
      const raw = await aiGenerate(key, aiModel(p), sys, [{ role: 'user', parts: [{ text: msg }] }], 2048);
      const m = raw.match(/\[[\s\S]*\]/);
      if (m) {
        const arr = JSON.parse(m[0]);
        for (const r of arr) {
          if (!r || typeof r.id !== 'string' || !validIds.has(r.catId)) continue;
          if (kind === 'hl') {
            e.hlCatMap[r.id] = { catId: r.catId, updatedAt: Date.now() };
          } else {
            const cur = fcCardState(e, r.id);
            e.fcCards[r.id] = { ...cur, catId: r.catId, updatedAt: Date.now() };
          }
        }
      }
      doneCount += batch.length;
      fcAutoProgress[kind] = { pct: Math.min(99, Math.round((doneCount / items.length) * 100)), done: false, err: '' };
      render();
    }
    fcAutoProgress[kind] = { pct: 100, done: true, err: '' };
    eduTouch(true);
    render();
    toast('✓ Kategorizasyon tamamlandı!');
  } catch (err) {
    fcAutoProgress[kind] = { pct: 0, done: false, err: err.message || 'Hata' };
    render();
    toast('Kategorizasyon hatası: ' + (err.message || err));
  }
}

document.addEventListener('click', async e => {
  const el = e.target.closest('[data-act^="fc"],[data-act^="hlSelect"],[data-act^="hlNewCat"],[data-act^="hlAutoCat"]');
  if (!el || el.disabled) return;
  const a = el.dataset.act;
  if (locked && ['fcRate', 'fcSaveNewCat', 'fcSaveCatSettings', 'fcDelCat', 'fcAutoCat', 'hlAutoCat', 'fcAiExplain'].includes(a)) {
    toast('Önce bu sekmede devam etmeyi seç.');
    return;
  }
  const edu = fcEnsureCats(ensureEduState(state));

  if (a === 'fcSelectCat') { fcActiveCat = el.dataset.cat; fcFlipped = false; fcCurrentId = null; render(); }
  else if (a === 'hlSelectCat') { hlActiveCat = el.dataset.cat; render(); }
  else if (a === 'fcSetMode') { fcSubMode = el.dataset.mode; fcFlipped = false; render(); }
  else if (a === 'fcFlip') { fcFlipped = true; render(); }
  else if (a === 'fcNewCatModal') fcOpenNewCatModal('fc');
  else if (a === 'hlNewCatModal') fcOpenNewCatModal('hl');
  else if (a === 'fcCatSettings') fcOpenCatSettingsModal(el.dataset.cat);
  else if (a === 'fcAutoCat') await fcRunAutoCategorize('fc');
  else if (a === 'hlAutoCat') await fcRunAutoCategorize('hl');
  else if (a === 'fcSaveNewCat') {
    const kind = el.dataset.kind;
    const name = ($('#fcCatName')?.value || '').trim();
    const desc = ($('#fcCatDesc')?.value || '').trim();
    if (!name) { toast('Kategori adı yaz.'); return; }
    const id = 'cat-' + Date.now().toString(36) + Math.random().toString(36).slice(2, 5);
    if (kind === 'hl') {
      edu.hlCats.push({ id, name, desc, updatedAt: Date.now() });
      hlActiveCat = id;
    } else {
      edu.fcCats.push({ id, name, desc, settings: fcDefaultSettings(), updatedAt: Date.now() });
      fcActiveCat = id;
    }
    eduTouch(true);
    closeDialog();
    render();
    toast('Kategori eklendi: ' + name);
  } else if (a === 'fcSaveCatSettings') {
    const cat = fcCatOf(edu, el.dataset.cat);
    cat.settings = {
      newPerDay: Math.max(1, Number($('#fcSetNew')?.value) || 20),
      revPerDay: Math.max(1, Number($('#fcSetRev')?.value) || 100),
      stepsMin: ($('#fcSetSteps')?.value || '10,1440').trim(),
      startEase: Math.max(1.3, Math.min(3.5, Number($('#fcSetEase')?.value) || 2.5)),
      order: $('#fcSetOrder')?.value || 'due-first',
      autoSpeak: !!$('#fcSetSpeak')?.checked,
      speakLang: 'en'
    };
    cat.updatedAt = Date.now();
    eduTouch(true);
    closeDialog();
    render();
    toast('Kategori ayarları kaydedildi.');
  } else if (a === 'fcDelCat') {
    const cid = el.dataset.cat;
    if (cid === 'other') return;
    edu.fcCats = edu.fcCats.filter(c => c.id !== cid);
    for (const cs of Object.values(edu.fcCards)) if (cs.catId === cid) cs.catId = 'other';
    if (fcActiveCat === cid) fcActiveCat = 'all';
    eduTouch(true);
    closeDialog();
    render();
    toast('Kategori silindi; kartlar Diğer kategorisine aktarıldı.');
  } else if (a === 'fcRate') {
    const id = el.dataset.id, rate = el.dataset.rate;
    const prev = fcCardState(edu, id);
    const cat = fcCatOf(edu, prev.catId);
    const isNew = prev.reps === 0 && prev.due === 0;
    const next = fcNextInterval(prev, rate, cat.settings);
    edu.fcCards[id] = { ...prev, ...next, lastReview: Date.now(), updatedAt: Date.now() };
    if (isNew) edu.fcDaily.newCount[cat.id] = (edu.fcDaily.newCount[cat.id] || 0) + 1;
    else edu.fcDaily.revCount[cat.id] = (edu.fcDaily.revCount[cat.id] || 0) + 1;
    fcFlipped = false;
    fcCurrentId = null;
    eduTouch(true);
    render();
  } else if (a === 'fcAiToggle') {
    const id = el.dataset.id;
    fcAiOpenId = fcAiOpenId === id ? null : id;
    render();
  } else if (a === 'fcAiClear') {
    const id = el.dataset.id;
    if (fcAiChats[id] && !fcAiChats[id].busy) { fcAiChats[id].history = []; fcAiChats[id].error = ''; render(); }
  } else if (a === 'fcAiSaveMeaning') {
    const id = el.dataset.id;
    const chat = fcAiChats[id];
    const last = [...(chat?.history || [])].reverse().find(m => m.role === 'model')?.parts?.[0]?.text;
    if (last) {
      const prev = fcCardState(edu, id);
      edu.fcCards[id] = { ...prev, customMeaning: last, updatedAt: Date.now() };
      eduTouch(true);
      render();
      toast('AI açıklaması karta kaydedildi.');
    }
  } else if (a === 'fcAiChip' || a === 'fcAiSend' || a === 'fcAiExplain') {
    const id = el.dataset.id;
    const p = activeProfile();
    const key = typeof aiLocalKey === 'function' ? aiLocalKey(p) : '';
    if (!key) { toast('Önce YZ Ayarları’ndan Gemini API anahtarını ekle.'); if (typeof aiSettings === 'function') aiSettings(); return; }
    const item = eduAllVocabItems().find(x => x.id === id);
    if (!item) return;
    const chat = fcAiChats[id] = fcAiChats[id] || { history: [], busy: false, error: '' };
    if (chat.busy) return;
    const userText = (el.dataset.text || $('#fcAiInput')?.value || '').trim();
    if (!userText) { toast('Önce bir soru yaz veya hızlı butonlardan birini seç.'); return; }
    chat.busy = true; chat.error = '';
    const msg = { role: 'user', parts: [{ text: userText }] };
    render();
    try {
      const sys = 'Türkçe bir kelime ve sınav öğretmenisin. Öğrencinin çalıştığı flashcard ifadesiyle ilgili sorusunu kısa, net, akılda kalıcı ve örnekli şekilde yanıtla.';
      const ctx = [{ role: 'user', parts: [{ text: `Kart İfadesi: "${item.word}"\nMevcut Anlam/Not: ${item.meaning || '-'}\nKaynak: ${item.source || '-'}` }] }, { role: 'model', parts: [{ text: 'Kart bağlamını dikkate alarak yardımcı olacağım.' }] }];
      const reply = await aiGenerate(key, aiModel(p), sys, [...ctx, ...chat.history.slice(-10), msg], 600);
      chat.history.push(msg, { role: 'model', parts: [{ text: reply }] });
      chat.history = chat.history.slice(-12);
    } catch (err) {
      chat.error = err.message || 'Yanıt alınamadı';
    } finally {
      chat.busy = false;
      render();
    }
  }
});

// ── Eğitim & Konu Anlatımı Kütüphaneleri, Favoriler ve Son Kullanılanlar ─────
function eduLibCur() {
  const e = ensureEduState(state);
  if (e.libCfg && Array.isArray(e.libCfg.libs)) return e.libCfg;
  const defs = [];
  for (const c of allCourses()) {
    if (c.library && c.library !== DIGER && !defs.includes(c.library)) defs.push(c.library);
  }
  e.libCfg = { libs: defs, assign: {}, closed: {}, views: {}, t: 0 };
  return e.libCfg;
}

function eduLibSave() {
  const c = eduLibCur();
  c.t = Date.now();
  eduTouch(true);
  render();
}

function eduLibOf(c) {
  const cfg = eduLibCur();
  const a = cfg.assign[c.id];
  if (a) return a;
  if (a === undefined && c.library) return c.library;
  return DIGER;
}

function eduLibList() {
  const out = eduLibCur().libs.filter(l => l !== DIGER);
  const courses = allCourses();
  for (const c of courses) {
    const l = eduLibOf(c);
    if (l !== DIGER && !out.includes(l)) out.push(l);
  }
  if (!out.length || courses.some(c => eduLibOf(c) === DIGER)) out.push(DIGER);
  return out;
}

function eduIsFav(cid) {
  const e = ensureEduState(state);
  return Array.isArray(e.favs) && e.favs.includes(cid);
}

function eduToggleFav(cid) {
  const e = ensureEduState(state);
  e.favs = Array.isArray(e.favs) ? e.favs : [];
  e.favs = eduIsFav(cid) ? e.favs.filter(x => x !== cid) : [...e.favs, cid];
  eduTouch(true);
  render();
}

function eduCourseProgress(c) {
  const done = c.sections.filter(s => isSecDone(c.id, s.id)).length;
  const total = c.sections.length || 0;
  const pct = total ? Math.round((done / total) * 100) : 0;
  return { done, total, pct };
}

function eduCourseActivity(c) {
  const e = ensureEduState(state);
  let ts = e.activeCourseId === c.id ? 2 : 0;
  for (const s of c.sections) {
    const k = c.id + '/' + s.id;
    ts = Math.max(ts, Number(e.completed?.[k]?.at) || 0, Number(e.notes?.[k]?.at) || 0);
    for (const h of e.hl?.[k] || []) ts = Math.max(ts, Number(h.at) || 0);
  }
  return ts;
}

function eduRecentCourses() {
  return allCourses()
    .map(c => [c, eduCourseActivity(c)])
    .filter(([, t]) => t > 0)
    .sort((a, b) => b[1] - a[1])
    .slice(0, 3)
    .map(([c]) => c);
}

function eduMiniCourse(c) {
  const { done, total, pct } = eduCourseProgress(c);
  return `<button class="mini-book" data-act="openCourse" data-cid="${esc(c.id)}">` +
    `<span class="mini-cover">${esc((c.shortTitle || c.title).slice(0, 14))}</span>` +
    `<span class="mini-info"><b>${esc(c.title)}</b><small>${esc(eduLibOf(c))} · ${done} / ${total} bölüm</small>` +
    `<span class="bar"><i style="width:${pct}%"></i></span></span>` +
    `<span class="mini-star" data-act="eduFav" data-cid="${esc(c.id)}" title="${eduIsFav(c.id) ? 'Favorilerden çıkar' : 'Favorilere ekle'}">${eduIsFav(c.id) ? '★' : '☆'}</span></button>`;
}

function eduCourseRow(c) {
  const { done, total, pct } = eduCourseProgress(c);
  return `<div class="lib-row"><button class="lib-row-main" data-act="openCourse" data-cid="${esc(c.id)}"><b>${esc(c.title)}</b><small>${esc(c.author || '')} · ${total} bölüm · ${done}/${total} tamamlandı</small><span class="bar"><i style="width:${pct}%"></i></span></button>` +
    `<span class="mini-star" data-act="eduFav" data-cid="${esc(c.id)}" title="${eduIsFav(c.id) ? 'Favorilerden çıkar' : 'Favorilere ekle'}">${eduIsFav(c.id) ? '★' : '☆'}</span>` +

  const bPaired = books.find(x => x.id === c.pairedBookId);
  let bAns = 0, bTot = 0;

    `<div class="bar"><i style="width:${pct}%"></i></div><p>${done} / ${total} bölüm tamamlandı (%${pct})</p>` +
    `<div class="edu-sec-pills">${c.sections.map(s => `<button class="small edu-sec-pill ${isSecDone(c.id, s.id) ? 'done' : ''}" data-act="openCourse" data-cid="${esc(c.id)}" data-sid="${esc(s.id)}">${isSecDone(c.id, s.id) ? '✓ ' : ''}${esc(s.dayTag)}</button>`).join('')}</div>` +
    `<div class="row" style="margin-top:14px"><button class="primary" data-act="openCourse" data-cid="${esc(c.id)}">${c.id === 'fen-3-oyun-atolyesi-2026' ? '🎮 Oyun Atölyesini Aç →' : 'Konu Anlatımını Aç →'}</button>` +

    `<button class="small" data-act="eduExportCourse" data-cid="${esc(c.id)}">↗ JSON İndir</button></div></div></article>`;
}

function eduLibsDialog() {

    eduLibSave();

function eduLibDelete(lib) {
  const courses = allCourses();
  const L = eduLibList().filter(l => l !== lib);
  const n = courses.filter(c => eduLibOf(c) === lib).length;

    for (const c of courses) if (eduLibOf(c) === lib) eduLibCur().assign[c.id] = hedef === DIGER ? null : hedef;

    eduLibSave();
    toast('“' + lib + '” silindi.');

        ? `<div class="lib-list">${list.map(eduCourseRow).join('')}</div>`

    h += `<section class="lib-section ${kapali ? 'closed' : ''}" data-edulib="${esc(lib)}"><div class="section-title"><h2><button class="lib-toggle" data-act="eduLibToggle" data-lib="${esc(lib)}" aria-expanded="${!kapali}" title="${kapali ? 'Aç' : 'Kapat'}">${kapali ? '▸' : '▾'}</button> 📚 ${esc(lib)}</h2><span class="row"><span class="eyebrow">${list.length} MODÜL</span>${kapali ? '' : `<span class="lib-views">${vb('kart', '▦ Kart')}${vb('liste', '☰ Liste')}${vb('kutucuk', '▣ Kutucuk')}</span>`}<button class="small" data-act="eduImportCourse">＋ Ekle</button></span></div>${kapali ? '' : list.length ? ic : `<div class="lib-empty">Bu eğitim kütüphanesi boş. “＋ Ekle” ile modül yükleyebilir veya mevcut bir modülü buraya taşıyabilirsin.</div>`}</section>`;
  }
  return h;
}

document.addEventListener('click', e => {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const a = el.dataset.act;
  if (a === 'eduLibsEdit') { e.stopPropagation(); if (!locked) eduLibsDialog(); return; }
  if (a === 'eduLibMove') { e.stopPropagation(); if (!locked) eduMoveCourseDialog(el.dataset.cid); return; }
  if (a === 'eduLibDel') { e.stopPropagation(); if (!locked) eduLibDelete(el.dataset.lib); return; }
  if (a === 'eduLibAddGo') {
    e.stopPropagation();
    const n = cleanLib($('#eduLibAdd')?.value);
    if (!n) { toast('Kütüphane adı yaz.'); return; }
    if (eduLibList().some(l => l.toLocaleLowerCase('tr') === n.toLocaleLowerCase('tr'))) { toast('Bu adda kütüphane var.'); return; }
    eduLibCur().libs = [...eduLibList().filter(l => l !== DIGER), n];
    eduLibSave();
    eduLibsDialog();
    return;
  }
  if (a === 'eduLibToggle') {
    e.stopPropagation();
    const C = eduLibCur();
    C.closed = C.closed || {};
    if (C.closed[el.dataset.lib]) delete C.closed[el.dataset.lib];
    else C.closed[el.dataset.lib] = true;
    eduLibSave();
    return;
  }
  if (a === 'eduLibView') {
    e.stopPropagation();
    const C = eduLibCur();
    C.views = C.views || {};
    C.views[el.dataset.lib] = el.dataset.v;
    eduLibSave();
    return;
  }
  if (a === 'eduFav') {
    e.preventDefault();
    e.stopPropagation();
    if (!locked) eduToggleFav(el.dataset.cid);
  }
}, true);

document.addEventListener('click',async e=>{const el=e.target.closest('[data-act]');if(!el||el.disabled)return;const act=el.dataset.act;if(act==='openCourse'||act.startsWith('edu'))return;const allowed=['nav','menu','contents','book','test','resume','backup','exportBackup','portable','htmlFile','close','prompt','format','history','zoomQ','zoomSolution','solution','figure','takeover','tts','ttsSettings','ttsTest','analysis','exportAnalysis','copyAiPrompt','aiGuide'];if(locked&&!allowed.includes(act)){toast('Önce bu sekmede devam etmeyi seç.');return;}const s=currentState,q=view==='study'?currentTest.questions[s.index]:null;switch(act){case'cloud':cloudDialog();break;case'cloudIn':await cloudSync(true);break;case'cloudSync':await cloudSync(false);break;case'cloudOut':await cloudSignOut();break;case'cloudMode':cloudSetMode(el.dataset.mode);break;case'cloudNagClose':$('#cloudNag')?.remove();break;case'profiles':profileDialog();break;case'contentsView':setContentsView(el.dataset.view);break;case'switchProfile':switchProfile(el.dataset.id);break;case'renameProfile':renameProfileDialog(el.dataset.id);break;case'deleteProfile':deleteProfile(el.dataset.id);break;case'addProfile':addProfile();break;case'tts':ttsRun(el.dataset.tts);break;case'ttsSettings':ttsDialog();break;case'ttsTest':ttsToggle('test:',()=>speechChunks('Merhaba. Bu, Eğitim Atölyesi sesli okuma denemesidir. Okuma hızı '+ttsSettings().rate.toFixed(2).replace('.',',')+'.'));break;case'peek':togglePeek();break;case'analysis':analysisDialog();break;case'exportAnalysis':{pulse();save();const scope=$('#analysisScope')?.value||'',pkg=analysisPackage(scope);if(!pkg.books.length){toast('Bu kapsamda çözülmüş test yok.');break;}download('Egitim-Atolyesi-YZ-analiz-'+activeProfile().name.replace(/[^\p{L}\p{N}]+/gu,'-')+'-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify(pkg,null,1));toast('Analiz paketi indirildi. Şimdi istem metnini kopyalayıp yapay zekâya ver.');}break;case'copyAiPrompt':{const txt=aiPromptText(activeProfile().name);try{await navigator.clipboard.writeText(txt);toast('İstem metni panoya kopyalandı.');}catch(err){dialog('İstem metni',`<textarea rows="8" readonly>${esc(txt)}</textarea><p class="file-help">Metni seçip kopyala.</p>`);}}break;case'aiGuide':download('Egitim-Atolyesi-YZ-analiz-yonergesi.md',aiGuideText(),'text/markdown;charset=utf-8');break;case'htmlFile':htmlFileDialog();break;case'chooseHTML':await chooseHTMLFile();break;case'resumeHTML':await resumeHTMLFile();break;case'disconnectHTML':await disconnectHTMLFile();break;case'appearance':appearanceDialog();break;case'resetAppearance':{const now=Date.now();state.appearance=normalizeAppearance({updatedAt:now});activeProfile().updatedAt=now;applyAppearance();save();syncSettingsSoon();appearanceDialog();}break;case'figure':{const figures=el.dataset.kind==='question'?q.figures:q.explanationFigures;const f=figures?.[Number(el.dataset.index)];if(f){dialog(f.alt||'Kitaptaki şekil',`<img src="${f.src}" alt="${esc(f.alt||'Kitaptaki şekil')}">`);$('#modal .dialog').classList.add('image-view');}}break;case'nav':nav(el.dataset.view);break;case'menu':if(innerWidth>900&&isPanelCollapsed('side'))togglePanelCollapse('side');else $('#sidebar').classList.toggle('open');break;case'toggleSidebar':togglePanelCollapse('side');break;case'toggleStudyAside':togglePanelCollapse('studyAside');break;case'toggleCourseToc':togglePanelCollapse('courseToc');break;case'contents':openBook(bookId);break;case'book':openBook(el.dataset.id);break;case'test':openTest(el.dataset.book,el.dataset.test);break;case'resume':resume();break;case'pause':toggleRun();break;case'prev':jump(s.index-1);break;case'next':jump(s.index+1);break;case'jump':jump(Number(el.dataset.index));break;case'answer':if(String(window.getSelection()||'').trim())break;answer(el.dataset.id);break;case'clearAnswer':delete s.answers[q.id];stampQ(s,q.id);save();render();break;case'flag':s.flags[q.id]=!s.flags[q.id];stampQ(s,q.id);save();render();break;case'check':check();break;case'uncheck':s.checked=false;stampT(s);showSolution=false;save();render();break;case'solution':showSolution=!showSolution;render();break;case'settings':settings();break;case'resetQuestionTime':confirmAction('Soru süresini sıfırla','Yalnız bu sorunun süresi sıfırlanır. Testin toplam çalışma süresi korunur.',()=>{s.times[q.id]=0;});break;case'resetTestTime':confirmAction('Test sürelerini sıfırla','Bu testin toplam ve soru bazlı tüm süreleri sıfırlanır. Seçimlerin ve notların korunur.',()=>{s.elapsed=0;s.times={};});break;case'clearTestAnswers':confirmAction('Tüm seçimleri sil','Bu testteki tüm cevap seçimleri silinir. Süreler, notlar ve kontrol geçmişi korunur.',()=>{s.answers={};s.elims={};s.checked=false;stampT(s);showSolution=false;});break;case'resetTest':confirmAction('Testi tamamen sıfırla','Bu testin seçimleri, süreleri, notları, işaretleri, sınırları ve kontrol geçmişi silinecek. Cevap anahtarı düzeltmeleri korunacak.',()=>{const keys=s.keyOverrides||{};delete state.tests[currentBook.id+'/'+currentTest.id];currentState=getState(currentBook,currentTest);currentState.keyOverrides=keys;stampT(currentState);showSolution=false;});break;case'close':closeDialog();break;case'backup':backupDialog();break;case'exportBackup':pulse();save();download('Egitim-Atolyesi-yedek-'+new Date().toISOString().slice(0,10)+'.json',JSON.stringify({format:'test-atolyesi-backup',version:2,createdAt:new Date().toISOString(),store,books:imported}));toast('Yedek indirildi.');break;case'restore':inputMode='backup';$('#file').click();break;case'import':libPickDialog(null);break;case'portable':await portable();break;case'prompt':download('AI-kitap-donusturme-yonergesi.txt',prompt,'text/plain;charset=utf-8');break;case'format':download('Egitim-Atolyesi-format-ornegi.json',JSON.stringify(sample,null,2));break;case'history':dialog('Kontrol geçmişi',s.history.length?s.history.slice().reverse().map(h=>`<p><b>${esc(new Date(h.at).toLocaleString('tr-TR'))}</b><br>${h.correct} doğru · ${h.wrong} yanlış · ${h.blank} boş · ${duration(h.elapsed)}</p>`).join(''):'<p>Bu test henüz kontrol edilmedi.</p>');break;case'zoomQ':case'zoomSolution':dialog(act==='zoomQ'?'Soru görüntüsü':'Kitaptaki çözüm',`<img src="${act==='zoomQ'?q.image:q.explanationImage}" alt="Büyük görüntü">`);$('#modal .dialog').classList.add('image-view');break;case'editKey':dialog('Cevap anahtarını düzelt','<p>Kitabın kaynak çözümünü inceledikten sonra doğru harfi seç. Bu değişiklik kişisel kaydına işlenir.</p><select id="keyAnswer"><option value="">Anahtar bilinmiyor</option>'+q.options.map((o,i)=>{const k=String.fromCharCode(65+i);return `<option ${q.answer===k?'selected':''}>${k}</option>`;}).join('')+'</select>','<button class="primary" id="saveKey">Kaydet</button>');$('#saveKey').onclick=()=>{rememberKey(q);q.answer=$('#keyAnswer').value||null;s.keyOverrides=s.keyOverrides||{};s.keyOverrides[q.id]=q.answer;stampQ(s,q.id);save();closeDialog();render();};break;case'removeBook':confirmAction('Kitabı kaldır','Yalnız indirilen kitap içeriği cihazdan kaldırılır. Cevaplar, notlar, süreler ve profil kayıtları korunur. Kitap katalogdan yeniden indirilebilir.',async()=>{try{await idb('delete',el.dataset.id);imported=imported.filter(b=>b.id!==el.dataset.id);books=[...baseBooks(),...imported];bookId=books[0]?.id||null;save();render();}catch(e){toast('Kitap kaldırılamadı.');}});break;case'takeover':claim(true);try{const latest=normalizeStore(JSON.parse(localStorage.getItem(STORE_KEY)||'null'));if(latest){store=latest;state=activeProfile().state;if(typeof ensureEduState==='function')ensureEduState(state);}}catch(e){}if(view==='study')currentState=getState(currentBook,currentTest);applyKeyOverrides();render();toast('Çalışma bu sekmeye alındı.');break;}});
document.addEventListener('input',e=>{if(['ttsRate','ttsPitch'].includes(e.target.id)){if(!locked)ttsInput(e);return;}if(['fontSize','lineHeight','backgroundColor','paperColor','textColor','accentColor','iconColor','noteColor'].includes(e.target.id)){if(!locked)appearanceInput(e);return;}if(e.target.id==='search'){filter=e.target.value;$('#testList').innerHTML=testCards(books.find(b=>b.id===bookId)||books[0]);}if(e.target.id==='qNote'&&!locked){currentState.notes[currentTest.questions[currentState.index].id]=e.target.value;stampQ(currentState,currentTest.questions[currentState.index].id);save();}});
document.addEventListener('change',e=>{if(['ttsVoice','ttsArabicVoice','ttsArabic','ttsAnnounce'].includes(e.target.id)){if(!locked)ttsInput(e);return;}if(['themeChoice','readingFont','iconColorMode','noteColorMode'].includes(e.target.id)){if(!locked)appearanceInput(e);return;}if(e.target.id==='sectionFilter'){sectionFilter=e.target.value;$('#testList').innerHTML=testCards(books.find(b=>b.id===bookId)||books[0]);}if(e.target.id==='file'){if(e.target.files[0])importFile(e.target.files[0]);e.target.value='';}});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeDialog();$('#sidebar')?.classList.remove('open');return;}if(view!=='study'||$('#modal').children.length||/INPUT|TEXTAREA|SELECT/.test(e.target.tagName)||e.ctrlKey||e.metaKey||e.altKey)return;if(e.key==='ArrowRight'){e.preventDefault();jump(currentState.index+1);}else if(e.key==='ArrowLeft'){e.preventDefault();jump(currentState.index-1);}else if(e.code==='Space'){e.preventDefault();toggleRun();}else if(e.key==='k'||e.key==='K'){e.preventDefault();togglePeek();}else if(e.key==='r'||e.key==='R'){e.preventDefault();if(!currentTest.questions[currentState.index].image)ttsRun('q');}else if(/^[1-8]$/.test(e.key)){const i=Number(e.key)-1;if(i<currentTest.questions[currentState.index].options.length)answer(String.fromCharCode(65+i));}});
window.addEventListener('beforeunload',()=>{pulse();save();try{if(!locked){const owner=JSON.parse(localStorage.getItem(LOCK)||'null');if(owner?.id===tabId)localStorage.removeItem(LOCK);}}catch(e){}});
document.addEventListener('visibilitychange',()=>{pulse();if(document.hidden){running=false;save();if(view==='study')render();}});
window.addEventListener('storage',e=>{if(e.key===LOCK){try{const o=JSON.parse(e.newValue||'null');if(o&&o.id!==tabId&&Date.now()-o.at<6500&&!locked){pulse();running=false;locked=true;render();}}catch(err){}}});
setInterval(()=>{pulse();if(ready&&locked){try{const o=JSON.parse(localStorage.getItem(LOCK)||'null');if(!o||Date.now()-o.at>6500){claim(true);const latest=normalizeStore(JSON.parse(localStorage.getItem(STORE_KEY)||'null'));if(latest){store=latest;state=activeProfile().state;if(typeof ensureEduState==='function')ensureEduState(state);}if(view==='study'&&currentBook&&currentTest)currentState=getState(currentBook,currentTest);applyKeyOverrides();render();if(window.cloudAfterUnlock)cloudAfterUnlock();}}catch(e){}}if(ready&&!locked){claim();save();}},1000);
render();init();
</script>
